bcr_test_module:
  module_path: "bcr_test_module"
  matrix:
    platform:
      - debian11
      - ubuntu2204
      - macos_arm64
      - windows
      - ubuntu2204_arm64
    bazel:
      - 9.x
  tasks:
    run_dx_help:
      name: Run dx --help
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      run_targets:
        - "@rules_dx//:dx"
      run_flags:
        - "--"
        - "--help"
    test_hello:
      name: Test hello
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//:hello_test"
    build_android_toolchain:
      name: Build android toolchain check
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "//:android_device_cc"
    build_apple_toolchain:
      name: Build Apple toolchain check
      platform: macos_arm64
      bazel: ${{ bazel }}
      build_targets:
        - "//:macos_arm64_cc"
    build_qt_hello_debian11:
      name: Build Qt hello
      platform: debian11
      bazel: ${{ bazel }}
      build_targets:
        - "//qt_hello"
    build_qt_hello_ubuntu2204:
      name: Build Qt hello
      platform: ubuntu2204
      bazel: ${{ bazel }}
      build_targets:
        - "//qt_hello"
    build_qt_hello_ubuntu2204_arm64:
      name: Build Qt hello
      platform: ubuntu2204_arm64
      bazel: ${{ bazel }}
      build_targets:
        - "//qt_hello"
    build_main_in_dep:
      name: Build cc_binary with main in a dependency
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "//main_in_dep"
