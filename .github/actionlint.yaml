self-hosted-runner:
  labels:
    - ubuntu-latest
    - ubuntu-24.04-arm
    - macos-15
    - windows-latest
    - windows-11-arm
# The pinned actionlint predates job.workflow_ref and job.workflow_sha (documented GitHub job context).
paths:
  .github/workflows/release-cells.yml:
    ignore:
      - 'property "workflow_(ref|sha)" is not defined in object type \{check_run_id'
