name: assert-no-secret
description: Fail when a file or directory about to be uploaded holds the BuildBuddy API key or REMOTE_CACHE_HEADER value.
inputs:
  path:
    description: File or directory to scan.
    required: true
runs:
  using: composite
  steps:
    - name: Check the upload holds no secret
      shell: bash
      env:
        DX_UPLOAD_PATH: ${{ inputs.path }}
      run: |
        needles=()
        if [ -n "${BUILDBUDDY_API_KEY:-}" ]; then
          needles+=(-e "$BUILDBUDDY_API_KEY")
        fi
        if [ -n "${REMOTE_CACHE_HEADER:-}" ]; then
          value="${REMOTE_CACHE_HEADER#*=}"
          if [ "$value" = "$REMOTE_CACHE_HEADER" ] || [ -z "$value" ]; then
            echo "::error::REMOTE_CACHE_HEADER has no value to scan for"
            exit 1
          fi
          needles+=(-e "$value")
        fi
        [ "${#needles[@]}" -gt 0 ] || exit 0
        [ -e "$DX_UPLOAD_PATH" ] || exit 0
        rc=0
        grep -RFl "${needles[@]}" -- "$DX_UPLOAD_PATH" || rc=$?
        case "$rc" in
          0)
            echo "::error::$DX_UPLOAD_PATH holds a remote cache secret"
            exit 1
            ;;
          1) ;;
          *)
            echo "::error::scan of $DX_UPLOAD_PATH failed"
            exit 1
            ;;
        esac
