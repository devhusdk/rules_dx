name: assert-no-secret
description: Fail when a file or directory about to be uploaded holds the BuildBuddy API key.
inputs:
  path:
    description: File or directory to scan.
    required: true
runs:
  using: composite
  steps:
    - name: Check the upload holds no secret
      shell: bash
      env:
        DX_UPLOAD_PATH: ${{ inputs.path }}
      run: |
        [ -n "${BUILDBUDDY_API_KEY:-}" ] || exit 0
        [ -e "$DX_UPLOAD_PATH" ] || exit 0
        if grep -rFl -- "$BUILDBUDDY_API_KEY" "$DX_UPLOAD_PATH"; then
          echo "::error::$DX_UPLOAD_PATH holds the BuildBuddy API key"
          exit 1
        fi
