name: gate
description: Run dx check --affected against the pinned base.
runs:
  using: composite
  steps:
    - name: Pin the affected base
      env:
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      shell: bash
      run: |
        # shellcheck disable=SC2086
        set -- $BAZEL_CONFIG $BB_ARGS
        bazel run "$@" @rules_dx//tools/ci/gate_base:gate_base_bin
    - name: Check the affected targets
      shell: bash
      run: |
        # shellcheck disable=SC2086
        set -- $BAZEL_CONFIG $BB_ARGS
        bazel run "$@" @rules_dx//:dx -- check --affected --output=json | tee "${RUNNER_TEMP:-/tmp}/gate.json"
    - name: Verify the base dx compared against
      shell: bash
      run: |
        seen="$(jq -Rr 'fromjson? | objects | .affected? | objects | .base? // empty | strings' "${RUNNER_TEMP:-/tmp}/gate.json")"
        grep -Fxq -- "$GATE_BASE" <<<"$seen" || { echo "gate: dx compared against [$seen], expected $GATE_BASE" >&2; exit 1; }
    - name: Summary
      if: ${{ always() }}
      shell: bash
      run: echo "gate base ${GATE_BASE:-unset}" >> "$GITHUB_STEP_SUMMARY"
