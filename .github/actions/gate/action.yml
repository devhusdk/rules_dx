name: gate
description: Run dx check or dx coverage with --affected against the pinned base.
inputs:
  command:
    description: The dx command, check or coverage.
    required: true
  lcov:
    description: Where dx coverage writes its lcov report.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Pin the affected base
      env:
        EVENT_NAME: ${{ github.event_name }}
        PUSH_BEFORE: ${{ github.event.before }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      shell: bash
      run: |
        # shellcheck disable=SC2086
        set -- $BAZEL_CONFIG $BB_ARGS
        bazel run "$@" @rules_dx//tools/ci/gate_base:gate_base_bin
    - name: dx ${{ inputs.command }} --affected
      id: check
      env:
        COMMAND: ${{ inputs.command }}
        LCOV: ${{ inputs.lcov }}
      shell: bash
      run: |
        # shellcheck disable=SC2086
        set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
        report=()
        if [ -n "$LCOV" ]; then
          mkdir -p "$(dirname "$LCOV")"
          report=(--report "lcov=$LCOV")
        fi
        bazel run "$@" @rules_dx//:dx -- "$COMMAND" --affected --output=json "${report[@]}" -- "$@" --config=gate < /dev/null | tee "${RUNNER_TEMP:-/tmp}/gate.json"
    - name: Print the failing test log tails
      if: ${{ failure() && steps.check.outcome == 'failure' }}
      shell: bash
      run: |
        # shellcheck disable=SC2086
        set -- $BAZEL_CONFIG $BB_ARGS
        bazel run --noshow_progress "$@" @rules_dx//tools/ci/producers:producers_bin -- --test-log-tails --dx "${RUNNER_TEMP:-/tmp}/gate.json"
    - name: Verify the base dx compared against
      if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
      shell: bash
      run: |
        seen="$(jq -Rr 'fromjson? | objects | .affected? | objects | .base? // empty | strings' "${RUNNER_TEMP:-/tmp}/gate.json")"
        grep -Fxq -- "$GATE_BASE" <<<"$seen" || { echo "gate: dx compared against [$seen], expected $GATE_BASE" >&2; exit 1; }
    - name: Summary
      if: ${{ always() }}
      shell: bash
      run: echo "gate base ${GATE_BASE:-unset}" >> "$GITHUB_STEP_SUMMARY"
