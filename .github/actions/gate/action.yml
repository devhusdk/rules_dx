name: gate
description: Run dx check with --affected against the pinned base.
inputs:
  command:
    description: The dx command and its flags, check or check --coverage.
    required: true
  lcov:
    description: Where dx check --coverage writes its lcov report.
    required: false
    default: ""
  name:
    description: Name of this job's Bazel profiles artifact after profiles-, such as check-linux_x86_64.
    required: true
runs:
  using: composite
  steps:
    - name: Build the gate tools
      shell: bash
      run: |
        # shellcheck disable=SC2086
        set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
        tools=(@rules_dx//tools/ci/gate_base:gate_base_bin @rules_dx//dx/launch:dx @rules_dx//tools/ci/producers:producers_bin)
        bazel build "$@" "${tools[@]}"
        root="$(bazel info "$@" execution_root)"
        bin="${RUNNER_TEMP:-/tmp}/dx-bin"
        mkdir -p "$bin"
        query="$(printf ' + %s' "${tools[@]}")"
        bazel cquery "$@" --output=files "${query# + }" | grep -E '/(gate_base_bin|dx|producers_bin)(\.exe)?$' | while read -r built; do
          cp -L "$root/$built" "$bin/${built##*/}"
        done
    - name: Pin the affected base
      env:
        EVENT_NAME: ${{ github.event_name }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      shell: bash
      run: |
        "${RUNNER_TEMP:-/tmp}/dx-bin/gate_base_bin"
    - name: dx ${{ inputs.command }} --affected
      id: check
      env:
        COMMAND_LINE: ${{ inputs.command }}
        LCOV: ${{ inputs.lcov }}
        LINT_SCOPE: ${{ github.event_name == 'pull_request' && 'direct' || 'closure' }}
        DX_PROFILE_DIR: ${{ runner.temp }}/dx-profiles
      shell: bash
      run: |
        # shellcheck disable=SC2086
        set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
        printf '%s\n' 'build --notrack_incremental_state' 'build --nokeep_state_after_build' >> user.bazelrc
        pr_tags=-network-consumer,-audit
        dx="${RUNNER_TEMP:-/tmp}/dx-bin/dx"
        out="${RUNNER_TEMP:-/tmp}/gate.json"
        read -ra COMMAND <<<"$COMMAND_LINE"
        filters=()
        report=(--max-findings 0 --lint-scope "$LINT_SCOPE")
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          filters=("--test_tag_filters=$pr_tags")
        fi
        if [[ " $COMMAND_LINE " == *" --coverage "* && -n "$LCOV" ]]; then
          mkdir -p "$(dirname "$LCOV")"
          report+=(--report "lcov=$LCOV")
        fi
        "$dx" "${COMMAND[@]}" --affected --output=json "${report[@]}" -- "$@" --keep_going "${filters[@]}" < /dev/null | tee "$out"
    - name: Print the failing test log tails
      if: ${{ failure() && steps.check.outcome == 'failure' }}
      shell: bash
      run: |
        "${RUNNER_TEMP:-/tmp}/dx-bin/producers_bin" --test-log-tails --dx "${RUNNER_TEMP:-/tmp}/gate.json"
    - name: Check the Bazel profiles hold no secret
      id: scan-profiles
      if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
      uses: ./.github/actions/assert-no-secret
      with:
        path: ${{ runner.temp }}/dx-profiles
    - name: Upload the Bazel profiles
      if: ${{ !cancelled() && steps.scan-profiles.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: profiles-${{ inputs.name }}
        path: ${{ runner.temp }}/dx-profiles
        retention-days: 7
        if-no-files-found: ignore
        overwrite: true
    - name: Verify the base dx compared against
      if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
      shell: bash
      run: |
        seen="$(jq -Rr 'fromjson? | objects | .affected? | objects | .base? // empty | strings' "${RUNNER_TEMP:-/tmp}/gate.json")"
        grep -Fxq -- "$GATE_BASE" <<<"$seen" || { echo "gate: dx compared against [$seen], expected $GATE_BASE" >&2; exit 1; }
    - name: Summary
      if: ${{ always() }}
      shell: bash
      run: echo "gate base ${GATE_BASE:-unset}" >> "$GITHUB_STEP_SUMMARY"
