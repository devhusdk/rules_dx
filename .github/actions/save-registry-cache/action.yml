name: save-registry-cache
description: Save the Bazel registry file cache after setup-bazel restored it and missed.
runs:
  using: composite
  steps:
    - name: Keep only small registry files
      shell: bash
      run: |
        dir="$RUNNER_TEMP/dx-repository-cache/content_addressable"
        mkdir -p "$dir/sha256"
        git ls-files -z '*MODULE.bazel.lock' | xargs -0 grep -ohE '"[0-9a-f]{64}"' | tr -d '"' | sort -u > "$RUNNER_TEMP/dx-registry-hashes"
        ls "$dir/sha256" | sort | comm -23 - "$RUNNER_TEMP/dx-registry-hashes" | while read -r hash; do
          rm -rf "${dir:?}/sha256/$hash"
        done
        find "$dir/sha256" -mindepth 2 -maxdepth 2 -type f -size +1024k | while read -r big; do
          rm -rf "$(dirname "$big")"
        done
        echo "registry file cache: $(du -sk "$dir" | cut -f1) KB"
    - name: Save the registry file cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dx-repository-cache/content_addressable
        key: dx-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
