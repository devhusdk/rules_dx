name: setup-bazel
description: Install Bazelisk with bazel-contrib/setup-bazel and optionally locate the Bazel repository cache.
inputs:
  locate-repository-cache:
    description: Run bazel info to set the repository-cache-root output. It starts a Bazel server, so only jobs that read the output turn it on.
    required: false
    default: "false"
  free-disk:
    description: In the background, delete preinstalled SDKs rules_dx does not use. On macOS that is the Xcode versions other than the selected one and the Android SDK; on Linux the Android SDK, .NET, GHC and CodeQL. Whole-repo runs need the space; rules_dx fetches its own Android SDK. The deletes keep running after this action ends. Nothing waits for them before building, since they finish long before a run fills the free space the runner starts with; a final step reads their pid, log and status from $RUNNER_TEMP/dx-free-disk and fails the job if they failed.
    required: false
    default: "false"
outputs:
  repository-cache-root:
    description: The Bazel repository cache directory, set when locate-repository-cache is "true".
    value: ${{ steps.repo-cache.outputs.path }}
runs:
  using: composite
  steps:
    - name: Resolve the setup inputs
      id: pin
      shell: bash
      run: |
        version=""
        if [ -f tools/bazelisk/pin.env ]; then
          version="$(sed -n 's/^BAZELISK_VERSION=//p' tools/bazelisk/pin.env)"
        fi
        [ ! -f tools/bazelisk/pin.env ] || test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_OS" = Windows ] && [ -z "${BAZEL_SH:-}" ] && [ -x /usr/bin/bash.exe ]; then
          echo "BAZEL_SH=$(cygpath -m /usr/bin/bash.exe)" >> "$GITHUB_ENV"
        fi
        if [ "$RUNNER_OS" = Windows ]; then
          # Bazel fails with error 183 when a file or dangling link sits where it wants a directory.
          for dir in /c/bz /c/_bazel /d/bz /d/_bazel; do
            [ -d "/${dir:1:1}" ] || continue
            if [ -e "$dir" ] && [ ! -d "$dir" ]; then
              rm -f "$dir" || { echo "::error::$dir exists and is not a directory"; exit 1; }
            elif [ -L "$dir" ] && [ ! -e "$dir" ]; then
              rm -f "$dir"
            fi
            [ -d "$dir" ] || mkdir -p "$dir" || { echo "::error::cannot create $dir"; exit 1; }
          done
        fi
        if [ "$RUNNER_OS" = Windows ]; then
          bin="$(cygpath -w "$(dirname "${BAZEL_SH:-/usr/bin/bash.exe}")")"
          root="${bin%\\usr\\bin}"
          if [ "$root" != "$bin" ] && [ -f "$(cygpath -u "$root\\cmd\\git.exe")" ]; then
            system="$(cygpath -w "${SYSTEMROOT:-C:\\Windows}")"
            path="$bin;$root\\bin;$root\\cmd;$system;$system\\System32;$system\\System32\\WindowsPowerShell\\v1.0"
            echo "test:windows '--test_env=PATH=${path//\\/\\\\}'" >> user.bazelrc
          fi
        fi
        if [ "$RUNNER_OS" = Windows ] && [ -d /d ]; then
          echo "startup:windows --output_user_root=D:/bz" >> user.bazelrc
        elif [ "$RUNNER_OS" = Windows ]; then
          echo "startup:windows --output_user_root=C:/bz" >> user.bazelrc
        fi
    - name: Configure the remote cache credential helper
      uses: ./.github/actions/remote-cache-helper
    - name: Point Bazel at a repository cache and the shared nested cache root
      shell: bash
      run: |
        cache="$RUNNER_TEMP/dx-repository-cache"
        contents="$RUNNER_TEMP/dx-repo-contents"
        nested="$RUNNER_TEMP/dx-nested"
        mkdir -p "$cache" "$contents" "$nested"
        if [ "$RUNNER_OS" = Windows ]; then
          cache="$(cygpath -m "$cache")"
          contents="$(cygpath -m "$contents")"
          nested="$(cygpath -m "$nested")"
        fi
        # Nested Bazel tests reserve 2560 MB each. On the 16 GB Linux and Windows
        # runners .33 leaves about 5.2 GB, room for the 2 that nested_bazel=2 allows.
        # The 7 GB macOS runners run 1 at a time (nested_bazel=1), which .5 covers.
        case "$RUNNER_OS" in
          macOS) heap=50 memory=.5 ;;
          *) heap=50 memory=.33 ;;
        esac
        {
          echo "common --repository_cache=$cache"
          echo "common --repo_contents_cache=$contents"
          echo "test --sandbox_writable_path=$nested"
          echo "test --test_env=DX_NESTED_SHARED=$nested"
          echo "startup --host_jvm_args=-XX:MaxRAMPercentage=$heap"
          echo "common --local_resources=memory=HOST_RAM*$memory"
        } >> user.bazelrc
    - name: Free preinstalled macOS content rules_dx does not use
      if: ${{ inputs.free-disk == 'true' && runner.os == 'macOS' }}
      shell: bash
      run: |
        # The inner subshell keeps errexit; the outer one records its exit status.
        state="$RUNNER_TEMP/dx-free-disk"
        mkdir -p "$state"
        (
          set +e
          (
            set -e
            df -h /
            keep="$(cd "$(xcode-select -p)/../.." && pwd -P)"
            for app in /Applications/Xcode*.app; do
              if [ ! -L "$app" ] && [ "$(cd "$app" && pwd -P)" != "$keep" ]; then
                sudo rm -rf "$app" &
              fi
            done
            if [ -n "${ANDROID_HOME:-}" ]; then
              sudo rm -rf "$ANDROID_HOME" &
            fi
            wait
            find /Applications -maxdepth 1 -name 'Xcode*.app' -type l ! -exec test -e {} \; -exec sudo rm -f {} +
            echo "kept $keep"
            df -h /
          )
          echo "$?" > "$state/status"
        ) > "$state/log" 2>&1 < /dev/null &
        echo "$!" > "$state/pid"
    - name: Free preinstalled Linux content rules_dx does not use
      if: ${{ inputs.free-disk == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        # Runs in the background like the macOS step above.
        state="$RUNNER_TEMP/dx-free-disk"
        mkdir -p "$state"
        (
          set +e
          (
            set -e
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
            df -h /
          )
          echo "$?" > "$state/status"
        ) > "$state/log" 2>&1 < /dev/null &
        echo "$!" > "$state/pid"
    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
      with:
        bazelisk-version: ${{ steps.pin.outputs.version }}
        bazelisk-cache: false
        disk-cache: false
        repository-cache: false
        external-cache: false
    - name: Start the Bazel server
      shell: bash
      run: bazel info output_base >/dev/null 2>&1 &
    - name: Locate the Bazel repository cache
      id: repo-cache
      if: ${{ inputs.locate-repository-cache == 'true' }}
      shell: bash
      run: |
        path="$(bazel info repository_cache)"
        echo "path=$path" >> "$GITHUB_OUTPUT"
