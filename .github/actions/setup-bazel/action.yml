name: setup-bazel
description: Install Bazelisk with bazel-contrib/setup-bazel and restore the Bazel repository cache.
inputs:
  cache-save:
    description: Save the setup-bazel caches.
    required: false
    default: "false"
  bazelisk-version:
    description: Bazelisk version. Defaults to BAZELISK_VERSION in tools/bazelisk/pin.env when that file exists, else 1.x.
    required: false
    default: ""
  repo-cache:
    description: "Repository cache to restore: none, download (content_addressable) or contents (extracted repos). Defaults to contents on Windows and none elsewhere."
    required: false
    default: ""
  bazelrc:
    description: Lines to append to ~/.bazelrc, which Bazel reads after the workspace rc files.
    required: false
    default: ""
outputs:
  repository-cache-root:
    description: The Bazel repository cache directory, empty when repo-cache is none.
    value: ${{ steps.repo-cache.outputs.path }}
  repository-cache-path:
    description: The content_addressable directory the cache saves.
    value: ${{ steps.repo-cache.outputs.path }}/content_addressable
  repository-cache-key:
    description: The key the cache saves under.
    value: ${{ steps.repo-cache-restore.outputs.cache-primary-key }}
  repository-cache-hit:
    description: Whether the restore hit the exact key.
    value: ${{ steps.repo-cache-restore.outputs.cache-hit }}
  repo-contents-cache-path:
    description: The repo contents directory the contents cache saves, empty unless repo-cache is contents.
    value: ${{ steps.repo-contents.outputs.path }}
  repo-contents-cache-key:
    description: The key the repo contents cache saves under.
    value: ${{ steps.repo-contents-restore.outputs.cache-primary-key }}
  repo-contents-cache-hit:
    description: Whether the repo contents restore hit the exact key.
    value: ${{ steps.repo-contents-restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve the setup inputs
      id: pin
      shell: bash
      env:
        BAZELISK_VERSION_INPUT: ${{ inputs.bazelisk-version }}
        REPO_CACHE_INPUT: ${{ inputs.repo-cache }}
        BAZELRC_INPUT: ${{ inputs.bazelrc }}
      run: |
        version="$BAZELISK_VERSION_INPUT"
        if [ -z "$version" ] && [ -f tools/bazelisk/pin.env ]; then
          version="$(sed -n 's/^BAZELISK_VERSION=//p' tools/bazelisk/pin.env)"
        fi
        echo "version=${version:-1.x}" >> "$GITHUB_OUTPUT"
        mode="$REPO_CACHE_INPUT"
        if [ -z "$mode" ]; then
          if [ "$RUNNER_OS" = Windows ]; then mode=contents; else mode=none; fi
        fi
        case "$mode" in
          none|download|contents) ;;
          *) echo "setup-bazel: repo-cache must be none, download or contents, got '$mode'" >&2; exit 1 ;;
        esac
        echo "repo-cache=$mode" >> "$GITHUB_OUTPUT"
        if [ -n "$BAZELRC_INPUT" ]; then
          printf '%s\n' "$BAZELRC_INPUT" >> "$HOME/.bazelrc"
        fi
        if [ "$RUNNER_OS" = Windows ] && [ -z "${BAZEL_SH:-}" ] && [ -x /usr/bin/bash.exe ]; then
          echo "BAZEL_SH=$(cygpath -m /usr/bin/bash.exe)" >> "$GITHUB_ENV"
        fi
    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
      with:
        bazelisk-version: ${{ steps.pin.outputs.version }}
        bazelisk-cache: false
        cache-save: ${{ inputs.cache-save }}
    - name: Locate the Bazel repository cache
      id: repo-cache
      if: ${{ steps.pin.outputs.repo-cache == 'download' }}
      shell: bash
      run: |
        path="$(bazel info repository_cache)"
        echo "path=$path" >> "$GITHUB_OUTPUT"
    - name: Restore the Bazel repository cache
      id: repo-cache-restore
      if: ${{ steps.repo-cache.outputs.path != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.repo-cache.outputs.path }}/content_addressable
        key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
        restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
    - name: Stamp the restored Bazel repository cache
      if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
      shell: bash
      run: touch "$RUNNER_TEMP/dx-repo-cache.stamp"
    - name: Locate the Bazel repo contents cache
      id: repo-contents
      if: ${{ steps.pin.outputs.repo-cache == 'contents' }}
      shell: bash
      run: |
        path="$(bazel info repository_cache | tr -d '\r')/contents"
        echo "path=$path" >> "$GITHUB_OUTPUT"
    - name: Restore the Bazel repo contents cache
      id: repo-contents-restore
      if: ${{ steps.repo-contents.outputs.path != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.repo-contents.outputs.path }}
          !${{ steps.repo-contents.outputs.path }}/gc_lock
          !${{ steps.repo-contents.outputs.path }}/_trash
        key: dx-contents-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
