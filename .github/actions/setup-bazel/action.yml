name: setup-bazel
description: Install Bazelisk with bazel-contrib/setup-bazel and optionally locate the Bazel repository cache.
inputs:
  cache-save:
    description: Save the setup-bazel caches.
    required: false
    default: "false"
  locate-repository-cache:
    description: Run bazel info to set the repository-cache-root output. It starts a Bazel server, so only jobs that read the output turn it on.
    required: false
    default: "false"
outputs:
  repository-cache-root:
    description: The Bazel repository cache directory, set when locate-repository-cache is "true".
    value: ${{ steps.repo-cache.outputs.path }}
  registry-cache-hit:
    description: "\"true\" when the registry file cache was restored under its exact key."
    value: ${{ steps.registry.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve the setup inputs
      id: pin
      shell: bash
      run: |
        version=""
        if [ -f tools/bazelisk/pin.env ]; then
          version="$(sed -n 's/^BAZELISK_VERSION=//p' tools/bazelisk/pin.env)"
        fi
        [ ! -f tools/bazelisk/pin.env ] || test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_OS" = Windows ] && [ -z "${BAZEL_SH:-}" ] && [ -x /usr/bin/bash.exe ]; then
          echo "BAZEL_SH=$(cygpath -m /usr/bin/bash.exe)" >> "$GITHUB_ENV"
        fi
        if [ "$RUNNER_OS" = Windows ] && [ -d /d ]; then
          echo "startup:windows --output_user_root=D:/bz" >> user.bazelrc
        fi
    - name: Configure the remote cache credential helper
      shell: bash
      run: |
        args="${DX_REMOTE_CACHE_ARG:-}"
        dir="$RUNNER_TEMP/dx-credential-helper"
        if [ -n "${BUILDBUDDY_API_KEY:-}" ] && [ -z "${REMOTE_CACHE_HEADER:-}" ]; then
          mkdir -p "$dir"
          if [ "$RUNNER_OS" = Windows ]; then
            helper="$dir/helper.bat"
            printf '@echo {"headers":{"x-buildbuddy-api-key":["%%BUILDBUDDY_API_KEY%%"]}}\r\n' > "$helper"
            chmod 700 "$helper"
            helper="$(cygpath -m "$helper")"
          else
            helper="$dir/helper.sh"
            cat > "$helper" <<'EOF'
        #!/bin/sh
        printf '{"headers":{"x-buildbuddy-api-key":["%s"]}}\n' "$BUILDBUDDY_API_KEY"
        EOF
            chmod 700 "$helper"
          fi
          args="${args:+$args }--credential_helper=remote.buildbuddy.io=$helper"
        elif [ -n "${REMOTE_CACHE_HEADER:-}" ]; then
          name="${REMOTE_CACHE_HEADER%%=*}"
          value="${REMOTE_CACHE_HEADER#*=}"
          if [ "$name" = "$REMOTE_CACHE_HEADER" ] || [ -z "$name" ] || [ -z "$value" ]; then
            echo "::error::REMOTE_CACHE_HEADER must look like name=value"
            exit 1
          fi
          case "$name$value" in
            *['"\%&|<>^']*)
              echo "::error::REMOTE_CACHE_HEADER has a character the credential helper cannot carry: one of \" \\ % & | < > ^"
              exit 1
              ;;
          esac
          host="${DX_REMOTE_CACHE_ARG#--remote_cache=}"
          host="${host#*://}"
          host="${host%%/*}"
          host="${host##*@}"
          host="${host%%:*}"
          host="${host:-remote.buildbuddy.io}"
          mkdir -p "$dir"
          if [ "$RUNNER_OS" = Windows ]; then
            helper="$dir/header.bat"
            printf '@for /f "tokens=1* delims==" %%%%a in ("%%REMOTE_CACHE_HEADER%%") do @echo {"headers":{"%%%%a":["%%%%b"]}}\r\n' > "$helper"
            chmod 700 "$helper"
            helper="$(cygpath -m "$helper")"
          else
            helper="$dir/header.sh"
            cat > "$helper" <<'HEADER'
        #!/bin/sh
        printf '{"headers":{"%s":["%s"]}}\n' "${REMOTE_CACHE_HEADER%%=*}" "${REMOTE_CACHE_HEADER#*=}"
        HEADER
            chmod 700 "$helper"
          fi
          args="${args:+$args }--credential_helper=$host=$helper"
        fi
        if [ -n "$args" ]; then
          echo "BB_ARGS=$args" >> "$GITHUB_ENV"
          echo "startup --experimental_remote_repo_contents_cache" >> user.bazelrc
        fi
    - name: Point Bazel at a registry file cache
      shell: bash
      run: |
        cache="$RUNNER_TEMP/dx-repository-cache"
        contents="$RUNNER_TEMP/dx-repo-contents"
        mkdir -p "$cache" "$contents"
        if [ "$RUNNER_OS" = Windows ]; then
          cache="$(cygpath -m "$cache")"
          contents="$(cygpath -m "$contents")"
        fi
        {
          echo "common --repository_cache=$cache"
          echo "common --repo_contents_cache=$contents"
        } >> user.bazelrc
    - name: Restore the registry file cache
      id: registry
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dx-repository-cache/content_addressable
        key: dx-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
        restore-keys: dx-registry-${{ runner.os }}-${{ runner.arch }}-
    - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
      with:
        bazelisk-version: ${{ steps.pin.outputs.version }}
        bazelisk-cache: false
        cache-save: ${{ inputs.cache-save }}
    - name: Locate the Bazel repository cache
      id: repo-cache
      if: ${{ inputs.locate-repository-cache == 'true' }}
      shell: bash
      run: |
        path="$(bazel info repository_cache)"
        echo "path=$path" >> "$GITHUB_OUTPUT"
