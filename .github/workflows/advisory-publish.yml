name: advisory-publish

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: advisory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      ADVISORY_REPO: devhusdk/rules_dx-advisory
      HAS_APP: ${{ secrets.DX_UPDATE_APP_ID != '' && secrets.DX_UPDATE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: env.HAS_APP == 'true'
        with:
          app-id: ${{ secrets.DX_UPDATE_APP_ID }}
          private-key: ${{ secrets.DX_UPDATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Prepare the snapshots live
        id: prepare
        run: |
          set -euo pipefail
          date="$(date -u +%F)"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          bazel build //cli/advisory_prep:trivy
          trivy_file="$(bazel cquery --output=files //cli/advisory_prep:trivy)"
          trivy="$(bazel info execution_root)/$trivy_file"
          bazel run //cli/advisory_prep -- \
            --workspace "$GITHUB_WORKSPACE" \
            --out "$RUNNER_TEMP/advisory" \
            --date "$date" \
            --trivy "$trivy" \
            --pin "$RUNNER_TEMP/assets" | grep '^advisory ' | sort > "$RUNNER_TEMP/pins.txt"
          cat "$RUNNER_TEMP/pins.txt"
      - name: Skip when no source changed
        id: changed
        env:
          GH_TOKEN: ${{ secrets.ADVISORY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          shas() { awk '{print $2, $4}' | sort; }
          gh release view --repo "$ADVISORY_REPO" --json body --jq .body 2>/dev/null |
            grep '^advisory ' | shas > "$RUNNER_TEMP/old-shas.txt" || : > "$RUNNER_TEMP/old-shas.txt"
          shas < "$RUNNER_TEMP/pins.txt" > "$RUNNER_TEMP/new-shas.txt"
          if cmp -s "$RUNNER_TEMP/old-shas.txt" "$RUNNER_TEMP/new-shas.txt"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADVISORY_RELEASE_TOKEN }}
          DATE: ${{ steps.prepare.outputs.date }}
        run: |
          set -euo pipefail
          gh release create "$DATE" --repo "$ADVISORY_REPO" --title "$DATE" \
            --notes-file "$RUNNER_TEMP/pins.txt" "$RUNNER_TEMP/assets/$DATE"/*
      - name: Open the pin pull request
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          if ! grep -q '^advisory ' .dx/pins; then
            echo "no advisory lines in .dx/pins; nothing to bump"
            exit 0
          fi
          gh auth setup-git
          tools/dx update advisory --pr
