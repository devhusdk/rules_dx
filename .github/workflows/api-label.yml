name: api-label

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: api-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-label:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Require the api label when api/ changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'api') }}
        run: |
          set -euo pipefail
          changed=$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty) | select(startswith("api/"))' | sort -u)
          if [ -z "$changed" ]; then
            echo "no change under api/"
            exit 0
          fi
          printf '%s\n' "$changed"
          if [ "$HAS_LABEL" != "true" ]; then
            echo "::error title=Missing api label::this pull request changes api/, so it needs the api label"
            exit 1
          fi
          echo "api label present"
