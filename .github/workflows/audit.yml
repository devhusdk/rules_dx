name: audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && '--config=ci' || '' }}
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
  # Git Bash must not convert Bazel labels.
  MSYS2_ARG_CONV_EXCL: "//"

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  network:
    name: network (requires-network nested consumer tests)
    timeout-minutes: 75
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        id: setup
        with:
          cache-save: true
          disk-cache: ${{ env.BUILDBUDDY_API_KEY == '' && format('{0}-{1}', github.job, strategy.job-index) || 'false' }}
          locate-repository-cache: "true"
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the opted-in requires-network consumer tests
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          targets="$(bazel query "$@" 'attr(tags, network-consumer, //...)' --output=label)"
          test -n "$targets"
          echo "$targets" > "$RUNNER_TEMP/network-targets"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --test_output=errors --test_timeout=2400 "$@" $targets
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### network (linux_x86_64) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran the tests tagged network-consumer." >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/network-targets" ]; then
            sed 's/^/- /' "$RUNNER_TEMP/network-targets" >> "$GITHUB_STEP_SUMMARY"
          fi
  quickstart:
    name: quickstart (README quickstart against the real internet)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the README quickstart with the network on
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --nocache_test_results --test_timeout=2400 --test_env=DX_NESTED_BAZEL_NETWORK=1 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //deploy/private/release/tests:release_consumer_smoke_test --test_arg=--exact --test_arg=quickstart_consumer_test::the_readme_quickstart_runs_as_written
  hermetic:
    name: hermetic (no-install and network-denied consumer qualification)
    timeout-minutes: 120
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: true
          disk-cache: ${{ env.BUILDBUDDY_API_KEY == '' && format('{0}-{1}', github.job, strategy.job-index) || 'false' }}
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Qualify the consumer without installs or network
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          targets="$(bazel query "$@" 'attr(tags, hermetic-consumer, //...) except filter("_upstream$", //...) except filter("_msvc$", //...)' --output=label)"
          test -n "$targets"
          echo "$targets" > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_probe_test //tools/testing:nested_bazel_harness_test $targets
      - name: Run the release consumer cases offline
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "$@" //deploy/private/release/tests:release_consumer_smoke_test
      - uses: ./.github/actions/hermetic-evidence
        if: always()
        with:
          platform: linux_x86_64
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### hermetic (linux_x86_64) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualified a fresh C++ and Rust consumer: fetch with network, then test, ambient-tool, home-config, network and cache probes with the network denied. Evidence is in the hermetic-evidence artifact." >> "$GITHUB_STEP_SUMMARY"
  hermetic-macos:
    name: hermetic-macos (macOS-compatible consumer qualifications on macos_arm64)
    timeout-minutes: 150
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        id: setup
        with:
          cache-save: true
          disk-cache: ${{ env.BUILDBUDDY_API_KEY == '' && format('{0}-{1}', github.job, strategy.job-index) || 'false' }}
          locate-repository-cache: "true"
      - name: Qualify the consumer without installs or network
        run: |
          test "$(uname -s)" = Darwin
          printf '%s\n' //tools/testing/hermetic:cpp_rust > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2046
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_probe_test //tools/testing:nested_bazel_harness_test //apple/tests:consumer_build_test $(cat "$RUNNER_TEMP/hermetic-targets")
      - name: Run the README quickstart and bcr_test_module cases for macos_arm64
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_output=all --test_timeout=2400 "$@" //deploy/private/release/tests:release_consumer_smoke_test --test_arg=--exact --test_arg=quickstart_consumer_test::bcr_test_module_runs_its_presubmit_targets --test_arg=quickstart_consumer_test::the_readme_quickstart_runs_as_written
      - uses: ./.github/actions/hermetic-evidence
        if: always()
        with:
          platform: macos_arm64
  hermetic-windows:
    name: hermetic-windows (MSVC isolation on ${{ matrix.platform }})
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: [windows_x86_64, windows_arm64]
    runs-on: ${{ fromJSON('{"windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: true
          disk-cache: ${{ env.BUILDBUDDY_API_KEY == '' && format('{0}-{1}', github.job, strategy.job-index) || 'false' }}
      - name: Deny the host MSVC trees to hermetic runs
        run: |
          denies=()
          # Git Bash upper-cases ProgramFiles but keeps ProgramFiles(x86) as is.
          for root in "${PROGRAMFILES:-$(printenv ProgramFiles)}" "$(printenv 'ProgramFiles(x86)')"; do
            [ -n "$root" ] || continue
            for name in "Microsoft Visual Studio" "Windows Kits" "Microsoft SDKs"; do
              dir="$root\\$name"
              if [ -d "$(cygpath -u "$dir")" ]; then
                denies+=(--deny "$dir")
              fi
            done
          done
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel run --noshow_progress "$@" --//cc:compiler=msvc //tools/testing/hermetic:appcontainer_run -- \
            --backend user --ensure-host-denies "${denies[@]}"
      - name: Probe MSVC isolation without Visual Studio or network
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_windows_probe_test
          if [ "$PLATFORM" = windows_x86_64 ]; then
            bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors "$@" //tools/testing:nested_bazel_harness_test
            bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "$@" --//cc:compiler=msvc //deploy/private:pypi_native_msvc_verify
          fi
  determinism:
    name: determinism (two cold builds, exec logs compared, shard ${{ matrix.shard }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0/7
            patterns: //appimage/...
          - shard: 1/7
            patterns: //cli/archive/...
          - shard: 2/7
            patterns: //android/private/packaging/...
          - shard: 3/7
            patterns: //msix/tests/...
          - shard: 4/7
            patterns: ""
          - shard: 5/7
            patterns: //deploy/private:all
          - shard: 6/7
            patterns: //deploy/private/... -//deploy/private:all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Build twice and compare the execution logs
        # A step timeout fails the step and keeps the log; the job cap above discards it.
        timeout-minutes: 40
        env:
          SHARD: ${{ matrix.shard }}
          PATTERNS: ${{ matrix.patterns }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          read -ra patterns <<< "$PATTERNS"
          bazel run "$@" //tools/testing:determinism_check -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/determinism" --kinds --shard "$SHARD" "${patterns[@]}"
  msix-install:
    name: msix-install (windows_x86_64)
    timeout-minutes: 60
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: true
          disk-cache: ${{ env.BUILDBUDDY_API_KEY == '' && format('{0}-{1}', github.job, strategy.job-index) || 'false' }}
      - name: Install and launch the signed package
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_output=errors "$@" //msix/tests:install_test
  verify-pins:
    name: verify-pins (quality artifact pins match upstream bytes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Verify the pinned quality tools
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run --noshow_progress "$@" //core/quality/artifacts:update -- --verify-only
  license-terms:
    name: license-terms (license terms match their pinned hash)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Hash the terms and track changes in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          title="licenses: terms changed upstream"
          report=$(python3 -I tools/licenses/terms_check.py core/licenses/pins.json)
          status=$?
          printf '%s\n' "$report"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi
          body="The audit terms check found terms that no longer match core/licenses/pins.json: $RUN_URL"$'\n\n'"$report"$'\n\n'"Read the new terms, then set the new terms_sha256 in core/licenses/pins.json so acceptances of the old terms ask users to re-accept."
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
  patch-upstream:
    name: patch-upstream (patches whose upstream fix is released)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Check each patch's Upstream header
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run --noshow_progress "$@" //patches:upstream > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="patches: upstream fixes released"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ ! -s report.md ]; then
            echo "Every patch's and carry's upstream fix is still unreleased."
            exit 0
          fi
          {
            echo "The \`audit\` run found patches under \`patches/\` or carries that need a person. See [patches/README.md]($GITHUB_SERVER_URL/$GH_REPO/blob/main/patches/README.md) for how to drop a patch or carry."
            echo
            cat report.md
          } > body.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --label P2 --body-file body.md
          fi
  upgrade-e2e:
    name: upgrade-e2e (dx upgrade between the two latest BCR releases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Upgrade and roll back
        run: |
          bazel build --noshow_progress //tools/ci/producers:producers_bin
          "$(bazel info bazel-bin)/tools/ci/producers/producers_bin" --upgrade-e2e
  unlabelled-issues:
    name: unlabelled-issues (open issues without a priority label)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: read
    steps:
      - name: Warn about open issues without a priority label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --state open --limit 1000 --json number,title,labels,createdAt,isPinned \
            --jq '.[] | select(.createdAt < "'"$cutoff"'") | select(.isPinned | not) | select([.labels[].name | test("^P[0-3]$")] | any | not) | "#\(.number) \(.title)"' \
            > unlabelled.txt
          count=$(wc -l < unlabelled.txt)
          {
            echo "### Open issues without P0 to P3 (created before $cutoff): $count"
            echo
            if [ "$count" -gt 0 ]; then
              sed 's/^/- /' unlabelled.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::warning title=Unlabelled issue::$line needs a P0 to P3 label"
          done < unlabelled.txt
  missing-labels:
    name: missing-labels (documented labels missing from the repository)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Warn about documented labels missing from the repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo bug enhancement needs-host tracking needs-review dogfood P0 P1 P2 P3 | tr ' ' '\n'
            for f in .github/ISSUE_TEMPLATE/*.md; do
              awk '/^---$/ { n++; next } n == 1 && /^labels:/ { sub(/^labels:/, ""); print; f = 1; next } n == 1 && f && /^[[:space:]]*-/ { sub(/^[[:space:]]*-/, ""); print; next } n == 1 { f = 0 }' "$f" |
                tr ',' '\n' | tr -d "[]\"' " | sed '/^$/d'
            done
          } | sort -u > wanted.txt
          gh label list --limit 500 --json name --jq '.[].name' | sort -u > present.txt
          grep -vxFf present.txt wanted.txt > missing.txt || true
          while IFS= read -r name; do
            echo "::warning title=Missing label::label $name is documented or used by an issue template but does not exist"
          done < missing.txt
  blocked-issues:
    name: blocked-issues (unblock issues whose blockers are done)
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build the blocker reference parser
        run: bazel build --noshow_progress //tools/ci/producers:producers_bin
      - name: Check that blocked issues name a blocker, and unblock closed ones
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- blocked-on-missing -->'
          producers="$(bazel info bazel-bin)/tools/ci/producers/producers_bin"
          for n in $(gh issue list --label blocked --state open --limit 1000 --json number --jq '.[].number'); do
            body=$(gh issue view "$n" --json body --jq .body)
            line=$(printf '%s\n' "$body" | tr -d '\r' | grep -m1 -i '^Blocked on:' || true)
            if [ -z "$line" ]; then
              echo "::warning title=Blocked without blocker::#$n has the blocked label but no 'Blocked on:' line"
              comments=$(gh issue view "$n" --json comments --jq '.comments[].body')
              if [[ "$comments" != *"$marker"* ]]; then
                gh issue comment "$n" --body "$marker
          This issue has the \`blocked\` label but no \`Blocked on:\` line in its body. Add one naming the blocking issue (\`#N\`), a pull request URL, or the owner action. See CONTRIBUTING.md."
              fi
              continue
            fi
            refs=$(printf '%s\n' "$line" | "$producers" --blocker-refs "$GH_REPO")
            [ -n "$refs" ] || continue
            done_all=true
            written=
            while read -r repo num ref kind; do
              if [ "$kind" = release ]; then
                state=false
                sha=$(gh api "repos/$repo/pulls/$num" --jq 'select(.merged_at != null) | .merge_commit_sha' 2>/dev/null) || sha=
                if [ -n "$sha" ]; then
                  tag=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null) || tag=
                  if [ -z "$tag" ]; then
                    echo "::warning title=No release to check::#$n: $repo has no latest GitHub release"
                  else
                    status=$(gh api "repos/$repo/compare/$tag...$sha" --jq .status 2>/dev/null) || status=
                    if [ "$status" = behind ] || [ "$status" = identical ]; then
                      state=true
                      ref="$ref released in $tag"
                    fi
                  fi
                fi
              else
                state=$(gh api "repos/$repo/issues/$num" --jq 'if .pull_request then (.pull_request.merged_at != null) else (.state == "closed") end' 2>/dev/null || echo unknown)
                ref="$ref closed"
              fi
              written="${written:+$written, }$ref"
              [ "$state" = true ] || done_all=false
            done <<< "$refs"
            if [ "$done_all" = true ]; then
              gh issue comment "$n" --body "Unblocked: $written"
              gh issue edit "$n" --remove-label blocked
            fi
          done
  unreviewed-merges:
    name: unreviewed-merges (merged review-path pull requests without a Review comment)
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build the review path filter
        run: bazel build --noshow_progress //tools/ci/producers:producers_bin
      - name: Warn about merged pull requests on review paths without a Review comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- unreviewed-merge -->'
          producers="$(bazel info bazel-bin)/tools/ci/producers/producers_bin"
          since=$(date -u -d '2 days ago' +%Y-%m-%d)
          for n in $(gh pr list --state merged --search "merged:>=$since" --limit 200 --json number --jq '.[].number'); do
            paths=$(gh pr view "$n" --json files --jq '.files[].path' | "$producers" --review-paths)
            [ -n "$paths" ] || continue
            bodies=$(gh pr view "$n" --json comments,reviews --jq '[.comments[].body, .reviews[].body] | .[]')
            if grep -q '^Review:' <<< "$bodies"; then
              continue
            fi
            echo "::warning title=Unreviewed merge::#$n touched review paths and has no Review: comment"
            comments=$(gh pr view "$n" --json comments --jq '.comments[].body')
            if [[ "$comments" != *"$marker"* ]]; then
              gh pr comment "$n" --body "$marker
          This pull request touched paths in \`.github/review-paths.txt\` and was merged without a \`Review:\` comment. See CONTRIBUTING.md."
            fi
          done
  dispatch:
    name: dispatch (advisory-publish daily, dx-update on Mondays)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the advisory and update workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run advisory-publish.yml --ref "$REF"
          if [ "$(date -u +%u)" = 1 ]; then
            gh workflow run dx-update.yml --ref "$REF"
          fi
  report:
    name: report
    if: ${{ always() && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'cancelled') }}
    needs:
      [
        network,
        quickstart,
        hermetic,
        hermetic-macos,
        hermetic-windows,
        determinism,
        msix-install,
        verify-pins,
        license-terms,
        patch-upstream,
        upgrade-e2e,
        unlabelled-issues,
        missing-labels,
        blocked-issues,
        unreviewed-merges,
        dispatch,
      ]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Rewrite the known red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Agents read this issue without a token; keep the fenced block one label per line.
          jobs=""
          labels=""
          while IFS=$'\t' read -r job_id job_name step_name; do
            [ -n "$job_id" ] || continue
            jobs="$jobs- $job_name (step: ${step_name:-unknown})"$'\n'
            if ! log=$(gh api "repos/$GH_REPO/actions/jobs/$job_id/logs"); then
              echo "::warning title=known-red::no log for job $job_id"
              continue
            fi
            found=$(printf '%s\n' "$log" | tr -d '\r' | sed -E 's/^[0-9T:.Z-]+ //' \
              | awk '/^(@[^ ]*)?\/\/[^ ]+ +(\(cached\) +)?(FAILED|TIMEOUT|NO STATUS|INCOMPLETE)/ { print $1 }')
            labels="$labels${found:+$'\n'$found}"
          done < <(gh run view "$RUN_ID" --json jobs --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | [(.databaseId | tostring), .name, ([.steps[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name][0] // "")] | @tsv')
          list=$(printf '%s\n' "$labels" | sed '/^$/d' | sort -u)
          {
            echo "Test labels that failed on the last audit run on main: $RUN_URL"
            echo "Commit: $HEAD_SHA. The audit workflow rewrites this issue after each run on main and never retries a test."
            echo
            echo '```text'
            if [ -n "$list" ]; then printf '%s\n' "$list"; fi
            echo '```'
            if [ -n "$jobs" ]; then
              echo
              echo "Failed jobs:"
              printf '%s' "$jobs"
            fi
          } > known-red.md
          gh label create known-red --force --color B60205 --description "Tests that failed on the last audit run on main"
          number=$(gh issue list --state open --label known-red --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file known-red.md
          else
            url=$(gh issue create --title "ci: known red tests on main" --label known-red --body-file known-red.md)
            if ! gh issue pin "$url"; then
              echo "::warning title=known-red::could not pin $url"
            fi
          fi
