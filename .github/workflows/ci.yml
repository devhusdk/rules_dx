          if [ -n "$SWAP_GB" ]; then
            sudo fallocate -l "${SWAP_GB}G" /mnt/dx-swap
            sudo chmod 600 /mnt/dx-swap
            sudo mkswap /mnt/dx-swap
            sudo swapon /mnt/dx-swap
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            # A runner out of memory or disk dies with no Bazel error; this log shows which one ran out.
            (while sleep 30; do echo "resources: $(free -m | sed -n 2,3p | tr -s ' \n' ' ') | $(df -h / /mnt | tail -2 | tr -s ' \n' ' ')"; done) &
