name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  # Both stay empty unless the repository sets BUILDBUDDY_API_KEY.
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ secrets.BUILDBUDDY_API_KEY != '' && format('--remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
  # Git Bash must not convert Bazel labels.
  MSYS2_ARG_CONV_EXCL: "//"
  BAZELISK_VERSION: "1.29.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dogfood:
    name: dogfood (self-call reusable consumer workflow)
    # Dogfoods the reusable file end to end on the working tree.
    needs: [workflow-check, preflight]
    uses: ./.github/workflows/reusable-consumer.yml
    with:
      rules_dx_version: "0.0.0"
      platforms: '["linux_x86_64", "linux_arm64", "macos_arm64", "windows_x86_64", "windows_arm64"]'
      min_coverage: "100"
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
  docs:
    name: docs (self-call reusable docs workflow)
    uses: ./.github/workflows/reusable-docs.yml
    with:
      rules_dx_version: "0.0.0"
      docs_scope: "//docs/... //tools/docs/..."
      site: "//tools/docs/site:user_site"
      site_check: "//tools/docs/site:user_site_check"
      landing: true
      smoke_test: "//tools/docs/site:deploy_smoke_test"
      forbid: |
        Treat warnings as errors
        docs_fixture
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pages: write
      id-token: write
  devcontainer-check:
    name: devcontainer-check (init parity, definition valid)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Prove dx init scaffold matches checked-in definition
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_timeout=300 //.devcontainer:devcontainer_parity_test "$@"
      - name: Validate devcontainer definition shape
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          python3 - <<'EOF'
          import json
          with open(".devcontainer/devcontainer.json") as handle:
              definition = json.load(handle)
          post_create = definition["postCreateCommand"]
          assert "bazel run @rules_dx//:dx -- env --apply" in post_create, post_create
          assert "bazel run @rules_dx//:dx -- codegen --apply" in post_create, post_create
          assert "bazel build //..." not in post_create, post_create
          print("devcontainer definition valid:", post_create)
          EOF
      - name: Write job summary
        if: always()
        run: |
          echo "### devcontainer-check — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: dx init scaffold parity plus devcontainer definition shape." >> "$GITHUB_STEP_SUMMARY"
  hermetic:
    name: hermetic (no-install and network-denied consumer qualification)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Qualify the consumer without installs or network
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          targets="$(bazel query "$@" 'attr(tags, hermetic-consumer, //...) except filter("_upstream$", //...)' --output=label)"
          test -n "$targets"
          echo "$targets" > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_probe_test $targets
      - name: Verify the evidence
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            bazel run --noshow_progress "$@" //tools/testing/hermetic:verify -- --evidence "$PWD/bazel-testlogs/$pkg/$name/test.outputs/evidence.json" --commit "$(git rev-parse HEAD)" --manifest "$PWD/bazel-bin/$pkg/${name}_manifest.json"
          done < "$RUNNER_TEMP/hermetic-targets"
      - name: Collect the evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hermetic-evidence"
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            mkdir -p "$RUNNER_TEMP/hermetic-evidence/$name"
            cp -R "bazel-testlogs/$pkg/$name/test.outputs/." "$RUNNER_TEMP/hermetic-evidence/$name/" || true
          done < "$RUNNER_TEMP/hermetic-targets"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hermetic-evidence-linux_x86_64
          path: ${{ runner.temp }}/hermetic-evidence
          retention-days: 7
      - name: Write job summary
        if: always()
        run: |
          echo "### hermetic (linux_x86_64) — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualified a fresh C++ and Rust consumer: fetch with network, then test, ambient-tool, home-config, network and cache probes with the network denied. Evidence is in the hermetic-evidence artifact." >> "$GITHUB_STEP_SUMMARY"
  preflight:
    name: preflight (native bootstrap and tool launch) (${{ matrix.platform }}, ${{ matrix.runner }})
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
            quality: "//quality/testdata:matrix_python_format_pass //quality/testdata:matrix_javascript_format_pass //quality/testdata:matrix_api_spec_openapi_pass"
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            quality: "//quality/testdata:matrix_python_format_pass //quality/testdata:matrix_javascript_format_pass"
          - platform: macos_arm64
            runner: macos-15
            quality: "//quality/testdata:matrix_python_format_pass //quality/testdata:matrix_javascript_format_pass"
          - platform: windows_x86_64
            runner: windows-latest
            quality: "//quality/testdata:matrix_python_format_pass //quality/testdata:matrix_javascript_format_pass"
          - platform: windows_arm64
            runner: windows-11-arm
            quality: ""
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Stamp the restored Bazel repository cache
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.platform == 'windows_arm64' && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        shell: bash
        run: touch "$RUNNER_TEMP/dx-repo-cache.stamp"
      - name: Build the bootstrap closure
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel build --noshow_progress "$@" //cli/cli:dx //cc/tests/fixtures/hello:hello
      - name: Run the launch smoke
        env:
          QUALITY_TARGETS: ${{ matrix.quality }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2086
          bazel test --noshow_progress --nocache_test_results --test_output=all --test_arg=--nocapture "$@" //tools/testing:preflight_smoke_test //cli/env:bootstrap_test //cc/tests/fixtures/hello:hello_test $QUALITY_TARGETS
      - name: Write job summary
        if: always()
        run: |
          echo "### preflight ${{ matrix.platform }} — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Built dx plus the native hello fixture, installed and replaced the bootstrap environment, then launched dx, hello, and the representative Python and JavaScript tools on ${{ matrix.runner }}." >> "$GITHUB_STEP_SUMMARY"
      - name: Prune the Bazel repository cache to this run's downloads
        if: ${{ success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.platform == 'windows_arm64' && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        shell: bash
        env:
          DX_REPO_CACHE: ${{ steps.repo-cache.outputs.path }}/content_addressable
        run: |
          # Bazel touches an entry on each hit, so entries older than the stamp went unused.
          stamp="$RUNNER_TEMP/dx-repo-cache.stamp"
          if [ ! -f "$stamp" ] || [ ! -d "$DX_REPO_CACHE" ]; then
            exit 0
          fi
          pruned=0
          for entry in "$DX_REPO_CACHE"/*/*/; do
            entry="${entry%/}"
            [ -d "$entry" ] || continue
            if [ ! "$entry/file" -nt "$stamp" ]; then
              rm -rf "$entry"
              pruned=$((pruned + 1))
            fi
          done
          size="$(du -sh "$DX_REPO_CACHE" | cut -f1)"
          echo "dx-ci: pruned $pruned unused repository cache entries; the saved cache holds $size." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the Bazel repository cache
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.platform == 'windows_arm64' && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: ${{ steps.repo-cache-restore.outputs.cache-primary-key }}
  workflow-check:
    name: workflow-check (actionlint semantics, before the matrix)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate workflow semantics with the pinned actionlint
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_timeout=300 //tools/ci:actionlint_test "$@"
      - name: Fail when bazel mod tidy would change MODULE.bazel
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel mod tidy "$@"
          git diff --exit-code -- MODULE.bazel
      - name: Write job summary
        if: always()
        run: |
          echo "### workflow-check — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: pinned actionlint over every shipped workflow and consumer starter, plus the invalid fixture; bazel mod tidy." >> "$GITHUB_STEP_SUMMARY"
  ci:
    name: ci
    if: ${{ !cancelled() || github.event_name == 'merge_group' }}
    needs:
      [
        dogfood,
        docs,
        devcontainer-check,
        hermetic,
        preflight,
        workflow-check,
      ]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          python3 - <<'DX_AGGREGATE'
          import json
          import os
          import sys

          required = ["dogfood", "docs", "devcontainer-check", "hermetic", "preflight", "workflow-check"]
          needs = json.loads(os.environ.get("NEEDS") or "{}")
          failing = sorted(
              name
              for name in required
              if needs.get(name, {}).get("result") != "success"
          )
          print(json.dumps({"aggregate": "ci", "failing checks": failing}))
          sys.exit(1 if failing else 0)
          DX_AGGREGATE
      - name: Write job summary
        if: always()
        run: |
          echo "### ci — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Aggregate required check over every ci.yml job (branch-protection single gate; every needed job must succeed)." >> "$GITHUB_STEP_SUMMARY"
