        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          tools/dx generate -- "$@"
      - name: Check MODULE.bazel.lock is current
        run: |
          # shellcheck disable=SC2086
          bazel mod deps --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
      - name: Check the per-platform lock entries agree
        run: |
          # shellcheck disable=SC2086
          bazel test //tools/ci:config_consistency_test --test_arg=--exact --test_arg=host_dependent_extensions_are_locked_for_every_ci_platform $BAZEL_CONFIG $BB_ARGS
