          echo "$line" | tee -a "$GITHUB_STEP_SUMMARY" || true
  workflow-check:
    name: workflow-check (actionlint semantics, before the matrix)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
