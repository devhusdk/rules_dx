name: ci

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
  # Git Bash must not convert Bazel labels.
  MSYS2_ARG_CONV_EXCL: "//"

concurrency:
  # One run per ref: a new dispatch or scheduled run on main replaces only the queued one. merge_group refs are unique.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dogfood:
    name: dogfood (self-call reusable consumer workflow)
    # Dogfoods the reusable file end to end on the working tree.
    needs: [workflow-check, preflight]
    if: ${{ !cancelled() && needs.workflow-check.result == 'success' }}
    uses: ./.github/workflows/reusable-consumer.yml
    with:
      platforms: '["linux_x86_64", "linux_arm64", "macos_arm64", "windows_x86_64", "windows_arm64"]'
      min_coverage: "100"
      deploy_dry_run: true
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      REMOTE_CACHE_HEADER: ${{ secrets.REMOTE_CACHE_HEADER }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
  coverage-cells:
    name: coverage-cells (one exact coverage report from every native cell)
    needs: [dogfood]
    # Without a successful dogfood there are no cell reports to check, and dogfood is already red.
    if: ${{ !cancelled() && needs.dogfood.result == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dx-reports-coverage-*
          path: ${{ runner.temp }}/coverage-reports
      - name: Check every cell reported exactly once
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          mkdir -p "$RUNNER_TEMP/coverage-reports"
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find "$RUNNER_TEMP/coverage-reports" -name coverage.ndjson | sort)
          bazel run "$@" //tools/ci/coverage_cells:coverage_cells_bin -- "$GITHUB_WORKSPACE/tools/coverage/cells.txt" "$GITHUB_SHA" "${files[@]}"
  docs:
    name: docs (self-call reusable docs workflow)
    # ci.yml and docs.yml both deploy Pages from main; a second concurrent
    # deploy-pages run fails instead of queueing, so they take turns.
    concurrency:
      group: docs-pages-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/reusable-docs.yml
    with:
      docs_scope: "//docs/... //tools/docs/..."
      site: "//tools/docs/site:user_site"
      site_check: "//tools/docs/site:user_site_check"
      landing: true
      smoke_test: "//tools/docs/site:deploy_smoke_test"
      forbid: |
        Treat warnings as errors
        docs_fixture
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'merge_group' }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pages: write
      id-token: write
  devcontainer-check:
    name: devcontainer-check (init parity, definition valid)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Prove dx init scaffold matches checked-in definition
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_output=errors --test_timeout=300 //.devcontainer:devcontainer_parity_test "$@"
      - name: Validate devcontainer definition shape
        run: |
          post_create="$(jq -er '.postCreateCommand' .devcontainer/devcontainer.json)"
          grep -Fq -- 'tools/dx sync' <<<"$post_create"
          if grep -Fq 'bazel build //...' <<<"$post_create"; then echo "devcontainer: postCreateCommand runs bazel build //..." >&2; exit 1; fi
          echo "devcontainer definition valid: $post_create"
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### devcontainer-check — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: dx init scaffold parity plus devcontainer definition shape." >> "$GITHUB_STEP_SUMMARY"
  hermetic:
    name: hermetic (no-install and network-denied consumer qualification)
    timeout-minutes: 120
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Qualify the consumer without installs or network
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          targets="$(bazel query "$@" 'attr(tags, hermetic-consumer, //...) except filter("_upstream$", //...) except filter("_msvc$", //...)' --output=label)"
          test -n "$targets"
          echo "$targets" > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_probe_test //tools/testing:nested_bazel_harness_test $targets
      - name: Run the release consumer cases offline
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "$@" //deploy/private/release/tests:release_consumer_smoke_test
      - uses: ./.github/actions/hermetic-evidence
        if: always()
        with:
          platform: linux_x86_64
      - name: Run the compiler probe tests
        id: compiler-probes
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel build --noshow_progress "$@" //tools/docs/support_matrix:facts //tools/ci/producers:producers_bin
          mkdir -p "$RUNNER_TEMP/ci-producers-bin"
          cp "$(bazel info "$@" bazel-bin)/tools/ci/producers/producers_bin" "$RUNNER_TEMP/ci-producers-bin/producers_bin"
          facts="$(bazel info "$@" bazel-bin)/tools/docs/support_matrix/facts.json"
          jq -r --slurpfile labels tools/docs/support_matrix/row_labels.json '.rows[] | select(.section == "compilers") | .identity.probe, ($labels[0][.name] // [])[]' "$facts" | tr -d '\r' | sort -u | grep . | tr '\n' ' ' > "$RUNNER_TEMP/compiler-targets"
          targets="$(cat "$RUNNER_TEMP/compiler-targets")"
          # shellcheck disable=SC2086
          bazel build --noshow_progress --skip_incompatible_explicit_targets --output_groups=starlark_manifest "$@" $targets
          status=0
          # shellcheck disable=SC2086
          bazel test --noshow_progress --test_output=errors --skip_incompatible_explicit_targets "$@" $targets && status=0 || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
            exit "$status"
          fi
      - uses: ./.github/actions/compiler-evidence
        if: always()
        with:
          platform: linux_x86_64
          name: linux_x86_64
          bin-from-bazel-info: "true"
      - name: Check the upload holds no secret
        id: scan-ci-producers-bin
        if: always()
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/ci-producers-bin/producers_bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-ci-producers-bin.outcome == 'success' }}
        with:
          name: ci-producers-bin
          path: ${{ runner.temp }}/ci-producers-bin/producers_bin
          if-no-files-found: ignore
          retention-days: 3
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### hermetic (linux_x86_64) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualified a fresh C++ and Rust consumer: fetch with network, then test, ambient-tool, home-config, network and cache probes with the network denied. Evidence is in the hermetic-evidence artifact." >> "$GITHUB_STEP_SUMMARY"
  hermetic-macos:
    name: hermetic-macos (macOS-compatible consumer qualifications on macos_arm64)
    timeout-minutes: 150
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        id: setup
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
          locate-repository-cache: "true"
      - name: Qualify the consumer without installs or network
        run: |
          test "$(uname -s)" = Darwin
          # The qualifications compatible with macOS; widen this list with the target (#8258).
          printf '%s\n' //tools/testing/hermetic:cpp_rust > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2046
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_probe_test //tools/testing:nested_bazel_harness_test //apple/tests:consumer_build_test $(cat "$RUNNER_TEMP/hermetic-targets")
      - name: Run the README quickstart and bcr_test_module cases for macos_arm64
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_output=all --test_timeout=2400 --flaky_test_attempts=2 "$@" //deploy/private/release/tests:release_consumer_smoke_test --test_arg=--exact --test_arg=quickstart_consumer_test::bcr_test_module_runs_its_presubmit_targets --test_arg=quickstart_consumer_test::the_readme_quickstart_runs_as_written
      - uses: ./.github/actions/hermetic-evidence
        if: always()
        with:
          platform: macos_arm64
  hermetic-windows:
    name: hermetic-windows (MSVC isolation on ${{ matrix.platform }})
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: [windows_x86_64, windows_arm64]
    runs-on: ${{ fromJSON('{"windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Deny the host MSVC trees to hermetic runs
        run: |
          denies=()
          # Git Bash upper-cases ProgramFiles but keeps ProgramFiles(x86) as is.
          for root in "${PROGRAMFILES:-$(printenv ProgramFiles)}" "$(printenv 'ProgramFiles(x86)')"; do
            [ -n "$root" ] || continue
            for name in "Microsoft Visual Studio" "Windows Kits" "Microsoft SDKs"; do
              dir="$root\\$name"
              if [ -d "$(cygpath -u "$dir")" ]; then
                denies+=(--deny "$dir")
              fi
            done
          done
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel run --noshow_progress "$@" --//cc:compiler=msvc //tools/testing/hermetic:appcontainer_run -- \
            --backend user --ensure-host-denies "${denies[@]}"
      - name: Probe MSVC isolation without Visual Studio or network
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_windows_probe_test
          if [ "$PLATFORM" = windows_x86_64 ]; then
            bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors "$@" //tools/testing:nested_bazel_harness_test
            bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "$@" --//cc:compiler=msvc //deploy/private:pypi_native_msvc_verify
          fi
  native-lint:
    name: native-lint (dx lint on cfg(windows) and macOS code on ${{ matrix.platform }})
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: [macos_arm64, windows_x86_64]
    runs-on: ${{ fromJSON('{"macos_arm64":"macos-15","windows_x86_64":"windows-latest"}')[matrix.platform] }}
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Lint the platform-specific process crates with the .bazelrc clippy deny set
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel run --noshow_progress "$@" //:dx -- lint //cli/process/... //cli/os_sys/... //cli/shim/...
  determinism:
    name: determinism (two cold builds, exec logs compared, shard ${{ matrix.shard }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0/5
            patterns: //appimage/...
          - shard: 1/5
            patterns: //cli/archive/...
          - shard: 2/5
            patterns: //android/private/packaging/...
          - shard: 3/5
            patterns: //msix/tests/...
          - shard: 4/5
            patterns: //deploy/private/...
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Build twice and compare the execution logs
        env:
          SHARD: ${{ matrix.shard }}
          PATTERNS: ${{ matrix.patterns }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          read -ra patterns <<< "$PATTERNS"
          bazel run "$@" //tools/testing:determinism_check -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/determinism" --kinds --shard "$SHARD" "${patterns[@]}"
  analysis-scaling:
    name: analysis-scaling (dx check, docs and sync aspects on depth 100 and 400 chains)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Compare the analysis phase of the two chain depths
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" //tools/testing:analysis_scaling_check -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/analysis_scaling"
  in-graph-prebuilt-guard:
    name: in-graph-prebuilt-guard (consumer fixtures compile no rules_dx tool on ${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
            langs: ""
          - platform: macos_arm64
            runner: macos-15
            langs: apple swift
          - platform: windows_x86_64
            runner: windows-latest
            langs: msix
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Analyze the consumer fixtures with --//cli/prebuilt:guard_view
        env:
          LANGS: ${{ matrix.langs }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" //tools/testing/consumer:in_graph_prebuilt_guard -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/in_graph_prebuilt_guard" ${LANGS:+--langs "$LANGS"}
  gcc-cross-build:
    name: gcc-cross-build (gcc + llvm linux_x86_64 -> linux_arm64 fixtures)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Cross-build the ARM64 fixtures with GCC
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel build --noshow_progress --//cc:compiler=gcc "$@" //cc/tests/gcc_cross:gcc_arm64
          mkdir -p "$RUNNER_TEMP/gcc-arm64"
          bazel cquery --noshow_progress --//cc:compiler=gcc "$@" --output=files //cc/tests/gcc_cross:gcc_arm64 2>/dev/null | while read -r file; do
            cp "$file" "$RUNNER_TEMP/gcc-arm64/"
          done
          find "$RUNNER_TEMP/gcc-arm64" -type f
          test "$(find "$RUNNER_TEMP/gcc-arm64" -type f | wc -l)" -eq 3
      - name: Cross-build the ARM64 conformance binaries with LLVM
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          mkdir -p "$RUNNER_TEMP/llvm-arm64"
          for lang in cc dart go rust swift zig; do
            bazel build --noshow_progress "$@" "//$lang/tests/conformance:cross_binary"
            file="$(bazel cquery --noshow_progress "$@" --output=files "//$lang/tests/conformance:cross_binary" 2>/dev/null)"
            test "$(printf '%s\n' "$file" | wc -l)" -eq 1
            cp "$file" "$RUNNER_TEMP/llvm-arm64/$lang"
          done
          find "$RUNNER_TEMP/llvm-arm64" -type f
          test "$(find "$RUNNER_TEMP/llvm-arm64" -type f | wc -l)" -eq 6
      - name: Check the upload holds no secret
        id: scan-gcc-arm64-fixtures
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/gcc-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-gcc-arm64-fixtures.outcome == 'success' }}
        with:
          name: gcc-arm64-fixtures
          path: ${{ runner.temp }}/gcc-arm64
          retention-days: 3
          if-no-files-found: error
      - name: Check the upload holds no secret
        id: scan-llvm-arm64-fixtures
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/llvm-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-llvm-arm64-fixtures.outcome == 'success' }}
        with:
          name: llvm-arm64-fixtures
          path: ${{ runner.temp }}/llvm-arm64
          retention-days: 3
          if-no-files-found: error
  gcc-cross-run-arm64:
    name: gcc-cross-run-arm64 (gcc + llvm x86_64-cross-built fixtures on native linux_arm64)
    needs: [gcc-cross-build]
    timeout-minutes: 10
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gcc-arm64-fixtures
          path: ${{ runner.temp }}/gcc-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: llvm-arm64-fixtures
          path: ${{ runner.temp }}/llvm-arm64
      - name: Run the fixtures without emulation
        run: |
          set -eu
          test "$(uname -m)" = aarch64
          cd "$RUNNER_TEMP/gcc-arm64"
          chmod +x hello hello_c native_call_bin
          test "$(./hello)" = "hello 42"
          test "$(./hello_c)" = "hello from c"
          test "$(./native_call_bin)" = "5"
      - name: Run the LLVM conformance binaries without emulation
        run: |
          set -eu
          test "$(uname -m)" = aarch64
          cd "$RUNNER_TEMP/llvm-arm64"
          for lang in cc dart go rust swift zig; do
            chmod +x "$lang"
            test "$("./$lang")" = "hello world"
          done
  llvm-cross-build-macos:
    name: llvm-cross-build-macos (llvm macos_arm64 -> linux_arm64 conformance binaries)
    timeout-minutes: 60
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Cross-build the linux_arm64 conformance binaries with LLVM
        run: |
          test "$(uname -s)" = Darwin
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          mkdir -p "$RUNNER_TEMP/llvm-macos-linux-arm64"
          for lang in cc dart go rust zig; do
            bazel build --noshow_progress "$@" "//$lang/tests/conformance:cross_binary"
            file="$(bazel cquery --noshow_progress "$@" --output=files "//$lang/tests/conformance:cross_binary" 2>/dev/null)"
