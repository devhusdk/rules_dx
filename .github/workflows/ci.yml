        with:
          pattern: compiler-evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/compiler-evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          name: ci-producers-bin
          path: ${{ runner.temp }}/ci-producers-bin
      - name: Merge compiler evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/compiler-evidence"
          chmod +x "$RUNNER_TEMP/ci-producers-bin/producers_bin"
          {
            echo "### Compiler evidence (row x platform)"
            "$RUNNER_TEMP/ci-producers-bin/producers_bin" --table "$RUNNER_TEMP/compiler-evidence" "$RUNNER_TEMP/compiler-evidence-all.jsonl" linux_x86_64 linux_arm64 macos_arm64 windows_x86_64 windows_arm64
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the upload holds no secret
        id: scan-compiler-evidence
        if: always()
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/compiler-evidence-all.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-compiler-evidence.outcome == 'success' }}
        with:
          name: compiler-evidence-all
          path: ${{ runner.temp }}/compiler-evidence-all.jsonl
          if-no-files-found: ignore
          retention-days: 3
