      - name: Analyze the gRPC C++ targets (#7989)
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2086
          bazel build --nobuild --noshow_progress "$@" //gazelle/protobuf/tests/roundtrip/grpc_app:all
      - name: Write job summary
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          JOB_STATUS: ${{ job.status }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          echo "### preflight ${PLATFORM} — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Built dx plus the native hello fixture, installed and replaced the bootstrap environment, then launched dx, hello, and the representative Python, JavaScript, and YAML tools, and the Zig example and hello fixture on ${RUNNER_LABEL}, and analyzed the gRPC C++ fixture targets." >> "$GITHUB_STEP_SUMMARY"
      - name: Record the runner image
        if: always()
