name: ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
  # Git Bash must not convert Bazel labels.
  MSYS2_ARG_CONV_EXCL: "//"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'main-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.platform }})
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: macos_arm64
            runner: macos-15
          - platform: windows_x86_64
            runner: windows-latest
          - platform: windows_arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      GATE: ${{ matrix.platform == 'linux_x86_64' && 'check coverage' || 'check' }}
    permissions:
      actions: read
      contents: read
      statuses: read
    steps:
      - name: Require settled evidence statuses
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="${HEAD_REF##*-}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "gate: no PR head sha in $HEAD_REF" >&2; exit 1; }
          bad="$(gh api --paginate "repos/$REPO/commits/$sha/statuses" --jq '.[] | [.context, .state] | @tsv' \
            | awk -F'\t' '$1 ~ /^evidence\// && !seen[$1]++ && $2 != "success" { print $1 " (" $2 ")" }')"
          if [ -n "$bad" ]; then
            echo "gate: evidence statuses not green on $sha:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=2 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
        with:
          free-disk: true
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: ./.github/actions/gate
        with:
          command: ${{ env.GATE }}
          lcov: ${{ runner.temp }}/coverage/lcov.info
          baseline: check-${{ matrix.platform }}
      - name: Stop the Bazel server
        if: ${{ always() && runner.os == 'Windows' }}
        run: bazel shutdown
      - name: Check generated files across the repo
        if: ${{ !cancelled() && matrix.platform == 'linux_x86_64' && github.event_name != 'pull_request' }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          "$RUNNER_TEMP/dx-bin/dx" generate -- "$@" < /dev/null
      - name: Check api/forwards.json against the consumer fixtures
        if: ${{ !cancelled() && matrix.platform == 'linux_x86_64' }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" //tools/api:update -- --bazel "$(command -v bazel)" --check
      - name: Check the upload holds no secret
        id: scan-results
        if: ${{ always() }}
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/gate.json
      - name: Upload the test results
        if: ${{ always() && steps.scan-results.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-${{ matrix.platform }}
          path: ${{ runner.temp }}/gate.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Check the upload holds no secret
        id: scan-coverage
        if: ${{ always() && contains(env.GATE, 'coverage') }}
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/coverage
      - name: Upload the coverage report
        if: ${{ always() && steps.scan-coverage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.platform }}
          path: ${{ runner.temp }}/coverage
          retention-days: 7
          if-no-files-found: ignore
  dogfood:
    name: dogfood (self-call reusable consumer workflow)
    # Dogfoods the reusable file end to end on the working tree.
    needs: [workflow-check, preflight]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.workflow-check.result == 'success' }}
    uses: ./.github/workflows/reusable-consumer.yml
    with:
      platforms: '["linux_x86_64", "linux_arm64", "macos_arm64", "windows_x86_64", "windows_arm64"]'
      min_coverage: "100"
      deploy_dry_run: true
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      REMOTE_CACHE_HEADER: ${{ secrets.REMOTE_CACHE_HEADER }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
  coverage-cells:
    name: coverage-cells (one exact coverage report from every native cell)
    needs: [dogfood]
    # Without a successful dogfood there are no cell reports to check, and dogfood is already red.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.dogfood.result == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dx-reports-coverage-*
          path: ${{ runner.temp }}/coverage-reports
      - name: Check every cell reported exactly once
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          mkdir -p "$RUNNER_TEMP/coverage-reports"
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find "$RUNNER_TEMP/coverage-reports" -name coverage.ndjson | sort)
          bazel run "$@" //tools/ci/coverage_cells:coverage_cells_bin -- "$GITHUB_WORKSPACE/tools/coverage/cells.txt" "$GITHUB_SHA" "${files[@]}"
  analysis-scaling:
    name: analysis-scaling (dx check, docs and sync aspects on depth 100 and 400 chains)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Compare the analysis phase of the two chain depths
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" //tools/testing:analysis_scaling_check -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/analysis_scaling"
  in-graph-prebuilt-guard:
    name: in-graph-prebuilt-guard (consumer fixtures compile no rules_dx tool on ${{ matrix.platform }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
            langs: ""
          - platform: macos_arm64
            runner: macos-15
            langs: apple swift
          - platform: windows_x86_64
            runner: windows-latest
            langs: msix
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
      - name: Analyze the consumer fixtures with --//cli/prebuilt:guard_view
        env:
          LANGS: ${{ matrix.langs }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" //tools/testing/consumer:in_graph_prebuilt_guard -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/in_graph_prebuilt_guard" ${LANGS:+--langs "$LANGS"}
  preflight:
    name: preflight (native bootstrap and tool launch) (${{ matrix.platform }}, ${{ matrix.runner }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: macos_arm64
            runner: macos-15
          - platform: windows_x86_64
            runner: windows-latest
          - platform: windows_arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
      - name: Build the bootstrap closure
        id: bootstrap-build
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel build --noshow_progress "$@" //cli/cli:dx //cc/tests/fixtures/hello:hello
      - name: Genrule from cmd with BAZEL_SH unset (#3377)
        if: ${{ runner.os == 'Windows' }}
        shell: cmd
        run: |
          set BAZEL_SH=
          where bash.exe
          if not exist "%SystemRoot%\System32\bash.exe" echo ::warning::%SystemRoot%\System32\bash.exe is missing, so this step does not meet the WSL launcher.
          bazel build --noshow_progress --noremote_accept_cached --disk_cache= //cc/tests/fixtures/c_app/store:store_build_h
      - name: Check the crate lockfiles are current (#8915)
        if: ${{ matrix.platform == 'linux_x86_64' }}
        run: |
          # shellcheck disable=SC2086
          bazel mod show_repo --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS --repo_env=CARGO_BAZEL_DIGEST_CHECK=1 @crates @dx_quality_crates @dx_thrift_crates >/dev/null
      - name: Check the direct zip and tar dependents match the allowlist (#13357)
        if: ${{ matrix.platform == 'linux_x86_64' }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          allowlist=tools/ci/archive_crates_allowlist.txt
          crates='crates//((zip|tar)-[0-9][^:]*)?:(zip|tar)(-[0-9][^,]*)?(,|\]|$)'
          bazel query --noshow_progress --output=label "$@" "attr(deps, \"$crates\", //...)" > "$RUNNER_TEMP/archive-all"
          if ! grep -qx '//cli/archive:dx_archive_upstream' "$RUNNER_TEMP/archive-all"; then
            echo "::error::The zip and tar dependents query did not find //cli/archive:dx_archive_upstream"
            exit 1
          fi
          awk '!/^\/\/cli\/archive[:\/]/' "$RUNNER_TEMP/archive-all" > "$RUNNER_TEMP/archive-dependents"
          LC_ALL=C sort -u -o "$RUNNER_TEMP/archive-dependents" "$RUNNER_TEMP/archive-dependents"
          LC_ALL=C sort -u "$allowlist" > "$RUNNER_TEMP/archive-allowlist"
          new="$(LC_ALL=C comm -23 "$RUNNER_TEMP/archive-dependents" "$RUNNER_TEMP/archive-allowlist")"
          stale="$(LC_ALL=C comm -13 "$RUNNER_TEMP/archive-dependents" "$RUNNER_TEMP/archive-allowlist")"
          if [ -n "$new" ]; then
            echo "::error::These targets depend on the zip or tar crate directly; use //cli/archive:dx_archive instead:"
            printf '%s\n' "$new"
          fi
          if [ -n "$stale" ]; then
            echo "::error::These ${allowlist} lines no longer depend on zip or tar; delete them:"
            printf '%s\n' "$stale"
          fi
          if [ -n "$new" ] || [ -n "$stale" ]; then
            exit 1
          fi
      - name: Record the Windows rmeta diagnostics (#4850)
        if: ${{ failure() && steps.bootstrap-build.outcome == 'failure' && runner.os == 'Windows' }}
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          out="$RUNNER_TEMP/rmeta-diag"
          mkdir -p "$out"
          bazel build --noshow_progress --subcommands --keep_going "$@" //cli/cli:dx > "$out/rebuild.log" 2>&1 || true
          bazel aquery "$@" --output=text --include_commandline 'outputs(".*-exec/.*\.rmeta", mnemonic("Rustc.*", deps(//cli/cli:dx)))' > "$out/aquery.txt" 2>&1 || true
          op="$(bazel info "$@" output_path 2>/dev/null)" || op=""
          if [ -n "$op" ]; then
            find "$op" -path '*-exec/bin/*' -name '*.rmeta' -printf '%M %TY-%Tm-%TdT%TH:%TM %p\n' > "$out/rmeta-all.txt" 2>&1 || true
            find "$op" -path '*-exec/bin/*' -name '*.rmeta' ! -perm -u=w -printf '%M %TY-%Tm-%TdT%TH:%TM %p\n' > "$out/rmeta-readonly.txt" 2>&1 || true
          fi
          touch "$out/rmeta-readonly.txt"
          {
            echo "### rmeta diagnostics (#4850)"
            grep -m1 'not writeable' "$out/rebuild.log" || echo "no 'not writeable' line in the rebuild"
            echo "read-only exec .rmeta files: $(wc -l < "$out/rmeta-readonly.txt")"
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Check the upload holds no secret
        id: scan-rmeta-diagnostics
        if: ${{ failure() && steps.bootstrap-build.outcome == 'failure' && runner.os == 'Windows' }}
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/rmeta-diag
      - name: Upload the rmeta diagnostics
        if: ${{ always() && steps.scan-rmeta-diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rmeta-diagnostics-${{ matrix.platform }}
          path: ${{ runner.temp }}/rmeta-diag
          retention-days: 3
          if-no-files-found: ignore
      - name: Analyze the gRPC C++ targets (#7989)
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2086
          bazel build --nobuild --noshow_progress "$@" //gazelle/protobuf/tests/roundtrip/grpc_app:all
      - name: Write job summary
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          JOB_STATUS: ${{ job.status }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          echo "### preflight ${PLATFORM} — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Built dx plus the native hello fixture on ${RUNNER_LABEL}, and analyzed the gRPC C++ fixture targets." >> "$GITHUB_STEP_SUMMARY"
      - name: Record the runner image
        if: always()
        shell: bash
        run: |
          line="runner: os=${RUNNER_OS:-unknown} arch=${RUNNER_ARCH:-unknown} image=${ImageOS:-unknown} version=${ImageVersion:-unknown} bazel=$(bazel --version 2>&1 | head -n 1 || true)"
          echo "$line" | tee -a "$GITHUB_STEP_SUMMARY" || true
  workflow-check:
    name: workflow-check (actionlint semantics, before the matrix)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Validate workflow semantics with the pinned actionlint
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_output=errors --test_timeout=300 //tools/ci:actionlint_test //tools/ci:workflow_expressions_test //tools/docs/rule_names:rule_names_test "$@"
      - name: Fail when bazel mod tidy would change MODULE.bazel
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel mod tidy "$@"
          git diff --exit-code -- MODULE.bazel
      - name: Fail when a public rust library is missing from PUBLIC_RUST_CRATES
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          tools/docs/site/public_rust_crates_guard.sh "$@"
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### workflow-check — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: pinned actionlint over every shipped workflow and consumer starter, plus the invalid fixture; no expressions in run blocks; bazel mod tidy; PUBLIC_RUST_CRATES covers every public rust library." >> "$GITHUB_STEP_SUMMARY"
  ci:
    name: ci
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs:
      [
        check,
        coverage-cells,
        dogfood,
        analysis-scaling,
        in-graph-prebuilt-guard,
        preflight,
        workflow-check,
      ]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "ci: a needed job did not succeed"
          echo "$NEEDS_JSON"
          exit 1
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### ci — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Aggregate required check over every ci.yml job (branch-protection single gate; every needed job must succeed)." >> "$GITHUB_STEP_SUMMARY"
