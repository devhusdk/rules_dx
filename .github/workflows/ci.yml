          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            quality: "//quality/testdata:runner_matrix_linux_arm64"
          - platform: macos_arm64
            runner: macos-15
            quality: "//quality/testdata:runner_matrix_macos_arm64"
          - platform: windows_x86_64
            runner: windows-latest
            quality: "//quality/testdata:runner_matrix_windows_x86_64"
          - platform: windows_arm64
            runner: windows-11-arm
            quality: "//quality/testdata:runner_matrix_windows_arm64"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Build the bootstrap closure
        id: bootstrap-build
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel build --noshow_progress "$@" //cli/cli:dx //cc/tests/fixtures/hello:hello
      - name: Check the crate lockfiles are current (#8915)
        if: ${{ matrix.platform == 'linux_x86_64' }}
        run: |
          # shellcheck disable=SC2086
          bazel mod show_repo --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS --repo_env=CARGO_BAZEL_DIGEST_CHECK=1 @crates @dx_quality_crates @dx_thrift_crates >/dev/null
      - name: Record the Windows rmeta diagnostics (#4850)
        if: ${{ failure() && steps.bootstrap-build.outcome == 'failure' && runner.os == 'Windows' }}
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          out="$RUNNER_TEMP/rmeta-diag"
          mkdir -p "$out"
          bazel build --noshow_progress --subcommands --keep_going "$@" //cli/cli:dx > "$out/rebuild.log" 2>&1 || true
          bazel aquery "$@" --output=text --include_commandline 'outputs(".*-exec/.*\.rmeta", mnemonic("Rustc.*", deps(//cli/cli:dx)))' > "$out/aquery.txt" 2>&1 || true
          op="$(bazel info "$@" output_path 2>/dev/null)" || op=""
          if [ -n "$op" ]; then
            find "$op" -path '*-exec/bin/*' -name '*.rmeta' -printf '%M %TY-%Tm-%TdT%TH:%TM %p\n' > "$out/rmeta-all.txt" 2>&1 || true
            find "$op" -path '*-exec/bin/*' -name '*.rmeta' ! -perm -u=w -printf '%M %TY-%Tm-%TdT%TH:%TM %p\n' > "$out/rmeta-readonly.txt" 2>&1 || true
          fi
          touch "$out/rmeta-readonly.txt"
          {
            echo "### rmeta diagnostics (#4850)"
            grep -m1 'not writeable' "$out/rebuild.log" || echo "no 'not writeable' line in the rebuild"
            echo "read-only exec .rmeta files: $(wc -l < "$out/rmeta-readonly.txt")"
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Check the upload holds no secret
        id: scan-rmeta-diagnostics
        if: ${{ failure() && steps.bootstrap-build.outcome == 'failure' && runner.os == 'Windows' }}
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/rmeta-diag
      - name: Upload the rmeta diagnostics
        if: ${{ always() && steps.scan-rmeta-diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rmeta-diagnostics-${{ matrix.platform }}
          path: ${{ runner.temp }}/rmeta-diag
          retention-days: 3
          if-no-files-found: ignore
      - name: Run the launch smoke
        env:
          QUALITY_TARGETS: ${{ matrix.quality }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2086
          bazel test --noshow_progress --nocache_test_results --test_output=all "$@" //tools/testing:preflight_smoke_test //cli/env:bootstrap_test //cc/tests/fixtures/hello:hello_test //powershell/tests/fixtures/hello:hello_test //zig/tests/fixtures/zig-app/... //dart/tests/fixtures/dart-app/... //dart/tests/runtime:all //dart/tools:all //zig/tests/fixtures/hello:all //julia/tests/fixtures/hello:all //julia/tests/fixtures/julia-app/... //julia/tools/... $QUALITY_TARGETS
      - name: Run the PyPI probe verification
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2086
