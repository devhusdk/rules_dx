name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Both stay empty unless the repository sets BUILDBUDDY_API_KEY.
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ secrets.BUILDBUDDY_API_KEY != '' && format('--remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
  # Git Bash must not convert Bazel labels.
  MSYS2_ARG_CONV_EXCL: "//"
  BAZELISK_VERSION: "1.29.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dogfood:
    name: dogfood (self-call reusable consumer workflow)
    # Dogfoods the reusable file end to end on the working tree.
    needs: [workflow-check]
    uses: ./.github/workflows/reusable-consumer.yml
    with:
      rules_dx_version: "0.0.0"
      platforms: '["linux_x86_64", "linux_arm64", "macos_arm64", "windows_x86_64"]'
      min_coverage: "96"
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
  docs:
    name: docs (self-call reusable docs workflow)
    uses: ./.github/workflows/reusable-docs.yml
    with:
      rules_dx_version: "0.0.0"
      docs_scope: "//..."
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pages: write
      id-token: write
  devcontainer-check:
    name: devcontainer-check (init parity, definition valid)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Prove dx init scaffold matches checked-in definition
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --flaky_test_attempts=3 --test_timeout=300 //.devcontainer:devcontainer_parity_test "$@"
      - name: Validate devcontainer definition shape
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          python3 - <<'EOF'
          import json
          with open(".devcontainer/devcontainer.json") as handle:
              definition = json.load(handle)
          post_create = definition["postCreateCommand"]
          assert "bazel run //dx:env" in post_create, post_create
          assert "bazel build //..." not in post_create, post_create
          print("devcontainer definition valid:", post_create)
          EOF
      - name: Write job summary
        if: always()
        run: |
          echo "### devcontainer-check — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: dx init scaffold parity plus devcontainer definition shape." >> "$GITHUB_STEP_SUMMARY"
  workflow-check:
    name: workflow-check (actionlint semantics, before the matrix)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Validate workflow semantics with the pinned actionlint
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --flaky_test_attempts=3 --test_timeout=300 //tools/ci:actionlint_test "$@"
      - name: Write job summary
        if: always()
        run: |
          echo "### workflow-check — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: pinned actionlint over every shipped workflow and consumer starter, plus the invalid fixture." >> "$GITHUB_STEP_SUMMARY"
  ci:
    name: ci
    # One green gate covers every job in this workflow.
    if: ${{ always() }}
    needs:
      [
        dogfood,
        docs,
        devcontainer-check,
        workflow-check,
      ]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          python3 - <<'EOF'
          import json
          import os
          import sys

          needs = json.loads(os.environ.get("NEEDS") or "{}")
          failing = sorted(
              key
              for key, value in needs.items()
              if value.get("result") not in ("success", "skipped", "cancelled")
          )
          print(json.dumps({"aggregate": "ci", "failing checks": failing}))
          sys.exit(1 if failing else 0)
          EOF
      - name: Write job summary
        if: always()
        run: |
          echo "### ci — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Aggregate required check over every ci.yml job (branch-protection single gate; skipped and cancelled needs are non-failing)." >> "$GITHUB_STEP_SUMMARY"
