name: ci

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
  # Git Bash must not convert Bazel labels.
  MSYS2_ARG_CONV_EXCL: "//"

concurrency:
  # One run per ref: a new dispatch or scheduled run on main replaces only the queued one. merge_group refs are unique.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dogfood:
    name: dogfood (self-call reusable consumer workflow)
    # Dogfoods the reusable file end to end on the working tree.
    needs: [workflow-check, preflight]
    uses: ./.github/workflows/reusable-consumer.yml
    with:
      platforms: '["linux_x86_64", "linux_arm64", "macos_arm64", "windows_x86_64", "windows_arm64"]'
      min_coverage: "100"
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      REMOTE_CACHE_HEADER: ${{ secrets.REMOTE_CACHE_HEADER }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
  coverage-cells:
    name: coverage-cells (one exact coverage report from every native cell)
    needs: [dogfood]
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: dx-reports-coverage-*
          path: ${{ runner.temp }}/coverage-reports
      - name: Check every cell reported exactly once
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          mkdir -p "$RUNNER_TEMP/coverage-reports"
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find "$RUNNER_TEMP/coverage-reports" -name coverage.ndjson | sort)
          bazel run "$@" //tools/ci:coverage_cells_bin -- "$GITHUB_WORKSPACE/tools/coverage/cells.txt" "$GITHUB_SHA" "${files[@]}"
  docs:
    name: docs (self-call reusable docs workflow)
    uses: ./.github/workflows/reusable-docs.yml
    with:
      docs_scope: "//docs/... //tools/docs/..."
      site: "//tools/docs/site:user_site"
      site_check: "//tools/docs/site:user_site_check"
      landing: true
      smoke_test: "//tools/docs/site:deploy_smoke_test"
      forbid: |
        Treat warnings as errors
        docs_fixture
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'merge_group' }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pages: write
      id-token: write
  devcontainer-check:
    name: devcontainer-check (init parity, definition valid)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Prove dx init scaffold matches checked-in definition
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_timeout=300 //.devcontainer:devcontainer_parity_test "$@"
      - name: Validate devcontainer definition shape
        run: |
          post_create="$(jq -er '.postCreateCommand' .devcontainer/devcontainer.json)"
          grep -Fq -- 'tools/dx sync' <<<"$post_create"
          if grep -Fq 'bazel build //...' <<<"$post_create"; then echo "devcontainer: postCreateCommand runs bazel build //..." >&2; exit 1; fi
          echo "devcontainer definition valid: $post_create"
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### devcontainer-check — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: dx init scaffold parity plus devcontainer definition shape." >> "$GITHUB_STEP_SUMMARY"
  families:
    name: families (each families/<family> module on linux_x86_64)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Test every family module
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          failed=0
          for dir in families/*/; do
            [ -f "$dir/MODULE.bazel" ] || continue
            echo "::group::$dir"
            (cd "$dir" && ../../tools/dx test //... -- --keep_going "$@") || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
  hermetic:
    name: hermetic (no-install and network-denied consumer qualification)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Qualify the consumer without installs or network
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          targets="$(bazel query "$@" 'attr(tags, hermetic-consumer, //...) except filter("_upstream$", //...) except filter("_msvc$", //...)' --output=label)"
          test -n "$targets"
          echo "$targets" > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_probe_test $targets
      - name: Verify the evidence
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            bazel run --noshow_progress "$@" //tools/testing/hermetic:verify -- --evidence "$PWD/bazel-testlogs/$pkg/$name/test.outputs/evidence.json" --commit "$(git rev-parse HEAD)" --manifest "$PWD/bazel-bin/$pkg/${name}_manifest.json"
          done < "$RUNNER_TEMP/hermetic-targets"
      - name: Collect the evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hermetic-evidence"
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            mkdir -p "$RUNNER_TEMP/hermetic-evidence/$name"
            cp -R "bazel-testlogs/$pkg/$name/test.outputs/." "$RUNNER_TEMP/hermetic-evidence/$name/" || true
          done < "$RUNNER_TEMP/hermetic-targets"
      - name: Record compiler evidence
        if: always()
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          out="$RUNNER_TEMP/compiler-evidence/linux_x86_64.jsonl"
          mkdir -p "$(dirname "$out")"
          : > "$out"
          bazel build --noshow_progress "$@" //tools/docs/support_matrix:facts //tools/ci:producers_bin
          DX_BIN="$(bazel info "$@" bazel-bin)"
          DX_TESTLOGS="$(bazel info "$@" bazel-testlogs)"
          DX_PRODUCERS="$DX_BIN/tools/ci/producers_bin"
          [ -f "$DX_PRODUCERS" ] || DX_PRODUCERS="$DX_PRODUCERS.exe"
          export DX_BIN DX_TESTLOGS DX_PRODUCERS
          facts="${DX_BIN}/tools/docs/support_matrix/facts.json"
          targets="$(jq -r '.rows[] | select(.section == "compilers") | .identity.probe, .ci_tests[]' "$facts" | tr -d '\r' | sort -u | grep . | tr '\n' ' ')"
          # shellcheck disable=SC2086
          bazel build --noshow_progress --skip_incompatible_explicit_targets --output_groups=starlark_manifest "$@" $targets || true
          # shellcheck disable=SC2086
          bazel test --noshow_progress --test_output=errors --skip_incompatible_explicit_targets "$@" $targets || true
          DX_EVIDENCE_COMMAND="bazel test --skip_incompatible_explicit_targets $* $targets"
          export DX_EVIDENCE_COMMAND
          tools/ci/compiler_evidence.sh "$out" linux_x86_64 "$facts"
          {
            echo "#### Compiler evidence"
            echo "| row | version | probe compiler | target | observed producers | ran/total | outcome |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            jq -r '"| \(.row) | \(.version) | \(.compiler) | \(.target) | \(.observed_producers | join("; ")) | \(.ran)/\(.total) | \(.outcome) |"' "$out"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the upload holds no secret
        id: scan-compiler-evidence
        if: always()
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/compiler-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-compiler-evidence.outcome == 'success' }}
        with:
          name: compiler-evidence-linux_x86_64
          path: ${{ runner.temp }}/compiler-evidence
          retention-days: 3
      - name: Check the upload holds no secret
        id: scan-hermetic-evidence
        if: always()
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/hermetic-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-hermetic-evidence.outcome == 'success' }}
        with:
          name: hermetic-evidence-linux_x86_64
          path: ${{ runner.temp }}/hermetic-evidence
          retention-days: 3
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### hermetic (linux_x86_64) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualified a fresh C++ and Rust consumer: fetch with network, then test, coverage, expected-failure, ambient-tool, home-config, network and cache probes with the network denied. Evidence is in the hermetic-evidence artifact." >> "$GITHUB_STEP_SUMMARY"
  hermetic-arm64:
    name: hermetic-arm64 (GCC consumer fixtures on native linux_arm64)
    timeout-minutes: 90
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Qualify the GCC consumers without installs or network
        run: |
          test "$(uname -m)" = aarch64
          printf '%s\n' //tools/testing/hermetic:c_fixture_gcc //tools/testing/hermetic:cpp_fixture_gcc > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2046
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" $(cat "$RUNNER_TEMP/hermetic-targets")
      - name: Verify the evidence
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            bazel run --noshow_progress "$@" //tools/testing/hermetic:verify -- --evidence "$PWD/bazel-testlogs/$pkg/$name/test.outputs/evidence.json" --commit "$(git rev-parse HEAD)" --manifest "$PWD/bazel-bin/$pkg/${name}_manifest.json"
          done < "$RUNNER_TEMP/hermetic-targets"
      - name: Collect the evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hermetic-evidence"
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            mkdir -p "$RUNNER_TEMP/hermetic-evidence/$name"
            cp -R "bazel-testlogs/$pkg/$name/test.outputs/." "$RUNNER_TEMP/hermetic-evidence/$name/" || true
          done < "$RUNNER_TEMP/hermetic-targets"
      - name: Check the upload holds no secret
        id: scan-hermetic-evidence
        if: always()
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/hermetic-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-hermetic-evidence.outcome == 'success' }}
        with:
          name: hermetic-evidence-linux_arm64
          path: ${{ runner.temp }}/hermetic-evidence
          retention-days: 3
  hermetic-macos:
    name: hermetic-macos (macOS-compatible consumer qualifications on macos_arm64)
    timeout-minutes: 90
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Qualify the consumer without installs or network
        run: |
          test "$(uname -s)" = Darwin
          # The qualifications compatible with macOS; widen this list with the target (#8258).
          printf '%s\n' //tools/testing/hermetic:cpp_rust > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2046
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_probe_test $(cat "$RUNNER_TEMP/hermetic-targets")
      - name: Verify the evidence
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            bazel run --noshow_progress "$@" //tools/testing/hermetic:verify -- --evidence "$PWD/bazel-testlogs/$pkg/$name/test.outputs/evidence.json" --commit "$(git rev-parse HEAD)" --manifest "$PWD/bazel-bin/$pkg/${name}_manifest.json"
          done < "$RUNNER_TEMP/hermetic-targets"
      - name: Collect the evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hermetic-evidence"
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            mkdir -p "$RUNNER_TEMP/hermetic-evidence/$name"
            cp -R "bazel-testlogs/$pkg/$name/test.outputs/." "$RUNNER_TEMP/hermetic-evidence/$name/" || true
          done < "$RUNNER_TEMP/hermetic-targets"
      - name: Check the upload holds no secret
        id: scan-hermetic-evidence
        if: always()
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/hermetic-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-hermetic-evidence.outcome == 'success' }}
        with:
          name: hermetic-evidence-macos_arm64
          path: ${{ runner.temp }}/hermetic-evidence
          retention-days: 3
  hermetic-windows:
    name: hermetic-windows (MSVC consumer fixtures on ${{ matrix.platform }})
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: [windows_x86_64, windows_arm64]
    runs-on: ${{ fromJSON('{"windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Deny the host MSVC trees to hermetic runs
        run: |
          denies=()
          for root in "$(printenv ProgramFiles)" "$(printenv 'ProgramFiles(x86)')"; do
            [ -n "$root" ] || continue
            for name in "Microsoft Visual Studio" "Windows Kits" "Microsoft SDKs"; do
              dir="$root\\$name"
              if [ -d "$(cygpath -u "$dir")" ]; then
                denies+=(--deny "$dir")
              fi
            done
          done
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel run --noshow_progress "$@" --//cc/toolchains:compiler=msvc //tools/testing/hermetic:appcontainer_run -- \
            --backend user --ensure-host-denies "${denies[@]}"
      - name: Qualify the MSVC consumers without Visual Studio or network
        run: |
          printf '%s\n' //tools/testing/hermetic:c_fixture_msvc //tools/testing/hermetic:cpp_fixture_msvc > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2046
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_windows_probe_test $(cat "$RUNNER_TEMP/hermetic-targets")
      - name: Collect the evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hermetic-evidence"
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            mkdir -p "$RUNNER_TEMP/hermetic-evidence/$name"
            cp -R "bazel-testlogs/$pkg/$name/test.outputs/." "$RUNNER_TEMP/hermetic-evidence/$name/" || true
          done < "$RUNNER_TEMP/hermetic-targets"
      # The test copies its manifest into its outputs; bazel-bin on Windows does not hold it.
      - name: Verify the evidence
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          while read -r label; do
            dir="$(cygpath -m "$RUNNER_TEMP/hermetic-evidence/${label##*:}")"
            bazel run --noshow_progress "$@" //tools/testing/hermetic:verify -- --evidence "$dir/evidence.json" --commit "$(git rev-parse HEAD)" --manifest "$dir/manifest.json"
          done < "$RUNNER_TEMP/hermetic-targets"
      - name: Check the upload holds no secret
        id: scan-hermetic-evidence
        if: always()
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/hermetic-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-hermetic-evidence.outcome == 'success' }}
        with:
          name: hermetic-evidence-${{ matrix.platform }}
          path: ${{ runner.temp }}/hermetic-evidence
          retention-days: 3
  gcc-cross-build:
    name: gcc-cross-build (linux_x86_64 -> linux_arm64 fixtures)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Cross-build the ARM64 fixtures with GCC
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel build --noshow_progress --//cc/toolchains:compiler=gcc "$@" //cc/tests/gcc_cross:gcc_arm64
          mkdir -p "$RUNNER_TEMP/gcc-arm64"
          bazel cquery --noshow_progress --//cc/toolchains:compiler=gcc "$@" --output=files //cc/tests/gcc_cross:gcc_arm64 2>/dev/null | while read -r file; do
            cp "$file" "$RUNNER_TEMP/gcc-arm64/"
          done
          find "$RUNNER_TEMP/gcc-arm64" -type f
          test "$(find "$RUNNER_TEMP/gcc-arm64" -type f | wc -l)" -eq 3
      - name: Check the upload holds no secret
        id: scan-gcc-arm64-fixtures
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/gcc-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-gcc-arm64-fixtures.outcome == 'success' }}
        with:
          name: gcc-arm64-fixtures
          path: ${{ runner.temp }}/gcc-arm64
          retention-days: 3
          if-no-files-found: error
  gcc-cross-run-arm64:
    name: gcc-cross-run-arm64 (run x86_64-cross-built fixtures on native linux_arm64)
    needs: [gcc-cross-build]
    timeout-minutes: 10
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gcc-arm64-fixtures
          path: ${{ runner.temp }}/gcc-arm64
      - name: Run the fixtures without emulation
        run: |
          set -eu
          test "$(uname -m)" = aarch64
          cd "$RUNNER_TEMP/gcc-arm64"
          chmod +x hello hello_c native_call_bin
          test "$(./hello)" = "hello 42"
          test "$(./hello_c)" = "hello from c"
          test "$(./native_call_bin)" = "5"
  network:
    name: network (requires-network nested consumer tests)
    timeout-minutes: 75
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        id: setup
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
          locate-repository-cache: "true"
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the opted-in requires-network consumer tests
        env:
          REPO_CACHE_PATH: ${{ steps.setup.outputs.repository-cache-root }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          targets="$(bazel query "$@" 'attr(tags, network-consumer, //...)' --output=label)"
          test -n "$targets"
          echo "$targets" > "$RUNNER_TEMP/network-targets"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --test_output=errors --test_timeout=2400 --flaky_test_attempts=2 "--test_env=DX_NESTED_BAZEL_REPOSITORY_CACHE=${REPO_CACHE_PATH}" "$@" $targets
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### network (linux_x86_64) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran the tests tagged network-consumer. A FLAKY result means the test passed on its single retry." >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/network-targets" ]; then
            sed 's/^/- /' "$RUNNER_TEMP/network-targets" >> "$GITHUB_STEP_SUMMARY"
          fi
  starter-consumer:
    name: starter-consumer (hello-world fixtures) (${{ matrix.platform }}, shard ${{ matrix.shard }})
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux_x86_64
          - linux_arm64
          - macos_arm64
          - windows_x86_64
          - windows_arm64
        shard: [0, 1, 2, 3]
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: macos_arm64
            runner: macos-15
          - platform: windows_x86_64
            runner: windows-latest
          - platform: windows_arm64
            runner: windows-11-arm
            no-starter-issue: "#4986"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: ./.github/actions/setup-bazel
        id: setup
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
          locate-repository-cache: "true"
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run this shard of the starter consumer tests
        env:
          REPO_CACHE_PATH: ${{ steps.setup.outputs.repository-cache-root }}
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
          NO_STARTER_ISSUE: ${{ matrix.no-starter-issue }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel query "$@" 'attr(tags, starter-consumer, //...)' --output=label | sort > "$RUNNER_TEMP/starter-all"
          awk -v shard="$SHARD" -v shards="$SHARDS" '(NR - 1) % shards == shard' "$RUNNER_TEMP/starter-all" > "$RUNNER_TEMP/starter-targets"
          if [ ! -s "$RUNNER_TEMP/starter-all" ]; then
            echo "::error::No starter consumer targets exist."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/starter-targets" ]; then
            echo "No starter consumer targets in shard ${SHARD}."
            exit 0
          fi
          targets="$(tr '\r\n' '  ' < "$RUNNER_TEMP/starter-targets")"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --test_output=errors --skip_incompatible_explicit_targets --test_timeout=2400 --flaky_test_attempts=2 "--test_env=DX_NESTED_BAZEL_REPOSITORY_CACHE=${REPO_CACHE_PATH}" "$@" $targets && test_status=0 || test_status=$?
          testlogs="$PWD/bazel-testlogs"
          ran=0
          : > "$RUNNER_TEMP/starter-ran"
          : > "$RUNNER_TEMP/starter-skipped"
          for label in $targets; do
            path="${label#//}"
            path="$(printf %s "$path" | tr : /)"
            if [ -f "${testlogs}/${path}/test.xml" ]; then
              ran=$((ran + 1))
              echo "$label" >> "$RUNNER_TEMP/starter-ran"
            else
              echo "$label" >> "$RUNNER_TEMP/starter-skipped"
            fi
          done
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          echo "Ran ${ran} starter consumer tests on ${PLATFORM}, shard ${SHARD}."
          if [ "$ran" -eq 0 ]; then
            if [ -n "$NO_STARTER_ISSUE" ]; then
              echo "::warning::${PLATFORM} runs no starter consumer tests. Tracked in ${NO_STARTER_ISSUE}."
              exit 0
            fi
            echo "::error::Every starter consumer test was skipped on ${PLATFORM}, shard ${SHARD}."
            exit 1
          fi
      - name: Record compiler evidence
        if: always() && matrix.shard == 0
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          out="$RUNNER_TEMP/compiler-evidence/starter-${PLATFORM}.jsonl"
          mkdir -p "$(dirname "$out")"
          : > "$out"
          bazel build --noshow_progress "$@" //tools/docs/support_matrix:facts //tools/ci:producers_bin
          DX_BIN="$PWD/bazel-bin"
          DX_TESTLOGS="$PWD/bazel-testlogs"
          DX_PRODUCERS="$DX_BIN/tools/ci/producers_bin"
          [ -f "$DX_PRODUCERS" ] || DX_PRODUCERS="$DX_PRODUCERS.exe"
          export DX_BIN DX_TESTLOGS DX_PRODUCERS
          facts="${DX_BIN}/tools/docs/support_matrix/facts.json"
          targets="$(jq -r --arg platform "$PLATFORM" '.rows[] | select(.section == "compilers") | (.identity.platform_probes[$platform] // .identity.probe), .ci_tests[]' "$facts" | tr -d '\r' | sort -u | grep . | tr '\n' ' ')"
          # shellcheck disable=SC2086
          bazel build --noshow_progress --skip_incompatible_explicit_targets --output_groups=starlark_manifest "$@" $targets || true
          # shellcheck disable=SC2086
          bazel test --noshow_progress --test_output=errors --skip_incompatible_explicit_targets "$@" $targets || true
          DX_EVIDENCE_COMMAND="bazel test --skip_incompatible_explicit_targets $* $targets"
          export DX_EVIDENCE_COMMAND
          tools/ci/compiler_evidence.sh "$out" "$PLATFORM" "$facts"
          {
            echo "#### Compiler evidence"
            echo "| row | version | probe compiler | target | observed producers | ran/total | outcome |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            jq -r '"| \(.row) | \(.version) | \(.compiler) | \(.target) | \(.observed_producers | join("; ")) | \(.ran)/\(.total) | \(.outcome) |"' "$out"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the upload holds no secret
        id: scan-compiler-evidence
        if: always() && matrix.shard == 0
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/compiler-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-compiler-evidence.outcome == 'success' }}
        with:
          name: compiler-evidence-starter-${{ matrix.platform }}
          path: ${{ runner.temp }}/compiler-evidence
          retention-days: 3
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PLATFORM: ${{ matrix.platform }}
          SHARD: ${{ matrix.shard }}
        run: |
          echo "### starter-consumer (${PLATFORM}, shard ${SHARD}) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "The tests tagged starter-consumer: each runs dx init and checks the generated files against a golden listing." >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/starter-ran" ]; then
            echo "#### Ran" >> "$GITHUB_STEP_SUMMARY"
            tr -d '\r' < "$RUNNER_TEMP/starter-ran" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            if [ -s "$RUNNER_TEMP/starter-skipped" ]; then
              echo "#### Skipped (incompatible with this platform)" >> "$GITHUB_STEP_SUMMARY"
              tr -d '\r' < "$RUNNER_TEMP/starter-skipped" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -f "$RUNNER_TEMP/starter-targets" ]; then
            echo "#### Targets" >> "$GITHUB_STEP_SUMMARY"
            tr -d '\r' < "$RUNNER_TEMP/starter-targets" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi
  msix-install:
    name: msix-install (windows_x86_64)
    timeout-minutes: 60
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
