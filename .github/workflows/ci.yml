name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Gives main a known pass or fail twice a day.
  schedule:
    - cron: "17 3,15 * * *"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  # Both stay empty unless the repository sets BUILDBUDDY_API_KEY.
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ secrets.BUILDBUDDY_API_KEY != '' && format('--remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
  # Git Bash must not convert Bazel labels.
  MSYS2_ARG_CONV_EXCL: "//"

concurrency:
  # Main pushes share one group; PRs, schedule, dispatch and merge_group get their own.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dogfood:
    name: dogfood (self-call reusable consumer workflow)
    # Dogfoods the reusable file end to end on the working tree.
    needs: [workflow-check, preflight]
    uses: ./.github/workflows/reusable-consumer.yml
    with:
      rules_dx_version: "0.0.0"
      platforms: '["linux_x86_64", "linux_arm64", "macos_arm64", "windows_x86_64", "windows_arm64"]'
      min_coverage: "100"
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      REMOTE_CACHE_HEADER: ${{ secrets.REMOTE_CACHE_HEADER }}
    permissions:
      contents: read
      pull-requests: write
  coverage-cells:
    name: coverage-cells (one exact coverage report from every native cell)
    needs: [dogfood]
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: dx-reports-coverage-*
          path: ${{ runner.temp }}/coverage-reports
      - name: Check every cell reported exactly once
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          mkdir -p "$RUNNER_TEMP/coverage-reports"
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find "$RUNNER_TEMP/coverage-reports" -name coverage.ndjson | sort)
          bazel run "$@" //tools/ci:coverage_cells_bin -- "$GITHUB_WORKSPACE/tools/coverage/cells.txt" "$GITHUB_SHA" "${files[@]}"
  docs:
    name: docs (self-call reusable docs workflow)
    uses: ./.github/workflows/reusable-docs.yml
    with:
      rules_dx_version: "0.0.0"
      docs_scope: "//docs/... //tools/docs/..."
      site: "//tools/docs/site:user_site"
      site_check: "//tools/docs/site:user_site_check"
      landing: true
      smoke_test: "//tools/docs/site:deploy_smoke_test"
      forbid: |
        Treat warnings as errors
        docs_fixture
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pages: write
      id-token: write
  devcontainer-check:
    name: devcontainer-check (init parity, definition valid)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Prove dx init scaffold matches checked-in definition
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_timeout=300 //.devcontainer:devcontainer_parity_test "$@"
      - name: Validate devcontainer definition shape
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          python3 - <<'EOF'
          import json
          with open(".devcontainer/devcontainer.json") as handle:
              definition = json.load(handle)
          post_create = definition["postCreateCommand"]
          assert "bazel run @rules_dx//:dx -- env --apply" in post_create, post_create
          assert "bazel build //..." not in post_create, post_create
          print("devcontainer definition valid:", post_create)
          EOF
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### devcontainer-check — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: dx init scaffold parity plus devcontainer definition shape." >> "$GITHUB_STEP_SUMMARY"
  hermetic:
    name: hermetic (no-install and network-denied consumer qualification)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Qualify the consumer without installs or network
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          targets="$(bazel query "$@" 'attr(tags, hermetic-consumer, //...) except filter("_upstream$", //...)' --output=label)"
          test -n "$targets"
          echo "$targets" > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_probe_test $targets
      - name: Verify the evidence
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            bazel run --noshow_progress "$@" //tools/testing/hermetic:verify -- --evidence "$PWD/bazel-testlogs/$pkg/$name/test.outputs/evidence.json" --commit "$(git rev-parse HEAD)" --manifest "$PWD/bazel-bin/$pkg/${name}_manifest.json"
          done < "$RUNNER_TEMP/hermetic-targets"
      - name: Collect the evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hermetic-evidence"
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            mkdir -p "$RUNNER_TEMP/hermetic-evidence/$name"
            cp -R "bazel-testlogs/$pkg/$name/test.outputs/." "$RUNNER_TEMP/hermetic-evidence/$name/" || true
          done < "$RUNNER_TEMP/hermetic-targets"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hermetic-evidence-linux_x86_64
          path: ${{ runner.temp }}/hermetic-evidence
          retention-days: 7
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### hermetic (linux_x86_64) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualified a fresh C++ and Rust consumer: fetch with network, then test, coverage, expected-failure, ambient-tool, home-config, network and cache probes with the network denied. Evidence is in the hermetic-evidence artifact." >> "$GITHUB_STEP_SUMMARY"
  hermetic-arm64:
    name: hermetic-arm64 (rust_wasi qualification on native linux_arm64)
    timeout-minutes: 90
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Qualify rust_wasi without installs or network
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          targets=//tools/testing/hermetic:rust_wasi
          echo "$targets" > "$RUNNER_TEMP/hermetic-targets"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "$@" //tools/testing/hermetic:isolation_probe_test $targets
      - name: Verify the evidence
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            bazel run --noshow_progress "$@" //tools/testing/hermetic:verify -- --evidence "$PWD/bazel-testlogs/$pkg/$name/test.outputs/evidence.json" --commit "$(git rev-parse HEAD)" --manifest "$PWD/bazel-bin/$pkg/${name}_manifest.json"
          done < "$RUNNER_TEMP/hermetic-targets"
      - name: Collect the evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hermetic-evidence"
          while read -r label; do
            pkg="${label%%:*}"; pkg="${pkg#//}"; name="${label##*:}"
            mkdir -p "$RUNNER_TEMP/hermetic-evidence/$name"
            cp -R "bazel-testlogs/$pkg/$name/test.outputs/." "$RUNNER_TEMP/hermetic-evidence/$name/" || true
          done < "$RUNNER_TEMP/hermetic-targets"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hermetic-evidence-linux_arm64
          path: ${{ runner.temp }}/hermetic-evidence
          retention-days: 7
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### hermetic-arm64 (linux_arm64, rust_wasi) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualified the WASI Rust consumer on a native aarch64 Linux runner with the network denied. Evidence is in the hermetic-evidence-linux_arm64 artifact." >> "$GITHUB_STEP_SUMMARY"
  network:
    name: network (requires-network nested consumer tests)
    timeout-minutes: 75
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the opted-in requires-network consumer tests
        env:
          REPO_CACHE_PATH: ${{ steps.repo-cache.outputs.path }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          targets="$(bazel query "$@" 'attr(tags, network-consumer, //...)' --output=label)"
          test -n "$targets"
          echo "$targets" > "$RUNNER_TEMP/network-targets"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --test_output=errors --test_timeout=2400 --flaky_test_attempts=2 "--test_env=DX_NESTED_BAZEL_REPOSITORY_CACHE=${REPO_CACHE_PATH}" "$@" $targets
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### network (linux_x86_64) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran the tests tagged network-consumer. A FLAKY result means the test passed on its single retry." >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/network-targets" ]; then
            sed 's/^/- /' "$RUNNER_TEMP/network-targets" >> "$GITHUB_STEP_SUMMARY"
          fi
  starter-consumer:
    name: starter-consumer (hello-world fixtures) (${{ matrix.platform }}, shard ${{ matrix.shard }})
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux_x86_64
          - linux_arm64
          - macos_arm64
          - windows_x86_64
          - windows_arm64
        shard: [0, 1, 2, 3]
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: macos_arm64
            runner: macos-15
          - platform: windows_x86_64
            runner: windows-latest
          - platform: windows_arm64
            runner: windows-11-arm
            no-starter-issue: "#4986"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run this shard of the starter consumer tests
        env:
          REPO_CACHE_PATH: ${{ steps.repo-cache.outputs.path }}
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
          NO_STARTER_ISSUE: ${{ matrix.no-starter-issue }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel query "$@" 'attr(tags, starter-consumer, //...)' --output=label | sort > "$RUNNER_TEMP/starter-all"
          awk -v shard="$SHARD" -v shards="$SHARDS" '(NR - 1) % shards == shard' "$RUNNER_TEMP/starter-all" > "$RUNNER_TEMP/starter-targets"
          if [ ! -s "$RUNNER_TEMP/starter-all" ]; then
            echo "::error::No starter consumer targets exist."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/starter-targets" ]; then
            echo "No starter consumer targets in shard ${SHARD}."
            exit 0
          fi
          targets="$(tr '\r\n' '  ' < "$RUNNER_TEMP/starter-targets")"
          # shellcheck disable=SC2086
          bazel test --noshow_progress --test_output=errors --skip_incompatible_explicit_targets --test_timeout=2400 --flaky_test_attempts=2 "--test_env=DX_NESTED_BAZEL_REPOSITORY_CACHE=${REPO_CACHE_PATH}" "$@" $targets && test_status=0 || test_status=$?
          testlogs="$(bazel info "$@" bazel-testlogs)"
          ran=0
          : > "$RUNNER_TEMP/starter-ran"
          : > "$RUNNER_TEMP/starter-skipped"
          for label in $targets; do
            path="${label#//}"
            if [ -f "${testlogs}/${path/:/\/}/test.xml" ]; then
              ran=$((ran + 1))
              echo "$label" >> "$RUNNER_TEMP/starter-ran"
            else
              echo "$label" >> "$RUNNER_TEMP/starter-skipped"
            fi
          done
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          echo "Ran ${ran} starter consumer tests on ${PLATFORM}, shard ${SHARD}."
          if [ "$ran" -eq 0 ]; then
            if [ -n "$NO_STARTER_ISSUE" ]; then
              echo "::warning::${PLATFORM} runs no starter consumer tests. Tracked in ${NO_STARTER_ISSUE}."
              exit 0
            fi
            echo "::error::Every starter consumer test was skipped on ${PLATFORM}, shard ${SHARD}."
            exit 1
          fi
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PLATFORM: ${{ matrix.platform }}
          SHARD: ${{ matrix.shard }}
        run: |
          echo "### starter-consumer (${PLATFORM}, shard ${SHARD}) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "The tests tagged starter-consumer: each runs dx init and checks the generated files against a golden listing." >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/starter-ran" ]; then
            echo "#### Ran" >> "$GITHUB_STEP_SUMMARY"
            tr -d '\r' < "$RUNNER_TEMP/starter-ran" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            if [ -s "$RUNNER_TEMP/starter-skipped" ]; then
              echo "#### Skipped (incompatible with this platform)" >> "$GITHUB_STEP_SUMMARY"
              tr -d '\r' < "$RUNNER_TEMP/starter-skipped" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -f "$RUNNER_TEMP/starter-targets" ]; then
            echo "#### Targets" >> "$GITHUB_STEP_SUMMARY"
            tr -d '\r' < "$RUNNER_TEMP/starter-targets" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi
  python-docs-consumer:
    name: python-docs-consumer (${{ matrix.platform }})
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux_x86_64
          - linux_arm64
          - macos_arm64
          - windows_x86_64
          - windows_arm64
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: macos_arm64
            runner: macos-15
          - platform: windows_x86_64
            runner: windows-latest
          - platform: windows_arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run the Python docs consumer test
        env:
          REPO_CACHE_PATH: ${{ steps.repo-cache.outputs.path }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_output=errors --test_timeout=2400 --flaky_test_attempts=2 "--test_env=DX_NESTED_BAZEL_REPOSITORY_CACHE=${REPO_CACHE_PATH}" "$@" //python/tests/consumer:docs_consumer_test
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "### python-docs-consumer (${PLATFORM}) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran //python/tests/consumer:docs_consumer_test: a renamed-repo consumer builds a Python API site with dx docs on this platform." >> "$GITHUB_STEP_SUMMARY"
  msix-install:
    name: msix-install (windows_x86_64)
    timeout-minutes: 60
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for msix changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(msix/|examples/msix-app/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-bazel
        if: steps.changes.outputs.run == 'true'
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Install and launch the signed package
        if: steps.changes.outputs.run == 'true'
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_output=errors "$@" //msix/tests:install_test
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RAN: ${{ steps.changes.outputs.run }}
        run: |
          echo "### msix-install (windows_x86_64) — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran //msix/tests:install_test: ${RAN}. It installs the signed and unsigned packages and launches the app." >> "$GITHUB_STEP_SUMMARY"
  preflight:
    name: preflight (native bootstrap and tool launch) (${{ matrix.platform }}, ${{ matrix.runner }})
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
            quality: "//quality/testdata:matrix_python_format_pass //quality/testdata:matrix_jupyter_format_pass //quality/testdata:matrix_jupyter_lint_fail //quality/testdata:matrix_jupyter_outputs_fail //quality/testdata:matrix_javascript_format_pass //quality/testdata:matrix_api_spec_openapi_pass //quality/testdata:matrix_yaml_format_pass //quality/testdata:matrix_yaml_format_fail //quality/testdata:matrix_yaml_format_syntax_error //quality/testdata:matrix_yaml_lint_pass //quality/testdata:matrix_yaml_lint_fail //quality/testdata:matrix_yaml_lint_syntax_error //quality/testdata:matrix_flatbuffers_lint_pass //quality/testdata:matrix_capnp_lint_pass //quality/testdata:matrix_thrift_lint_pass //quality/testdata:matrix_thrift_lint_warning_fail //quality/testdata:matrix_thrift_lint_syntax_error //quality/testdata:matrix_thrift_lint_semantic_fail //quality/testdata:matrix_thrift_lint_include_undeclared //quality/testdata:matrix_thrift_typecheck_pass //quality/testdata:matrix_thrift_typecheck_semantic_fail //quality/testdata:matrix_thrift_typecheck_warning_ignored //quality/testdata:matrix_avro_lint_avsc_pass //quality/testdata:matrix_avro_lint_avsc_undefined_name //quality/testdata:matrix_avro_lint_avsc_syntax_error //quality/testdata:matrix_avro_lint_avdl_import_pass //quality/testdata:matrix_avro_lint_avdl_syntax_error //quality/testdata:matrix_avro_typecheck_avsc_pass //quality/testdata:matrix_avro_typecheck_avsc_undefined_name"
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            quality: "//quality/testdata:runner_matrix_linux_arm64"
          - platform: macos_arm64
            runner: macos-15
            quality: "//quality/testdata:runner_matrix_macos_arm64"
          - platform: windows_x86_64
            runner: windows-latest
            quality: "//quality/testdata:runner_matrix_windows_x86_64"
          - platform: windows_arm64
            runner: windows-11-arm
            quality: "//quality/testdata:runner_matrix_windows_arm64"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Stamp the restored Bazel repository cache
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        shell: bash
        run: touch "$RUNNER_TEMP/dx-repo-cache.stamp"
      - name: Build the bootstrap closure
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel build --noshow_progress "$@" //cli/cli:dx //cc/tests/fixtures/hello:hello
      - name: Run the launch smoke
        env:
          QUALITY_TARGETS: ${{ matrix.quality }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2086
          bazel test --noshow_progress --nocache_test_results --test_output=all "$@" //tools/testing:preflight_smoke_test //cli/env:bootstrap_test //cc/tests/fixtures/hello:hello_test //powershell/tests/fixtures/hello:hello_test //zig/tests/fixtures/zig-app/... //examples/dart-app/... //dart/tests/runtime:all //dart/tools:all //zig/tests/fixtures/hello:all //julia/tests/fixtures/hello:all //julia/tests/fixtures/julia-app/... $QUALITY_TARGETS
      - name: Run the PyPI probe verification
        if: ${{ matrix.platform != 'windows_arm64' }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          # shellcheck disable=SC2086
          bazel test --noshow_progress --nocache_test_results --test_output=all "$@" //deploy/rules:pypi_probe_verify
      - name: Write job summary
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          JOB_STATUS: ${{ job.status }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          echo "### preflight ${PLATFORM} — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Built dx plus the native hello fixture, installed and replaced the bootstrap environment, then launched dx, hello, and the representative Python, JavaScript, and YAML tools, and the Zig example and hello fixture on ${RUNNER_LABEL}." >> "$GITHUB_STEP_SUMMARY"
      - name: Record the runner image
        if: always()
        shell: bash
        run: |
          line="runner: os=${RUNNER_OS:-unknown} arch=${RUNNER_ARCH:-unknown} image=${ImageOS:-unknown} version=${ImageVersion:-unknown} bazel=$(bazel --version 2>&1 | head -n 1 || true)"
          echo "$line" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Prune the Bazel repository cache to this run's downloads
        if: ${{ success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        shell: bash
        env:
          DX_REPO_CACHE: ${{ steps.repo-cache.outputs.path }}/content_addressable
        run: |
          # Bazel touches an entry on each hit, so entries older than the stamp went unused.
          stamp="$RUNNER_TEMP/dx-repo-cache.stamp"
          if [ ! -f "$stamp" ] || [ ! -d "$DX_REPO_CACHE" ]; then
            exit 0
          fi
          pruned=0
          for entry in "$DX_REPO_CACHE"/*/*/; do
            entry="${entry%/}"
            [ -d "$entry" ] || continue
            if [ ! "$entry/file" -nt "$stamp" ]; then
              rm -rf "$entry"
              pruned=$((pruned + 1))
            fi
          done
          size="$(du -sh "$DX_REPO_CACHE" | cut -f1)"
          echo "dx-ci: pruned $pruned unused repository cache entries; the saved cache holds $size." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the Bazel repository cache
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: ${{ steps.repo-cache-restore.outputs.cache-primary-key }}
  repo-cache-prune:
    name: repo-cache-prune (keep newest repository cache per platform)
    needs: [preflight]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete older repository caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for p in Linux-X64 Linux-ARM64 macOS-ARM64 Windows-X64 Windows-ARM64; do
            for id in $(gh cache list --key "dx-repo-$p-" --ref refs/heads/main --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id'); do
              gh cache delete "$id"
            done
          done
          {
            echo "### Remaining repository caches"
            gh cache list --key "dx-repo-" --ref refs/heads/main --limit 100 --json key,sizeInBytes --jq '.[] | "\(.key) \(.sizeInBytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
  workflow-check:
    name: workflow-check (actionlint semantics, before the matrix)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate workflow semantics with the pinned actionlint
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel test --noshow_progress --test_timeout=300 //tools/ci:actionlint_test //tools/ci:workflow_expressions_test "$@"
      - name: Fail when bazel mod tidy would change MODULE.bazel
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel mod tidy "$@"
          git diff --exit-code -- MODULE.bazel
      - name: Fail when a public rust library is missing from PUBLIC_RUST_CRATES
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          tools/docs/site/public_rust_crates_guard.sh "$@"
      - name: Fail when a nested Bazel test is missing from nested_smoke.txt
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          tools/testing/nested_smoke_guard.sh "$@"
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### workflow-check — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked: pinned actionlint over every shipped workflow and consumer starter, plus the invalid fixture; no expressions in run blocks; bazel mod tidy; PUBLIC_RUST_CRATES covers every public rust library; nested_smoke.txt lists every nested Bazel test." >> "$GITHUB_STEP_SUMMARY"
  gate:
    name: gate
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Pin the affected base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//tools/ci:gate_base_bin
      - name: Check the affected targets
        shell: bash
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- check --affected --output=json | tee "${RUNNER_TEMP:-/tmp}/gate.json"
      - name: Verify the base dx compared against
        run: |
          python3 - "${RUNNER_TEMP:-/tmp}/gate.json" <<'DX_GATE_VERIFY'
          import json
          import os
          import sys

          want = os.environ["GATE_BASE"]
          seen = []
          for line in open(sys.argv[1], encoding="utf-8"):
              try:
                  value = json.loads(line)
              except ValueError:
                  continue
              affected = value.get("affected") if isinstance(value, dict) else None
              if isinstance(affected, dict) and "base" in affected:
                  seen.append(affected["base"])
          if want not in seen:
              sys.exit(f"gate: dx compared against {seen}, expected {want}")
          DX_GATE_VERIFY
      - name: Summary
        if: ${{ always() }}
        run: echo "gate base ${GATE_BASE:-unset}" >> "$GITHUB_STEP_SUMMARY"
  ci:
    name: ci
    if: ${{ !cancelled() || github.event_name == 'merge_group' }}
    needs:
      [
        coverage-cells,
        dogfood,
        docs,
        devcontainer-check,
        gate,
        hermetic,
        hermetic-arm64,
        msix-install,
        network,
        preflight,
        python-docs-consumer,
        starter-consumer,
        workflow-check,
      ]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          NEEDS_COVERAGE_CELLS: ${{ needs.coverage-cells.result }}
          NEEDS_DOGFOOD: ${{ needs.dogfood.result }}
          NEEDS_DOCS: ${{ needs.docs.result }}
          NEEDS_DEVCONTAINER_CHECK: ${{ needs.devcontainer-check.result }}
          NEEDS_GATE: ${{ needs.gate.result }}
          NEEDS_HERMETIC: ${{ needs.hermetic.result }}
          NEEDS_HERMETIC_ARM64: ${{ needs.hermetic-arm64.result }}
          NEEDS_MSIX_INSTALL: ${{ needs.msix-install.result }}
          NEEDS_NETWORK: ${{ needs.network.result }}
          NEEDS_PREFLIGHT: ${{ needs.preflight.result }}
          NEEDS_PYTHON_DOCS_CONSUMER: ${{ needs.python-docs-consumer.result }}
          NEEDS_STARTER_CONSUMER: ${{ needs.starter-consumer.result }}
          NEEDS_WORKFLOW_CHECK: ${{ needs.workflow-check.result }}
        run: |
          set -eu
          export LC_ALL=C
          required=(coverage-cells dogfood docs devcontainer-check gate hermetic hermetic-arm64 msix-install network preflight python-docs-consumer starter-consumer workflow-check)
          failing=()
          for name in "${required[@]}"; do
            var="NEEDS_${name^^}"
            var=${var//-/_}
            [ "${!var:-}" = success ] || failing+=("$name")
          done
          list=""
          for name in $(printf '%s\n' "${failing[@]}" | sort); do
            list="$list${list:+,}\"$name\""
          done
          echo "{\"aggregate\":\"ci\",\"failing checks\":[$list]}"
          [ ${#failing[@]} -eq 0 ]
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### ci — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Aggregate required check over every ci.yml job (branch-protection single gate; every needed job must succeed)." >> "$GITHUB_STEP_SUMMARY"
  scheduled-report:
    name: scheduled-report
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [ci]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          title="ci: scheduled run is failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ "$CI_RESULT" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Scheduled run is green again: $RUN_URL"
            fi
            exit 0
          fi
          failed=$(gh run view "$RUN_ID" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | "- " + .name] | join("\n")')
          body="Scheduled ci run failed: $RUN_URL"$'\n\n'"Failed jobs:"$'\n'"$failed"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
