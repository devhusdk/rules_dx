        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS
          bazel build --noshow_progress --//cc:compiler=msvc "$@" //cc/tests/msvc_cross:app_arm64
          mkdir -p "$RUNNER_TEMP/msvc-arm64"
          bazel cquery --noshow_progress --//cc:compiler=msvc "$@" --output=files //cc/tests/msvc_cross:app_arm64 2>/dev/null | while read -r file; do
            case "$file" in
              *.exe | *.dll) cp "$file" "$RUNNER_TEMP/msvc-arm64/" ;;
            esac
          done
          find "$RUNNER_TEMP/msvc-arm64" -type f
          test -f "$RUNNER_TEMP/msvc-arm64/app.exe"
          test "$(find "$RUNNER_TEMP/msvc-arm64" -type f -name '*.dll' | wc -l)" -eq 1
      - name: Check the upload holds no secret
        id: scan-msvc-arm64-fixtures
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/msvc-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-msvc-arm64-fixtures.outcome == 'success' }}
        with:
          name: msvc-arm64-fixtures
          path: ${{ runner.temp }}/msvc-arm64
          retention-days: 3
          if-no-files-found: error
  msvc-cross-run-arm64:
    name: msvc-cross-run-arm64 (msvc x64-cross-built app on native windows_arm64)
    needs: [msvc-cross-build]
    timeout-minutes: 10
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Check out files in parallel
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 fetch --depth=1 --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c checkout.workers=0 checkout --force FETCH_HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msvc-arm64-fixtures
          path: ${{ runner.temp }}/msvc-arm64
      - name: Run the app without emulation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $os = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          Write-Output "OS architecture: $os"
          if ($os -ne 'Arm64') { throw "expected an Arm64 host, got $os" }
          Set-Location (Join-Path $env:RUNNER_TEMP 'msvc-arm64')
          foreach ($file in Get-ChildItem -File -Include *.exe, *.dll -Path *) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $pe = [System.BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [System.BitConverter]::ToUInt16($bytes, $pe + 4)
            Write-Output ('{0}: machine 0x{1:X4}' -f $file.Name, $machine)
            if ($machine -ne 0xAA64) { throw "$($file.Name) is not an ARM64 image" }
          }
          $out = & .\app.exe
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0) { throw ('app.exe exited with 0x{0:X8}' -f $code) }
          if (-not ($out | Where-Object { $_ -match '^_MSC_FULL_VER=[0-9]+$' })) { throw 'app.exe printed no _MSC_FULL_VER line' }
