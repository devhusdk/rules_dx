  ci:
    name: ci
    if: ${{ !cancelled() || github.event_name == 'merge_group' }}
    needs:
      [
        coverage-cells,
        dogfood,
        docs,
        devcontainer-check,
        families,
        gate,
        gcc-cross-build,
        gcc-cross-run-arm64,
        hermetic,
        hermetic-arm64,
        hermetic-macos,
        hermetic-windows,
        msix-install,
        network,
        preflight,
        starter-consumer,
        workflow-check,
      ]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          NEEDS_COVERAGE_CELLS: ${{ needs.coverage-cells.result }}
          NEEDS_DOGFOOD: ${{ needs.dogfood.result }}
          NEEDS_DOCS: ${{ needs.docs.result }}
          NEEDS_DEVCONTAINER_CHECK: ${{ needs.devcontainer-check.result }}
          NEEDS_FAMILIES: ${{ needs.families.result }}
          NEEDS_GATE: ${{ needs.gate.result }}
          NEEDS_GCC_CROSS_BUILD: ${{ needs.gcc-cross-build.result }}
          NEEDS_GCC_CROSS_RUN_ARM64: ${{ needs.gcc-cross-run-arm64.result }}
          NEEDS_HERMETIC: ${{ needs.hermetic.result }}
          NEEDS_HERMETIC_ARM64: ${{ needs.hermetic-arm64.result }}
          NEEDS_HERMETIC_MACOS: ${{ needs.hermetic-macos.result }}
          NEEDS_HERMETIC_WINDOWS: ${{ needs.hermetic-windows.result }}
          NEEDS_MSIX_INSTALL: ${{ needs.msix-install.result }}
          NEEDS_NETWORK: ${{ needs.network.result }}
          NEEDS_PREFLIGHT: ${{ needs.preflight.result }}
          NEEDS_STARTER_CONSUMER: ${{ needs.starter-consumer.result }}
          NEEDS_WORKFLOW_CHECK: ${{ needs.workflow-check.result }}
        run: |
          set -eu
          export LC_ALL=C
          required=(coverage-cells dogfood docs devcontainer-check families gate gcc-cross-build gcc-cross-run-arm64 hermetic hermetic-arm64 hermetic-macos hermetic-windows msix-install network preflight starter-consumer workflow-check)
          failing=()
          for name in "${required[@]}"; do
            var="NEEDS_${name^^}"
            var=${var//-/_}
            [ "${!var:-}" = success ] || failing+=("$name")
          done
          list=""
          for name in $(printf '%s\n' "${failing[@]}" | sort); do
            list="$list${list:+,}\"$name\""
          done
          echo "{\"aggregate\":\"ci\",\"failing checks\":[$list]}"
          [ ${#failing[@]} -eq 0 ]
      - name: Write job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### ci — ${JOB_STATUS}" >> "$GITHUB_STEP_SUMMARY"
          echo "Aggregate required check over every ci.yml job (branch-protection single gate; every needed job must succeed)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always()
        with:
          sparse-checkout: tools/ci/compiler_table.sh
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        continue-on-error: true
        with:
          pattern: compiler-evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/compiler-evidence
      - name: Merge compiler evidence
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/compiler-evidence"
          {
            echo "### Compiler evidence (row x platform)"
            tools/ci/compiler_table.sh "$RUNNER_TEMP/compiler-evidence" "$RUNNER_TEMP/compiler-evidence-all.jsonl" linux_x86_64 linux_arm64 macos_arm64 windows_x86_64 windows_arm64
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the upload holds no secret
        id: scan-compiler-evidence
        if: always()
        uses: ./.github/actions/assert-no-secret
        with:
          path: ${{ runner.temp }}/compiler-evidence-all.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.scan-compiler-evidence.outcome == 'success' }}
        continue-on-error: true
        with:
          name: compiler-evidence-all
          path: ${{ runner.temp }}/compiler-evidence-all.jsonl
          if-no-files-found: ignore
          retention-days: 3
  scheduled-report:
    name: scheduled-report
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [ci]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          title="ci: scheduled run is failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ "$CI_RESULT" = "cancelled" ] || [ "$CI_RESULT" = "skipped" ]; then
            echo "Run $RUN_ID was $CI_RESULT and gave no result; leaving the tracking issue alone."
            exit 0
          fi
          if [ "$CI_RESULT" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Scheduled run is green again: $RUN_URL"
            fi
            exit 0
          fi
          failed=""
          while IFS=$'\t' read -r job_id job_name step_name; do
            [ -n "$job_id" ] || continue
            failed="$failed${failed:+$'\n'}- $job_name (step: ${step_name:-unknown})"
            lines=$(gh api "repos/$GH_REPO/actions/jobs/$job_id/logs" 2>/dev/null \
              | sed -E 's/^[0-9T:.Z-]+ //' \
              | grep -E '^ERROR:|panicked at|FAILED|^##\[error\]' \
              | cut -c1-300 | head -n 5 || true)
            if [ -n "$lines" ]; then
              failed="$failed"$'\n'"$(printf '%s\n' "$lines" | sed 's/^/    /')"
            fi
          done < <(gh run view "$RUN_ID" --json jobs --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | [(.databaseId | tostring), .name, ([.steps[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name][0] // "")] | @tsv')
          if [ -z "$failed" ]; then
            failed="- (no failed job recorded; see the run)"
          fi
          body="Scheduled ci run failed: $RUN_URL"$'\n\n'"Failed jobs:"$'\n'"$failed"
          body=${body:0:60000}
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
