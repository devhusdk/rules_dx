name: comment-command

# One workflow for every slash command, so a comment starts one run, not one per
# command. Each job filters on the comment's first line, so a plain comment
# starts no job.
on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: comment-command-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  evidence:
    name: dispatch evidence
    if: ${{ startsWith(github.event.comment.body, '/evidence') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    timeout-minutes: 5
    runs-on: ubuntu-slim
    steps:
      - name: Dispatch evidence.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DX_BODY: ${{ github.event.comment.body }}
          DX_NUMBER: ${{ github.event.issue.number }}
          DX_IS_PR: ${{ github.event.issue.pull_request != null }}
          DX_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          reply() { gh issue comment "$DX_NUMBER" --body "$1"; }
          ref="$DX_DEFAULT_BRANCH"
          if [ "$DX_IS_PR" = true ]; then
            head=$(gh pr view "$DX_NUMBER" --json headRefName,isCrossRepository --jq 'if .isCrossRepository then "" else .headRefName end')
            if [ -z "$head" ]; then
              reply "/evidence needs a pull request branch in this repository."
              exit 1
            fi
            ref="$head"
          fi
          line=$(printf '%s\n' "$DX_BODY" | head -n 1 | tr -d '\r')
          args=()
          key=
          for token in ${line#/evidence}; do
            case "$token" in
              platforms=* | task=* | scope=* | test_timeout=* | displays=* | android=* | qualify=* | relocate=* | release_cell=* | flags=* | lock_refresh=* | accept_licenses=*)
                key=${token%%=*}
                args+=("$key=${token#*=}")
                ;;
              *)
                if [ "$key" != scope ] && [ "$key" != flags ]; then
                  reply "/evidence could not read '$token'. Use platforms=, task=, scope=, test_timeout=, displays=, android=, qualify=, relocate=, release_cell=, flags=, lock_refresh= or accept_licenses=."
                  exit 1
                fi
                args[${#args[@]}-1]+=" $token"
                ;;
            esac
          done
          flags=()
          for arg in "${args[@]}"; do
            flags+=(-f "$arg")
          done
          printf '%s\n' "${args[@]}"
          runs() { gh run list --workflow evidence.yml --branch "$ref" --event workflow_dispatch --limit 50 --json databaseId,url "$@"; }
          before=$(runs --jq '[.[].databaseId] | tostring')
          if ! gh workflow run evidence.yml --ref "$ref" "${flags[@]}"; then
            reply "/evidence could not dispatch evidence.yml on $ref."
            exit 1
          fi
          url=
          for _ in $(seq 1 30); do
            url=$(runs --jq "[.[] | select([.databaseId] | inside($before) | not)] | first | .url // empty")
            [ -z "$url" ] || break
            sleep 2
          done
          reply "Evidence started on \`$ref\`: ${url:-https://github.com/$GH_REPO/actions/workflows/evidence.yml}"

  lock-refresh:
    name: dispatch lock-refresh
    # The first line is `/lock-refresh` alone or followed by a space; the newline
    # and carriage return come from fromJSON because expression strings have no
    # escapes.
    if: >-
      ${{
        github.event.issue.pull_request != null
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && (github.event.comment.body == '/lock-refresh'
          || startsWith(github.event.comment.body, '/lock-refresh ')
          || startsWith(github.event.comment.body, format('/lock-refresh{0}', fromJSON('"\n"')))
          || startsWith(github.event.comment.body, format('/lock-refresh{0}', fromJSON('"\r"'))))
      }}
    timeout-minutes: 5
    runs-on: ubuntu-slim
    steps:
      - name: Dispatch lock-refresh.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DX_BODY: ${{ github.event.comment.body }}
          DX_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          reply() { gh pr comment "$DX_NUMBER" --body "$1"; }
          line=$(printf '%s\n' "$DX_BODY" | head -n 1 | tr -d '\r')
          # Expression comparisons ignore case, so the job also starts on
          # `/Lock-Refresh`; only the exact command dispatches.
          case "$line" in
            /lock-refresh | "/lock-refresh "*) ;;
            *) exit 0 ;;
          esac
          nested=false
          for token in ${line#/lock-refresh}; do
            case "$token" in
              nested=true | nested=false) nested=${token#nested=} ;;
              *)
                reply "/lock-refresh could not read '$token'. Use nested=true or nested=false."
                exit 1
                ;;
            esac
          done
          head=$(gh pr view "$DX_NUMBER" --json headRefName,isCrossRepository --jq 'if .isCrossRepository then "" else .headRefName end')
          if [ -z "$head" ]; then
            reply "/lock-refresh needs a pull request branch in this repository."
            exit 1
          fi
          echo "pr=$DX_NUMBER ref=$head nested=$nested"
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ! gh workflow run lock-refresh.yml --ref "$head" -f "pr=$DX_NUMBER" -f "nested=$nested"; then
            reply "/lock-refresh could not dispatch lock-refresh.yml on $head."
            exit 1
          fi
          url=
          for _ in 1 2 3 4 5 6; do
            sleep 5
            url=$(gh run list --workflow lock-refresh.yml --branch "$head" --event workflow_dispatch --json url,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")] | last | .url // empty")
            [ -z "$url" ] || break
          done
          reply "Lock refresh (nested=$nested) started on \`$head\`: ${url:-https://github.com/$GH_REPO/actions/workflows/lock-refresh.yml}"
