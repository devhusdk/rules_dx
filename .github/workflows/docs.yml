name: docs

# Publishes the user docs to GitHub Pages when a push to main changes a page
# the book renders. ci.yml still checks the docs on every merge group and
# republishes on its daily run, which picks up API reference changes from code.
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "examples/**/README.md"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/reusable-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docs:
    name: docs (build and publish the user book)
    # ci.yml and docs.yml both deploy Pages from main; a second concurrent
    # deploy-pages run fails instead of queueing, so they take turns.
    concurrency:
      group: docs-pages-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/reusable-docs.yml
    with:
      docs_scope: "//docs/... //tools/docs/..."
      site: "//tools/docs/site:user_site"
      site_check: "//tools/docs/site:user_site_check"
      landing: true
      smoke_test: "//tools/docs/site:deploy_smoke_test"
      forbid: |
        Treat warnings as errors
        docs_fixture
      publish: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pages: write
      id-token: write
