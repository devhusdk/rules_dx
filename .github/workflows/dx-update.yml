name: dx-update

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dx-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      HAS_APP: ${{ secrets.DX_UPDATE_APP_ID != '' && secrets.DX_UPDATE_APP_PRIVATE_KEY != '' }}
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: env.HAS_APP == 'true'
        with:
          app-id: ${{ secrets.DX_UPDATE_APP_ID }}
          private-key: ${{ secrets.DX_UPDATE_APP_PRIVATE_KEY }}
      - name: Warn when the update App is not configured
        if: env.HAS_APP != 'true'
        run: |
          msg="DX_UPDATE_APP_ID and DX_UPDATE_APP_PRIVATE_KEY are not set, so CI will not run on these PRs."
          echo "::warning::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Use BuildBuddy remote execution
        run: |
          [ -n "${BB_ARGS:-}" ] || { echo "::warning::BUILDBUDDY_API_KEY is not set, so updates are verified on this runner and may time out."; exit 0; }
          {
            echo "common --config=ci"
            echo "common --config=rbe"
            echo "common $BB_ARGS"
          } >> user.bazelrc
      - name: Open rule-set floor-raise PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          tools/dx update --pr --allow-major --automerge=none bazel:rules_php bazel:rules_lua bazel:rules_qt
      - name: Open update PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          tools/dx update --pr
      - name: Refresh per-platform lock entries
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          [ -f .github/workflows/lock-refresh.yml ] || exit 0
          git fetch --quiet origin '+refs/heads/dx-update/*:refs/remotes/origin/dx-update/*'
          keys='["rules_python+//python/extensions:python.bzl%python", "rules_go+//go:extensions.bzl%go_sdk"]'
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("dx-update/")) | "\(.number) \(.headRefName)"' |
            while read -r number branch; do
              changed="$(
                for ref in "origin/main" "origin/$branch"; do
                  git show "$ref:MODULE.bazel.lock" | jq -c --argjson keys "$keys" '.moduleExtensions | [$keys[] as $k | .[$k]]'
                done | uniq | wc -l
              )"
              if [ "$changed" -gt 1 ]; then
                gh workflow run lock-refresh.yml --ref "$branch" -f pr="$number"
              fi
            done
