name: dx-update

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dx-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      HAS_APP: ${{ secrets.DX_UPDATE_APP_ID != '' && secrets.DX_UPDATE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: env.HAS_APP == 'true'
        with:
          app-id: ${{ secrets.DX_UPDATE_APP_ID }}
          private-key: ${{ secrets.DX_UPDATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
      - name: Open update PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          tools/dx update --pr --group=set --automerge=patch --min-age=3 --max-prs=5
      - name: Refresh per-platform lock entries
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          [ -f .github/workflows/lock-refresh.yml ] || exit 0
          git fetch --quiet origin '+refs/heads/dx-update/*:refs/remotes/origin/dx-update/*'
          keys='["rules_python+//python/extensions:python.bzl%python", "rules_go+//go:extensions.bzl%go_sdk"]'
          gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("dx-update/")) | "\(.number) \(.headRefName)"' |
            while read -r number branch; do
              changed="$(
                for ref in "origin/main" "origin/$branch"; do
                  git show "$ref:MODULE.bazel.lock" | jq -c --argjson keys "$keys" '.moduleExtensions | [$keys[] as $k | .[$k]]'
                done | uniq | wc -l
              )"
              if [ "$changed" -gt 1 ]; then
                gh workflow run lock-refresh.yml --ref "$branch" -f pr="$number"
              fi
            done
