name: evidence-command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: evidence-command-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: dispatch evidence
    if: ${{ startsWith(github.event.comment.body, '/evidence') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    timeout-minutes: 5
    runs-on: ubuntu-slim
    steps:
      - name: Dispatch evidence.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DX_BODY: ${{ github.event.comment.body }}
          DX_NUMBER: ${{ github.event.issue.number }}
          DX_IS_PR: ${{ github.event.issue.pull_request != null }}
          DX_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          reply() { gh issue comment "$DX_NUMBER" --body "$1"; }
          ref="$DX_DEFAULT_BRANCH"
          if [ "$DX_IS_PR" = true ]; then
            head=$(gh pr view "$DX_NUMBER" --json headRefName,isCrossRepository --jq 'if .isCrossRepository then "" else .headRefName end')
            if [ -z "$head" ]; then
              reply "/evidence needs a pull request branch in this repository."
              exit 1
            fi
            ref="$head"
          fi
          line=$(printf '%s\n' "$DX_BODY" | head -n 1 | tr -d '\r')
          args=()
          key=
          for token in ${line#/evidence}; do
            case "$token" in
              platforms=* | task=* | scope=* | test_timeout=* | displays=* | android=* | qualify=* | relocate=* | release_cell=*)
                key=${token%%=*}
                args+=("$key=${token#*=}")
                ;;
              *)
                if [ "$key" != scope ]; then
                  reply "/evidence could not read '$token'. Use platforms=, task=, scope=, test_timeout=, displays=, android=, qualify=, relocate= or release_cell=."
                  exit 1
                fi
                args[${#args[@]}-1]+=" $token"
                ;;
            esac
          done
          flags=()
          for arg in "${args[@]}"; do
            flags+=(-f "$arg")
          done
          printf '%s\n' "${args[@]}"
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ! gh workflow run evidence.yml --ref "$ref" "${flags[@]}"; then
            reply "/evidence could not dispatch evidence.yml on $ref."
            exit 1
          fi
          url=
          for _ in 1 2 3 4 5 6; do
            sleep 5
            url=$(gh run list --workflow evidence.yml --branch "$ref" --event workflow_dispatch --json url,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")] | last | .url // empty")
            [ -z "$url" ] || break
          done
          reply "Evidence started on \`$ref\`: ${url:-https://github.com/$GH_REPO/actions/workflows/evidence.yml}"
