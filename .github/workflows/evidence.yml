name: evidence

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Space-separated Bazel target patterns such as //cli/cli/... or //pkg:target. Apple on macos_arm64: //apple/... //apple/tests:macos_consumer_test //apple/tests:macos_app_consumer_test //apple/tests:macos_swift_consumer_test."
        required: true
      task:
        description: "One of test, build or coverage."
        required: false
        default: "test"
      platforms:
        description: 'JSON array of platform labels (e.g. ["windows_x86_64"]).'
        required: false
        default: '["linux_x86_64"]'
      test_timeout:
        description: "Seconds each test may run (test task only)."
        required: false
        default: "600"
      displays:
        description: "Linux only: xcb, wayland or xcb,wayland. Starts Xvfb and a headless Weston and sets DX_QT_DISPLAYS."
        required: false
        default: ""
      android:
        description: "linux_x86_64 only: boot an Android emulator and run the device scenarios after the scope task."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  MSYS2_ARG_CONV_EXCL: "//"
  DX_ANDROID_API: "34"
  DX_ANDROID_ABI: "x86_64"

jobs:
  validate:
    name: validate evidence inputs
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.inputs.outputs.platforms }}
      runners: ${{ steps.inputs.outputs.runners }}
      scope: ${{ steps.inputs.outputs.scope }}
      task: ${{ steps.inputs.outputs.task }}
      test_timeout: ${{ steps.inputs.outputs.test_timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Validate workflow inputs
        id: inputs
        env:
          DX_SCOPE: ${{ inputs.scope }}
          DX_TASK: ${{ inputs.task }}
          DX_PLATFORMS: ${{ inputs.platforms }}
          DX_DISPLAYS: ${{ inputs.displays }}
          DX_TEST_TIMEOUT: ${{ inputs.test_timeout }}
        run: bazel run --noshow_progress //tools/ci:evidence_inputs_bin

  evidence:
    name: evidence (${{ matrix.platform }})
    needs: [validate]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.platforms) }}
    runs-on: ${{ fromJSON(needs.validate.outputs.runners)[matrix.platform] }}
    permissions:
      contents: read
    steps:
      - name: Free disk space
        if: ${{ inputs.android && matrix.platform == 'linux_x86_64' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Record the Apple executor
        if: ${{ matrix.platform == 'macos_arm64' }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            sw_vers
            uname -m
            xcode-select -p
            xcodebuild -version
            xcodebuild -showsdks
            ls -d /Applications/Xcode*.app
            xcrun simctl list runtimes
            xcrun swift -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk iphonesimulator --show-sdk-version
            xcrun --sdk iphoneos --show-sdk-version
          } 2>&1 | tee "$RUNNER_TEMP/evidence/executor.txt"
      - name: Enable KVM
        if: ${{ inputs.android && matrix.platform == 'linux_x86_64' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "android: /dev/kvm is missing; this runner cannot run a hardware-accelerated emulator" && exit 1
          fi
      - name: Install the Android SDK packages
        if: ${{ inputs.android && matrix.platform == 'linux_x86_64' }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-$DX_ANDROID_API;google_apis;$DX_ANDROID_ABI" > /dev/null
          {
            echo "SDKMANAGER=$sdkmanager"
            echo "EMULATOR=$ANDROID_HOME/emulator/emulator"
            echo "ANDROID_HOME=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Boot the emulator
        if: ${{ inputs.android && matrix.platform == 'linux_x86_64' }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n dx \
            -k "system-images;android-$DX_ANDROID_API;google_apis;$DX_ANDROID_ABI"
          nohup "$EMULATOR" -avd dx -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/evidence/emulator.log" 2>&1 &
          adb start-server
      - name: Start virtual displays
        if: ${{ inputs.displays != '' && startsWith(matrix.platform, 'linux') }}
        env:
          DX_DISPLAYS: ${{ inputs.displays }}
        run: |
          set -eu
          case "$DX_DISPLAYS" in
            xcb|wayland|xcb,wayland|wayland,xcb) ;;
            *) echo "displays must be xcb, wayland or xcb,wayland, got '$DX_DISPLAYS'"; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y xvfb weston
          runtime="$RUNNER_TEMP/xdg"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "DX_QT_DISPLAYS=$DX_DISPLAYS" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          case ",$DX_DISPLAYS," in
            *,xcb,*)
              Xvfb :99 -screen 0 1280x720x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              sleep 3
              ;;
          esac
          case ",$DX_DISPLAYS," in
            *,wayland,*)
              XDG_RUNTIME_DIR="$runtime" weston --backend=headless --socket=wayland-dx --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
              echo "WAYLAND_DISPLAY=wayland-dx" >> "$GITHUB_ENV"
              for _ in $(seq 1 20); do
                [ -S "$runtime/wayland-dx" ] && break
                sleep 1
              done
              [ -S "$runtime/wayland-dx" ] || { cat "$RUNNER_TEMP/weston.log"; exit 1; }
              ;;
          esac
      - name: Run evidence task
        env:
          DX_SCOPE: ${{ needs.validate.outputs.scope }}
          DX_TASK: ${{ needs.validate.outputs.task }}
          DX_TEST_TIMEOUT: ${{ needs.validate.outputs.test_timeout }}
        run: |
          set -o pipefail
          read -ra patterns <<< "$DX_SCOPE"
          if [ "$DX_TASK" = "build" ]; then
            bazel build --noshow_progress "${patterns[@]}" 2>&1 | tee evidence.log
          elif [ "$DX_TASK" = "coverage" ]; then
            bazel run --noshow_progress //cli/cli:dx -- coverage --min-coverage 100 "${patterns[@]}" 2>&1 | tee evidence.log
          else
            bazel test --noshow_progress --nozip_undeclared_test_outputs --test_output=errors --test_timeout="$DX_TEST_TIMEOUT" "${patterns[@]}" 2>&1 | tee evidence.log
          fi
      - name: Run the APK inspect tests
        if: ${{ inputs.android && matrix.platform == 'linux_x86_64' }}
        run: |
          set -o pipefail
          bazel test --noshow_progress --test_output=errors //examples/shared-rust:inspect_apk_test //examples/shared-rust:inspect_consumer_apk_test 2>&1 | tail -n 120
      - name: Wait for the emulator to boot
        id: boot
        if: ${{ inputs.android && matrix.platform == 'linux_x86_64' }}
        run: |
          timeout 600 adb -s emulator-5554 wait-for-device
          waited=0
          until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if [ "$waited" -ge 600 ]; then
              echo "android: emulator-5554 did not boot within 600 s" && tail -n 50 "$RUNNER_TEMP/evidence/emulator.log" && exit 1
            fi
            sleep 5
            waited=$((waited + 5))
          done
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
          {
            lsb_release -d
            uname -m
            "$EMULATOR" -version | head -n 1
            adb version
            "$SDKMANAGER" --list_installed
            for prop in ro.build.version.sdk ro.product.cpu.abi ro.product.cpu.abilist; do
              echo "$prop=$(adb -s emulator-5554 shell getprop "$prop" | tr -d '\r')"
            done
          } > "$RUNNER_TEMP/evidence/android-versions.txt" 2>&1
      - name: Run the device scenario
        if: ${{ inputs.android && matrix.platform == 'linux_x86_64' }}
        run: cd families/android && sh tests/fixtures/rust_apk/device_run.sh emulator-5554 "$RUNNER_TEMP/evidence"
      - name: Run the rust-android fixture on the emulator
        if: ${{ inputs.android && matrix.platform == 'linux_x86_64' }}
        run: |
          set -o pipefail
          checkout="$PWD"
          evidence="$RUNNER_TEMP/evidence"
          bazel build --noshow_progress //cli/cli:dx 2>&1 | tail -n 20
          cp -L bazel-bin/cli/cli/dx "$RUNNER_TEMP/dx"
          starter() {
            set -e
            cd "$RUNNER_TEMP"
            ./dx init --apply demo-app --workspace "$RUNNER_TEMP"
            fixture="$checkout/tools/testing/starters/fixtures/rust-android"
            (cd "$fixture" && find . -type f -name '*.fixture') | while read -r file; do
              dest="demo-app/${file#./}"
              dest="${dest%.fixture}"
              mkdir -p "$(dirname "$dest")"
              case "$dest" in
                demo-app/families) for family in $(cat "$fixture/$file"); do printf 'bazel_dep(name = "rules_dx_%s", version = "0.0.0")\nlocal_path_override(module_name = "rules_dx_%s", path = "%s/families/%s")\n' "$family" "$family" "$checkout" "$family" >> demo-app/MODULE.bazel; done ;;
                demo-app/MODULE.bazel | demo-app/.bazelrc) printf '\n' >> "$dest" && cat "$fixture/$file" >> "$dest" ;;
                *) cp "$fixture/$file" "$dest" ;;
              esac
            done
            cd demo-app
            printf 'local_path_override(module_name = "rules_dx", path = "%s")\n' "$checkout" >> MODULE.bazel
            bazel build --noshow_progress --config=android :demo-app_apk_file
            bazel build --noshow_progress --config=android :demo-app_release_sign
            bazel test --noshow_progress --config=android :demo-app_check_test
            adb -s emulator-5554 logcat -c
            bazel run --noshow_progress --config=android :demo-app_install
            bazel run --noshow_progress --config=android :demo-app_start
            waited=0
            until adb -s emulator-5554 logcat -d -s DxApp:I | grep -q 'greeting=Hello from Rust on Android!'; do
              if [ "$waited" -ge 60 ]; then
                echo "android: the starter greeting is absent from logcat after 60 s" && return 1
              fi
              sleep 1
              waited=$((waited + 1))
            done
            adb -s emulator-5554 logcat -d -s DxApp:I | tee "$evidence/logcat-starter.txt"
          }
          code=0
          (starter) > "$evidence/rust-android-starter.log" 2>&1 || code=$?
          cat "$evidence/rust-android-starter.log"
          echo "rust-android-starter $code" >> "$evidence/exit-codes.txt"
          exit "$code"
      - name: Run shared-rust on the emulator
        if: ${{ !cancelled() && inputs.android && matrix.platform == 'linux_x86_64' && steps.boot.outcome == 'success' }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          adb -s emulator-5554 logcat -c
          bazel run --noshow_progress //examples/shared-rust:install
          bazel run --noshow_progress //examples/shared-rust:start
          sleep 5
          adb -s emulator-5554 shell input tap 200 400
          adb -s emulator-5554 shell input keyevent KEYCODE_ENTER
          sleep 2
          adb -s emulator-5554 shell input keyevent KEYCODE_BACK
          sleep 2
          adb -s emulator-5554 logcat -d -s DxSharedTasks:I | tee "$RUNNER_TEMP/evidence/logcat-shared-rust.txt"
          sh examples/shared-rust/check_lifecycle.sh "$RUNNER_TEMP/evidence/logcat-shared-rust.txt"
      - name: Collect test logs
        if: always()
        run: |
          out="$RUNNER_TEMP/evidence/testlogs"
          mkdir -p "$out"
          cp evidence.log "$RUNNER_TEMP/evidence/"
          [ -e bazel-testlogs ] || exit 0
          find -L bazel-testlogs/ -name test.log -print | while read -r log; do
            dir="$(dirname "$log")"
            rel="${dir#bazel-testlogs/}"
            mkdir -p "$out/$rel"
            cp "$dir/test.log" "$out/$rel/"
            cp "$dir/test.xml" "$out/$rel/" 2>/dev/null || true
            if [ -d "$dir/test.outputs" ]; then
              cp -RL "$dir/test.outputs" "$out/$rel/"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.platform }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
      - name: Write job summary
        if: always()
        env:
          DX_PLATFORM: ${{ matrix.platform }}
          DX_TASK: ${{ needs.validate.outputs.task }}
          DX_SCOPE: ${{ needs.validate.outputs.scope }}
          DX_DISPLAYS: ${{ inputs.displays }}
        run: |
          {
            printf '## Evidence %s\n\n' "$DX_PLATFORM"
            printf "Task \`%s\` on \`%s\`.\n" "$DX_TASK" "$DX_SCOPE"
            printf "Commit \`%s\`, displays \`%s\`.\n" "$GITHUB_SHA" "$DX_DISPLAYS"
            if [ -f evidence.log ]; then
              tail -n 20 evidence.log
              if [ "$DX_TASK" = coverage ]; then
                grep -E 'coverage sources|coverage_sources_incomplete' evidence.log | tail -n 40
              fi
            fi
            if [ -f "$RUNNER_TEMP/evidence/android-versions.txt" ]; then
              printf '\n```\n'
              cat "$RUNNER_TEMP/evidence/android-versions.txt"
              printf '```\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
