name: evidence

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Space-separated Bazel target patterns such as //cli/cli/... or //pkg:target."
        required: true
      task:
        description: "One of test or build."
        required: false
        default: "test"
      platforms:
        description: 'JSON array of platform labels (e.g. ["windows_x86_64"]).'
        required: false
        default: '["linux_x86_64"]'
      test_timeout:
        description: "Seconds each test may run (test task only)."
        required: false
        default: "600"
      displays:
        description: "Linux only: xcb, wayland or xcb,wayland. Starts Xvfb and a headless Weston and sets DX_QT_DISPLAYS."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  BAZELISK_VERSION: "1.29.0"
  MSYS2_ARG_CONV_EXCL: "//"

jobs:
  validate:
    name: validate evidence inputs
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.inputs.outputs.platforms }}
      runners: ${{ steps.inputs.outputs.runners }}
      scope: ${{ steps.inputs.outputs.scope }}
      task: ${{ steps.inputs.outputs.task }}
      test_timeout: ${{ steps.inputs.outputs.test_timeout }}
    steps:
      - name: Validate workflow inputs
        id: inputs
        env:
          DX_SCOPE: ${{ inputs.scope }}
          DX_TASK: ${{ inputs.task }}
          DX_PLATFORMS: ${{ inputs.platforms }}
          DX_DISPLAYS: ${{ inputs.displays }}
          DX_TEST_TIMEOUT: ${{ inputs.test_timeout }}
        run: |
          python3 - <<'DX_EVIDENCE_INPUTS'
          """Reads the dispatch inputs, rejects a bad one naming the accepted values."""
          import json
          import os
          import re
          import sys

          PLATFORMS = {
              "linux_x86_64": "ubuntu-latest",
              "linux_arm64": "ubuntu-24.04-arm",
              "macos_arm64": "macos-15",
              "windows_x86_64": "windows-latest",
              "windows_arm64": "windows-11-arm",
          }
          TASKS = ("test", "build")
          DISPLAYS = ("", "xcb", "wayland", "xcb,wayland", "wayland,xcb")
          PATTERN = re.compile(r"//[A-Za-z0-9_.+@=,~/-]*(?::(?:\*|[A-Za-z0-9_.+@=,~/-]+))?")
          TIMEOUT = re.compile(r"[0-9]+")

          def fail(message):
              print(f"evidence input rejected: {message}")
              return 1

          def json_type(value):
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "boolean"
              if isinstance(value, (int, float)):
                  return "number"
              if isinstance(value, str):
                  return "string"
              if isinstance(value, list):
                  return "array"
              return "object"

          def main():
              patterns = os.environ.get("DX_SCOPE", "").split()
              if not patterns:
                  return fail("scope must name at least one target pattern")
              for pattern in patterns:
                  if PATTERN.fullmatch(pattern) is None:
                      return fail(
                          f"scope holds {pattern!r}, which is not a target pattern; "
                          "write patterns such as //pkg/... or //pkg:target"
                      )
              scope = " ".join(patterns)
              task = os.environ.get("DX_TASK", "")
              if task not in TASKS:
                  return fail(f"task must be one of {list(TASKS)}, got {task!r}")
              try:
                  platforms = json.loads(os.environ.get("DX_PLATFORMS", ""))
              except ValueError:
                  return fail("platforms must be a JSON array")
              if not isinstance(platforms, list):
                  return fail(f"platforms must be a JSON array, got a JSON {json_type(platforms)}")
              if not platforms:
                  return fail("platforms must be a non-empty JSON array")
              for platform in platforms:
                  if not isinstance(platform, str):
                      return fail(f"platforms must hold strings, got a JSON {json_type(platform)}")
              unknown = [p for p in platforms if p not in PLATFORMS]
              if unknown:
                  return fail(f"unknown platforms {unknown}; accepted {sorted(PLATFORMS)}")
              for platform in platforms:
                  if platforms.count(platform) > 1:
                      return fail(f"platforms lists {platform!r} twice; list each platform once")
              displays = os.environ.get("DX_DISPLAYS", "")
              if displays not in DISPLAYS:
                  return fail(f"displays must be one of {list(DISPLAYS[1:])}, got {displays!r}")
              test_timeout = os.environ.get("DX_TEST_TIMEOUT", "")
              if TIMEOUT.fullmatch(test_timeout) is None:
                  return fail(f"test_timeout must be whole seconds, got {test_timeout!r}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
                  handle.write(f"scope={scope}\n")
                  handle.write(f"task={task}\n")
                  handle.write(f"platforms={json.dumps(platforms)}\n")
                  handle.write(f"runners={json.dumps(PLATFORMS)}\n")
                  handle.write(f"test_timeout={test_timeout}\n")
              print(f"evidence inputs accepted: {task} {scope} on {platforms}")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          DX_EVIDENCE_INPUTS

  evidence:
    name: evidence (${{ matrix.platform }})
    needs: [validate]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.platforms) }}
    runs-on: ${{ fromJSON(needs.validate.outputs.runners)[matrix.platform] }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: false
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Start virtual displays
        if: ${{ inputs.displays != '' && startsWith(matrix.platform, 'linux') }}
        env:
          DX_DISPLAYS: ${{ inputs.displays }}
        run: |
          set -eu
          case "$DX_DISPLAYS" in
            xcb|wayland|xcb,wayland|wayland,xcb) ;;
            *) echo "displays must be xcb, wayland or xcb,wayland, got '$DX_DISPLAYS'"; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y xvfb weston
          runtime="$RUNNER_TEMP/xdg"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "DX_QT_DISPLAYS=$DX_DISPLAYS" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          case ",$DX_DISPLAYS," in
            *,xcb,*)
              Xvfb :99 -screen 0 1280x720x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              sleep 3
              ;;
          esac
          case ",$DX_DISPLAYS," in
            *,wayland,*)
              XDG_RUNTIME_DIR="$runtime" weston --backend=headless --socket=wayland-dx --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
              echo "WAYLAND_DISPLAY=wayland-dx" >> "$GITHUB_ENV"
              for _ in $(seq 1 20); do
                [ -S "$runtime/wayland-dx" ] && break
                sleep 1
              done
              [ -S "$runtime/wayland-dx" ] || { cat "$RUNNER_TEMP/weston.log"; exit 1; }
              ;;
          esac
      - name: Run evidence task
        env:
          DX_SCOPE: ${{ needs.validate.outputs.scope }}
          DX_TASK: ${{ needs.validate.outputs.task }}
          DX_TEST_TIMEOUT: ${{ needs.validate.outputs.test_timeout }}
        run: |
          set -o pipefail
          read -ra patterns <<< "$DX_SCOPE"
          if [ "$DX_TASK" = "build" ]; then
            bazel build --noshow_progress "${patterns[@]}" 2>&1 | tee evidence.log
          else
            bazel test --noshow_progress --test_output=errors --test_timeout="$DX_TEST_TIMEOUT" "${patterns[@]}" 2>&1 | tee evidence.log
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.platform }}
          path: evidence.log
          retention-days: 7
      - name: Write job summary
        if: always()
        env:
          DX_PLATFORM: ${{ matrix.platform }}
          DX_TASK: ${{ needs.validate.outputs.task }}
          DX_SCOPE: ${{ needs.validate.outputs.scope }}
          DX_DISPLAYS: ${{ inputs.displays }}
        run: |
          {
            printf '## Evidence %s\n\n' "$DX_PLATFORM"
            printf "Task \`%s\` on \`%s\`.\n" "$DX_TASK" "$DX_SCOPE"
            printf "Commit \`%s\`, displays \`%s\`.\n" "$GITHUB_SHA" "$DX_DISPLAYS"
            if [ -f evidence.log ]; then
              tail -n 20 evidence.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"
