name: gate

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

concurrency:
  group: gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Raise the Bazel server heap
        run: |
          # A hosted runner runs one job, so the server can take half the memory.
          echo 'startup --host_jvm_args=-XX:MaxRAMPercentage=50' >> user.bazelrc
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name != 'pull_request' }}
      - uses: ./.github/actions/gate
