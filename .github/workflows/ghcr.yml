name: ghcr-prebuilt

on:
  pull_request:
    paths:
      - ".devcontainer/Dockerfile.prebuilt"
      - ".github/workflows/ghcr.yml"
      - ".devcontainer/devcontainer.json"
  workflow_dispatch:
    inputs:
      approve:
        description: "Owner approval to push the prebuilt image to GHCR. False builds and reports only; nothing pushes either way until standing approval exists."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ghcr-prebuilt-${{ github.ref }}
  cancel-in-progress: false

env:
  BAZELISK_VERSION: "1.29.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Build prebuilt image (no push on PR)
        run: |
          set -euo pipefail
          # Tag tracks the single-version dx == module pin.
          docker build \
            -f .devcontainer/Dockerfile.prebuilt \
            -t "ghcr.io/${{ github.repository }}/devcontainer:0.0.0-ci-${{ github.sha }}" \
            .
          docker images "ghcr.io/${{ github.repository }}/devcontainer" --digests
      - name: Verify admissibility (pinned bootstrap, Bazel delegation, no ambient tools)
        run: |
          set -euo pipefail
          bazel run //deploy/release:devcontainer_check -- .devcontainer/Dockerfile.prebuilt
      - name: Push to GHCR (owner approval only)
        env:
          APPROVE: ${{ inputs.approve }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "$APPROVE" != "true" ]]; then
            echo "push gate: event=${{ github.event_name }} approve=$APPROVE -> build-only, nothing pushes."
            echo "first push (dispatch + approve:true) publishes ghcr.io/${{ github.repository }}/devcontainer:0.0.0-sha-${{ github.sha }} (single-version dx == module 0.0.0); scaffold digest ref + cosign sign + quota record follow (#311 signing-second)."
            echo "signing dry-run (RELEASE_SIGN_DRY_RUN=1 equivalent, signs nothing): cosign sign <digest> on the #311 trust root (https://tuf-repo-cdn.sigstore.dev) plus gh attestation create, same selection as //deploy/release:signing_demo."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Tag carries the single-version dx == module pin plus sha.
          tag="ghcr.io/${{ github.repository }}/devcontainer:0.0.0-sha-${{ github.sha }}"
          docker build -f .devcontainer/Dockerfile.prebuilt -t "$tag" .
          docker push "$tag"
          echo "pushed: $tag"
          docker inspect --format='{{index .RepoDigests 0}}' "$tag" || true
          ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag" || echo '')"
          digest="$(echo "$ref" | cut -d'@' -f2 || echo '<digest>')"
          if [[ -z "$ref" || "$ref" == "<digest>" || "$digest" == "<digest>" ]]; then
            echo "push: could not resolve RepoDigest for $tag; scaffold update needs the digest from 'docker images --digests' or the GHCR package page" >&2
            ref="$tag@$digest"
          fi
          echo "digest pin (never latest): $ref"
          # Pinned cosign fetch; cosign_checksums.txt is a cross-check only.
          COSIGN_VERSION="v2.4.1"
          COSIGN_SHA256_LINUX_AMD64="8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b"
          curl --version | tee /tmp/curl-version.txt
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 -o /tmp/cosign_checksums "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          bazel run //deploy/release:cosign_fetch_check -- /tmp/cosign /tmp/cosign_checksums /tmp/curl-version.txt "$COSIGN_VERSION" "$COSIGN_SHA256_LINUX_AMD64"
          install -m755 /tmp/cosign /tmp/cosign-bin
          rm /tmp/cosign /tmp/cosign_checksums /tmp/curl-version.txt
          echo "signing: cosign sign <digest> on the #311 trust root (https://tuf-repo-cdn.sigstore.dev) for $ref plus gh attestation create (owner-approved human-run path)."
          /tmp/cosign-bin sign --yes --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref"
          /tmp/cosign-bin verify --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref"
          if command -v gh >/dev/null 2>&1; then
            gh attestation create "$ref" --repo "${{ github.repository }}" || echo "attestation: gh attestation create needs an OCI subject; verify via 'gh attestation verify oci://$ref --owner ${{ github.repository_owner }}' after the push."
          fi
          echo "verify: cosign verify $ref plus gh attestation verify oci://$ref --owner ${{ github.repository_owner }} on the #311 trust root."
          {
            echo "## GHCR prebuilt push"
            echo ""
            echo "- tag: \`$tag\` (single-version dx == module 0.0.0 plus sha)"
            echo "- digest pin (never latest): \`$ref\`"
            echo "- signed: \`cosign sign <digest>\` on the #311 trust root (https://tuf-repo-cdn.sigstore.dev) plus verified (\`cosign verify\` / \`gh attestation verify\`), same as //deploy/release:signing_demo."
            echo "- scaffold update: set \`.devcontainer/devcontainer.json\` \`\"image\": \"$ref\"\` (digest pin, never latest) plus \`cli/adopt/src/scaffold.rs\` \`DEVCONTAINER_JSON\`, then \`bazel test //.devcontainer:devcontainer_parity_test\`."
            echo "- quota: image size from \`docker images --digests\`; container storage/bandwidth currently free for public repos (1-month notice before pricing changes); record exact bytes here on first push."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write job summary (build-only by default)
        if: always()
        run: |
          {
            echo "### ghcr-prebuilt — ${{ job.status }}"
            echo ""
            echo "- base: \`ubuntu:24.04@sha256:69cecf4...\` (pinned digest, resolved 2026-09-17; re-pin deliberately)."
            echo "- Bazel: Bazelisk v1.29.0 (pinned sha256) + Bazel 9.2.0 via USE_BAZEL_VERSION; no ambient toolchains."
            echo "- tag: \`0.0.0-sha-<sha>\` tracks single-version dx == module (0.0.0); digest pin \`ghcr.io/...@sha256:<digest>\` never latest."
            echo "- push: only on workflow_dispatch + approve:true (explicit owner approval); PRs build only."
            echo "- signing: dry-run would-sign \`cosign sign <digest>\` on the #311 trust root plus attestation (same as //deploy/release:signing_demo); gated push signs + verifies (\`cosign sign --yes\` / \`cosign verify\` / \`gh attestation\`) with id-token OIDC."
            echo "- follow-ups on first push (issue #460): scaffold digest ref, signed digest verify, quota bytes record."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prove checkout left clean
        run: test -z "$(git status --porcelain)"
