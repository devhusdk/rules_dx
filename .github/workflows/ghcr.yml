name: ghcr-prebuilt

on:
  pull_request:
    paths:
      - ".devcontainer/Dockerfile.prebuilt"
      - ".github/workflows/ghcr.yml"
      - ".devcontainer/devcontainer.json"
  workflow_dispatch:
    inputs:
      approve:
        description: "Owner approval to push the prebuilt image to GHCR. False builds and reports only; nothing pushes either way until standing approval exists."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ghcr-prebuilt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build prebuilt image (no push on PR)
        run: |
          set -euo pipefail
          # Tag tracks the single-version dx == module pin.
          docker build \
            -f .devcontainer/Dockerfile.prebuilt \
            -t "ghcr.io/${{ github.repository }}/devcontainer:0.0.0-ci-${{ github.sha }}" \
            .
          docker images "ghcr.io/${{ github.repository }}/devcontainer" --digests
      - name: Verify admissibility (pinned bootstrap, Bazel delegation, no ambient tools)
        run: |
          set -euo pipefail
          df=".devcontainer/Dockerfile.prebuilt"
          grep -qE '^FROM [^ ]+@sha256:[0-9a-f]{64}' "$df" \
            || { echo "admissibility: FROM must be digest-pinned (@sha256:), never latest/bare tag"; exit 1; }
          ! grep -qiE 'FROM [^ ]+:latest([ @]|$)' "$df" \
            || { echo "admissibility: :latest is rejected by the pinned-bootstrap gate"; exit 1; }
          grep -q "bazelisk-linux-amd64" "$df" \
            || { echo "admissibility: pre-installed Bazelisk (Bazel delegation) required"; exit 1; }
          grep -q "sha256sum -c" "$df" \
            || { echo "admissibility: Bazelisk fetch must be sha256-checked (pinned bootstrap)"; exit 1; }
          # No ambient language toolchains; tools resolve via Bazel.
          ! grep -qiE 'pip install|uv pip|npm install -g|pnpm add -g|cargo install|dotnet tool install|go install' "$df" \
            || { echo "admissibility: language toolchains must not be baked in"; exit 1; }
          echo "admissibility: pinned bootstrap + Bazel delegation + no ambient tools"
      - name: Write job summary (build-only by default)
        if: always()
        run: |
          {
            echo "### ghcr-prebuilt — ${{ job.status }}"
            echo ""
            echo "- base: \`ubuntu:24.04@sha256:69cecf4...\` (pinned digest, resolved 2026-09-17; re-pin deliberately)."
            echo "- Bazel: Bazelisk v1.29.0 (pinned sha256) + Bazel 9.2.0 via USE_BAZEL_VERSION; no ambient toolchains."
            echo "- tag: \`0.0.0-sha-<sha>\` tracks single-version dx == module (0.0.0); digest pin \`ghcr.io/...@sha256:<digest>\` never latest."
            echo "- push: only on workflow_dispatch + approve:true (explicit owner approval); PRs build only."
            echo "- signing: dry-run would-sign \`cosign sign <digest>\` on the #311 trust root plus attestation (same as //deploy/release:signing_demo); gated push signs + verifies (\`cosign sign --yes\` / \`cosign verify\` / actions/attest provenance + \`gh attestation verify\`) with id-token OIDC."
            echo "- follow-ups on first push (issue #460): scaffold digest ref, signed digest verify, quota bytes record."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prove checkout left clean
        run: test -z "$(git status --porcelain)"
  push:
    # Separate job so the pull_request build never holds a write scope.
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.approve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Push to GHCR (owner approval only)
        id: push
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Tag carries the single-version dx == module pin plus sha.
          tag="ghcr.io/${{ github.repository }}/devcontainer:0.0.0-sha-${{ github.sha }}"
          docker build -f .devcontainer/Dockerfile.prebuilt -t "$tag" .
          docker push "$tag"
          echo "pushed: $tag"
          name="ghcr.io/${{ github.repository }}/devcontainer"
          ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")"
          digest="${ref#*@}"
          if [[ "$ref" != "$name@"* || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "push: could not resolve RepoDigest for $tag (got '$ref')" >&2
            exit 1
          fi
          {
            echo "name=$name"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          echo "digest pin (never latest): $ref"
          COSIGN_VERSION="$(sed -n 's/^COSIGN_VERSION = "\(.*\)"$/\1/p' deploy/release/cosign_pins.bzl)"
          COSIGN_SHA256_LINUX_AMD64="$(sed -n 's/^COSIGN_SHA256_LINUX_AMD64 = "\(.*\)"$/\1/p' deploy/release/cosign_pins.bzl)"
          if [[ -z "$COSIGN_VERSION" || -z "$COSIGN_SHA256_LINUX_AMD64" ]]; then
            echo "cosign: pins missing from deploy/release/cosign_pins.bzl" >&2
            exit 1
          fi
          curl --version
          curl --version | head -n 1 | grep -qE '^curl ([7-9]|[1-9][0-9])\.'
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 -o /tmp/cosign_checksums "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          echo "${COSIGN_SHA256_LINUX_AMD64}  /tmp/cosign" | sha256sum -c -
          (cd /tmp && grep -F "cosign-linux-amd64" cosign_checksums | sha256sum -c -)
          install -m755 /tmp/cosign /tmp/cosign-bin
          rm /tmp/cosign /tmp/cosign_checksums
          echo "signing: cosign sign <digest> on the #311 trust root (https://tuf-repo-cdn.sigstore.dev) for $ref plus actions/attest provenance + gh attestation verify (owner-approved human-run path)."
          /tmp/cosign-bin sign --yes --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref"
          /tmp/cosign-bin verify --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref"
          echo "verify: cosign verify $ref; actions/attest provenance + gh attestation verify oci://$ref --owner ${{ github.repository_owner }} follow."
          {
            echo "## GHCR prebuilt push"
            echo ""
            echo "- tag: \`$tag\` (single-version dx == module 0.0.0 plus sha)"
            echo "- digest pin (never latest): \`$ref\`"
            echo "- signed: \`cosign sign <digest>\` on the #311 trust root (https://tuf-repo-cdn.sigstore.dev) plus verified (\`cosign verify\` / actions/attest provenance + \`gh attestation verify\`), same as //deploy/release:signing_demo."
            echo "- scaffold update: set \`.devcontainer/devcontainer.json\` \`\"image\": \"$ref\"\` (digest pin, never latest) plus \`cli/adopt/src/scaffold.rs\` \`DEVCONTAINER_JSON\`, then \`bazel test //.devcontainer:devcontainer_parity_test\`."
            echo "- quota: image size from \`docker images --digests\`; container storage/bandwidth currently free for public repos (1-month notice before pricing changes); record exact bytes here on first push."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ steps.push.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$SUBJECT" --owner "${{ github.repository_owner }}"
