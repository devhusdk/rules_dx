name: issue-labels

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  unlabelled-issues:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Warn about open issues without a priority label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --state open --limit 1000 --json number,title,labels,createdAt,isPinned \
            --jq '.[] | select(.createdAt < "'"$cutoff"'") | select(.isPinned | not) | select([.labels[].name | test("^P[0-3]$")] | any | not) | "#\(.number) \(.title)"' \
            > unlabelled.txt
          count=$(wc -l < unlabelled.txt)
          {
            echo "### Open issues without P0 to P3 (created before $cutoff): $count"
            echo
            if [ "$count" -gt 0 ]; then
              sed 's/^/- /' unlabelled.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::warning title=Unlabelled issue::$line needs a P0 to P3 label"
          done < unlabelled.txt

  missing-labels:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Warn about documented labels missing from the repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo bug enhancement needs-host tracking dogfood P0 P1 P2 P3 | tr ' ' '\n'
            for f in .github/ISSUE_TEMPLATE/*.md; do
              awk '/^---$/ { n++; next } n == 1 && /^labels:/ { sub(/^labels:/, ""); print; f = 1; next } n == 1 && f && /^[[:space:]]*-/ { sub(/^[[:space:]]*-/, ""); print; next } n == 1 { f = 0 }' "$f" |
                tr ',' '\n' | tr -d "[]\"' " | sed '/^$/d'
            done
          } | sort -u > wanted.txt
          gh label list --limit 500 --json name --jq '.[].name' | sort -u > present.txt
          grep -vxFf present.txt wanted.txt > missing.txt || true
          while IFS= read -r name; do
            echo "::warning title=Missing label::label $name is documented or used by an issue template but does not exist"
          done < missing.txt

  blocked-issues:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check that blocked issues name a blocker, and unblock closed ones
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- blocked-on-missing -->'
          for n in $(gh issue list --label blocked --state open --limit 1000 --json number --jq '.[].number'); do
            body=$(gh issue view "$n" --json body --jq .body)
            line=$(printf '%s\n' "$body" | tr -d '\r' | grep -m1 -i '^Blocked on:' || true)
            if [ -z "$line" ]; then
              echo "::warning title=Blocked without blocker::#$n has the blocked label but no 'Blocked on:' line"
              if ! gh issue view "$n" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
                gh issue comment "$n" --body "$marker
          This issue has the \`blocked\` label but no \`Blocked on:\` line in its body. Add one naming the blocking issue (\`#N\`), a pull request URL, or the owner action. See CONTRIBUTING.md."
              fi
              continue
            fi
            refs=$(printf '%s\n' "$line" | grep -oE "https://github\.com/${GH_REPO}/pull/[0-9]+|#[0-9]+" || true)
            [ -n "$refs" ] || continue
            done_all=true
            for ref in $refs; do
              num=${ref##*[#/]}
              case "$ref" in
                http*) state=$(gh pr view "$num" --json state --jq .state 2>/dev/null || echo UNKNOWN); want=MERGED ;;
                *) state=$(gh issue view "$num" --json state --jq .state 2>/dev/null || echo UNKNOWN); want=CLOSED ;;
              esac
              [ "$state" = "$want" ] || done_all=false
            done
            if [ "$done_all" = true ]; then
              gh issue comment "$n" --body "Unblocked: $(echo $refs | sed 's/ /, /g') closed"
              gh issue edit "$n" --remove-label blocked
            fi
          done
