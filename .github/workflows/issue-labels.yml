name: issue-labels

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  unlabelled-issues:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Warn about open issues without a priority label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --state open --limit 1000 --json number,title,labels,createdAt \
            --jq '.[] | select(.createdAt < "'"$cutoff"'") | select([.labels[].name | test("^P[0-3]$")] | any | not) | "#\(.number) \(.title)"' \
            > unlabelled.txt
          count=$(wc -l < unlabelled.txt)
          {
            echo "### Open issues without P0 to P3 (created before $cutoff): $count"
            echo
            if [ "$count" -gt 0 ]; then
              sed 's/^/- /' unlabelled.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::warning title=Unlabelled issue::$line needs a P0 to P3 label"
          done < unlabelled.txt
