name: license-terms

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: license-terms
  cancel-in-progress: false

jobs:
  terms:
    name: license terms match their pinned hash
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Hash the terms and track changes in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          title="licenses: terms changed upstream"
          report=$(python3 -I tools/licenses/terms_check.py core/licenses/pins.json)
          status=$?
          printf '%s\n' "$report"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi
          body="The scheduled terms check found terms that no longer match core/licenses/pins.json: $RUN_URL"$'\n\n'"$report"$'\n\n'"Read the new terms, then set the new terms_sha256 in core/licenses/pins.json so acceptances of the old terms ask users to re-accept."
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
