name: lock-refresh-command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: lock-refresh-command-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: dispatch lock-refresh
    if: ${{ github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/lock-refresh') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    timeout-minutes: 5
    runs-on: ubuntu-slim
    steps:
      - name: Dispatch lock-refresh.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DX_BODY: ${{ github.event.comment.body }}
          DX_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          reply() { gh pr comment "$DX_NUMBER" --body "$1"; }
          line=$(printf '%s\n' "$DX_BODY" | head -n 1 | tr -d '\r')
          case "$line" in
            /lock-refresh | "/lock-refresh "*) ;;
            *) exit 0 ;;
          esac
          nested=false
          for token in ${line#/lock-refresh}; do
            case "$token" in
              nested=true | nested=false) nested=${token#nested=} ;;
              *)
                reply "/lock-refresh could not read '$token'. Use nested=true or nested=false."
                exit 1
                ;;
            esac
          done
          head=$(gh pr view "$DX_NUMBER" --json headRefName,isCrossRepository --jq 'if .isCrossRepository then "" else .headRefName end')
          if [ -z "$head" ]; then
            reply "/lock-refresh needs a pull request branch in this repository."
            exit 1
          fi
          echo "pr=$DX_NUMBER ref=$head nested=$nested"
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if ! gh workflow run lock-refresh.yml --ref "$head" -f "pr=$DX_NUMBER" -f "nested=$nested"; then
            reply "/lock-refresh could not dispatch lock-refresh.yml on $head."
            exit 1
          fi
          url=
          for _ in 1 2 3 4 5 6; do
            sleep 5
            url=$(gh run list --workflow lock-refresh.yml --branch "$head" --event workflow_dispatch --json url,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")] | last | .url // empty")
            [ -z "$url" ] || break
          done
          reply "Lock refresh (nested=$nested) started on \`$head\`: ${url:-https://github.com/$GH_REPO/actions/workflows/lock-refresh.yml}"
