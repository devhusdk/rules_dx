name: lock-refresh

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose branch gets the merged MODULE.bazel.lock pushed. Dispatch with --ref set to that branch.
        required: false
        default: ""
      nested:
        description: Also re-record the nested cache sets in tools/testing/nested_cache on linux_x86_64, macos_arm64 and windows_x86_64.
        type: boolean
        required: false
        default: false
      android_maven:
        description: Also re-resolve third_party/jvm/rules_android_maven_install.json with REPIN=1 on linux_x86_64.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform:
    name: lock (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: macos_arm64
            runner: macos-15
          - platform: windows_x86_64
            runner: windows-latest
          - platform: windows_arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Lock this platform's extensions
        run: bazel fetch --noshow_progress --lockfile_mode=update --repo=@pythons_hub --repo=@@rules_go++go_sdk+go_toolchains
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lock-${{ matrix.platform }}
          path: MODULE.bazel.lock
          if-no-files-found: error

  nested:
    name: nested record (${{ matrix.platform }})
    if: inputs.nested
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x86_64
            runner: ubuntu-latest
            targets: //tools/testing:nested_bazel_harness_test //examples/adopt-polyglot:consumer_test //deploy/private/release/tests:release_consumer_smoke_test
          - platform: macos_arm64
            runner: macos-15
            targets: //tools/testing:nested_bazel_harness_test //examples/adopt-polyglot:consumer_test //deploy/private/release/tests:release_consumer_smoke_test //apple/tests:consumer_build_test
          - platform: windows_x86_64
            runner: windows-latest
            targets: //tools/testing:nested_bazel_harness_test //examples/adopt-polyglot:consumer_test //deploy/private/release/tests:release_consumer_smoke_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Record the nested cache sets
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<< "$TARGETS"
          bazel test --noshow_progress --test_env=DX_NESTED_BAZEL_NETWORK=1 --nocache_test_results --nozip_undeclared_test_outputs --test_output=errors --test_timeout=3000 --test_tag_filters= --build_tag_filters= "--test_env=DX_HERMETIC_BAZELISK=$(command -v bazel)" "${targets[@]}"
      - name: Collect the records
        if: ${{ !cancelled() }}
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<< "$TARGETS"
          out="$RUNNER_TEMP/nested"
          for label in "${targets[@]}"; do
            rel="${label#//}"
            rel="${rel/://}"
            shards=(bazel-testlogs/"$rel"/shard_*/test.outputs/nested_cache)
            if [ -d "${shards[0]}" ]; then
              for dir in "${shards[@]}"; do
                shard="${dir%/test.outputs/nested_cache}"
                mkdir -p "$out/$rel/${shard##*/}"
                cp -RL "$dir/." "$out/$rel/${shard##*/}/"
              done
            elif [ -d "bazel-testlogs/$rel/test.outputs/nested_cache" ]; then
              mkdir -p "$out/$rel"
              cp -RL "bazel-testlogs/$rel/test.outputs/nested_cache/." "$out/$rel/"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: nested-${{ matrix.platform }}
          path: ${{ runner.temp }}/nested
          if-no-files-found: error

  android-maven:
    name: android maven pin
    if: inputs.android_maven
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Pin
        run: REPIN=1 bazel run --noshow_progress @rules_android_maven//:pin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-maven
          path: third_party/jvm/rules_android_maven_install.json
          if-no-files-found: error

  merge:
    name: merge the platform entries
    needs: [platform, nested, android-maven]
    if: ${{ !cancelled() && needs.platform.result == 'success' && (needs.nested.result == 'success' || needs.nested.result == 'skipped') && (needs.android-maven.result == 'success' || needs.android-maven.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_APP: ${{ secrets.DX_UPDATE_APP_ID != '' && secrets.DX_UPDATE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: inputs.pr != '' && env.HAS_APP == 'true'
        with:
          app-id: ${{ secrets.DX_UPDATE_APP_ID }}
          private-key: ${{ secrets.DX_UPDATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lock-*
          path: ${{ runner.temp }}/locks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.nested
        with:
          pattern: nested-*
          path: ${{ runner.temp }}/nested
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.android_maven
        with:
          name: android-maven
          path: third_party/jvm
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Merge
        env:
          LOCKS: ${{ runner.temp }}/locks
        run: |
          bazel build --noshow_progress //tools/ci/producers:producers_bin
          "$(bazel info bazel-bin)/tools/ci/producers/producers_bin" --lock-merge "$LOCKS" MODULE.bazel.lock
      - name: Normalise
        run: bazel mod deps --noshow_progress --lockfile_mode=update
      - name: Merge the nested records
        if: inputs.nested
        env:
          NESTED: ${{ runner.temp }}/nested
        run: |
          set -euo pipefail
          dirs=()
          while IFS= read -r dir; do
            dirs+=("$dir")
          done < <(find "$NESTED" -type f -exec dirname {} \; | sort -u)
          test "${#dirs[@]}" -gt 0
          bazel run --noshow_progress //tools/testing:nested_cache_update -- --from "${dirs[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MODULE.bazel.lock
          path: |
            MODULE.bazel.lock
            tools/testing/nested_cache/*.txt
            tools/testing/nested_cache/*.MODULE.bazel.lock
            third_party/jvm/rules_android_maven_install.json
          if-no-files-found: error
      - name: Push to the pull request
        if: inputs.pr != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- MODULE.bazel.lock tools/testing/nested_cache third_party/jvm/rules_android_maven_install.json)" ]; then
            echo "The locks are unchanged"
            exit 0
          fi
          head="$(gh pr view "$PR" --json headRefName --jq .headRefName)"
          if [ "$head" != "$GITHUB_REF_NAME" ]; then
            echo "pull request $PR is on $head, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- MODULE.bazel.lock tools/testing/nested_cache third_party/jvm/rules_android_maven_install.json
          git commit -m "lock: refresh the per-platform extension entries, the nested cache sets and the android maven pin"
          git push origin "HEAD:refs/heads/$head"
