name: patch-upstream

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: patch-upstream
  cancel-in-progress: false

env:
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && '--config=ci' || '' }}
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

jobs:
  patch-upstream:
    name: patches whose upstream fix is released
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Check each patch's Upstream header
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run --noshow_progress "$@" //patches:upstream > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # One open issue carries the latest report; it is edited, not duplicated.
          title="patches: upstream fixes released"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ ! -s report.md ]; then
            echo "Every patch's and carry's upstream fix is still unreleased."
            exit 0
          fi
          {
            echo "The weekly \`patch-upstream\` run found patches under \`patches/\` or carries that need a person. See [patches/README.md]($GITHUB_SERVER_URL/$GH_REPO/blob/main/patches/README.md) for how to drop a patch or carry."
            echo
            cat report.md
          } > body.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --label P2 --body-file body.md
          fi
