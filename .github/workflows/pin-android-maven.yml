name: pin-android-maven

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pin-android-maven
  cancel-in-progress: false

jobs:
  pin:
    name: resolve the rules_android_maven lock on a runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: Pin
        run: REPIN=1 bazel run --noshow_progress @rules_android_maven//:pin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rules_android_maven_install
          path: |
            third_party/jvm/rules_android_maven_install.json
          if-no-files-found: error
