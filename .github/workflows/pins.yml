name: pins

on:
  pull_request:
    paths:
      - "cli/prebuilt/pins.bzl"
      - ".github/workflows/pins.yml"

permissions:
  contents: read

jobs:
  attested:
    name: pins.bzl equals the attested manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Check the pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^DX_VERSION = "\(.*\)"$/\1/p' cli/prebuilt/pins.bzl)"
          bazel run //tools/ci:fill_pins_bin -- "v$version" --check
