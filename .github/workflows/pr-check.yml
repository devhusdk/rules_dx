name: pr-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && '--config=ci' || '' }}
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis (PR-time checks on linux_x86_64)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: workflow
        run: |
          # shellcheck disable=SC2086
          tools/ci/pr_check.sh workflow $BAZEL_CONFIG $BB_ARGS
      - name: preflight
        run: |
          # shellcheck disable=SC2086
          tools/ci/pr_check.sh preflight $BAZEL_CONFIG $BB_ARGS
      - name: preflight-windows-arm64
        run: |
          # shellcheck disable=SC2086
          tools/ci/pr_check.sh preflight-windows-arm64 $BAZEL_CONFIG $BB_ARGS
      - name: starter
        run: |
          # shellcheck disable=SC2086
          tools/ci/pr_check.sh starter $BAZEL_CONFIG $BB_ARGS
      - name: hermetic
        run: |
          # shellcheck disable=SC2086
          tools/ci/pr_check.sh hermetic $BAZEL_CONFIG $BB_ARGS
      - name: docs
        run: |
          # shellcheck disable=SC2086
          tools/ci/pr_check.sh docs $BAZEL_CONFIG $BB_ARGS
      - name: families
        run: |
          # shellcheck disable=SC2086
          tools/ci/pr_check.sh families $BAZEL_CONFIG $BB_ARGS
      - name: cli
        run: |
          # shellcheck disable=SC2086
          tools/ci/pr_check.sh cli $BAZEL_CONFIG $BB_ARGS
      - name: affected tests
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        timeout-minutes: 18
        run: |
          if [ -z "$BUILDBUDDY_API_KEY" ]; then
            echo "::notice::affected tests skipped: no remote cache secret on this PR"
            exit 0
          fi
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS --test_tag_filters=-resources:nested_bazel:1,-starter-consumer,-network-consumer
          log="${RUNNER_TEMP:-/tmp}/affected-tests.log"
          set -o pipefail
          status=0
          timeout 480 tools/dx test --affected --since 'HEAD^1' -- "$@" 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ] && grep -qE '^(WARNING|ERROR): .*[Rr]emote([ _][Cc]ache| [Ee]xecution)' "$log"; then
            echo "::warning::remote cache failed; retrying without it"
            timeout 480 tools/dx test --affected --since 'HEAD^1' -- "$@" --remote_cache= --noremote_accept_cached
          else
            exit "$status"
          fi
