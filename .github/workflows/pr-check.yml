name: pr-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && '--config=ci' || '' }}
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis (PR-time checks on linux_x86_64)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: pr-check tool
        run: |
          # shellcheck disable=SC2086
          bazel build --noshow_progress $BAZEL_CONFIG $BB_ARGS //tools/ci/producers:producers_bin
          mkdir -p "$RUNNER_TEMP/pr-check"
          # shellcheck disable=SC2086
          cp "$(bazel info $BAZEL_CONFIG $BB_ARGS bazel-bin)/tools/ci/producers/producers_bin" "$RUNNER_TEMP/pr-check/producers_bin"
      - name: workflow
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check workflow $BAZEL_CONFIG $BB_ARGS
      - name: preflight
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check preflight $BAZEL_CONFIG $BB_ARGS
      - name: preflight-windows-arm64
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check preflight-windows-arm64 $BAZEL_CONFIG $BB_ARGS
      - name: starter
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check starter $BAZEL_CONFIG $BB_ARGS
      - name: hermetic
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check hermetic $BAZEL_CONFIG $BB_ARGS
      - name: docs
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check docs $BAZEL_CONFIG $BB_ARGS
      - name: cli
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check cli $BAZEL_CONFIG $BB_ARGS

  # Affected tests get their own runner. As the last step of `analysis` they had
  # only what the sets before them left of its 30 minutes (about 8), and a change
  # that widens to whole packages ran out of time with no failing test.
  affected:
    name: affected tests (linux_x86_64)
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: affected tests
        shell: bash
        timeout-minutes: 26
        run: |
          if [ -z "$BUILDBUDDY_API_KEY" ]; then
            echo "::notice::affected tests skipped: no remote cache secret on this PR"
            exit 0
          fi
          # One deadline covers building dx, the run and the cacheless retry, and stays under
          # the step timeout so running out of time is reported here rather than as a bare kill.
          budget=1380
          deadline=$((SECONDS + budget))
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          # tools/dx builds //:dx without the remote cache, which on a fresh runner is minutes
          # of local compiles. Build it with the cache and run a copy, as `analysis` does for
          # producers_bin; the copy keeps a test that rebuilds dx from replacing it mid-run.
          bazel build --noshow_progress "$@" //:dx
          dx="$RUNNER_TEMP/affected/dx"
          mkdir -p "${dx%/*}"
          cp "$(bazel info "$@" bazel-bin)/cli/cli/dx" "$dx"
          set -- "$@" --test_tag_filters=-resources:nested_bazel:1,-starter-consumer,-network-consumer
          log="${RUNNER_TEMP:-/tmp}/affected-tests.log"
          affected() {
            local left=$((deadline - SECONDS))
            if [ "$left" -lt 60 ]; then
              return 124
            fi
            timeout "$left" "$dx" test --affected --since 'HEAD^1' -- "$@"
          }
          set -o pipefail
          status=0
          affected "$@" 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && grep -qE '^(WARNING|ERROR): .*[Rr]emote([ _][Cc]ache| [Ee]xecution)' "$log"; then
            echo "::warning::remote cache failed; retrying without it"
            status=0
            affected "$@" --remote_cache= --experimental_remote_downloader= --noremote_accept_cached || status=$?
          fi
          if [ "$status" -eq 124 ]; then
            echo "::error::affected tests did not finish inside their ${budget}s budget. $(grep -m1 '^dx: affected: [0-9]' "$log" | cut -c1-200)"
          fi
          exit "$status"
