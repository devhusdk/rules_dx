name: pr-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && '--config=ci' || '' }}
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis (PR-time checks on linux_x86_64)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: pr-check tool
        run: |
          # shellcheck disable=SC2086
          bazel build --noshow_progress $BAZEL_CONFIG $BB_ARGS //tools/ci/producers:producers_bin
          mkdir -p "$RUNNER_TEMP/pr-check"
          # shellcheck disable=SC2086
          cp "$(bazel info $BAZEL_CONFIG $BB_ARGS bazel-bin)/tools/ci/producers/producers_bin" "$RUNNER_TEMP/pr-check/producers_bin"
      - name: workflow
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check workflow $BAZEL_CONFIG $BB_ARGS
      - name: preflight
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check preflight $BAZEL_CONFIG $BB_ARGS
      - name: preflight-windows-arm64
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check preflight-windows-arm64 $BAZEL_CONFIG $BB_ARGS
      - name: android-linux-arm64
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check android-linux-arm64 $BAZEL_CONFIG $BB_ARGS
      - name: hermetic
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check hermetic $BAZEL_CONFIG $BB_ARGS
      - name: docs
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check docs $BAZEL_CONFIG $BB_ARGS
      - name: cli
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check cli $BAZEL_CONFIG $BB_ARGS
      - name: kotlin-bench
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/pr-check/producers_bin" --pr-check kotlin-bench $BAZEL_CONFIG $BB_ARGS

  affected-plan:
    name: affected tests plan (linux_x86_64)
    if: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      labels: ${{ steps.plan.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: plan
        id: plan
        shell: bash
        run: |
          if [ -z "$BUILDBUDDY_API_KEY" ]; then
            echo "::notice::affected tests skipped: no remote cache secret on this PR"
            echo "shards=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          export DX_LAUNCHER_BAZEL_FLAGS="$* --ui_event_filters=+info"
          dx="$PWD/tools/dx"
          "$dx" --version
          mkdir -p "$RUNNER_TEMP/affected"
          plan="$RUNNER_TEMP/affected/plan.jsonl"
          planned=0
          "$dx" test --affected --since 'HEAD^1' --output=json -- --nobuild --build_tests_only --test_tag_filters=dx-affected-plan-only "$@" > "$plan" || planned=$?
          if ! jq -e 'select(.event == "command_started") | .affected.targets' "$plan" > /dev/null; then
            cat "$plan"
            echo "::error::dx printed no affected plan (exit $planned)"
            exit 1
          fi
          jq -c 'select(.event == "command_started") | .affected | {base, changed_files, widened}' "$plan"
          labels="$RUNNER_TEMP/affected/labels"
          jq -r 'select(.event == "command_started") | .affected.targets[]' "$plan" > "$labels"
          if [ ! -s "$labels" ]; then
            echo "no affected tests" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "shards=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          query="$RUNNER_TEMP/affected/query"
          # shellcheck disable=SC2016
          {
            printf 'let t = tests(set('
            tr '\n' ' ' < "$labels"
            printf '%s\n' ')) in ($t intersect //...) except attr(tags, "(\[|, )(manual|resources:nested_bazel:1|starter-consumer|network-consumer)(,|\])", $t)'
          } > "$query"
          per=150
          bazel query --noshow_progress --query_file="$query" | LC_ALL=C sort -u > "$labels"
          slices=$(jq -R . "$labels" | jq -cs --argjson per "$per" '[range(0; length; $per) as $i | .[$i:$i + $per] | join(" ")]')
          echo "$(wc -l < "$labels") affected tests in $(jq length <<< "$slices") shards" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "labels=$slices" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -c 'keys' <<< "$slices")" >> "$GITHUB_OUTPUT"
  affected:
    name: affected tests (linux_x86_64, shard ${{ matrix.shard }})
    needs: affected-plan
    if: ${{ needs.affected-plan.outputs.shards != '[]' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.affected-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: false
      - name: affected tests
        shell: bash
        timeout-minutes: 26
        env:
          SHARD: ${{ matrix.shard }}
          LABELS: ${{ fromJSON(needs.affected-plan.outputs.labels)[matrix.shard] }}
        run: |
          budget=1380
          deadline=$((SECONDS + budget))
          read -r -a targets <<< "$LABELS"
          echo "shard $SHARD: ${#targets[@]} tests, ${targets[0]} to ${targets[-1]}"
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          export DX_LAUNCHER_BAZEL_FLAGS="$* --ui_event_filters=+info"
          dx="$PWD/tools/dx"
          "$dx" --version
          log="${RUNNER_TEMP:-/tmp}/affected-tests.log"
          affected() {
            local left=$((deadline - SECONDS))
            if [ "$left" -lt 60 ]; then
              return 124
            fi
            timeout "$left" "$dx" test "${targets[@]}" -- "$@"
          }
          set -o pipefail
          status=0
          affected "$@" 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && grep -qE '^(WARNING|ERROR): .*[Rr]emote([ _][Cc]ache| [Ee]xecution)' "$log"; then
            echo "::warning::remote cache failed; retrying without it"
            status=0
            affected "$@" --remote_cache= --experimental_remote_downloader= --noremote_accept_cached || status=$?
          fi
          if [ "$status" -eq 124 ]; then
            echo "::error::shard $SHARD (${#targets[@]} tests from ${targets[0]}) did not finish inside its ${budget}s budget"
          fi
          exit "$status"
