name: publish-dry-run

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Owner approval to run the full dry-run qualification. False builds and reports only; nothing publishes either way."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-dry-run-${{ github.ref }}
  cancel-in-progress: false

env:
  BAZELISK_VERSION: "1.29.0"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Build seed-host release binary and standalone archive
        run: bazel build //cli/cli:dx //cli/cli:dx_standalone //deploy/release:all //deploy/release:release_artifacts
      - name: Stage binary and emit dry-run report
        env:
          APPROVE: ${{ inputs.approve }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/publish-dry-run"
          rm -rf "$stage"
          mkdir -p "$stage"
          bin="$(bazel cquery --output=files //cli/cli:dx)"
          cp "$bin" "$stage/dx-linux-x86_64"
          archive="$(bazel cquery --output=files //cli/cli:dx_standalone_archive)"
          cp "$archive" "$stage/dx-standalone.tar.gz"
          bazel build //deploy/release:release_artifacts --noshow_progress
          bazel cquery --output=files //deploy/release:release_artifacts > "$stage/release-artifacts.txt"
          spdx="$(bazel cquery --output=files //deploy/release:sbom_demo_spdx)"
          prov="$(bazel cquery --output=files //deploy/release:sbom_demo_provenance)"
          notice="$(bazel cquery --output=files //deploy/release:notice_demo_notice)"
          cp "$spdx" "$stage/sbom_demo.spdx.json"
          cp "$prov" "$stage/sbom_demo.provenance.json"
          cp "$notice" "$stage/notice_demo.NOTICE"
          demo_archive="$GITHUB_WORKSPACE/$(bazel cquery --output=files //deploy/rules:release_demo_archive)"
          notice_manifest="$GITHUB_WORKSPACE/$(bazel cquery --output=files //deploy/release:notice_demo_inventory.txt)"
          notice_a="$GITHUB_WORKSPACE/$(bazel cquery --output=files //deploy/release:notice_demo_a.txt)"
          notice_b="$GITHUB_WORKSPACE/$(bazel cquery --output=files //deploy/release:notice_demo_b.txt)"
          GH_RELEASE_DRY_RUN=1 bazel run //cli/cli:github_draft > "$stage/draft-dry-run.log" 2>&1
          bazel test //deploy/release:all --noshow_progress > "$stage/release-tests.log" 2>&1
          RELEASE_SIGN_DRY_RUN=1 bazel run //deploy/release:signing_demo > "$stage/signing-dry-run.log" 2>&1
          BCR_DRY_RUN=1 bazel run //deploy/release:bcr_demo > "$stage/bcr-dry-run.log" 2>&1
          bazel run //deploy/release:release_driver -- v0.0.0-dryrun > "$stage/human-run-dry-run.log" 2>&1
          {
            echo "install verifier refusal proof (no network, publishes nothing):"
            bazel run //deploy/install:dx_verify -- --help > "$stage/verify-help.txt"
            if bazel run //deploy/install:dx_verify -- --binary "$stage/dx-linux-x86_64" --sha256 deadbeef > "$stage/verify-refusal.log" 2>&1; then
              echo "expected checksum-only refusal failed" >&2
              exit 1
            fi
          }
          bazel run //deploy/release:publish_dry_run_check -- \
            --binary "$stage/dx-linux-x86_64" \
            --archive "$stage/dx-standalone.tar.gz" \
            --sbom-artifact "$demo_archive" \
            --spdx "$stage/sbom_demo.spdx.json" \
            --provenance "$stage/sbom_demo.provenance.json" \
            --notice "$stage/notice_demo.NOTICE" \
            --notice-manifest "$notice_manifest" \
            --notice-texts "$notice_a:$notice_b" \
            --release-artifacts "$stage/release-artifacts.txt" \
            --draft-log "$stage/draft-dry-run.log" \
            --signing-log "$stage/signing-dry-run.log" \
            --bcr-log "$stage/bcr-dry-run.log" \
            --human-run-log "$stage/human-run-dry-run.log" \
            --release-tests-log "$stage/release-tests.log" \
            --module-bazel "$GITHUB_WORKSPACE/MODULE.bazel" \
            --verify-refusal-log "$stage/verify-refusal.log" \
            --approve "$APPROVE" \
            --report "$stage/dry-run-report.json" \
            --binary-sha256-out "$stage/dx-linux-x86_64.sha256" \
            --archive-sha256-out "$stage/dx-standalone.tar.gz.sha256"
          {
            echo "## Publish dry-run report"
            echo ""
            echo "- approved: \`$APPROVE\`; published: **no** (dry run never publishes)"
            echo "- seed binary: \`dx-linux-x86_64\` \`$(cut -d' ' -f1 "$stage/dx-linux-x86_64.sha256")\`"
            echo "- standalone: \`dx-standalone.tar.gz\` \`$(cut -d' ' -f1 "$stage/dx-standalone.tar.gz.sha256")\`"
            echo "- draft dry-run: \`//cli/cli:github_draft\` \`GH_RELEASE_DRY_RUN=1\` ok (placeholder \`v0.0.0-dryrun\`, draft-only flags, publishes nothing)"
            echo "- packaging: \`//deploy/release:release_artifacts\` ok (audit curator plus binary plus man page plus NOTICE plus SBOM/provenance, publishes nothing)"
            echo "- SBOM: \`//deploy/release:sbom_demo\` SPDX-2.3 + SLSA v1 ok, subject digest equals artifact sha256, publishes nothing"
            echo "- NOTICE: \`//deploy/release:notice_demo\` ok (hermetic bundle, signed alongside SBOM pair, publishes nothing)"
            echo "- signing dry-run: \`//deploy/release:signing_demo\` \`RELEASE_SIGN_DRY_RUN=1\` ok (Sigstore keyless + attestation over SBOM pair plus NOTICE, publishes nothing)"
            echo "- BCR shape: \`rules_dx\` at \`0.0.0\` via \`//deploy/release:bcr_demo\` checked, not submitted"
            echo "- verifier: checksum-only refused, TUF trust root, nothing installed"
            echo "- full report: \`dry-run-report.json\` in the job logs"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prove checkout left clean
        run: test -z "$(git status --porcelain)"
