name: release-cells

on:
  workflow_call:
    outputs:
      version:
        description: "The version printed by the built dx (release_cell version)."
        value: ${{ jobs.verify.outputs.version }}
      sha:
        description: "The commit every cell was built from."
        value: ${{ jobs.verify.outputs.sha }}
      workflow_ref:
        description: "The workflow ref every record carries (job.workflow_ref of this file)."
        value: ${{ jobs.verify.outputs.workflow_ref }}
  workflow_dispatch:

permissions:
  contents: read

env:
  MSYS2_ARG_CONV_EXCL: "//"

jobs:
  cell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dx-linux-x86_64
            runner: ubuntu-latest
          - name: dx-linux-arm64
            runner: ubuntu-24.04-arm
          - name: dx-macos-arm64
            runner: macos-15
          - name: dx-windows-x86_64
            runner: windows-latest
          - name: dx-windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build the archive twice and qualify it
        env:
          CELL: ${{ matrix.name }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          JOB: ${{ github.job }}
          SHA: ${{ github.sha }}
        run: tools/ci/release_cell.sh "$RUNNER_TEMP/cell-out"
      - name: Qualify exact owned line coverage
        env:
          CELL: ${{ matrix.name }}
        run: |
          set -euo pipefail
          mkdir -p coverage-files
          status=0
          bazel run --config=dx_release //cli/cli:dx -- coverage --output=json --min-coverage 100 //... > "coverage-files/coverage-$CELL.ndjson" || status=$?
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: release-coverage-${{ matrix.name }}
          path: coverage-files/*
          if-no-files-found: warn
          retention-days: 7
      - name: Collect the cell files
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p cell-files
          cp "$RUNNER_TEMP"/cell-out/* cell-files/ || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: release-cell-${{ matrix.name }}
          path: cell-files/*
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: cell
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
      workflow_ref: ${{ steps.verify.outputs.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A cell that produced nothing is reported as "no record" by verify instead of stopping here.
        continue-on-error: true
        with:
          pattern: release-cell-*
          merge-multiple: true
          path: release-cells
      - name: Verify every cell
        id: verify
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REF" ]; then
            echo "job.workflow_ref is empty" >&2
            exit 1
          fi
          bazel build --config=dx_release //cli/cli:dx //deploy/release:release_cell //deploy/release:release_matrix
          root="$(bazel info --config=dx_release execution_root)"
          dx="$root/$(bazel cquery --config=dx_release --output=files //cli/cli:dx)"
          tool="$root/$(bazel cquery --config=dx_release --output=files //deploy/release:release_cell)"
          matrix="$root/$(bazel cquery --config=dx_release --output=files //deploy/release:release_matrix)"
          mkdir -p release-cells
          version="$("$tool" version --exe "$dx")"
          {
            echo "version=$version"
            echo "sha=$SHA"
            echo "workflow_ref=$WORKFLOW_REF"
          } >> "$GITHUB_OUTPUT"
          status=0
          "$tool" verify \
            --matrix "$matrix" \
            --records release-cells \
            --archives release-cells \
            --sha "$SHA" \
            --version "$version" \
            --workflow-ref "$WORKFLOW_REF" > release-cells/verification.txt || status=$?
          cat release-cells/verification.txt
          {
            echo "## Release cells"
            echo ""
            echo "version \`$version\`, commit \`$SHA\`"
            echo ""
            echo '```'
            cat release-cells/verification.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: release-cells
          path: release-cells/*
          if-no-files-found: error
          retention-days: 7
