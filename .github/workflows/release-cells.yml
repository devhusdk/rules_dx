name: release-cells

# Builds, qualifies and verifies one release archive per cell of //deploy/release:release_matrix on its
# native runner. Read-only: no signing, no attestation, no upload to a release. publish-dry-run.yml calls
# it today and release.yml can call it later. The runner map below is checked against the matrix by
# //tools/ci:release_cells_runners_test.

on:
  workflow_call:
    outputs:
      version:
        description: "The version printed by the built dx (release_cell version)."
        value: ${{ jobs.verify.outputs.version }}
      sha:
        description: "The commit every cell was built from."
        value: ${{ jobs.verify.outputs.sha }}
      workflow_ref:
        description: "The workflow ref every record carries (job.workflow_ref of this file)."
        value: ${{ jobs.verify.outputs.workflow_ref }}
  workflow_dispatch:

permissions:
  contents: read

env:
  BAZELISK_VERSION: "1.29.0"
  MSYS2_ARG_CONV_EXCL: "//"

jobs:
  cell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dx-linux-x86_64
            runner: ubuntu-latest
          - name: dx-linux-arm64
            runner: ubuntu-24.04-arm
          - name: dx-macos-arm64
            runner: macos-15
          - name: dx-windows-x86_64
            runner: windows-latest
          - name: dx-windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: false
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Build the archive twice and qualify it
        env:
          CELL: ${{ matrix.name }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          JOB: ${{ github.job }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REF" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "job.workflow_ref or job.workflow_sha is empty" >&2
            exit 1
          fi
          out="$RUNNER_TEMP/cell-out"
          rm -rf "$out"
          mkdir -p "$out"
          bazel build --config=dx_release //cli/cli:dx //deploy/release:release_cell //deploy/release:release_matrix //deploy/release:dx_host_cell
          root="$(bazel info --config=dx_release execution_root)"
          dx="$root/$(bazel cquery --config=dx_release --output=files //cli/cli:dx)"
          tool="$root/$(bazel cquery --config=dx_release --output=files //deploy/release:release_cell)"
          matrix="$root/$(bazel cquery --config=dx_release --output=files //deploy/release:release_matrix)"
          built="$root/$(bazel cquery --config=dx_release --output=files //deploy/release:dx_host_cell)"
          version="$("$tool" version --exe "$dx")"
          archive_name="$(basename "$built")"
          cp "$built" "$out/$archive_name"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$out/$archive_name" | cut -d' ' -f1)"
          else
            digest="$(shasum -a 256 "$out/$archive_name" | cut -d' ' -f1)"
          fi
          printf '%s  %s\n' "$digest" "$archive_name" > "$out/$archive_name.sha256"
          # The determinism input is a second, independent build: its own output base, no caches.
          rebuild_base="$RUNNER_TEMP/rebuild-base"
          rm -rf "$rebuild_base"
          bazel --output_base="$rebuild_base" build --config=dx_release --disk_cache= --remote_cache= //deploy/release:dx_host_cell
          rebuild_root="$(bazel --output_base="$rebuild_base" info --config=dx_release execution_root)"
          rebuilt="$rebuild_root/$(bazel --output_base="$rebuild_base" cquery --config=dx_release --output=files //deploy/release:dx_host_cell)"
          cp "$rebuilt" "$RUNNER_TEMP/rebuilt-$archive_name"
          status=0
          "$tool" qualify \
            --matrix "$matrix" \
            --cell "$CELL" \
            --archive "$out/$archive_name" \
            --rebuild "$RUNNER_TEMP/rebuilt-$archive_name" \
            --work "$RUNNER_TEMP/qualify-work" \
            --sha "$SHA" \
            --version "$version" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" \
            --job "$JOB" \
            --consumer "$GITHUB_WORKSPACE/deploy/release/consumer" \
            --checkout "$GITHUB_WORKSPACE" \
            --out "$out/$CELL.json" || status=$?
          exit "$status"
      - name: Collect the cell files
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p cell-files
          cp "$RUNNER_TEMP"/cell-out/* cell-files/ || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: release-cell-${{ matrix.name }}
          path: cell-files/*
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: cell
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
      workflow_ref: ${{ steps.verify.outputs.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: false
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # A cell that produced nothing is reported as "no record" by verify instead of stopping here.
        continue-on-error: true
        with:
          pattern: release-cell-*
          merge-multiple: true
          path: release-cells
      - name: Verify every cell
        id: verify
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$WORKFLOW_REF" ]; then
            echo "job.workflow_ref is empty" >&2
            exit 1
          fi
          bazel build --config=dx_release //cli/cli:dx //deploy/release:release_cell //deploy/release:release_matrix
          root="$(bazel info --config=dx_release execution_root)"
          dx="$root/$(bazel cquery --config=dx_release --output=files //cli/cli:dx)"
          tool="$root/$(bazel cquery --config=dx_release --output=files //deploy/release:release_cell)"
          matrix="$root/$(bazel cquery --config=dx_release --output=files //deploy/release:release_matrix)"
          mkdir -p release-cells
          version="$("$tool" version --exe "$dx")"
          {
            echo "version=$version"
            echo "sha=$SHA"
            echo "workflow_ref=$WORKFLOW_REF"
          } >> "$GITHUB_OUTPUT"
          status=0
          "$tool" verify \
            --matrix "$matrix" \
            --records release-cells \
            --archives release-cells \
            --sha "$SHA" \
            --version "$version" \
            --workflow-ref "$WORKFLOW_REF" > release-cells/verification.txt || status=$?
          cat release-cells/verification.txt
          {
            echo "## Release cells"
            echo ""
            echo "version \`$version\`, commit \`$SHA\`"
            echo ""
            echo '```'
            cat release-cells/verification.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: release-cells
          path: release-cells/*
          if-no-files-found: error
          retention-days: 7
