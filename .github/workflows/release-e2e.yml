name: release-e2e

on:
  push:
    tags:
      - 'v0.0.0-e2e.*'

permissions:
  contents: read

jobs:
  release:
    name: release (self-call reusable release workflow)
    uses: ./.github/workflows/reusable-release.yml
    with:
      deployables: ${{ contains(github.ref_name, 'partial') && '["//tools/testing/release_e2e:a_github","//tools/testing/release_e2e:b_refuses"]' || '["//tools/testing/release_e2e:a_github"]' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
