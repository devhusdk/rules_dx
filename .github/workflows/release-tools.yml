name: release-tools

on:
  workflow_call:

permissions:
  contents: read

env:
  MSYS2_ARG_CONV_EXCL: "//"

jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-latest
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: macos-arm64
            runner: macos-15
          - host: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build the tools and collect licences and sources
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tool-out"
          host="$HOST"
          deadnix_version="1.3.1"
          selene_version="0.32.0"
          selene_sha256="cd208a4b3bae38decc9c7bb797c19615caaecf67606b3e593ca60b64d3416cd5"
          rm -rf "$out"
          mkdir -p "$out"
          flags=()
          case "$host" in
            linux-x86_64) flags=(--platforms=//tools/platforms:linux_x86_64_musl) ;;
            linux-arm64) flags=(--platforms=//tools/platforms:linux_arm64_musl) ;;
          esac
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -- "$1" | cut -d' ' -f1
            else
              shasum -a 256 -- "$1" | cut -d' ' -f1
            fi
          }
          bazel test //lua/tests:selene_smoke_test
          bazel build ${flags[@]+"${flags[@]}"} //rust/private/quality/tools:deadnix //rust/private/quality/tools:selene
          bazel build ${flags[@]+"${flags[@]}"} //rust/private/quality/tools:topiary //rust/private/quality/tools:progenitor
          root="$(bazel info ${flags[@]+"${flags[@]}"} execution_root)"
          for tool in topiary progenitor deadnix selene; do
            cp "$root/$(bazel cquery ${flags[@]+"${flags[@]}"} --output=files "//rust/private/quality/tools:$tool")" "$out/dx-$tool-$host"
            chmod +x "$out/dx-$tool-$host"
          done
          if test "$host" = "macos-arm64"; then
            for tool in deadnix selene topiary progenitor; do
              file="$out/dx-$tool-$host"
              chmod u+w "$file"
              codesign --verify --strict "$file" || codesign --sign - "$file"
              codesign --verify --strict "$file"
            done
          fi
          bazel_bin="$(command -v bazel)"
          case "$host" in windows-*) bazel_bin="$(cygpath -w "$bazel_bin")" ;; esac
          bazel run //tools/testing:determinism_check -- --bazel "$bazel_bin" --out "$RUNNER_TEMP/determinism-rust" ${flags[@]+"${flags[@]}"} //rust/private/quality/tools:deadnix //rust/private/quality/tools:selene //rust/private/quality/tools:topiary //rust/private/quality/tools:progenitor
          case "$host" in
            linux-*)
              for tool in deadnix selene topiary progenitor; do
                if readelf -l "$out/dx-$tool-$host" | grep -q INTERP; then
                  echo "dx-$tool-$host is dynamically linked" >&2
                  exit 1
                fi
              done
              "$out/dx-deadnix-$host" --version
              "$out/dx-selene-$host" --version
              ;;
          esac
          download="$(mktemp -d)"
          crate="deadnix-$deadnix_version.crate"
          curl --fail --silent --show-error --location -o "$download/$crate" "https://static.crates.io/crates/deadnix/$crate"
          want="$(sed -n '/^name = "deadnix"$/,/^$/s/^checksum = "\(.*\)"$/\1/p' rust/private/quality/tools/Cargo.lock)"
          test -n "$want" || { echo "no deadnix checksum in Cargo.lock" >&2; exit 1; }
          test "$(sha256_of "$download/$crate")" = "$want" || { echo "deadnix crate sha256 differs from Cargo.lock" >&2; exit 1; }
          cp "$download/$crate" "$out/dx-deadnix-source.crate"
          tar -xzOf "$download/$crate" "deadnix-$deadnix_version/LICENSE" > "$out/dx-deadnix-LICENSE"
          curl --fail --silent --show-error --location -o "$download/selene.tar.gz" "https://github.com/Kampfkarren/selene/archive/refs/tags/$selene_version.tar.gz"
          test "$(sha256_of "$download/selene.tar.gz")" = "$selene_sha256" || { echo "selene archive sha256 differs from MODULE.bazel" >&2; exit 1; }
          tar -xzOf "$download/selene.tar.gz" "selene-$selene_version/LICENSE.md" > "$out/dx-selene-LICENSE"
          test -s "$out/dx-deadnix-LICENSE"
          test -s "$out/dx-selene-LICENSE"
          rm -rf "$download"
          case "$host" in
            linux-*)
              bazel test //tools/coverage/kcov:smoke_test //tools/coverage/kcov:static_smoke_test
              bazel build //tools/coverage/kcov:kcov_static
              cp "$(bazel info execution_root)/$(bazel cquery --output=files //tools/coverage/kcov:kcov_static)" "$out/dx-kcov-$host"
              if readelf -l "$out/dx-kcov-$host" | grep -q INTERP; then
                echo "dx-kcov-$host is dynamically linked" >&2
                exit 1
              fi
              bazel run //tools/testing:determinism_check -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/determinism" //tools/coverage/kcov:kcov_static
              ;;
          esac
          if [ "$host" = linux-x86_64 ]; then
            kcov_version="43"
            kcov_sha256="$(sed -n 's/^ *"sha256": "\(.*\)",$/\1/p' tools/coverage/kcov/pins.json)"
            test -n "$kcov_sha256" || { echo "no kcov sha256 in pins.json" >&2; exit 1; }
            external="$(mktemp -d)"
            bazel fetch --force --repo=@elfutils --repo=@zlib
            bazel vendor --vendor_dir="$external" --repo=@elfutils --repo=@zlib
            src="$(mktemp -d)/dx-tool-kcov-$kcov_version-source"
            mkdir -p "$src/patches"
            curl --fail --silent --show-error --location -o "$src/kcov-$kcov_version.tar.gz" "https://github.com/SimonKagstrom/kcov/archive/refs/tags/v$kcov_version.tar.gz"
            test "$(sha256_of "$src/kcov-$kcov_version.tar.gz")" = "$kcov_sha256" || { echo "kcov archive sha256 differs from pins.json" >&2; exit 1; }
            cp patches/kcov/*.patch tools/coverage/kcov/kcov.BUILD "$src/patches/"
            for dep in elfutils zlib; do
              test -d "$external/$dep+" || { echo "no $dep+ under $external" >&2; exit 1; }
              tar -C "$external" --exclude="$dep+/.git" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf "$src/$dep.tar" "$dep+"
            done
            tar -xzOf "$src/kcov-$kcov_version.tar.gz" "kcov-$kcov_version/COPYING" > "$out/dx-kcov-LICENSE"
            test -s "$out/dx-kcov-LICENSE"
            tar -C "$(dirname "$src")" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "$(basename "$src")" | gzip -n > "$out/dx-kcov-source.tar.gz"
            rm -rf "$(dirname "$src")" "$external"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tool-${{ matrix.host }}
          path: ${{ runner.temp }}/tool-out/*
          if-no-files-found: error

  python-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build one archive per Python quality tool and host
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/python-tools-out"
          rm -rf "$out"
          mkdir -p "$out"
          target=//core/quality/tools/python_bundle:release_assets
          bazel build "$target"
          root="$(bazel info execution_root)"
          bazel cquery --output=files "$target" | while read -r built; do
            cp "$root/$built" "$out/"
          done
          for asset in "$out"/*.tar.gz; do
            case "${asset##*/}" in
              *-windows-*) want='^\./bin/[a-z_]+\.cmd$' ;;
              *) want='^\./bin/[a-z_]+$' ;;
            esac
            test "$(tar -tzf "$asset" | grep -cE "$want")" -eq 1 || { echo "$asset has no single bin/ launcher" >&2; exit 1; }
          done
          bazel run //tools/testing:determinism_check -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/determinism" "$target"
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tool-python-tools
          path: ${{ runner.temp }}/python-tools-out/*
          if-no-files-found: error

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Cross-build dx-go, oapi-codegen and gopackagesdriver
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/go-out"
          rm -rf "$out"
          mkdir -p "$out"
          hosts=(linux-x86_64 linux-arm64 macos-arm64 windows-x86_64 windows-arm64)
          tools=(go:dx_go oapi-codegen:oapi_codegen gopackagesdriver:gopackagesdriver)
          targets=()
          for tool in "${tools[@]}"; do
            for host in "${hosts[@]}"; do
              targets+=("//go/private/tools/analysis/dx_go:${tool#*:}_${host//-/_}")
            done
          done
          bazel build "${targets[@]}"
          root="$(bazel info execution_root)"
          for tool in "${tools[@]}"; do
            for host in "${hosts[@]}"; do
              built="$root/$(bazel cquery --output=files "//go/private/tools/analysis/dx_go:${tool#*:}_${host//-/_}")"
              asset="$out/dx-${tool%%:*}-$host"
              cp "$built" "$asset"
              chmod 0755 "$asset"
              kind="$(file -b "$asset")"
              case "$host" in
                linux-x86_64) want=("ELF 64-bit" "x86-64" "statically linked") ;;
                linux-arm64) want=("ELF 64-bit" "aarch64" "statically linked") ;;
                macos-arm64) want=("Mach-O 64-bit" "arm64") ;;
                windows-x86_64) want=("PE32\+" "x86-64") ;;
                windows-arm64) want=("PE32\+" "Aarch64|ARM64") ;;
              esac
              for token in "${want[@]}"; do
                grep -Eq "$token" <<<"$kind" || { echo "$asset is not $token: $kind" >&2; exit 1; }
              done
            done
          done
          # oapi-codegen ships unmodified under its Apache-2.0 licence.
          oapi="$(bazel query --output=location @com_github_oapi_codegen_oapi_codegen_v2//cmd/oapi-codegen)"
          cp "${oapi%%/cmd/oapi-codegen/BUILD*}/LICENSE" "$out/dx-oapi-codegen-LICENSE"
          grep -q "Apache License" "$out/dx-oapi-codegen-LICENSE"
          "$out/dx-oapi-codegen-linux-x86_64" -version
          # gopackagesdriver ships unmodified under the rules_go Apache-2.0 licence.
          driver="$(bazel query --output=location @rules_go//go/tools/gopackagesdriver)"
          cp "${driver%%/go/tools/gopackagesdriver/BUILD*}/LICENSE.txt" "$out/dx-gopackagesdriver-LICENSE"
          grep -q "Apache License" "$out/dx-gopackagesdriver-LICENSE"
          check="$RUNNER_TEMP/go-check"
          rm -rf "$check"
          mkdir -p "$check"
          cp "$out/dx-go-linux-x86_64" "$check/dx_modfmt"
          (cd "$check" && ./dx_modfmt -c)
          rm -rf "$check"
          bazel run //tools/testing:determinism_check -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/determinism" "${targets[@]}"
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tool-go
          path: ${{ runner.temp }}/go-out/*
          if-no-files-found: error

  jars:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build the JVM tool jars
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/jars-out"
          rm -rf "$out"
          mkdir -p "$out"
          jars=(
            "//avro/private/tools/avro_union:avro_union_deploy.jar dx-avro-union-any.jar"
            "//java/private/quality/tools/javac_check:javac_check_deploy.jar dx-javac-check-any.jar"
            "//tools/docs/jvm/javadoc:javadoc_extract_deploy.jar dx-javadoc-extract-any.jar"
            "//java/private/jmh:jmh_generate_deploy.jar dx-jmh-generate-any.jar"
            "//java/private/quality/tools/kotlinc_check:kotlinc_check_deploy.jar dx-kotlinc-check-any.jar"
            "//java/private/tools/lock:resolver_deploy.jar dx-maven-resolver-any.jar"
            "//java/private/quality/tools/scalac_check:scalac_check_deploy.jar dx-scalac-check-any.jar"
            "//tools/docs/jvm/dokka:dokka_extract_deploy.jar dx-dokka-extract-any.jar"
            "//tools/docs/jvm/scaladoc:scaladoc_extract_deploy.jar dx-scaladoc-extract-any.jar"
          )
          targets=()
          for jar in "${jars[@]}"; do
            targets+=("${jar%% *}")
          done
          bazel build "${targets[@]}"
          root="$(bazel info execution_root)"
          for jar in "${jars[@]}"; do
            cp "$root/$(bazel cquery --output=files "${jar%% *}")" "$out/${jar#* }"
            unzip -l "$out/${jar#* }" META-INF/MANIFEST.MF >/dev/null || { echo "$out/${jar#* } is not a jar" >&2; exit 1; }
          done
          bazel run //tools/testing:determinism_check -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/determinism" "${targets[@]}"
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tool-jars
          path: ${{ runner.temp }}/jars-out/*
          if-no-files-found: error

  haskell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-latest
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: macos-arm64
            runner: macos-15
          - host: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build the Haskell tools
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/haskell-out"
          rm -rf "$out"
          mkdir -p "$out"
          flags=()
          case "$HOST" in
            linux-x86_64) flags=(--platforms=//tools/platforms:linux_x86_64_musl --features=fully_static_link) ;;
            linux-arm64) flags=(--platforms=//tools/platforms:linux_arm64_musl --features=fully_static_link) ;;
            windows-*) flags=(--//haskell/private/toolchain:ghc_mingw=True) ;;
          esac
          tools=(
            "//haskell/private/coverage:hpc_lcov_source dx-hpc-lcov-$HOST"
            "//haskell/private/tools/weeder/bin:source dx-weeder-$HOST"
          )
          targets=()
          for tool in "${tools[@]}"; do
            targets+=("${tool%% *}")
          done
          bazel build ${flags[@]+"${flags[@]}"} "${targets[@]}"
          root="$(bazel info ${flags[@]+"${flags[@]}"} execution_root)"
          for tool in "${tools[@]}"; do
            built="$(bazel cquery ${flags[@]+"${flags[@]}"} --output=files "${tool%% *}" | grep -v '\.sh$' | head -n 1)"
            cp "$root/$built" "$out/${tool#* }"
            chmod +x "$out/${tool#* }"
            case "$HOST" in
              linux-*)
                if readelf -l "$out/${tool#* }" | grep -q INTERP; then
                  echo "${tool#* } is dynamically linked" >&2
                  exit 1
                fi
                ;;
              macos-*)
                if otool -L "$out/${tool#* }" | grep -q libHS; then
                  echo "${tool#* } links a libHS dylib" >&2
                  exit 1
                fi
                codesign --verify "$out/${tool#* }" 2>/dev/null || codesign --force -s - "$out/${tool#* }"
                ;;
            esac
          done
          bazel_bin="$(command -v bazel)"
          case "$HOST" in windows-*) bazel_bin="$(cygpath -w "$bazel_bin")" ;; esac
          bazel run //tools/testing:determinism_check -- --bazel "$bazel_bin" --out "$RUNNER_TEMP/determinism" ${flags[@]+"${flags[@]}"} "${targets[@]}"
          check="$RUNNER_TEMP/weeder-check"
          case "$HOST" in windows-*) check="$check.exe" ;; esac
          cp "$out/dx-weeder-$HOST" "$check"
          "$check" --version
          if test "$HOST" = "linux-arm64"; then
            weeder="$(jq -c '.packages[] | select(.name == "weeder") | {version, archive: .archives[0]}' haskell/private/tools/weeder/cabal.lock.json)"
            weeder_version="$(jq -r .version <<<"$weeder")"
            download="$(mktemp -d)"
            curl --fail --silent --show-error --location -o "$download/weeder.tar.gz" "$(jq -r '.archive.urls[0]' <<<"$weeder")"
            test "$(sha256sum "$download/weeder.tar.gz" | cut -d' ' -f1)" = "$(jq -r .archive.sha256 <<<"$weeder")" || { echo "weeder archive sha256 differs from haskell/private/tools/weeder/cabal.lock.json" >&2; exit 1; }
            tar -xzOf "$download/weeder.tar.gz" "weeder-$weeder_version/LICENSE" > "$out/dx-weeder-LICENSE"
            test -s "$out/dx-weeder-LICENSE"
            # The musl cell links libgmp.a from the pinned gmp-dev apk into every tool, so the
            # release ships GMP's checked-in licence, the source it was built from and Alpine's
            # one patch. The macOS and Windows tools link the GMP inside GHC's libHSghc-bignum,
            # so the release also ships GHC's in-tree GMP tarball.
            cp haskell/private/toolchain/lgpl-3.0.txt "$out/dx-haskell-gmp-LICENSE"
            for gmp in "gmp_source dx-haskell-gmp-source.tar.xz" "gmp_source_patch dx-haskell-gmp-source.patch" "gmp_ghc_source dx-haskell-gmp-ghc-source.tar.xz"; do
              pin="${gmp%% *}"
              asset="${gmp#* }"
              curl --fail --silent --show-error --location -o "$out/$asset" "$(jq -r --arg pin "$pin" '.archives[$pin].urls[0]' haskell/pins.json)"
              test "$(sha256sum "$out/$asset" | cut -d' ' -f1)" = "$(jq -r --arg pin "$pin" '.archives[$pin].sha256' haskell/pins.json)" || { echo "$asset sha256 differs from haskell/pins.json $pin" >&2; exit 1; }
            done
            rm -rf "$download"
          fi
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tool-haskell-${{ matrix.host }}
          path: ${{ runner.temp }}/haskell-out/*
          if-no-files-found: error

  hackage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: hlint
            host: linux-arm64
            runner: ubuntu-24.04-arm
            target: "@haskell_hlint_hackage//:hlint-exe-hlint"
            lock: haskell/private/tools/hlint/cabal.lock.json
          - tool: hlint
            host: macos-arm64
            runner: macos-15
            target: "@haskell_hlint_hackage//:hlint-exe-hlint"
            lock: haskell/private/tools/hlint/cabal.lock.json
            determinism: false
          - tool: nixfmt
            host: linux-arm64
            runner: ubuntu-24.04-arm
            target: "@haskell_nixfmt_hackage//:nixfmt-exe-nixfmt"
            lock: core/quality/tools/nixfmt/cabal.lock.json
          - tool: nixfmt
            host: macos-arm64
            runner: macos-15
            target: "@haskell_nixfmt_hackage//:nixfmt-exe-nixfmt"
            lock: core/quality/tools/nixfmt/cabal.lock.json
          - tool: ormolu
            host: linux-arm64
            runner: ubuntu-24.04-arm
            target: "@haskell_ormolu_hackage//:ormolu-exe-ormolu"
            lock: haskell/private/tools/ormolu/cabal.lock.json
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build the Hackage tool
        env:
          TOOL: ${{ matrix.tool }}
          HOST: ${{ matrix.host }}
          TARGET: ${{ matrix.target }}
          LOCK: ${{ matrix.lock }}
          DETERMINISM: ${{ matrix.determinism }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hackage-out"
          rm -rf "$out"
          mkdir -p "$out"
          flags=()
          case "$HOST" in
            linux-arm64) flags=(--platforms=//tools/platforms:linux_arm64_musl --features=fully_static_link) ;;
          esac
          bazel build ${flags[@]+"${flags[@]}"} "$TARGET"
          root="$(bazel info ${flags[@]+"${flags[@]}"} execution_root)"
          built="$(bazel cquery ${flags[@]+"${flags[@]}"} --output=files "$TARGET" | grep -v '\.sh$' | head -n 1)"
          asset="dx-$TOOL-$HOST"
          cp "$root/$built" "$out/$asset"
          chmod +x "$out/$asset"
          case "$HOST" in
            linux-*)
              if readelf -l "$out/$asset" | grep -q INTERP; then
                echo "$asset is dynamically linked" >&2
                exit 1
              fi
              ;;
            macos-*)
              if otool -L "$out/$asset" | grep -q libHS; then
                echo "$asset links a libHS dylib" >&2
                exit 1
              fi
              codesign --verify "$out/$asset" 2>/dev/null || codesign --force -s - "$out/$asset"
              ;;
          esac
          if test "$DETERMINISM" != false; then
            bazel run //tools/testing:determinism_check -- --bazel "$(command -v bazel)" --out "$RUNNER_TEMP/determinism" ${flags[@]+"${flags[@]}"} "$TARGET"
          fi
          "$out/$asset" --version
          if test "$HOST" = "linux-arm64"; then
            package="$(jq -c --arg tool "$TOOL" '.packages[] | select(.name == $tool) | {version, archive: .archives[0]}' "$LOCK")"
            version="$(jq -r .version <<<"$package")"
            download="$(mktemp -d)"
            curl --fail --silent --show-error --location -o "$download/$TOOL.tar.gz" "$(jq -r '.archive.urls[0]' <<<"$package")"
            test "$(sha256sum "$download/$TOOL.tar.gz" | cut -d' ' -f1)" = "$(jq -r .archive.sha256 <<<"$package")" || { echo "$TOOL archive sha256 differs from $LOCK" >&2; exit 1; }
            license="$(tar -tzf "$download/$TOOL.tar.gz" | grep -E "^$TOOL-$version/LICENSE(\.md)?\$" | head -n 1)"
            test -n "$license" || { echo "$TOOL-$version has no LICENSE or LICENSE.md" >&2; exit 1; }
            tar -xzOf "$download/$TOOL.tar.gz" "$license" > "$out/dx-$TOOL-LICENSE"
            test -s "$out/dx-$TOOL-LICENSE"
            rm -rf "$download"
          fi
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tool-haskell-${{ matrix.tool }}-${{ matrix.host }}
          path: ${{ runner.temp }}/hackage-out/*
          if-no-files-found: error
