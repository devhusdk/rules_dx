name: release-tools

on:
  workflow_call:

permissions:
  contents: read

env:
  MSYS2_ARG_CONV_EXCL: "//"

jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-latest
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: macos-arm64
            runner: macos-15
          - host: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build the tools and collect licences and sources
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tool-out"
          host="$HOST"
          deadnix_version="1.3.1"
          selene_version="0.32.0"
          selene_sha256="cd208a4b3bae38decc9c7bb797c19615caaecf67606b3e593ca60b64d3416cd5"
          rm -rf "$out"
          mkdir -p "$out"
          flags=()
          ext=""
          case "$host" in
            linux-*) flags=(--@rules_rust//rust/settings:extra_rustc_flag=-Ctarget-feature=+crt-static) ;;
            windows-*) ext=".exe" ;;
          esac
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -- "$1" | cut -d' ' -f1
            else
              shasum -a 256 -- "$1" | cut -d' ' -f1
            fi
          }
          bazel test "${flags[@]}" //lua/tests:selene_smoke_test
          bazel build "${flags[@]}" //rust/private/quality/tools:deadnix //rust/private/quality/tools:selene
          root="$(bazel info "${flags[@]}" execution_root)"
          for tool in deadnix selene; do
            case "$tool" in deadnix) version="$deadnix_version" ;; *) version="$selene_version" ;; esac
            built="$root/$(bazel cquery "${flags[@]}" --output=files "//rust/private/quality/tools:$tool")"
            cp "$built" "$out/dx-tool-$tool-$version-$host$ext"
          done
          case "$host" in
            linux-*)
              for tool in deadnix-$deadnix_version selene-$selene_version; do
                if readelf -l "$out/dx-tool-$tool-$host" | grep -q INTERP; then
                  echo "dx-tool-$tool-$host is dynamically linked" >&2
                  exit 1
                fi
              done
              ;;
          esac
          download="$(mktemp -d)"
          crate="deadnix-$deadnix_version.crate"
          curl --fail --silent --show-error --location -o "$download/$crate" "https://static.crates.io/crates/deadnix/$crate"
          want="$(sed -n '/^name = "deadnix"$/,/^$/s/^checksum = "\(.*\)"$/\1/p' rust/private/quality/tools/Cargo.lock)"
          test -n "$want" || { echo "no deadnix checksum in Cargo.lock" >&2; exit 1; }
          test "$(sha256_of "$download/$crate")" = "$want" || { echo "deadnix crate sha256 differs from Cargo.lock" >&2; exit 1; }
          cp "$download/$crate" "$out/dx-tool-deadnix-$deadnix_version-source.crate"
          tar -xzOf "$download/$crate" "deadnix-$deadnix_version/LICENSE" > "$out/dx-tool-deadnix-$deadnix_version-LICENSE"
          curl --fail --silent --show-error --location -o "$download/selene.tar.gz" "https://github.com/Kampfkarren/selene/archive/refs/tags/$selene_version.tar.gz"
          test "$(sha256_of "$download/selene.tar.gz")" = "$selene_sha256" || { echo "selene archive sha256 differs from MODULE.bazel" >&2; exit 1; }
          tar -xzOf "$download/selene.tar.gz" "selene-$selene_version/LICENSE.md" > "$out/dx-tool-selene-$selene_version-LICENSE"
          test -s "$out/dx-tool-deadnix-$deadnix_version-LICENSE"
          test -s "$out/dx-tool-selene-$selene_version-LICENSE"
          rm -rf "$download"
          case "$host" in
            linux-*)
              kcov_version="43"
              bazel test //tools/coverage/kcov:smoke_test //tools/coverage/kcov:static_smoke_test
              bazel build //tools/coverage/kcov:kcov_static
              cp "$(bazel info execution_root)/$(bazel cquery --output=files //tools/coverage/kcov:kcov_static)" "$out/dx-tool-kcov-$kcov_version-$host"
              if readelf -l "$out/dx-tool-kcov-$kcov_version-$host" | grep -q INTERP; then
                echo "dx-tool-kcov-$kcov_version-$host is dynamically linked" >&2
                exit 1
              fi
              ;;
          esac
          if [ "$host" = linux-x86_64 ]; then
            kcov_version="43"
            kcov_sha256="$(sed -n 's/^ *"sha256": "\(.*\)",$/\1/p' tools/coverage/kcov/pins.json)"
            test -n "$kcov_sha256" || { echo "no kcov sha256 in pins.json" >&2; exit 1; }
            external="$(mktemp -d)"
            bazel fetch --force --repo=@elfutils --repo=@zlib
            bazel vendor --vendor_dir="$external" --repo=@elfutils --repo=@zlib
            src="$(mktemp -d)/dx-tool-kcov-$kcov_version-source"
            mkdir -p "$src/patches"
            curl --fail --silent --show-error --location -o "$src/kcov-$kcov_version.tar.gz" "https://github.com/SimonKagstrom/kcov/archive/refs/tags/v$kcov_version.tar.gz"
            test "$(sha256_of "$src/kcov-$kcov_version.tar.gz")" = "$kcov_sha256" || { echo "kcov archive sha256 differs from pins.json" >&2; exit 1; }
            cp patches/kcov/*.patch tools/coverage/kcov/kcov.BUILD "$src/patches/"
            for dep in elfutils zlib; do
              test -d "$external/$dep+" || { echo "no $dep+ under $external" >&2; exit 1; }
              tar -C "$external" --exclude="$dep+/.git" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf "$src/$dep.tar" "$dep+"
            done
            tar -xzOf "$src/kcov-$kcov_version.tar.gz" "kcov-$kcov_version/COPYING" > "$out/dx-tool-kcov-$kcov_version-LICENSE"
            test -s "$out/dx-tool-kcov-$kcov_version-LICENSE"
            tar -C "$(dirname "$src")" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - "$(basename "$src")" | gzip -n > "$out/dx-tool-kcov-$kcov_version-source.tar.gz"
            rm -rf "$(dirname "$src")" "$external"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tool-${{ matrix.host }}
          path: ${{ runner.temp }}/tool-out/*
          if-no-files-found: error

  python-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build the Python quality tools bundles
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/python-tools-out"
          rm -rf "$out"
          mkdir -p "$out"
          hosts=(linux-x86_64 linux-arm64 macos-arm64 windows-x86_64 windows-arm64)
          targets=()
          for host in "${hosts[@]}"; do
            targets+=("//core/quality/tools/python_bundle:dx_python_tools_${host//-/_}")
          done
          bazel build "${targets[@]}"
          root="$(bazel info execution_root)"
          for host in "${hosts[@]}"; do
            built="$root/$(bazel cquery --output=files "//core/quality/tools/python_bundle:dx_python_tools_${host//-/_}")"
            asset="$out/dx-python-tools-$host.tar.gz"
            cp "$built" "$asset"
            case "$host" in
              windows-*) want="./bin/yamllint.cmd" ;;
              *) want="./bin/yamllint" ;;
            esac
            tar -tzf "$asset" | grep -Fx "$want" >/dev/null || { echo "$asset has no $want" >&2; exit 1; }
          done
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tool-python-tools
          path: ${{ runner.temp }}/python-tools-out/*
          if-no-files-found: error
