name: release-tools

on:
  workflow_call:

permissions:
  contents: read

env:
  MSYS2_ARG_CONV_EXCL: "//"

jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-latest
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: macos-arm64
            runner: macos-15
          - host: windows-x86_64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Build the tools and collect licences and sources
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tool-out"
          host="$HOST"
          deadnix_version="1.3.1"
          selene_version="0.32.0"
          nixfmt_version="1.5.0"
          nixfmt_sha256="614827e269ece8055904241675f691b47f5c6468604264412c4fec2ca92d3474"
          selene_sha256="cd208a4b3bae38decc9c7bb797c19615caaecf67606b3e593ca60b64d3416cd5"
          rm -rf "$out"
          mkdir -p "$out"
          flags=()
          ext=""
          case "$host" in
            linux-*) flags=(--@rules_rust//rust/settings:extra_rustc_flag=-Ctarget-feature=+crt-static) ;;
            windows-*) ext=".exe" ;;
          esac
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -- "$1" | cut -d' ' -f1
            else
              shasum -a 256 -- "$1" | cut -d' ' -f1
            fi
          }
          bazel test "${flags[@]}" //lua/tests:selene_smoke_test
          bazel build "${flags[@]}" //rust/private/quality/tools:deadnix //rust/private/quality/tools:selene
          root="$(bazel info "${flags[@]}" execution_root)"
          for tool in deadnix selene; do
            case "$tool" in deadnix) version="$deadnix_version" ;; *) version="$selene_version" ;; esac
            built="$root/$(bazel cquery "${flags[@]}" --output=files "//rust/private/quality/tools:$tool")"
            cp "$built" "$out/dx-tool-$tool-$version-$host$ext"
          done
          if test "$host" = "linux-arm64"; then
            bazel build --config=dx_tool_release_linux_haskell @haskell_nixfmt_hackage//:nixfmt-exe-nixfmt
            built="$root/$(bazel cquery --config=dx_tool_release_linux_haskell --output=files @haskell_nixfmt_hackage//:nixfmt-exe-nixfmt)"
            cp "$built" "$out/dx-tool-nixfmt-$nixfmt_version-$host"
            chmod +x "$out/dx-tool-nixfmt-$nixfmt_version-$host"
          fi
          case "$host" in
            linux-*)
              tools=(deadnix-$deadnix_version selene-$selene_version)
              if test "$host" = "linux-arm64"; then tools+=(nixfmt-$nixfmt_version); fi
              for tool in "${tools[@]}"; do
                if readelf -l "$out/dx-tool-$tool-$host" | grep -q INTERP; then
                  echo "dx-tool-$tool-$host is dynamically linked" >&2
                  exit 1
                fi
              done
              ;;
          esac
          download="$(mktemp -d)"
          crate="deadnix-$deadnix_version.crate"
          curl --fail --silent --show-error --location -o "$download/$crate" "https://static.crates.io/crates/deadnix/$crate"
          want="$(sed -n '/^name = "deadnix"$/,/^$/s/^checksum = "\(.*\)"$/\1/p' rust/private/quality/tools/Cargo.lock)"
          test -n "$want" || { echo "no deadnix checksum in Cargo.lock" >&2; exit 1; }
          test "$(sha256_of "$download/$crate")" = "$want" || { echo "deadnix crate sha256 differs from Cargo.lock" >&2; exit 1; }
          cp "$download/$crate" "$out/dx-tool-deadnix-$deadnix_version-source.crate"
          tar -xzOf "$download/$crate" "deadnix-$deadnix_version/LICENSE" > "$out/dx-tool-deadnix-$deadnix_version-LICENSE"
          curl --fail --silent --show-error --location -o "$download/selene.tar.gz" "https://github.com/Kampfkarren/selene/archive/refs/tags/$selene_version.tar.gz"
          test "$(sha256_of "$download/selene.tar.gz")" = "$selene_sha256" || { echo "selene archive sha256 differs from MODULE.bazel" >&2; exit 1; }
          tar -xzOf "$download/selene.tar.gz" "selene-$selene_version/LICENSE.md" > "$out/dx-tool-selene-$selene_version-LICENSE"
          if test "$host" = "linux-arm64"; then
            curl --fail --silent --show-error --location -o "$download/nixfmt.tar.gz" "https://github.com/NixOS/nixfmt/archive/refs/tags/v$nixfmt_version.tar.gz"
            test "$(sha256_of "$download/nixfmt.tar.gz")" = "$nixfmt_sha256" || { echo "nixfmt archive sha256 differs from haskell_deps.json" >&2; exit 1; }
            tar -xzOf "$download/nixfmt.tar.gz" "nixfmt-$nixfmt_version/LICENSE" > "$out/dx-tool-nixfmt-$nixfmt_version-LICENSE"
            test -s "$out/dx-tool-nixfmt-$nixfmt_version-LICENSE"
          fi
          test -s "$out/dx-tool-deadnix-$deadnix_version-LICENSE"
          test -s "$out/dx-tool-selene-$selene_version-LICENSE"
          rm -rf "$download"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tool-${{ matrix.host }}
          path: ${{ runner.temp }}/tool-out/*
          if-no-files-found: error
