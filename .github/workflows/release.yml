name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload dx binaries to."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BAZELISK_VERSION: "1.29.0"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  MSYS2_ARG_CONV_EXCL: "//"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: dx-linux-x86_64
            runner: ubuntu-latest
          - name: dx-linux-arm64
            runner: ubuntu-24.04-arm
          - name: dx-macos-arm64
            runner: macos-14
          - name: dx-windows-x86_64
            runner: windows-latest
          - name: dx-windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: false
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-
      - name: Build and checksum dx
        env:
          ASSET: ${{ matrix.name }}
        run: |
          set -euo pipefail
          bazel build -c opt //cli/cli:dx
          bin="$(bazel cquery -c opt --output=files //cli/cli:dx)"
          mkdir -p out
          cp "$bin" "out/$ASSET"
          chmod +x "out/$ASSET"
          if command -v sha256sum >/dev/null 2>&1; then
            hash="$(sha256sum "out/$ASSET" | cut -d' ' -f1)"
          else
            hash="$(shasum -a 256 "out/$ASSET" | cut -d' ' -f1)"
          fi
          printf '%s  %s\n' "$hash" "$ASSET" > "out/$ASSET.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for asset in dx-linux-x86_64 dx-linux-arm64 dx-macos-arm64 dx-windows-x86_64 dx-windows-arm64; do
            test -s "out/$asset"
            test -s "out/$asset.sha256"
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No release for $RELEASE_TAG. Run //cli/cli:github_draft, then re-run this workflow with the tag." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" out/dx-* --clobber
