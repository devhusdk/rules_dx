name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload dx binaries to."
        required: false
        type: string
      commit:
        description: "Full SHA of the commit the release tag points at."
        required: false
        type: string
      dry_run:
        description: "Build and qualify the release without uploading anything."
        required: false
        default: false
        type: boolean
      approve:
        description: "Owner approval to run the full dry-run qualification. False builds and reports only."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CANDIDATE_COMMIT: ${{ inputs.commit || github.sha }}
  MSYS2_ARG_CONV_EXCL: "//"

jobs:
  cells:
    permissions:
      contents: read
    uses: ./.github/workflows/release-cells.yml

  source:
    needs: cells
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.dry_run && format('v{0}', needs.cells.outputs.version) || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.dry_run && github.sha || env.RELEASE_TAG }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Check the committed versions equal the tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          check() {
            if [ "$2" != "$tag" ]; then
              echo "$1 says $2 but the tag is $RELEASE_TAG; land the version bump first." >&2
              exit 1
            fi
          }
          check "cli/prebuilt/pins.bzl DX_VERSION" "$(sed -n 's/^DX_VERSION = "\(.*\)"$/\1/p' cli/prebuilt/pins.bzl)"
          check "MODULE.bazel module version" "$(sed -n '/^module(/,/^)/s/^    version = "\(.*\)",$/\1/p' MODULE.bazel)"
          check "cli/adopt/src/version.rs DX_VERSION" "$(sed -n 's/^pub const DX_VERSION: &str = "\(.*\)";$/\1/p' cli/adopt/src/version.rs)"
          check "cli/adopt/src/version.rs MODULE_VERSION" "$(sed -n 's/^pub const MODULE_VERSION: &str = "\(.*\)";$/\1/p' cli/adopt/src/version.rs)"
      - name: Check the tag names the candidate commit
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          RELEASE_DRY_RUN=0 RELEASE_APPROVE=1 bazel run //deploy/release:release_driver -- "$RELEASE_TAG" "$CANDIDATE_COMMIT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-cell-*
          path: out
          merge-multiple: true
      - name: Collect and check the checksum manifest
        env:
          CELLS_VERSION: ${{ needs.cells.outputs.version }}
          CELLS_SHA: ${{ needs.cells.outputs.sha }}
        run: |
          set -euo pipefail
          test "$CELLS_VERSION" = "${RELEASE_TAG#v}" || { echo "want ${RELEASE_TAG#v}, got $CELLS_VERSION" >&2; exit 1; }
          test "$CELLS_SHA" = "$CANDIDATE_COMMIT" || { echo "want $CANDIDATE_COMMIT, got $CELLS_SHA" >&2; exit 1; }
          : > sums.tmp
          : > out/dx-gazelle-sha256sums.txt
          files="dx-sha256sums.txt dx-sha256sums.txt.sigstore.json dx-gazelle-sha256sums.txt"
          for asset in dx-linux-x86_64 dx-linux-arm64 dx-macos-arm64 dx-windows-x86_64 dx-windows-arm64; do
            case "$asset" in dx-windows-*) archive="$asset.zip" ;; *) archive="$asset.tar.gz" ;; esac
            for file in "$archive" "$archive.sha256" "$archive.spdx.json"; do
              test -s "out/$file" || { echo "want a non-empty out/$file" >&2; exit 1; }
            done
            case "$archive" in *.zip) unzip -p "out/$archive" dx.exe ;; *) tar -xzOf "out/$archive" dx ;; esac > "out/$asset"
            hash="$(sha256sum "out/$asset" | cut -d' ' -f1)"
            printf '%s  %s\n' "$hash" "$asset" > "out/$asset.sha256"
            printf '%s  %s\n' "$(sha256sum "out/$archive.spdx.json" | cut -d' ' -f1)" "$archive.spdx.json" >> sums.tmp
            cat "out/$asset.sha256" "out/$archive.sha256" >> sums.tmp
            files="$files $asset $asset.sha256 $archive $archive.sha256 $archive.spdx.json"
            gazelle="dx-gazelle-${asset#dx-}"
            test -s "out/$gazelle" || { echo "want a non-empty out/$gazelle" >&2; exit 1; }
            printf '%s  %s\n' "$(sha256sum "out/$gazelle" | cut -d' ' -f1)" "$gazelle" > "out/$gazelle.sha256"
            cat "out/$gazelle.sha256" >> out/dx-gazelle-sha256sums.txt
            files="$files $gazelle $gazelle.sha256"
            case "$asset" in dx-windows-*)
              pdb="$asset-pdb.zip"
              for file in "$pdb" "$pdb.sha256" "$pdb.spdx.json"; do
                test -s "out/$file" || { echo "want a non-empty out/$file" >&2; exit 1; }
              done
              printf '%s  %s\n' "$(sha256sum "out/$pdb.spdx.json" | cut -d' ' -f1)" "$pdb.spdx.json" >> sums.tmp
              cat "out/$pdb.sha256" >> sums.tmp
              files="$files $pdb $pdb.sha256 $pdb.spdx.json"
              ;;
            esac
          done
          printf '%s\n' "$files" > out/files.list
          LC_ALL=C sort -k2 sums.tmp > out/dx-sha256sums.txt
          test "$(wc -l < out/dx-sha256sums.txt)" -eq 19 || { echo "want 19 manifest lines, got $(wc -l < out/dx-sha256sums.txt)" >&2; exit 1; }
          (cd out && sha256sum -c dx-sha256sums.txt)
          test "$(wc -l < out/dx-gazelle-sha256sums.txt)" -eq 5 || { echo "want 5 gazelle manifest lines, got $(wc -l < out/dx-gazelle-sha256sums.txt)" >&2; exit 1; }
          (cd out && sha256sum -c dx-gazelle-sha256sums.txt)
      - name: Build and verify the source archive
        env:
          SOURCE_DIR: ${{ runner.temp }}/source
        run: |
          set -euo pipefail
          pins="$RUNNER_TEMP/pins.bzl"
          cp cli/prebuilt/pins.bzl "$pins"
          bazel run //tools/ci:fill_pins_bin -- "$RELEASE_TAG" --manifest "$PWD/out/dx-sha256sums.txt" --gazelle-manifest "$PWD/out/dx-gazelle-sha256sums.txt" --pins "$pins" --repo "$GITHUB_REPOSITORY"
          bazel run //deploy/release:source_archive -- "$RELEASE_TAG" "$CANDIDATE_COMMIT" "$SOURCE_DIR" --pins "$pins"
          for file in dx-sha256sums.txt dx-gazelle-sha256sums.txt files.list dx-*.sha256 dx-linux-x86_64 dx-linux-arm64 dx-macos-arm64 dx-windows-x86_64 dx-windows-arm64 dx-gazelle-linux-x86_64 dx-gazelle-linux-arm64 dx-gazelle-macos-arm64 dx-gazelle-windows-x86_64 dx-gazelle-windows-arm64; do
            case "$file" in *.tar.gz.sha256|*.zip.sha256) continue ;; esac
            cp "out/$file" "$SOURCE_DIR/"
          done
          ls -l "$SOURCE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: ${{ runner.temp }}/source/*
          if-no-files-found: error
          retention-days: 7

  dry-run:
    needs: cells
    if: ${{ !cancelled() && inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # A missing artifact shows up as a rejected cell in the report instead of stopping here.
        continue-on-error: true
        with:
          name: release-cells
          path: ${{ runner.temp }}/release-cells
      - name: Build the host release unit
        run: bazel build //cli/cli:dx //deploy/release:all //deploy/release:release_artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: release-coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-coverage
      - name: Qualify exact owned line coverage in every cell
        if: ${{ inputs.approve }}
        env:
          CELLS_SHA: ${{ needs.cells.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-coverage"
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find "$RUNNER_TEMP/release-coverage" -name '*.ndjson' | sort)
          bazel run //tools/ci:coverage_cells_bin -- "$GITHUB_WORKSPACE/tools/coverage/cells.txt" "$CELLS_SHA" "${files[@]}"
      - name: Emit dry-run report from the release cells
        env:
          APPROVE: ${{ inputs.approve }}
          CELLS_VERSION: ${{ needs.cells.outputs.version }}
          CELLS_SHA: ${{ needs.cells.outputs.sha }}
          WORKFLOW_REF: ${{ needs.cells.outputs.workflow_ref }}
        run: |
          set -uo pipefail
          failed=""
          run() { name=$1; shift; "$@" || { echo "::error::$name failed"; failed="$failed $name"; }; }
          stage="$RUNNER_TEMP/publish-dry-run"
          rm -rf "$stage"
          mkdir -p "$stage"
          cells="$RUNNER_TEMP/release-cells"
          mkdir -p "$cells"
          # The refusal proof only needs some dx file; a missing cell archive is reported by the check below.
          tar -xzf "$cells/dx-linux-x86_64.tar.gz" -C "$stage" dx \
            || cp "$(bazel cquery --output=files //cli/cli:dx)" "$stage/dx" \
            || { echo "::error::fetch_dx failed"; failed="$failed fetch_dx"; }
          matrix="$(bazel cquery --output=files //deploy/release:release_matrix)" || failed="$failed matrix"
          run build_release_matrix bazel build //deploy/release:release_matrix --noshow_progress
          run build_release_artifacts bazel build //deploy/release:release_artifacts --noshow_progress
          bazel cquery --output=files //deploy/release:release_artifacts > "$stage/release-artifacts.txt" || failed="$failed release_artifacts_list"
          spdx="$(bazel cquery --output=files //deploy/release:sbom_demo_spdx)" || failed="$failed spdx"
          prov="$(bazel cquery --output=files //deploy/release:sbom_demo_provenance)" || failed="$failed provenance"
          notice="$(bazel cquery --output=files //deploy/release:notice_demo_notice)" || failed="$failed notice"
          run copy_spdx cp "$spdx" "$stage/sbom_demo.spdx.json"
          run copy_provenance cp "$prov" "$stage/sbom_demo.provenance.json"
          run copy_notice cp "$notice" "$stage/notice_demo.NOTICE"
          demo_archive="$GITHUB_WORKSPACE/$(bazel cquery --output=files //deploy/rules:release_demo_archive)" || failed="$failed demo_archive"
          notice_manifest="$GITHUB_WORKSPACE/$(bazel cquery --output=files //deploy/release:notice_demo_inventory.txt)" || failed="$failed notice_manifest"
          notice_a="$GITHUB_WORKSPACE/$(bazel cquery --output=files //deploy/release:notice_demo_a.txt)" || failed="$failed notice_a"
          notice_b="$GITHUB_WORKSPACE/$(bazel cquery --output=files //deploy/release:notice_demo_b.txt)" || failed="$failed notice_b"
          run draft_dry_run bazel run //cli/cli:github_draft > "$stage/draft-dry-run.log" 2>&1
          run release_tests bazel test //deploy/release:all --noshow_progress > "$stage/release-tests.log" 2>&1
          RELEASE_SIGN_DRY_RUN=1 run signing_demo bazel run //deploy/release:signing_demo > "$stage/signing-dry-run.log" 2>&1
          BCR_DRY_RUN=1 run bcr_demo bazel run //deploy/release:bcr_demo > "$stage/bcr-dry-run.log" 2>&1
          bcr_logs="$stage/bcr-dry-run.log"
          for family in android apple; do
            BCR_DRY_RUN=1 run "bcr_demo_$family" bazel run "//deploy/release:bcr_demo_$family" > "$stage/bcr-dry-run-$family.log" 2>&1
            bcr_logs="$bcr_logs:$stage/bcr-dry-run-$family.log"
          done
          run release_driver bazel run //deploy/release:release_driver -- v0.0.0-dryrun > "$stage/human-run-dry-run.log" 2>&1
          echo "install verifier refusal proof (no network, publishes nothing):"
          run verify_help bazel run //deploy/install:dx_verify -- --help > "$stage/verify-help.txt"
          if bazel run //deploy/install:dx_verify -- --binary "$stage/dx" --sha256 deadbeef > "$stage/verify-refusal.log" 2>&1; then
            echo "::error::expected checksum-only refusal failed"
            failed="$failed verify_refusal"
          fi
          status=0
          bazel run //deploy/release:publish_dry_run_check -- \
            --matrix "$GITHUB_WORKSPACE/$matrix" \
            --records "$cells" \
            --archives "$cells" \
            --sha "$CELLS_SHA" \
            --version "$CELLS_VERSION" \
            --workflow-ref "$WORKFLOW_REF" \
            --sbom-artifact "$demo_archive" \
            --spdx "$stage/sbom_demo.spdx.json" \
            --provenance "$stage/sbom_demo.provenance.json" \
            --notice "$stage/notice_demo.NOTICE" \
            --notice-manifest "$notice_manifest" \
            --notice-texts "$notice_a:$notice_b" \
            --release-artifacts "$stage/release-artifacts.txt" \
            --draft-log "$stage/draft-dry-run.log" \
            --signing-log "$stage/signing-dry-run.log" \
            --bcr-log "$bcr_logs" \
            --human-run-log "$stage/human-run-dry-run.log" \
            --release-tests-log "$stage/release-tests.log" \
            --module-bazel "$GITHUB_WORKSPACE/MODULE.bazel" \
            --verify-refusal-log "$stage/verify-refusal.log" \
            --approve "$APPROVE" \
            --report "$stage/dry-run-report.json" | tee "$stage/verification.txt" || status=$?
          {
            echo "## Publish dry-run report"
            echo ""
            echo "- approved: \`$APPROVE\`; published: **no** (dry run never publishes)"
            echo "- release cells (\`release-cells.yml\`, version \`$CELLS_VERSION\`, commit \`$CELLS_SHA\`):"
            echo '```'
            cat "$stage/verification.txt"
            echo '```'
            echo "- draft dry-run: \`//cli/cli:github_draft\` ok (placeholder \`v0.0.0-dryrun\`, draft-only flags, staged locally, publishes nothing)"
            echo "- packaging: \`//deploy/release:release_artifacts\` ok (audit curator plus binary plus man page plus NOTICE plus SBOM/provenance, publishes nothing)"
            echo "- SBOM: \`//deploy/release:sbom_demo\` SPDX-2.3 + SLSA v1 ok, subject digest equals artifact sha256, publishes nothing"
            echo "- NOTICE: \`//deploy/release:notice_demo\` ok (hermetic bundle, signed alongside SBOM pair, publishes nothing)"
            echo "- signing dry-run: \`//deploy/release:signing_demo\` \`RELEASE_SIGN_DRY_RUN=1\` ok (Sigstore keyless + attestation over SBOM pair plus NOTICE, publishes nothing)"
            echo "- BCR shape: \`rules_dx\` and \`rules_dx_<family>\` at \`0.0.0\` via \`//deploy/release:bcr_demo\` and \`//deploy/release:bcr_demo_<family>\` checked, not submitted"
            echo "- verifier: checksum-only refused, TUF trust root, nothing installed"
            echo "- operations (all \`not-authorized\`, none executed):"
            echo '```'
            jq -r '.operations[] | "\(.operation) \(.subject): \(.state)"' "$stage/dry-run-report.json"
            echo '```'
            echo "- full report: \`dry-run-report.json\` in the job logs"
            echo "- failed steps: \`${failed:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$failed" ] && exit "$status"
          exit 1
      - name: Prove checkout left clean
        run: test -z "$(git status --porcelain)"

  attest:
    needs: [cells, source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ inputs.dry_run && format('v{0}', needs.cells.outputs.version) || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-cell-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: out
      - name: Check the release inputs
        run: |
          set -euo pipefail
          (cd out && sha256sum -c dx-sha256sums.txt && sha256sum -c dx-gazelle-sha256sums.txt)
          src="rules_dx-${RELEASE_TAG#v}.tar.gz"
          test -s "out/$src"
          test -s "out/$src.sha256"
          test -s out/source.json
          for file in out/rules_dx_*.source.json; do
            [ -e "$file" ] || continue
            test -s "$file"
          done
          test -s out/files.list
      - name: Reuse or plan the attestation
        id: plan
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REF_FULL: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No release for $RELEASE_TAG. Create the draft first (see RELEASING.md), then re-run this workflow with the tag." >&2
            exit 1
          fi
          existing_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$existing_names" | grep -Fxq dx-sha256sums.txt.sigstore.json; then
            gh release download "$RELEASE_TAG" --pattern dx-sha256sums.txt.sigstore.json --dir out
            if printf '%s\n' "$existing_names" | grep -Fxq "rules_dx-${RELEASE_TAG#v}.tar.gz.intoto.jsonl"; then
              gh release download "$RELEASE_TAG" --pattern "rules_dx-${RELEASE_TAG#v}.tar.gz.intoto.jsonl" --dir out
            fi
            echo "attest=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$GITHUB_REF_FULL" != "refs/tags/$RELEASE_TAG" ]; then
              echo "Refusing to sign from $GITHUB_REF_FULL; dispatch with --ref $RELEASE_TAG." >&2
              exit 1
            fi
            echo "attest=true" >> "$GITHUB_OUTPUT"
          fi
      - name: List the attestation subjects
        id: subjects
        if: ${{ !inputs.dry_run && steps.plan.outputs.attest == 'true' && github.ref == format('refs/tags/{0}', env.RELEASE_TAG) }}
        run: |
          set -euo pipefail
          { cat out/dx-sha256sums.txt out/dx-gazelle-sha256sums.txt; (cd out && sha256sum dx-sha256sums.txt dx-gazelle-sha256sums.txt); } > "$RUNNER_TEMP/subjects.txt"
      - name: Attest the checksum manifest
        id: attest
        if: ${{ !inputs.dry_run && steps.plan.outputs.attest == 'true' && github.ref == format('refs/tags/{0}', env.RELEASE_TAG) }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt
      - name: Attest the source archive
        id: attest_source
        if: ${{ !inputs.dry_run && steps.plan.outputs.attest == 'true' && github.ref == format('refs/tags/{0}', env.RELEASE_TAG) }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/rules_dx-${{ needs.cells.outputs.version }}.tar.gz
      - name: Keep the attestation bundles
        if: ${{ !inputs.dry_run && steps.plan.outputs.attest == 'true' }}
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          SOURCE_BUNDLE_PATH: ${{ steps.attest_source.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_PATH"
          test -n "$SOURCE_BUNDLE_PATH"
          cp "$BUNDLE_PATH" out/dx-sha256sums.txt.sigstore.json
          cp "$SOURCE_BUNDLE_PATH" "out/rules_dx-${RELEASE_TAG#v}.tar.gz.intoto.jsonl"
      - name: Verify the archives against the bundle
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for archive in dx-linux-x86_64.tar.gz dx-linux-arm64.tar.gz dx-macos-arm64.tar.gz dx-windows-x86_64.zip dx-windows-arm64.zip dx-windows-x86_64-pdb.zip dx-windows-arm64-pdb.zip; do
            for file in "$archive" "$archive.spdx.json"; do
            gh attestation verify "out/$file" \
              --bundle out/dx-sha256sums.txt.sigstore.json \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: out
          if-no-files-found: error

  assets:
    needs: [cells, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.dry_run && format('v{0}', needs.cells.outputs.version) || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ !inputs.dry_run }}
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
        if: ${{ !inputs.dry_run }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: out
      - name: Collect the release asset paths
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          src="rules_dx-${RELEASE_TAG#v}.tar.gz"
          sources=$(cd out && ls source.json rules_dx_*.source.json 2>/dev/null)
          : > "$RUNNER_TEMP/paths.txt"
          for file in $(cat out/files.list) "$src" "$src.sha256" "$src.intoto.jsonl" $sources; do
            if [ "$DRY_RUN" = true ]; then
              case "$file" in dx-sha256sums.txt.sigstore.json | "$src.intoto.jsonl") continue ;; esac
            fi
            test -s "out/$file" || { echo "want a non-empty out/$file" >&2; exit 1; }
            echo "$PWD/out/$file" >> "$RUNNER_TEMP/paths.txt"
          done
      - name: Upload release assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t paths < "$RUNNER_TEMP/paths.txt"
          status=0
          RELEASE_DRY_RUN=0 RELEASE_APPROVE=1 bazel run //deploy/release:release_driver -- "$RELEASE_TAG" "$CANDIDATE_COMMIT" "${paths[@]}" > "$RUNNER_TEMP/ledger.json" || status=$?
          { echo '```json'; cat "$RUNNER_TEMP/ledger.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && !inputs.dry_run }}
        with:
          name: release-ledger
          path: ${{ runner.temp }}/ledger.json
          if-no-files-found: warn
      - name: Check the published assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src="rules_dx-${RELEASE_TAG#v}.tar.gz"
          mkdir -p verify
          gh release download "$RELEASE_TAG" --pattern "$src" --pattern "$src.sha256" --pattern 'dx-*' --dir verify
          (cd verify && sha256sum -c "$src.sha256" && sha256sum -c dx-sha256sums.txt && sha256sum -c dx-gazelle-sha256sums.txt)
          tar -xzf verify/dx-linux-x86_64.tar.gz -C verify dx
          verify/dx --version

  pins:
    needs: assets
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel
      - name: Check the release archive's pins against the attested manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/archive"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "rules_dx-$version.tar.gz" --dir "$RUNNER_TEMP/archive"
          tar -xzf "$RUNNER_TEMP/archive/rules_dx-$version.tar.gz" -C "$RUNNER_TEMP/archive" "rules_dx-$version/cli/prebuilt/pins.bzl"
          bazel run //tools/ci:fill_pins_bin -- "$RELEASE_TAG" --check --filled --pins "$RUNNER_TEMP/archive/rules_dx-$version/cli/prebuilt/pins.bzl" --repo "$GITHUB_REPOSITORY"
