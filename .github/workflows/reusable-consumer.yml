            echo "Findings outside the diff stay in counts only; no invented review locations."
          } > "${RUNNER_TEMP:-/tmp}"/coverage_comment.md
          cat "${RUNNER_TEMP:-/tmp}"/coverage_comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish PR summary comment (dedup marker, fork-safe)
        # One comment per PR per cell marker; forks skip.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          jq --version
          gh --version | head -n 1 | grep -qE '^gh version ([2-9]|[1-9][0-9])\.'
          jq --version | grep -qE '^jq-(1\.([6-9]|[0-9]{2,})|[2-9])'
          head_repo="${{ github.event.pull_request.head.repo.full_name }}"
          base_repo="${{ github.repository }}"
          if [[ "$head_repo" != "$base_repo" ]]; then
            echo "Fork PR detected: step-summary only, no PR comment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker="dx-coverage-summary: coverage ${{ matrix.platform }}"
          pr="${{ github.event.pull_request.number }}"
          existing="$(gh api "repos/$base_repo/issues/$pr/comments?per_page=100" --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | last // empty" || true)"
          if [[ -n "$existing" ]]; then
            jq -Rs '{body: .}' "${RUNNER_TEMP:-/tmp}"/coverage_comment.md > "${RUNNER_TEMP:-/tmp}"/coverage_payload.json
            gh api -X PATCH "repos/$base_repo/issues/comments/$existing" --input "${RUNNER_TEMP:-/tmp}"/coverage_payload.json --jq .id
          else
            gh pr comment "$pr" --body-file "${RUNNER_TEMP:-/tmp}"/coverage_comment.md
          fi

  dx-ci:
    name: dx-ci (aggregate)
    needs: [validate, lint, typecheck, format, generate, security-audit, advisory-snapshots, license-audit, test, build, coverage]
    if: ${{ always() }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Aggregate selected check results
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          python3 - <<'EOF'
          import json, os, sys
          required = ["lint", "typecheck", "format", "generate", "security-audit", "advisory-snapshots", "license-audit", "test", "build", "coverage"]
          needs = json.loads(os.environ["NEEDS"])
          disabled = {name for name in os.environ["DISABLED"].split(",") if name}
          if "security-audit" in disabled:
              disabled.add("advisory-snapshots")
          results = {name: info.get("result") for name, info in needs.items()}
          print(json.dumps({"aggregate": "dx-ci", "disabled": sorted(disabled), "needs": results}))
          if results.get("validate") != "success":
              print("dx-ci: input validation failed; see the validate job")
              sys.exit(1)
          checks = {name: result for name, result in results.items() if name != "validate"}
          missing = sorted(name for name in required if name not in results)
          bad = sorted(
              name for name, result in checks.items()
              if result not in ("success", "skipped")
          )
          lost = sorted(
              name for name, result in checks.items()
              if result == "skipped" and name not in disabled
          )
          if lost:
              print(f"dx-ci: skipped without disabled_checks: {', '.join(lost)}")
          if bad:
              print(f"dx-ci: failing checks: {', '.join(bad)}")
          if missing:
              print(f"dx-ci: missing checks: {', '.join(missing)}")
          if bad or lost or missing:
              sys.exit(1)
          EOF
        env:
          NEEDS: ${{ toJSON(needs) }}
          DISABLED: ${{ needs.validate.outputs.disabled }}
