# Reusable consumer CI. This repository cuts no releases; the
# consumer-owned caller pins this file at a reviewed commit:
#   uses: rules_dx/.github/workflows/reusable-consumer.yml@<commit>
# Reviewed pin bumps only; no silent upgrades. Consumers never copy
# per-check execution, parsing, review, or comment-management logic.
#
# Contract: docs/github-ci.md. Nine checks, all per-platform (lint,
# typecheck, format, generate, security-audit, license-audit, test,
# build, coverage): every enabled check runs on every selected platform.
# Starter enables all nine; callers disable individual checks by ID.
# `platforms` selects the matrix; empty selects Linux x86_64 only.
# Checks run in parallel. Aggregate `dx-ci` is the single stable
# required check.
# Reporting is first-party dx code; no reviewdog. No SARIF upload step
# ships here; `code_scanning_opt_in` is accepted and ignored.
#
# Hygiene (issue #80, deduped under #915): job bootstraps are an inline
# no-secrets `actions/checkout` (must be step 1) plus the pinned
# `bazel-contrib/setup-bazel` action (commit SHA plus trailing tag
# comment); every third-party action is pinned to a commit SHA with its
# tag in a trailing comment. The optional BuildBuddy remote cache rides
# the caller-provided `BUILDBUDDY_API_KEY` secret through the workflow
# `BAZEL_CONFIG` plus `BB_ARGS` env on every Bazel plus dx call.
# Inner dx Bazel invocations share the cache: dx resolves `bytestream://`
# BEP artifacts through workspace-local copies materialized by
# `--remote_download_outputs=all`.
# Platform labels map to runners through the fixed table in each job's
# `runs-on`; unknown labels fail the workflow when the matrix expands.

name: rules-dx-consumer

on:
  workflow_call:
    inputs:
      rules_dx_version:
        description: "Pinned rules_dx version (e.g. 0.0.0). Must match the consumer MODULE.bazel pin."
        required: true
        type: string
      disabled_checks:
        description: "Comma-separated check IDs to omit (e.g. coverage,license-audit). Empty enables all nine."
        required: false
        default: ""
        type: string
      platforms:
        description: 'JSON array of platform labels for every check (e.g. ["linux_x86_64"]). Empty runs Linux x86_64 only.'
        required: false
        default: ""
        type: string
      scheduling_mode:
        description: "parallel (default) or sequential. Accepted and ignored for now; checks run in parallel until sequential qualifies."
        required: false
        default: "parallel"
        type: string
      code_scanning_opt_in:
        description: "Accepted and ignored. No SARIF upload step ships in this workflow."
        required: false
        default: false
        type: boolean
      min_coverage:
        description: "Required line-coverage percent for the coverage check (e.g. 80). Empty collects without enforcing a threshold."
        required: false
        default: ""
        type: string
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key enabling the shared remote cache. Optional; jobs skip remote-cache configuration when absent."
        required: false

permissions:
  contents: read

env:
  # CI flag set (the workspace `.bazelrc` `ci` plus `ci-pr` configs) and
  # the optional BuildBuddy key, passed inline on every Bazel and dx call.
  # No key (fork pull request, or a caller that passes no secret): both
  # stay empty, so no remote-cache flag is set at all and Bazel runs
  # local-cache only. With a key, pull requests stay read-only via
  # `ci-pr` and the header rides inline (never in a committed rc file).
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ secrets.BUILDBUDDY_API_KEY != '' && format('--remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
  # Git Bash must preserve Bazel labels (`//...`) when invoking native
  # Windows binaries, while still converting MSYS paths (`/c/...`) for
  # tools like tsc.bat. Exclude only `//`, not `*`.
  MSYS2_ARG_CONV_EXCL: "//"
  # Single-sourced Bazelisk pin for every setup-bazel step in this
  # workflow (kept in sync with .devcontainer/Dockerfile.prebuilt).
  BAZELISK_VERSION: "1.29.0"

concurrency:
  group: dx-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',lint,') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ fromJSON('{"linux_x86_64":"ubuntu-latest","linux_arm64":"ubuntu-24.04-arm","macos_arm64":"macos-14","windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Verify rules_dx pin
        env:
          RULES_DX_PIN: ${{ inputs.rules_dx_version }}
        run: test -f MODULE.bazel && grep -F -q "version = \"$RULES_DX_PIN\"" MODULE.bazel
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- lint --check //... -- $BAZEL_CONFIG $BB_ARGS
  typecheck:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',typecheck,') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ fromJSON('{"linux_x86_64":"ubuntu-latest","linux_arm64":"ubuntu-24.04-arm","macos_arm64":"macos-14","windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- typecheck --check //... -- $BAZEL_CONFIG $BB_ARGS
  format:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',format,') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ fromJSON('{"linux_x86_64":"ubuntu-latest","linux_arm64":"ubuntu-24.04-arm","macos_arm64":"macos-14","windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- format --check //... -- $BAZEL_CONFIG $BB_ARGS
  generate:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',generate,') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ fromJSON('{"linux_x86_64":"ubuntu-latest","linux_arm64":"ubuntu-24.04-arm","macos_arm64":"macos-14","windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- generate --check //... -- $BAZEL_CONFIG $BB_ARGS
  security-audit:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',security-audit,') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ fromJSON('{"linux_x86_64":"ubuntu-latest","linux_arm64":"ubuntu-24.04-arm","macos_arm64":"macos-14","windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Resolve hermetic Gitleaks
        run: |
          rel="$(bazel cquery --output=files @dx_tools//:gitleaks $BAZEL_CONFIG $BB_ARGS 2>/dev/null | tail -1)"
          echo "DX_GITLEAKS_BIN=$(bazel info output_base)/$rel" >> "$GITHUB_ENV"
      - name: Populate advisory snapshots (OSV offline sets)
        # dx audit security loads `.dx/advisory/<set>.json` plus identity
        # offline (no network in the audit itself). Populate every curated
        # advisory set from the OSV GCS zips, merge each zip's per-vuln
        # JSON files into one array, and write same-day identities. A set
        # with a lockfile and no snapshot fails the audit.
        run: |
          set -euo pipefail
          mkdir -p .dx/advisory
          today="$(date -u +%F)"
          populate() {
            set="$1"
            url="$2"
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/all.zip" "$url"
            python3 - "$tmp" "$set" "$url" "$today" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          tmp, set_name, url, today = sys.argv[1:5]
          root = pathlib.Path(tmp)
          with zipfile.ZipFile(root / "all.zip") as zf:
              zf.extractall(root / "db")
          vulns = []
          for path in sorted((root / "db").rglob("*.json")):
              text = path.read_text(encoding="utf-8")
              if not text.strip():
                  continue
              data = json.loads(text)
              if isinstance(data, list):
                  vulns.extend(data)
              else:
                  vulns.append(data)
          out = pathlib.Path(".dx/advisory") / f"{set_name}.json"
          payload = json.dumps(vulns, separators=(",", ":"), sort_keys=True).encode("utf-8")
          out.write_bytes(payload)
          meta = {
              "set": set_name,
              "url": url,
              "sha256": hashlib.sha256(payload).hexdigest(),
              "retrieved_at": today,
              "path": str(out),
          }
          pathlib.Path(str(out).replace(".json", ".meta.json")).write_text(
              json.dumps(meta, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"{set_name}: {len(vulns)} advisories")
          PY
            rm -rf "$tmp"
          }
          populate cargo "https://osv-vulnerabilities.storage.googleapis.com/crates.io/all.zip"
          populate npm "https://osv-vulnerabilities.storage.googleapis.com/npm/all.zip"
          populate maven "https://osv-vulnerabilities.storage.googleapis.com/Maven/all.zip"
          populate nuget "https://osv-vulnerabilities.storage.googleapis.com/NuGet/all.zip"
          populate go "https://osv-vulnerabilities.storage.googleapis.com/Go/all.zip"
          populate rubygems "https://osv-vulnerabilities.storage.googleapis.com/RubyGems/all.zip"
      # Audit backends run no Bazel (live Gitleaks plus lockfile/advisory
      # analysis over the checkout), so this call takes no `--` forwards.
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- security //...
  license-audit:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',license-audit,') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ fromJSON('{"linux_x86_64":"ubuntu-latest","linux_arm64":"ubuntu-24.04-arm","macos_arm64":"macos-14","windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      # Audit backends run no Bazel (live Gitleaks plus lockfile/advisory
      # analysis over the checkout), so this call takes no `--` forwards.
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- license //...
  test:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',test,') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ fromJSON('{"linux_x86_64":"ubuntu-latest","linux_arm64":"ubuntu-24.04-arm","macos_arm64":"macos-14","windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- test //... -- $BAZEL_CONFIG $BB_ARGS
  build:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',build,') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ fromJSON('{"linux_x86_64":"ubuntu-latest","linux_arm64":"ubuntu-24.04-arm","macos_arm64":"macos-14","windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- build //... -- $BAZEL_CONFIG $BB_ARGS
  coverage:
    if: ${{ !contains(format(',{0},', inputs.disabled_checks), ',coverage,') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms != '' && inputs.platforms || '["linux_x86_64"]') }}
    runs-on: ${{ fromJSON('{"linux_x86_64":"ubuntu-latest","linux_arm64":"ubuntu-24.04-arm","macos_arm64":"macos-14","windows_x86_64":"windows-latest","windows_arm64":"windows-11-arm"}')[matrix.platform] }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Run coverage with optional threshold
        env:
          DX_MIN_COVERAGE: ${{ inputs.min_coverage }}
        run: |
          set +e
          extra=()
          if [ -n "$DX_MIN_COVERAGE" ]; then
            case "$DX_MIN_COVERAGE" in
              ''|*[!0-9.]*|*.*.*|.*|*.) echo "dx-ci: invalid min_coverage '$DX_MIN_COVERAGE': want e.g. 80 or 80.5" >&2; exit 1 ;;
            esac
            extra=(--min-coverage "$DX_MIN_COVERAGE")
          fi
          # Array on purpose (issue #914): empty stays zero words, a
          # validated numeric threshold stays one flag plus one value.
          # Input travels via env and is numeric-validated above, never
          # interpolated into the script.
          bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- coverage "${extra[@]}" //... -- $BAZEL_CONFIG $BB_ARGS 2>&1 | tee ${RUNNER_TEMP:-/tmp}/dx_coverage.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > ${RUNNER_TEMP:-/tmp}/dx_coverage.rc
          exit $rc
      - name: Render first-party coverage summary (per-cell, no union)
        # First-party PR reporting (issue #254): same comment contract as
        # this repo's seed cell, per platform cell. Bazel-owned dx coverage
        # stays the gate; this step only presents its counts. No cross-cell
        # union, no averaged percentages, no rounding up. Findings stay in
        # counts only with no invented locations.
        if: always()
        run: |
          set -euo pipefail
          cell="coverage ${{ matrix.platform }}"
          dx_rc="$(cat ${RUNNER_TEMP:-/tmp}/dx_coverage.rc 2>/dev/null || echo unknown)"
          dx_line="$(grep -E -e 'coverage .*lines.*meets minimum|coverage_below_minimum' ${RUNNER_TEMP:-/tmp}/dx_coverage.log 2>/dev/null | head -n 1 || true)"
          if [[ "$dx_rc" == "0" ]]; then status="PASS"; else status="FAIL"; fi
          {
            echo "<!-- dx-coverage-summary: $cell -->"
            echo "## Coverage summary — $cell — $status"
            echo ""
            echo "Analyzed revision: \`${GITHUB_SHA}\` | Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} | Cell: \`$cell\`."
            echo ""
            if [[ -n "$dx_line" ]]; then echo "$dx_line"; echo ""; fi
            echo "Gate exit: $dx_rc (comment never changes this outcome)."
            echo ""
            echo "LCOV: Bazel-owned combined report for this cell (see workflow run ${GITHUB_RUN_ID})."
            echo ""
            echo "Scope: per-cell exact counts only; no cross-cell union, no averaged percentages, no rounding up. Codecov stays opt-in only, never required."
            echo ""
            echo "Findings outside the diff stay in counts only; no invented review locations."
          } > ${RUNNER_TEMP:-/tmp}/coverage_comment.md
          cat ${RUNNER_TEMP:-/tmp}/coverage_comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish PR summary comment (dedup marker, fork-safe)
        # One updated comment per PR per cell marker; human comments never
        # touched; stale runs never overwrite current (concurrency cancels
        # superseded runs). Fork PRs skip so fork code never gets write
        # credentials. Publication failure fails separately while the gate
        # outcome above stays preserved.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          jq --version
          gh --version | head -n 1 | grep -qE '^gh version ([2-9]|[1-9][0-9])\.'
          jq --version | grep -qE '^jq-(1\.([6-9]|[0-9]{2,})|[2-9])'
          head_repo="${{ github.event.pull_request.head.repo.full_name }}"
          base_repo="${{ github.repository }}"
          if [[ "$head_repo" != "$base_repo" ]]; then
            echo "Fork PR detected: step-summary only, no PR comment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker="dx-coverage-summary: coverage ${{ matrix.platform }}"
          pr="${{ github.event.pull_request.number }}"
          existing="$(gh api "repos/$base_repo/issues/$pr/comments?per_page=100" --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | last // empty" || true)"
          if [[ -n "$existing" ]]; then
            jq -Rs '{body: .}' ${RUNNER_TEMP:-/tmp}/coverage_comment.md > ${RUNNER_TEMP:-/tmp}/coverage_payload.json
            gh api -X PATCH "repos/$base_repo/issues/comments/$existing" --input ${RUNNER_TEMP:-/tmp}/coverage_payload.json --jq .id
          else
            gh pr comment "$pr" --body-file ${RUNNER_TEMP:-/tmp}/coverage_comment.md
          fi

  dx-ci:
    name: dx-ci (aggregate)
    needs: [lint, typecheck, format, generate, security-audit, license-audit, test, build, coverage]
    if: ${{ always() }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Aggregate selected check results
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          results = {name: info.get("result") for name, info in needs.items()}
          print(json.dumps({"aggregate": "dx-ci", "needs": results}))
          # Disabled checks report skipped and stay green; every other
          # non-success (failure, cancelled) fails the aggregate so the
          # stable required check never hides a failing selection.
          bad = sorted(
              name for name, result in results.items()
              if result not in ("success", "skipped")
          )
          if bad:
              print(f"dx-ci: failing checks: {', '.join(bad)}")
              sys.exit(1)
          EOF
        env:
          NEEDS: ${{ toJSON(needs) }}
