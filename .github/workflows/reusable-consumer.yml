name: rules-dx-consumer

on:
  workflow_call:
    inputs:
      disabled_checks:
        description: "Comma-separated check IDs to omit (e.g. coverage,license-audit). Empty enables all nine."
        required: false
        default: ""
        type: string
      platforms:
        description: 'JSON array of platform labels for every check (e.g. ["linux_x86_64"]). Omit it to run Linux x86_64 only; [] fails validation.'
        required: false
        default: ""
        type: string
      min_coverage:
        description: "Required line-coverage percent for the coverage check (e.g. 80), a whole number from 0 to 100. Empty collects without enforcing a threshold."
        required: false
        default: ""
        type: string
      min_changed_line_coverage:
        description: "Required percent of executable lines a pull request adds that tests cover, a whole number from 0 to 100. Empty skips the changed-line check."
        required: false
        default: ""
        type: string
      affected_on_pr:
        description: "On pull_request events, run lint, typecheck, format, test, build and (when no coverage threshold is set) coverage with --affected. Push and merge_group events keep //... ."
        required: false
        default: true
        type: boolean
      buf_breaking_on_pr:
        description: "On pull_request events, run dx lint with --breaking-against so buf breaking compares the proto files with the pull request base."
        required: false
        default: false
        type: boolean
      link_check_online:
        description: "Run dx lint with --online so lychee also checks external links. Pull requests always stay offline; call this workflow from a schedule to use it."
        required: false
        default: false
        type: boolean
      mutate:
        description: "Run dx mutate on targets tagged dx-mutate. Runs only on scheduled and manually dispatched runs of the default branch; call this workflow from a weekly schedule to use it."
        required: false
        default: false
        type: boolean
      fuzz:
        description: "Run dx fuzz on targets tagged dx-fuzz on Linux x86_64, with the corpus cached between runs. A crash fails the job and uploads the dx-fuzz-crashes artifact."
        required: false
        default: false
        type: boolean
      fuzz_time:
        description: "Time budget per fuzz target, such as 90s, 5m or 1h."
        required: false
        default: "300s"
        type: string
      bench:
        description: "Run dx bench on Linux x86_64. Pushes to the default branch upload the dx-bench-linux_x86_64 artifact for 90 days; pull requests compare against the base branch and fail on a regression."
        required: false
        default: false
        type: boolean
      bench_regression_pct:
        description: "Percent a benchmark may be slower than the base branch on a pull request before the bench job fails, a whole number from 0 to 100."
        required: false
        default: "20"
        type: string
      remote_cache:
        description: "URL of an REAPI remote cache, for example grpc://cache.example.com:9092. Empty keeps BUILDBUDDY_API_KEY as the only way to enable a cache."
        required: false
        default: ""
        type: string
      invocation_id:
        description: "Names this call's advisory artifact. Empty keeps advisory-snapshots for a single call. Two calls in one parent run need distinct IDs of 1 to 40 letters, digits, underscores or hyphens."
        required: false
        default: ""
        type: string
      commit_lint:
        description: "On pull requests, fail when a commit between the base and the head is not a conventional commit (dx release --check --commits). Skipped subjects come from release.toml."
        required: false
        default: false
        type: boolean
    secrets:
      REMOTE_CACHE_HEADER:
        description: "Header for the remote cache as name=value. Optional; used with remote_cache."
        required: false
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key enabling the shared remote cache. Optional; jobs skip remote-cache configuration when absent."
        required: false

permissions:
  contents: read

env:
  # All stay empty unless the caller sets remote_cache or passes BUILDBUDDY_API_KEY.
  BAZEL_CONFIG: ${{ (inputs.remote_cache != '' || secrets.BUILDBUDDY_API_KEY != '') && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ inputs.remote_cache != '' && format('--remote_cache={0}', inputs.remote_cache) || '' }} ${{ secrets.REMOTE_CACHE_HEADER == '' && secrets.BUILDBUDDY_API_KEY != '' && format('--remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
  REMOTE_HEADER: ${{ secrets.REMOTE_CACHE_HEADER }}
  # Git Bash must not convert Bazel labels.
  MSYS2_ARG_CONV_EXCL: "//"
  BAZELISK_VERSION: "1.29.0"

concurrency:
  group: dx-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.invocation_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate (inputs)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cache_saver: ${{ steps.validate.outputs.cache_saver }}
      check_lines: ${{ steps.validate.outputs.check_lines }}
      checks_timeout: ${{ steps.validate.outputs.checks_timeout }}
      disabled: ${{ steps.validate.outputs.disabled }}
      min_changed_line_coverage: ${{ steps.validate.outputs.min_changed_line_coverage }}
      min_coverage: ${{ steps.validate.outputs.min_coverage }}
      platforms: ${{ steps.validate.outputs.platforms }}
      runners: ${{ steps.validate.outputs.runners }}
      snapshot_artifact: ${{ steps.validate.outputs.snapshot_artifact }}
      artifact_suffix: ${{ steps.validate.outputs.artifact_suffix }}
      checks: ${{ steps.validate.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Write the Bazel preset layers
        # dx writes the gitignored .dx/bazelrc; a pinned release runs the cached dx without Bazel.
        run: |
          if [ -s .dx/pins ] && [ -f tools/dx ]; then
            if [ "$RUNNER_OS" = Windows ]; then
              cmd.exe //c tools\\dx.cmd completion bash > /dev/null
            else
              tools/dx completion bash > /dev/null
            fi
          else
            bazel run --lockfile_mode=error @rules_dx//:dx -- completion bash > /dev/null
          fi
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Stamp the restored Bazel repository cache
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        shell: bash
        run: touch "$RUNNER_TEMP/dx-repo-cache.stamp"
      - name: Validate workflow inputs
        id: validate
        env:
          DX_PLATFORMS: ${{ inputs.platforms }}
          DX_DISABLED_CHECKS: ${{ inputs.disabled_checks }}
          DX_MIN_COVERAGE: ${{ inputs.min_coverage }}
          DX_MIN_CHANGED_LINE_COVERAGE: ${{ inputs.min_changed_line_coverage }}
          DX_INVOCATION_ID: ${{ inputs.invocation_id }}
          DX_FUZZ_TIME: ${{ inputs.fuzz_time }}
          DX_BENCH_REGRESSION_PCT: ${{ inputs.bench_regression_pct }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          bazel run "$@" @rules_dx//tools/ci:input_validation_bin
  checks:
    name: checks (${{ matrix.platform }})
    needs: [validate]
    if: ${{ needs.validate.outputs.checks != '[]' || !contains(format(',{0},', needs.validate.outputs.disabled), ',coverage,') }}
    timeout-minutes: ${{ fromJSON(needs.validate.outputs.checks_timeout) }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.platforms) }}
    runs-on: ${{ fromJSON(needs.validate.outputs.runners)[matrix.platform] }}
    permissions:
      contents: read
      pull-requests: write
    env:
      DX_AFFECTED: ${{ github.event_name == 'pull_request' && inputs.affected_on_pr }}
      DX_LINK_CHECK_ONLINE: ${{ github.event_name != 'pull_request' && inputs.link_check_online }}
      DX_BUF_BREAKING: ${{ github.event_name == 'pull_request' && inputs.buf_breaking_on_pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.validate.outputs.min_changed_line_coverage != '' && '0' || (env.DX_AFFECTED == 'true' || env.DX_BUF_BREAKING == 'true') && '2' || '1' }}
      - name: Pin the pull request base for --affected
        if: ${{ env.DX_AFFECTED == 'true' || env.DX_BUF_BREAKING == 'true' || (github.event_name == 'pull_request' && needs.validate.outputs.min_changed_line_coverage != '') }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          DX_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base='HEAD^1'
          if ! git rev-parse --verify -q 'HEAD^2' >/dev/null; then
            if [ "$DX_AFFECTED" = "true" ]; then
              echo "::warning::checkout is not a merge commit; falling back to //..."
              echo "DX_AFFECTED=false" >> "$GITHUB_ENV"
              exit 0
            fi
            base="$DX_PR_BASE"
          fi
          git update-ref "refs/remotes/origin/$GITHUB_BASE_REF" "$base"
          git symbolic-ref refs/remotes/origin/HEAD "refs/remotes/origin/$GITHUB_BASE_REF"
          echo '/bazel-*' >> "$(git rev-parse --git-path info/exclude)"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
          disk-cache: ${{ inputs.remote_cache == '' && secrets.BUILDBUDDY_API_KEY == '' && format('checks-{0}', matrix.platform) || 'false' }}
      - name: Write the Bazel preset layers
        # dx writes the gitignored .dx/bazelrc; a pinned release runs the cached dx without Bazel.
        run: |
          if [ -s .dx/pins ] && [ -f tools/dx ]; then
            if [ "$RUNNER_OS" = Windows ]; then
              cmd.exe //c tools\\dx.cmd completion bash > /dev/null
            else
              tools/dx completion bash > /dev/null
            fi
          else
            bazel run --lockfile_mode=error @rules_dx//:dx -- completion bash > /dev/null
          fi
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Stamp the restored Bazel repository cache
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.validate.outputs.cache_saver == github.job && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        shell: bash
        run: touch "$RUNNER_TEMP/dx-repo-cache.stamp"
      - name: Run the checks
        env:
          DX_CHECK_LINES: ${{ needs.validate.outputs.check_lines }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          failed=0
          while IFS='|' read -r id dx_args dx_reports passthrough; do
            [ -n "$id" ] || continue
            scope='//...'
            case "$id" in
              lint|typecheck|format|test|build)
                if [ "$DX_AFFECTED" = "true" ]; then scope='--affected'; fi
                ;;
            esac
            reports="${RUNNER_TEMP:-/tmp}/dx-reports/$id"
            mkdir -p "$reports"
            read -ra args <<< "$dx_args"
            read -ra tokens <<< "$dx_reports"
            for token in "${tokens[@]}"; do
              args+=(--report "${token%%=*}=$reports/${token#*=}")
            done
            if [ "$id" = "lint" ] && [ "$DX_LINK_CHECK_ONLINE" = "true" ]; then
              args+=(--online)
            fi
            if [ "$id" = "lint" ] && [ "$DX_BUF_BREAKING" = "true" ]; then
              args+=(--breaking-against)
            fi
            args+=("$scope")
            if [ "$passthrough" = "true" ]; then
              args+=(-- "$@")
            fi
            echo "::group::$id"
            rc=0
            bazel run "$@" @rules_dx//:dx -- "${args[@]}" < /dev/null || rc=$?
            echo "::endgroup::"
            case "$id" in
              test|build)
                cp .dx/local/profile/report.json "$reports/profile-$id.json" 2>/dev/null || true
                ;;
            esac
            if [ "$rc" -eq 0 ]; then
              echo "$id: passed (exit 0)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$id: failed (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done <<< "$DX_CHECK_LINES"
          exit "$failed"
      - name: Upload the lint reports
        if: ${{ always() && contains(needs.validate.outputs.checks, '"id":"lint"') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx-reports-lint-${{ matrix.platform }}${{ needs.validate.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/dx-reports/lint
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the typecheck reports
        if: ${{ always() && contains(needs.validate.outputs.checks, '"id":"typecheck"') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx-reports-typecheck-${{ matrix.platform }}${{ needs.validate.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/dx-reports/typecheck
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the test reports
        if: ${{ always() && contains(needs.validate.outputs.checks, '"id":"test"') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx-reports-test-${{ matrix.platform }}${{ needs.validate.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/dx-reports/test
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the build reports
        if: ${{ always() && contains(needs.validate.outputs.checks, '"id":"build"') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx-reports-build-${{ matrix.platform }}${{ needs.validate.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/dx-reports/build
          if-no-files-found: warn
          retention-days: 14
      - name: Prove dx run works noninteractively in CI
        if: ${{ !cancelled() && contains(needs.validate.outputs.checks, '"id":"build"') }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          bazel run "$@" @rules_dx//:dx -- run @rules_dx//:dx -- --version
      - name: Run coverage with optional threshold
        if: ${{ always() && !contains(format(',{0},', needs.validate.outputs.disabled), ',coverage,') }}
        env:
          DX_MIN_COVERAGE: ${{ needs.validate.outputs.min_coverage }}
          DX_MIN_CHANGED_LINE_COVERAGE: ${{ needs.validate.outputs.min_changed_line_coverage }}
          DX_EVENT: ${{ github.event_name }}
        run: |
          set +e
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          scope=//...
          if [ "$DX_AFFECTED" = true ] && [ -z "$DX_MIN_COVERAGE" ] && [ -z "$DX_MIN_CHANGED_LINE_COVERAGE" ]; then
            scope=--affected
          fi
          reports="${RUNNER_TEMP:-/tmp}/dx-reports/coverage"
          mkdir -p "$reports"
          extra=(--report "failures=$reports/failures.json" --report "results=$reports/results.json")
          # Bash array keeps an empty threshold at zero words.
          if [ -n "$DX_MIN_COVERAGE" ]; then
            extra+=(--min-coverage "$DX_MIN_COVERAGE")
          fi
          if [ -n "$DX_MIN_CHANGED_LINE_COVERAGE" ]; then
            if [ "$DX_EVENT" = "pull_request" ]; then
              extra+=(--min-changed-line-coverage "$DX_MIN_CHANGED_LINE_COVERAGE")
            else
              echo "dx-ci: changed-line coverage needs a pull_request event, so it did not run on $DX_EVENT." | tee -a "$GITHUB_STEP_SUMMARY"
              echo skipped > "${RUNNER_TEMP}/dx_changed_lines.rc"
            fi
          fi
          bazel run "$@" @rules_dx//:dx -- coverage --output=json "${extra[@]}" "$scope" -- "$@" > "$reports/coverage.ndjson"
          rc=$?
          echo "$rc" > "${RUNNER_TEMP:-/tmp}"/dx_coverage.rc
          exit "$rc"
      - name: Upload the coverage reports
        if: ${{ always() && !contains(format(',{0},', needs.validate.outputs.disabled), ',coverage,') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx-reports-coverage-${{ matrix.platform }}${{ needs.validate.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/dx-reports/coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Check changed-line coverage
        if: ${{ always() && !contains(format(',{0},', needs.validate.outputs.disabled), ',coverage,') && needs.validate.outputs.min_changed_line_coverage != '' && github.event_name == 'pull_request' }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          events="${RUNNER_TEMP}/dx-reports/coverage/coverage.ndjson"
          result="$(jq -rR 'fromjson? | select(.event=="changed_line_coverage") | .result' "$events" 2>/dev/null | head -n 1 || true)"
          jq -rR 'fromjson? | select(.event=="changed_line_coverage") | "changed-line coverage \(.result): \(.covered_lines)/\(.eligible_lines) lines, minimum \(.minimum)%, merge base \(.merge_base)", (.uncovered[]? | "changed_line_uncovered: \(.path):\(.line)")' "$events" > "${RUNNER_TEMP}/dx_changed_lines.txt" 2>/dev/null || true
          case "$result" in
            pass | not-applicable) rc=0 ;;
            "") rc="not run" ;;
            *) rc=1 ;;
          esac
          echo "$rc" > "${RUNNER_TEMP}/dx_changed_lines.rc"
          {
            echo "## Changed-line coverage - ${PLATFORM}"
            echo '```text'
            cat "${RUNNER_TEMP}/dx_changed_lines.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Render first-party coverage summary (per-cell, no union)
        if: ${{ always() && !contains(format(',{0},', needs.validate.outputs.disabled), ',coverage,') }}
        env:
          DX_MIN_CHANGED_LINE_COVERAGE: ${{ needs.validate.outputs.min_changed_line_coverage }}
          DX_INVOCATION_ID: ${{ inputs.invocation_id }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cell="coverage ${PLATFORM}"
          if [[ -n "$DX_INVOCATION_ID" ]]; then cell="$cell $DX_INVOCATION_ID"; fi
          dx_rc="$(cat "${RUNNER_TEMP:-/tmp}"/dx_coverage.rc 2>/dev/null || echo unknown)"
          events="${RUNNER_TEMP:-/tmp}/dx-reports/coverage/coverage.ndjson"
          dx_line="$(jq -rR 'fromjson? | select(.event=="error" and .code=="coverage_below_minimum") | .message' "$events" 2>/dev/null | head -n 1 || true)"
          if [[ -z "$dx_line" ]]; then
            dx_line="$(jq -rR 'fromjson? | select(.event=="coverage" and .passed==true and .minimum!=null) | "coverage \(.covered_lines)/\(.eligible_lines) lines meets minimum \(.minimum)% in cell \(.cell)"' "$events" 2>/dev/null | head -n 1 || true)"
          fi
          sources_lines="$(jq -rR 'fromjson? | select(.code=="coverage_sources" or .code=="coverage_sources_incomplete") | "\(.code): \(.message)"' "$events" 2>/dev/null | head -n 200 || true)"
          if [[ -z "$DX_MIN_CHANGED_LINE_COVERAGE" ]]; then
            changed_rc="not configured"
          else
            changed_rc="$(cat "${RUNNER_TEMP:-/tmp}"/dx_changed_lines.rc 2>/dev/null || echo "not run")"
          fi
          changed_line="$(grep -v -e '^[[:space:]]*$' "${RUNNER_TEMP:-/tmp}"/dx_changed_lines.txt 2>/dev/null | head -n 1 || true)"
          profile_lines=""
          for id in build test; do
            profile_lines+="$(jq -r --arg id "$id" '
              def clock: (. / 1000000 | floor) as $s | "\($s / 60 | floor)m\($s % 60 | tostring | if length < 2 then "0" + . else . end)s";
              select(.cache != null and .cache.actions > 0)
              | "\($id): \(.cache.hit_percent)% cache hits (remote \(.cache.remote_hits * 100 / .cache.actions | floor)%, disk \(.cache.disk_hits * 100 / .cache.actions | floor)%), \(.wall_micros | clock), critical path \(.critical_path_micros | clock)"
            ' "${RUNNER_TEMP:-/tmp}/dx-reports/$id/profile-$id.json" 2>/dev/null || true)"$'\n'
          done
          profile_lines="$(printf '%s' "$profile_lines" | grep -v '^$' || true)"
          status="PASS"
          if [[ "$dx_rc" != "0" ]]; then status="FAIL"; fi
          if [[ "$changed_rc" =~ ^[0-9]+$ && "$changed_rc" != "0" ]]; then status="FAIL"; fi
          {
            echo "<!-- dx-coverage-summary: $cell -->"
            echo "## Coverage summary — $cell — $status"
            echo ""
            echo "Analyzed revision: \`${GITHUB_SHA}\` | Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} | Cell: \`$cell\`."
            echo ""
            if [[ -n "$dx_line" ]]; then echo "$dx_line"; echo ""; fi
            if [[ -n "$sources_lines" ]]; then echo '```text'; echo "$sources_lines"; echo '```'; echo ""; fi
            if [[ -n "$profile_lines" ]]; then echo '```text'; echo "$profile_lines"; echo '```'; echo ""; fi
            echo "Gate exit: $dx_rc (comment never changes this outcome)."
            echo ""
            echo "Changed-line gate exit: $changed_rc"
            echo ""
            if [[ -n "$changed_line" ]]; then echo "$changed_line"; echo ""; fi
            echo "LCOV: Bazel-owned combined report for this cell (see workflow run ${GITHUB_RUN_ID})."
            echo ""
            echo "Scope: per-cell exact counts only; no cross-cell union, no averaged percentages, no rounding up. Codecov stays opt-in only, never required."
            echo ""
            echo "Findings outside the diff stay in counts only; no invented review locations."
          } > "${RUNNER_TEMP:-/tmp}"/coverage_comment.md
          cat "${RUNNER_TEMP:-/tmp}"/coverage_comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish PR summary comment (dedup marker, fork-safe)
        if: ${{ always() && !contains(format(',{0},', needs.validate.outputs.disabled), ',coverage,') && github.event_name == 'pull_request' }}
        env:
          DX_INVOCATION_ID: ${{ inputs.invocation_id }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PLATFORM: ${{ matrix.platform }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh --version
          jq --version
          gh --version | head -n 1 | grep -qE '^gh version ([2-9]|[1-9][0-9])\.'
          jq --version | grep -qE '^jq-(1\.([6-9]|[0-9]{2,})|[2-9])'
          head_repo="${HEAD_REPO}"
          base_repo="${GITHUB_REPOSITORY}"
          if [[ "$head_repo" != "$base_repo" ]]; then
            echo "Fork PR detected: step-summary only, no PR comment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cell="coverage ${PLATFORM}"
          if [[ -n "$DX_INVOCATION_ID" ]]; then cell="$cell $DX_INVOCATION_ID"; fi
          marker="<!-- dx-coverage-summary: $cell -->"
          pr="${PR_NUMBER}"
          existing="$(gh api --paginate "repos/$base_repo/issues/$pr/comments?per_page=100" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n 1 || true)"
          if [[ -n "$existing" ]]; then
            jq -Rs '{body: .}' "${RUNNER_TEMP:-/tmp}"/coverage_comment.md > "${RUNNER_TEMP:-/tmp}"/coverage_payload.json
            gh api -X PATCH "repos/$base_repo/issues/comments/$existing" --input "${RUNNER_TEMP:-/tmp}"/coverage_payload.json --jq .id
          else
            gh pr comment "$pr" --body-file "${RUNNER_TEMP:-/tmp}"/coverage_comment.md
          fi
      - name: Record the runner image
        if: always()
        shell: bash
        run: |
          line="runner: os=${RUNNER_OS:-unknown} arch=${RUNNER_ARCH:-unknown} image=${ImageOS:-unknown} version=${ImageVersion:-unknown} bazel=$(bazel --version 2>&1 | head -n 1 || true)"
          echo "$line" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Prune the Bazel repository cache to this run's downloads
        if: ${{ success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.validate.outputs.cache_saver == github.job && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        shell: bash
        env:
          DX_REPO_CACHE: ${{ steps.repo-cache.outputs.path }}/content_addressable
        run: |
          # Bazel touches an entry on each hit, so entries older than the stamp went unused.
          stamp="$RUNNER_TEMP/dx-repo-cache.stamp"
          if [ ! -f "$stamp" ] || [ ! -d "$DX_REPO_CACHE" ]; then
            exit 0
          fi
          pruned=0
          for entry in "$DX_REPO_CACHE"/*/*/; do
            entry="${entry%/}"
            [ -d "$entry" ] || continue
            if [ ! "$entry/file" -nt "$stamp" ]; then
              rm -rf "$entry"
              pruned=$((pruned + 1))
            fi
          done
          size="$(du -sh "$DX_REPO_CACHE" | cut -f1)"
          echo "dx-ci: pruned $pruned unused repository cache entries; the saved cache holds $size." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save the Bazel repository cache
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.validate.outputs.cache_saver == github.job && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: ${{ steps.repo-cache-restore.outputs.cache-primary-key }}
  advisory-snapshots:
    name: advisory snapshots (one run, every platform)
    needs: [validate]
    if: ${{ !contains(format(',{0},', needs.validate.outputs.disabled), ',security-audit,') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      retrieved_at: ${{ steps.prepare.outputs.retrieved_at }}
      status: ${{ steps.prepare.outputs.status }}
      ecosystems: ${{ steps.prepare.outputs.ecosystems }}
      trivy: ${{ steps.prepare.outputs.trivy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Write the Bazel preset layers
        # dx writes the gitignored .dx/bazelrc; a pinned release runs the cached dx without Bazel.
        run: |
          if [ -s .dx/pins ] && [ -f tools/dx ]; then
            if [ "$RUNNER_OS" = Windows ]; then
              cmd.exe //c tools\\dx.cmd completion bash > /dev/null
            else
              tools/dx completion bash > /dev/null
            fi
          else
            bazel run --lockfile_mode=error @rules_dx//:dx -- completion bash > /dev/null
          fi
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Stamp the restored Bazel repository cache
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        shell: bash
        run: touch "$RUNNER_TEMP/dx-repo-cache.stamp"
      - name: Prepare one advisory snapshot set
        id: prepare
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          retrieved_at="$(date -u +%F)"
          echo "retrieved_at=$retrieved_at" >> "$GITHUB_OUTPUT"
          trivy_args=()
          if [ -n "$(git ls-files '*.tf' '*.bicep' 'Dockerfile' '*/Dockerfile' '*/Chart.yaml' | head -n 1)" ] ||
            git grep -q 'oci_deploy' -- '*BUILD' '*BUILD.bazel' '*.bzl'; then
            bazel build "$@" @rules_dx//cli/advisory_prep:trivy
            trivy_file="$(bazel cquery "$@" --output=files @rules_dx//cli/advisory_prep:trivy)"
            trivy_args=(--trivy "$(bazel info execution_root)/$trivy_file")
            echo "trivy=true" >> "$GITHUB_OUTPUT"
          fi
          bazel run "$@" @rules_dx//cli/advisory_prep -- \
            --workspace "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/.dx/local/advisory" \
            --date "$retrieved_at" \
            "${trivy_args[@]}" \
            --status-file "$GITHUB_OUTPUT"
      - name: Publish the advisory snapshots
        if: ${{ steps.prepare.outputs.status != 'empty' || steps.prepare.outputs.trivy == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.validate.outputs.snapshot_artifact }}
          path: .dx/local/advisory
          if-no-files-found: error
          retention-days: 1
  security-audit:
    needs: [validate, advisory-snapshots]
    if: ${{ !contains(format(',{0},', needs.validate.outputs.disabled), ',security-audit,') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.platforms) }}
    runs-on: ${{ fromJSON(needs.validate.outputs.runners)[matrix.platform] }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Write the Bazel preset layers
        # dx writes the gitignored .dx/bazelrc; a pinned release runs the cached dx without Bazel.
        run: |
          if [ -s .dx/pins ] && [ -f tools/dx ]; then
            if [ "$RUNNER_OS" = Windows ]; then
              cmd.exe //c tools\\dx.cmd completion bash > /dev/null
            else
              tools/dx completion bash > /dev/null
            fi
          else
            bazel run --lockfile_mode=error @rules_dx//:dx -- completion bash > /dev/null
          fi
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Stamp the restored Bazel repository cache
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        shell: bash
        run: touch "$RUNNER_TEMP/dx-repo-cache.stamp"
      - name: Resolve hermetic Gitleaks
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          bazel run "$@" @rules_dx//cli/tool_resolve -- --label @rules_dx//quality/artifacts:gitleaks --var DX_GITLEAKS_BIN -- "$@"
      - name: Cache the pinned advisory snapshots
        if: ${{ hashFiles('.dx/pins') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dx/local/advisory
          key: dx-advisory-${{ hashFiles('.dx/pins') }}
      - name: Restore the advisory snapshots this run prepared
        if: ${{ needs.advisory-snapshots.outputs.status != 'empty' || needs.advisory-snapshots.outputs.trivy == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.snapshot_artifact }}
          path: .dx/local/advisory
      # Audit backends run no Bazel and take no passthrough flags.
      - name: Audit against the shared snapshots
        env:
          DX_AUDIT_TODAY: ${{ needs.advisory-snapshots.outputs.retrieved_at }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          bazel run "$@" @rules_dx//:dx -- security //...
  mutate:
    name: mutate
    if: ${{ inputs.mutate && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: false
      - name: Run the mutation targets
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          bazel run "$@" @rules_dx//:dx -- mutate --time 10m //...
  fuzz:
    name: fuzz
    needs: [validate]
    if: ${{ inputs.fuzz }}
    timeout-minutes: 120
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: false
      - name: Restore the fuzz corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dx/local/fuzz
          key: dx-fuzz-corpus-${{ hashFiles('**/BUILD', '**/BUILD.bazel', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: dx-fuzz-corpus-${{ hashFiles('**/BUILD', '**/BUILD.bazel', 'MODULE.bazel.lock') }}-
      - name: Fuzz the dx-fuzz targets
        env:
          FUZZ_TIME: ${{ inputs.fuzz_time }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          bazel run "$@" @rules_dx//:dx -- fuzz --time "${FUZZ_TIME:-300s}" //...
      - name: Save the fuzz corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dx/local/fuzz
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: Upload the crashes
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx-fuzz-crashes
          path: .dx/local/fuzz/**/crash-*
          if-no-files-found: ignore
          retention-days: 30
  bench:
    name: bench
    needs: [validate]
    if: ${{ inputs.bench && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: false
      - name: Run the benchmarks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REGRESSION_PCT: ${{ inputs.bench_regression_pct }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          if [ "$EVENT" = pull_request ]; then
            status=0
            bazel run "$@" @rules_dx//:dx -- bench --compare "$BASE_REF" "--fail-on=regression:${REGRESSION_PCT:-20}" //... | tee "$RUNNER_TEMP/bench.txt" || status=$?
            {
              echo "## dx bench"
              echo '```'
              cat "$RUNNER_TEMP/bench.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          bazel run "$@" @rules_dx//:dx -- bench //...
      - name: Upload the results
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx-bench-linux_x86_64
          path: .dx/local/bench/last.json
          if-no-files-found: ignore
          retention-days: 90
  commit-lint:
    name: commit-lint
    if: ${{ inputs.commit_lint && github.event_name == 'pull_request' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: false
      - name: Lint the commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # shellcheck disable=SC2086
          set -- --lockfile_mode=error $BAZEL_CONFIG $BB_ARGS ${REMOTE_HEADER:+"--remote_header=$REMOTE_HEADER"}
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          bazel run "$@" @rules_dx//:dx -- release --check --commits "$base..$HEAD_SHA"
  dx-ci:
    name: dx-ci (aggregate)
    needs: [validate, checks, security-audit, advisory-snapshots]
    if: ${{ !cancelled() || github.event_name == 'merge_group' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Aggregate selected check results
        env:
          NEEDS_VALIDATE: ${{ needs.validate.result }}
          NEEDS_CHECKS: ${{ needs.checks.result }}
          NEEDS_SECURITY_AUDIT: ${{ needs.security-audit.result }}
          NEEDS_ADVISORY_SNAPSHOTS: ${{ needs.advisory-snapshots.result }}
          DISABLED: ${{ needs.validate.outputs.disabled }}
          CHECKS: ${{ needs.validate.outputs.checks }}
        run: |
          set -eu
          export LC_ALL=C
          required=(checks security-audit advisory-snapshots)
          disabled=()
          result() {
            local name="NEEDS_${1^^}"
            echo "${!name:-}"
          }
          is_disabled() {
            case " ${disabled[*]} " in
              *" $1 "*) return 0 ;;
            esac
            return 1
          }
          add_disabled() { is_disabled "$1" || disabled+=("$1"); }
          sorted() { printf '%s\n' "$@" | sort; }
          json_list() {
            local out="" item
            for item in $(sorted "$@"); do out="$out${out:+,}\"$item\""; done
            echo "[$out]"
          }
          say() {
            local label=$1
            shift
            [ $# -eq 0 ] || echo "dx-ci: $label: $(sorted "$@" | paste -sd, - | sed 's/,/, /g')"
          }
          IFS=, read -ra given <<<"$DISABLED"
          for name in "${given[@]}"; do
            [ -z "$name" ] || add_disabled "$name"
          done
          case ",$DISABLED," in
            *,security-audit,*) add_disabled advisory-snapshots ;;
          esac
          needs=""
          for name in validate "${required[@]}"; do
            value=$(result "${name//-/_}")
            [ -z "$value" ] || needs="$needs${needs:+,}\"$name\":\"$value\""
          done
          echo "{\"aggregate\":\"dx-ci\",\"disabled\":$(json_list "${disabled[@]}"),\"needs\":{$needs}}"
          if [ "$(result VALIDATE)" != success ]; then
            echo "dx-ci: input validation failed; see the validate job"
            exit 1
          fi
          if [ -z "${CHECKS:-}" ]; then
            echo "dx-ci: validate wrote no checks list; pin the workflow and rules_dx to the same commit"
            exit 1
          fi
          if [ "$CHECKS" = "[]" ] && is_disabled coverage; then
            add_disabled checks
          fi
          lost=() bad=() missing=()
          for name in "${required[@]}"; do
            case $(result "${name//-/_}") in
              "") missing+=("$name") ;;
              success) ;;
              skipped) is_disabled "$name" || lost+=("$name") ;;
              *) bad+=("$name") ;;
            esac
          done
          say "skipped without disabled_checks" "${lost[@]}"
          say "failing checks" "${bad[@]}"
          say "missing checks" "${missing[@]}"
          [ $((${#lost[@]} + ${#bad[@]} + ${#missing[@]})) -eq 0 ]
