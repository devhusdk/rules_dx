name: rules-dx-consumer

on:
  workflow_call:
    inputs:
      rules_dx_version:
        description: "Version of the rules_dx declaration in the consumer MODULE.bazel (e.g. 0.0.0). It must equal that call's version, not another dependency's."
        required: true
        type: string
      disabled_checks:
        description: "Comma-separated check IDs to omit (e.g. coverage,license-audit). Empty enables all nine."
        required: false
        default: ""
        type: string
      platforms:
        description: 'JSON array of platform labels for every check (e.g. ["linux_x86_64"]). Omit it to run Linux x86_64 only; [] fails validation.'
        required: false
        default: ""
        type: string
      scheduling_mode:
        description: "parallel. Only parallel is implemented; sequential fails validation instead of being ignored."
        required: false
        default: "parallel"
        type: string
      code_scanning_opt_in:
        description: "Must be false. No SARIF upload step ships in this workflow, so true fails validation instead of being ignored."
        required: false
        default: false
        type: boolean
      min_coverage:
        description: "Required line-coverage percent for the coverage check (e.g. 80), a whole number from 0 to 100. Empty collects without enforcing a threshold."
        required: false
        default: ""
        type: string
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key enabling the shared remote cache. Optional; jobs skip remote-cache configuration when absent."
        required: false

permissions:
  contents: read

env:
  # Both stay empty unless the caller passes BUILDBUDDY_API_KEY.
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ secrets.BUILDBUDDY_API_KEY != '' && format('--remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
  # Git Bash must not convert Bazel labels.
  MSYS2_ARG_CONV_EXCL: "//"
  BAZELISK_VERSION: "1.29.0"

concurrency:
  group: dx-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate (inputs)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      disabled: ${{ steps.validate.outputs.disabled }}
      min_coverage: ${{ steps.validate.outputs.min_coverage }}
      platforms: ${{ steps.validate.outputs.platforms }}
      runners: ${{ steps.validate.outputs.runners }}
    steps:
      - name: Validate workflow inputs
        id: validate
        env:
          DX_PLATFORMS: ${{ inputs.platforms }}
          DX_DISABLED_CHECKS: ${{ inputs.disabled_checks }}
          DX_SCHEDULING_MODE: ${{ inputs.scheduling_mode }}
          DX_CODE_SCANNING_OPT_IN: ${{ inputs.code_scanning_opt_in }}
          DX_MIN_COVERAGE: ${{ inputs.min_coverage }}
        run: |
          python3 - <<'DX_INPUT_VALIDATION'
          """Validates the consumer workflow inputs before any matrix job starts.

          The consumer workflow passes each workflow_call input through one environment
          variable and runs this file from standard input. A rejected input prints one
          diagnostic naming the accepted values, and an accepted input is written to
          GITHUB_OUTPUT so the matrix, runner, threshold and disabled-check wiring all
          read one validated source.
          """

          import json
          import os
          import re
          import sys

          PLATFORMS_ENV = "DX_PLATFORMS"
          DISABLED_ENV = "DX_DISABLED_CHECKS"
          SCHEDULING_ENV = "DX_SCHEDULING_MODE"
          SCANNING_ENV = "DX_CODE_SCANNING_OPT_IN"
          MIN_COVERAGE_ENV = "DX_MIN_COVERAGE"
          OUTPUT_ENV = "GITHUB_OUTPUT"

          PLATFORMS = {
              "linux_x86_64": "ubuntu-latest",
              "linux_arm64": "ubuntu-24.04-arm",
              "macos_arm64": "macos-14",
              "windows_x86_64": "windows-latest",
              "windows_arm64": "windows-11-arm",
          }
          DEFAULT_PLATFORMS = ["linux_x86_64"]
          CHECKS = (
              "lint",
              "typecheck",
              "format",
              "generate",
              "security-audit",
              "license-audit",
              "test",
              "build",
              "coverage",
          )
          SCHEDULING = "parallel"
          WHOLE_PERCENT = re.compile(r"[0-9]+")


          def fail(message):
              """Reports one diagnostic and returns a failing exit status."""
              print(f"dx-ci: {message}", file=sys.stderr)
              return 1


          def accepted(values):
              """Returns the accepted values as one comma-separated list."""
              return ", ".join(values)


          def json_type(value):
              """Returns the JSON type name of one parsed value."""
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "boolean"
              if isinstance(value, (int, float)):
                  return "number"
              if isinstance(value, str):
                  return "string"
              if isinstance(value, list):
                  return "array"
              return "object"


          def validate_platforms(text):
              """Returns the platform labels to run, or None after a diagnostic."""
              if text == "":
                  return DEFAULT_PLATFORMS
              try:
                  parsed = json.loads(text)
              except ValueError as error:
                  fail(f"{PLATFORMS_ENV} is not a JSON array: {error}. {platform_hint()}")
                  return None
              if not isinstance(parsed, list):
                  fail(
                      f"{PLATFORMS_ENV} is a JSON {json_type(parsed)}, not an array. {platform_hint()}"
                  )
                  return None
              if parsed == []:
                  fail(f"{PLATFORMS_ENV} is an empty array. {platform_hint()}")
                  return None
              for item in parsed:
                  if not isinstance(item, str):
                      fail(
                          f"{PLATFORMS_ENV} holds a JSON {json_type(item)}, not a platform label "
                          f"string. {platform_hint()}"
                      )
                      return None
              for item in parsed:
                  if item not in PLATFORMS:
                      fail(
                          f"{PLATFORMS_ENV} names unknown platform {item!r}. "
                          f"Accepted: {accepted(PLATFORMS)}."
                      )
                      return None
              seen = []
              for item in parsed:
                  if item in seen:
                      fail(f"{PLATFORMS_ENV} lists {item!r} twice. List every platform once.")
                      return None
                  seen.append(item)
              return parsed


          def platform_hint():
              """Returns the one sentence naming the accepted platforms and the default."""
              return f"Accepted: {accepted(PLATFORMS)}. Omit it to run {DEFAULT_PLATFORMS[0]}."


          def validate_disabled(text):
              """Returns the normalized disabled check IDs, or None after a diagnostic."""
              if text.strip() == "":
                  return []
              ids = []
              for part in text.split(","):
                  name = part.strip()
                  if name == "":
                      fail(
                          f"{DISABLED_ENV} holds an empty check ID in {text!r}. "
                          f"Accepted: {accepted(CHECKS)}."
                      )
                      return None
                  if name not in CHECKS:
                      fail(
                          f"{DISABLED_ENV} names unknown check {name!r}. Accepted: {accepted(CHECKS)}."
                      )
                      return None
                  if name in ids:
                      fail(f"{DISABLED_ENV} lists {name!r} twice. List every check ID once.")
                      return None
                  ids.append(name)
              return ids


          def validate_scheduling(text):
              """Returns the accepted scheduling mode, or None after a diagnostic."""
              if text != SCHEDULING:
                  fail(
                      f"{SCHEDULING_ENV}={text!r} is not implemented. Checks always run in "
                      f"parallel, so pass {SCHEDULING!r}."
                  )
                  return None
              return text


          def validate_scanning(text):
              """Returns the accepted code scanning opt-in, or None after a diagnostic."""
              if text == "false":
                  return text
              if text == "true":
                  fail(
                      f"{SCANNING_ENV}=true is not implemented. No SARIF upload step ships "
                      "in this workflow, so leave it false."
                  )
                  return None
              fail(f"{SCANNING_ENV}={text!r} is not true or false.")
              return None


          def validate_min_coverage(text):
              """Returns the coverage threshold to enforce, or None after a diagnostic."""
              if text == "":
                  return ""
              if WHOLE_PERCENT.fullmatch(text) is None or not 0 <= int(text) <= 100:
                  fail(
                      f"{MIN_COVERAGE_ENV}={text!r} is not a whole percent from 0 to 100. "
                      "Write a whole number such as 80, or omit it to collect without a "
                      "threshold."
                  )
                  return None
              return text


          def compact(value):
              """Returns value as JSON without spaces."""
              return json.dumps(value, separators=(",", ":"))


          def write_outputs(outputs):
              """Appends the validated values to the job output file."""
              path = os.environ.get(OUTPUT_ENV, "")
              if path == "":
                  fail(f"{OUTPUT_ENV} is unset, so the validated inputs cannot reach the jobs.")
                  return False
              with open(path, "a", encoding="utf-8") as handle:
                  for key in sorted(outputs):
                      print(f"{key}={outputs[key]}", file=handle)
              return True


          def main():
              """Validates every input, then writes the validated values as job outputs."""
              accepted_values = {
                  PLATFORMS_ENV: validate_platforms(os.environ.get(PLATFORMS_ENV, "")),
                  DISABLED_ENV: validate_disabled(os.environ.get(DISABLED_ENV, "")),
                  SCHEDULING_ENV: validate_scheduling(os.environ.get(SCHEDULING_ENV, SCHEDULING)),
                  SCANNING_ENV: validate_scanning(os.environ.get(SCANNING_ENV, "false")),
                  MIN_COVERAGE_ENV: validate_min_coverage(os.environ.get(MIN_COVERAGE_ENV, "")),
              }
              if any(value is None for value in accepted_values.values()):
                  return 1
              outputs = {
                  "platforms": compact(accepted_values[PLATFORMS_ENV]),
                  "runners": compact(PLATFORMS),
                  "disabled": ",".join(accepted_values[DISABLED_ENV]),
                  "min_coverage": accepted_values[MIN_COVERAGE_ENV],
              }
              if not write_outputs(outputs):
                  return 1
              print(f"{PLATFORMS_ENV} {outputs['platforms']}")
              print(f"{DISABLED_ENV} {outputs['disabled'] or '(none)'}")
              print(f"{SCHEDULING_ENV} {accepted_values[SCHEDULING_ENV]}")
              print(f"{SCANNING_ENV} {accepted_values[SCANNING_ENV]}")
              print(f"{MIN_COVERAGE_ENV} {outputs['min_coverage'] or '(none)'}")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          DX_INPUT_VALIDATION
  lint:
    needs: [validate]
    if: ${{ !contains(format(',{0},', needs.validate.outputs.disabled), ',lint,') }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.platforms) }}
    runs-on: ${{ fromJSON(needs.validate.outputs.runners)[matrix.platform] }}
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Verify rules_dx pin
        env:
          RULES_DX_PIN: ${{ inputs.rules_dx_version }}
        run: |
          python3 - <<'DX_MODULE_PIN'
          """Reports whether a MODULE.bazel declares rules_dx at one expected version.

          The consumer and docs workflows pass the expected version through the
          RULES_DX_PIN environment variable and run this file from standard input.
          The module is read as text: the file is never imported, executed or
          evaluated. Only a top-level `bazel_dep` or `module` call naming rules_dx
          counts as a declaration, and its version must be a quoted string literal.
          """

          import os
          import re
          import sys

          MODULE_FILE = "MODULE.bazel"
          PIN_ENV = "RULES_DX_PIN"

          CALL = re.compile(r"^(bazel_dep|module)[ \t]*\(", re.MULTILINE)
          NAME = re.compile(r'\bname[ \t]*=[ \t]*"rules_dx"')
          VERSION = re.compile(r'\bversion[ \t]*=[ \t]*("[^"]*"|[^\s,()]+)')


          def strip_comments(text):
              """Returns text with every # comment outside a string literal removed."""
              kept = []
              quote = ""
              index = 0
              while index < len(text):
                  char = text[index]
                  if quote:
                      if char == "\\" and index + 1 < len(text):
                          kept.append(text[index : index + 2])
                          index += 2
                          continue
                      kept.append(char)
                      if char == quote:
                          quote = ""
                  elif char in "\"'":
                      quote = char
                      kept.append(char)
                  elif char == "#":
                      end = text.find("\n", index)
                      index = len(text) if end < 0 else end
                      continue
                  else:
                      kept.append(char)
                  index += 1
              return "".join(kept)


          def call_arguments(text, opening):
              """Returns the arguments of the call whose opening paren is at opening."""
              depth = 0
              quote = ""
              index = opening
              while index < len(text):
                  char = text[index]
                  if quote:
                      if char == "\\" and index + 1 < len(text):
                          index += 2
                          continue
                      if char == quote:
                          quote = ""
                  elif char in "\"'":
                      quote = char
                  elif char == "(":
                      depth += 1
                  elif char == ")":
                      depth -= 1
                      if depth == 0:
                          return text[opening + 1 : index]
                  index += 1
              return None


          def declarations(text):
              """Returns the line, call name and arguments of every top-level call."""
              found = []
              for match in CALL.finditer(text):
                  arguments = call_arguments(text, match.end() - 1)
                  if arguments is None:
                      continue
                  line = text.count("\n", 0, match.start()) + 1
                  found.append((line, match.group(1), arguments))
              return found


          def rules_dx_declarations(text):
              """Returns every declaration naming rules_dx."""
              return [entry for entry in declarations(text) if NAME.search(entry[2])]


          def fail(message):
              """Reports one diagnostic and returns a failing exit status."""
              print(f"dx-ci: {message}", file=sys.stderr)
              return 1


          def verify(path, pin):
              """Reports whether path declares rules_dx at pin, and returns the status."""
              if pin == "" or '"' in pin or "\\" in pin or any(c.isspace() for c in pin):
                  return fail(f"{PIN_ENV}={pin!r} is not a plain rules_dx version string")
              try:
                  with open(path, encoding="utf-8") as handle:
                      text = strip_comments(handle.read())
              except OSError as error:
                  return fail(f"{path} cannot be read: {error}")
              found = rules_dx_declarations(text)
              if not found:
                  return fail(
                      f'{path} declares no bazel_dep(name = "rules_dx", version = "{pin}")'
                  )
              if len(found) > 1:
                  where = " and ".join(f"line {line} ({call})" for line, call, _ in found)
                  return fail(
                      f"{path} declares rules_dx {len(found)} times, at {where}. "
                      "Keep one declaration."
                  )
              line, call, arguments = found[0]
              version = VERSION.search(arguments)
              if version is None:
                  return fail(
                      f'{path}:{line} {call}(name = "rules_dx") declares no version. '
                      f'Add version = "{pin}".'
                  )
              if not version.group(1).startswith('"'):
                  return fail(
                      f"{path}:{line} {call} version must be a quoted string, "
                      f'found {version.group(1)}. Write version = "{pin}".'
                  )
              if version.group(1)[1:-1] != pin:
                  return fail(
                      f"{path}:{line} declares rules_dx {version.group(1)}, "
                      f'the workflow expects "{pin}". Pin both to the same version.'
                  )
              print(
                  f'{path}:{line} {call}(name = "rules_dx", version = "{pin}") '
                  "matches the workflow pin"
              )
              return 0


          def main(argv):
              """Verifies one module file and returns its exit status."""
              path = argv[1] if len(argv) > 1 else MODULE_FILE
              return verify(path, os.environ.get(PIN_ENV, ""))


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          DX_MODULE_PIN
      - run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- lint --check //... -- "$@"
