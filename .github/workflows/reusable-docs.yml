# Reusable docs CI. This repository cuts no releases; the
# docs-owned caller pins this file at a reviewed commit:
#   uses: rules_dx/.github/workflows/reusable-docs.yml@<commit>
# Reviewed pin bumps only; no silent upgrades. Consumers never copy
# per-check execution or deploy plumbing.
#
# Contract: one check, Linux-once. `docs-check` runs `dx lint --check`
# over the caller-selected docs scope (default `//...`, the entire repo)
# plus `dx docs --check` site validation; the lint
# pass is the repository-owned Markdown link/structure audit, so broken
# relative targets fail before deploy, and the site pass is renderer
# evidence for the deployed bundle. `docs-publish` runs only when
# `publish` is true: it builds the rendered site via `dx docs` and
# deploys the Bazel-owned `bazel-bin/docs/site` bundle to the
# `environment` Pages environment. `publish: false`
# is pure check-only.
#
# Hygiene (issue #80, deduped under #915): the docs-check bootstrap is
# an inline no-secrets `actions/checkout` (step 1) plus the pinned
# `bazel-contrib/setup-bazel` action (commit SHA plus trailing tag
# comment); every third-party action is pinned to a commit SHA with its
# tag in a trailing comment. The optional BuildBuddy remote cache rides
# the caller-provided `BUILDBUDDY_API_KEY` secret through the workflow
# `BAZEL_CONFIG` plus `BB_ARGS` env on every Bazel plus dx call.
# Inner dx Bazel invocations share the cache: dx resolves `bytestream://`
# BEP artifacts through workspace-local copies.
# `docs-publish` stages the artifact in a temp dir so the checkout is
# never left dirty for later steps.

name: rules-dx-docs

on:
  workflow_call:
    inputs:
      rules_dx_version:
        description: "Pinned rules_dx version (e.g. 0.0.0). Must match the consumer MODULE.bazel pin."
        required: true
        type: string
      docs_scope:
        description: "dx scope covered by docs check and lint (e.g. //...)."
        required: false
        default: "//..."
        type: string
      publish:
        description: "Build the rendered site and deploy it to GitHub Pages. False is check-only."
        required: false
        default: false
        type: boolean
      environment:
        description: "Pages environment name for the deploy job."
        required: false
        default: "github-pages"
        type: string
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key enabling the shared remote cache. Optional; the job skips remote-cache configuration when absent."
        required: false

permissions:
  contents: read

env:
  # CI flag set (the workspace `.bazelrc` `ci` plus `ci-pr` configs) and
  # the optional BuildBuddy key, passed inline on every Bazel and dx call.
  # No key (fork pull request, or a caller that passes no secret): both
  # stay empty, so no remote-cache flag is set at all and Bazel runs
  # local-cache only. With a key, pull requests stay read-only via
  # `ci-pr` and the header rides inline (never in a committed rc file).
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ secrets.BUILDBUDDY_API_KEY != '' && format('--remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
  # Single-sourced Bazelisk pin for the setup-bazel step in this
  # workflow (kept in sync with .devcontainer/Dockerfile.prebuilt).
  BAZELISK_VERSION: "1.29.0"

concurrency:
  group: dx-docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Verify rules_dx pin
        env:
          RULES_DX_PIN: ${{ inputs.rules_dx_version }}
        run: test -f MODULE.bazel && grep -F -q "version = \"$RULES_DX_PIN\"" MODULE.bazel
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- lint --check ${{ inputs.docs_scope }} -- $BAZEL_CONFIG $BB_ARGS
      - run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- docs --check -- $BAZEL_CONFIG $BB_ARGS
  docs-publish:
    name: docs-publish (GitHub Pages)
    needs: [docs-check]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Verify rules_dx pin
        env:
          RULES_DX_PIN: ${{ inputs.rules_dx_version }}
        run: test -f MODULE.bazel && grep -F -q "version = \"$RULES_DX_PIN\"" MODULE.bazel
      - name: Build rendered site
        run: bazel run $BAZEL_CONFIG $BB_ARGS @rules_dx//cli/cli:dx -- docs -- $BAZEL_CONFIG $BB_ARGS
      - name: Stage rendered site in a temp dir
        # The artifact is the Bazel-owned rendered bundle
        # (`bazel-bin/docs/site`), never committed sources. Stage a copy
        # under RUNNER_TEMP so the repo tree stays renderer-clean and the
        # checkout is never left dirty. Uses the workspace `bazel-bin`
        # symlink left by `dx docs`: no `bazel info` call, which would
        # resolve a different output base than dx's `--nohome_rc` build.
        # The published bundle is the user site: all user guides plus the
        # API reference. The `demo_*` targets stay fixture-only for unit
        # and execution tests and are never published.
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/pages"
          rm -rf "$stage"
          mkdir -p "$stage"
          test -f "bazel-bin/docs/site/user_site_index.html"
          test -f "bazel-bin/docs/site/user_site_searchindex.json"
          cp "bazel-bin/docs/site/user_site_index.html" "$stage/index.html"
          cp "bazel-bin/docs/site/user_site_searchindex.json" "$stage/searchindex.json"
          echo "PAGES_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Upload rendered site as Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.PAGES_STAGE }}
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Prove checkout left clean
        # Bazel rewrites the registry lockfile on BCR drift; renderer dirt is what fails here.
        run: |
          git status --porcelain
          test -z "$(git status --porcelain -- ':!MODULE.bazel.lock')"
