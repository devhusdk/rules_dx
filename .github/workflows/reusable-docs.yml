name: rules-dx-docs

on:
  workflow_call:
    inputs:
      docs_scope:
        description: "dx scope covered by docs check and lint (e.g. //...)."
        required: false
        default: "//..."
        type: string
      publish:
        description: "Build the rendered site and deploy it to GitHub Pages. False is check-only."
        required: false
        default: false
        type: boolean
      environment:
        description: "Pages environment name for the deploy job."
        required: false
        default: "github-pages"
        type: string
      site:
        description: "One target label in the calling repository whose output is the rendered mdBook tree (index.html and searchindex.js at its root)."
        required: true
        type: string
      site_check:
        description: "Target label in the calling repository that dx docs runs. Empty skips the source check."
        required: false
        default: ""
        type: string
      forbid:
        description: "Text the rendered site must not contain, one entry per line. Empty forbids nothing."
        required: false
        default: ""
        type: string
      landing:
        description: "Also require the rendered site to have a landing page."
        required: false
        default: false
        type: boolean
      smoke_test:
        description: "Test label in the calling repository run with DX_PAGES_URL after the deploy. Empty runs only the built-in page fetch."
        required: false
        default: ""
        type: string
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key enabling the shared remote cache. Optional; the job skips remote-cache configuration when absent."
        required: false

permissions:
  contents: read

env:
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
  BAZELISK_VERSION: "1.29.0"
  DX_DOCS_SITE: ${{ inputs.site }}
  DX_DOCS_SITE_CHECK: ${{ inputs.site_check }}
  DX_DOCS_FORBID: ${{ inputs.forbid }}
  DX_DOCS_LANDING: ${{ inputs.landing }}
  DX_DOCS_SMOKE_TEST: ${{ inputs.smoke_test }}

concurrency:
  group: dx-docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the docs inputs
        shell: bash
        run: |
          set -euo pipefail
          label='^(@@?[A-Za-z0-9_.~+-]*)?//[A-Za-z0-9_.+@=,~/-]*:?[A-Za-z0-9_.+@=,~/-]*$'
          for name in DX_DOCS_SITE DX_DOCS_SITE_CHECK DX_DOCS_SMOKE_TEST; do
            value="${!name}"
            if [ "$name" != DX_DOCS_SITE ] && [ -z "$value" ]; then
              continue
            fi
            if ! [[ "$value" =~ $label ]] || [[ "$value" == *... ]]; then
              echo "dx-ci: $name holds '$value', which is not a single target label." >&2
              exit 1
            fi
          done
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
      - name: Configure the remote cache credential helper
        shell: bash
        run: |
          args="${DX_REMOTE_CACHE_ARG:-}"
          dir="$RUNNER_TEMP/dx-credential-helper"
          if [ -n "${BUILDBUDDY_API_KEY:-}" ] && [ -z "${REMOTE_CACHE_HEADER:-}" ]; then
            mkdir -p "$dir"
            if [ "$RUNNER_OS" = Windows ]; then
              helper="$dir/helper.bat"
              printf '@echo {"headers":{"x-buildbuddy-api-key":["%%BUILDBUDDY_API_KEY%%"]}}\r\n' > "$helper"
              chmod 700 "$helper"
              helper="$(cygpath -m "$helper")"
            else
              helper="$dir/helper.sh"
              cat > "$helper" <<'EOF'
          #!/bin/sh
          printf '{"headers":{"x-buildbuddy-api-key":["%s"]}}\n' "$BUILDBUDDY_API_KEY"
          EOF
              chmod 700 "$helper"
            fi
            args="${args:+$args }--credential_helper=remote.buildbuddy.io=$helper"
          elif [ -n "${REMOTE_CACHE_HEADER:-}" ]; then
            name="${REMOTE_CACHE_HEADER%%=*}"
            value="${REMOTE_CACHE_HEADER#*=}"
            if [ "$name" = "$REMOTE_CACHE_HEADER" ] || [ -z "$name" ] || [ -z "$value" ]; then
              echo "::error::REMOTE_CACHE_HEADER must look like name=value"
              exit 1
            fi
            case "$name$value" in
              *[\"\\%\&\|\<\>\^]*)
                echo "::error::REMOTE_CACHE_HEADER has a character the credential helper cannot carry: one of \" \\ % & | < > ^"
                exit 1
                ;;
            esac
            host="${DX_REMOTE_CACHE_ARG#--remote_cache=}"
            host="${host#*://}"
            host="${host%%/*}"
            host="${host##*@}"
            host="${host%%:*}"
            host="${host:-remote.buildbuddy.io}"
            mkdir -p "$dir"
            if [ "$RUNNER_OS" = Windows ]; then
              helper="$dir/header.bat"
              printf '@for /f "tokens=1* delims==" %%%%a in ("%%REMOTE_CACHE_HEADER%%") do @echo {"headers":{"%%%%a":["%%%%b"]}}\r\n' > "$helper"
              chmod 700 "$helper"
              helper="$(cygpath -m "$helper")"
            else
              helper="$dir/header.sh"
              cat > "$helper" <<'HEADER'
          #!/bin/sh
          printf '{"headers":{"%s":["%s"]}}\n' "${REMOTE_CACHE_HEADER%%=*}" "${REMOTE_CACHE_HEADER#*=}"
          HEADER
              chmod 700 "$helper"
            fi
            args="${args:+$args }--credential_helper=$host=$helper"
          fi
          if [ -n "$args" ]; then
            echo "BB_ARGS=$args" >> "$GITHUB_ENV"
          fi
      - name: Lint the docs scope
        env:
          DX_DOCS_SCOPE: ${{ inputs.docs_scope }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//tools/ci:docs_scope_bin
      - name: Check the docs site sources
        if: inputs.site_check != ''
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- docs "$DX_DOCS_SITE_CHECK" -- "$@"
      - name: Render and validate the rendered site
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- docs "$DX_DOCS_SITE" -- "$@"
          stage="$RUNNER_TEMP/pages"
          site="$(bazel cquery "$@" --output=files "$DX_DOCS_SITE")"
          test -f "$site/index.html"
          test -f "$site/searchindex.js"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$site/." "$stage/"
          check=()
          if [ "$DX_DOCS_LANDING" = true ]; then
            check+=(--landing)
          fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              check+=(--forbid "$line")
            fi
          done <<< "$DX_DOCS_FORBID"
          bazel run "$@" @rules_dx//tools/docs/site/check:site_check -- --rendered "$stage" "${check[@]}"
  docs-publish:
    name: docs-publish (GitHub Pages)
    needs: [docs-check]
    if: ${{ inputs.publish && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
      - name: Configure the remote cache credential helper
        shell: bash
        run: |
          args="${DX_REMOTE_CACHE_ARG:-}"
          dir="$RUNNER_TEMP/dx-credential-helper"
          if [ -n "${BUILDBUDDY_API_KEY:-}" ] && [ -z "${REMOTE_CACHE_HEADER:-}" ]; then
            mkdir -p "$dir"
            if [ "$RUNNER_OS" = Windows ]; then
              helper="$dir/helper.bat"
              printf '@echo {"headers":{"x-buildbuddy-api-key":["%%BUILDBUDDY_API_KEY%%"]}}\r\n' > "$helper"
              chmod 700 "$helper"
              helper="$(cygpath -m "$helper")"
            else
              helper="$dir/helper.sh"
              cat > "$helper" <<'EOF'
          #!/bin/sh
          printf '{"headers":{"x-buildbuddy-api-key":["%s"]}}\n' "$BUILDBUDDY_API_KEY"
          EOF
              chmod 700 "$helper"
            fi
            args="${args:+$args }--credential_helper=remote.buildbuddy.io=$helper"
          elif [ -n "${REMOTE_CACHE_HEADER:-}" ]; then
            name="${REMOTE_CACHE_HEADER%%=*}"
            value="${REMOTE_CACHE_HEADER#*=}"
            if [ "$name" = "$REMOTE_CACHE_HEADER" ] || [ -z "$name" ] || [ -z "$value" ]; then
              echo "::error::REMOTE_CACHE_HEADER must look like name=value"
              exit 1
            fi
            case "$name$value" in
              *[\"\\%\&\|\<\>\^]*)
                echo "::error::REMOTE_CACHE_HEADER has a character the credential helper cannot carry: one of \" \\ % & | < > ^"
                exit 1
                ;;
            esac
            host="${DX_REMOTE_CACHE_ARG#--remote_cache=}"
            host="${host#*://}"
            host="${host%%/*}"
            host="${host##*@}"
            host="${host%%:*}"
            host="${host:-remote.buildbuddy.io}"
            mkdir -p "$dir"
            if [ "$RUNNER_OS" = Windows ]; then
              helper="$dir/header.bat"
              printf '@for /f "tokens=1* delims==" %%%%a in ("%%REMOTE_CACHE_HEADER%%") do @echo {"headers":{"%%%%a":["%%%%b"]}}\r\n' > "$helper"
              chmod 700 "$helper"
              helper="$(cygpath -m "$helper")"
            else
              helper="$dir/header.sh"
              cat > "$helper" <<'HEADER'
          #!/bin/sh
          printf '{"headers":{"%s":["%s"]}}\n' "${REMOTE_CACHE_HEADER%%=*}" "${REMOTE_CACHE_HEADER#*=}"
          HEADER
              chmod 700 "$helper"
            fi
            args="${args:+$args }--credential_helper=$host=$helper"
          fi
          if [ -n "$args" ]; then
            echo "BB_ARGS=$args" >> "$GITHUB_ENV"
          fi
      - name: Build rendered site
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- docs "$DX_DOCS_SITE" -- "$@"
      - name: Stage rendered site in a temp dir
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          stage="$RUNNER_TEMP/pages"
          site="$(bazel cquery "$@" --output=files "$DX_DOCS_SITE")"
          test -f "$site/index.html"
          test -f "$site/searchindex.js"
          test -f "$site/css/general.css"
          test -f "$site/book.js"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$site/." "$stage/"
          echo "PAGES_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Validate staged site
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          check=()
          if [ "$DX_DOCS_LANDING" = true ]; then
            check+=(--landing)
          fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              check+=(--forbid "$line")
            fi
          done <<< "$DX_DOCS_FORBID"
          bazel run "$@" @rules_dx//tools/docs/site/check:site_check -- --rendered "$PAGES_STAGE" "${check[@]}"
      - name: Check the upload holds no secret
        id: scan-site
        shell: bash
        env:
          DX_UPLOAD_PATH: ${{ env.PAGES_STAGE }}
        run: |
          [ -n "${BUILDBUDDY_API_KEY:-}" ] || exit 0
          [ -e "$DX_UPLOAD_PATH" ] || exit 0
          if grep -rFl -- "$BUILDBUDDY_API_KEY" "$DX_UPLOAD_PATH"; then
            echo "::error::$DX_UPLOAD_PATH holds the BuildBuddy API key"
            exit 1
          fi
      - name: Upload rendered site as Pages artifact
        if: ${{ always() && steps.scan-site.outcome == 'success' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.PAGES_STAGE }}
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Smoke-test the deployed site
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGES_URL"
          for file in index.html searchindex.js; do
            curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null "${PAGES_URL%/}/$file"
          done
          if [ -n "$DX_DOCS_SMOKE_TEST" ]; then
            # shellcheck disable=SC2086
            set -- $BAZEL_CONFIG $BB_ARGS
            bazel test "$@" --test_env=DX_PAGES_URL="$PAGES_URL" "$DX_DOCS_SMOKE_TEST"
          fi
      - name: Prove checkout left clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
