                      f'Add version = "{pin}".'
                  )
              if not version.group(1).startswith('"'):
                  return fail(
                      f"{path}:{line} {call} version must be a quoted string, "
                      f'found {version.group(1)}. Write version = "{pin}".'
                  )
              if version.group(1)[1:-1] != pin:
                  return fail(
                      f"{path}:{line} declares rules_dx {version.group(1)}, "
                      f'the workflow expects "{pin}". Pin both to the same version.'
                  )
              print(
                  f'{path}:{line} {call}(name = "rules_dx", version = "{pin}") '
                  "matches the workflow pin"
              )
              return 0


          def main(argv):
              """Verifies one module file and returns its exit status."""
              path = argv[1] if len(argv) > 1 else MODULE_FILE
              return verify(path, os.environ.get(PIN_ENV, ""))


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          DX_MODULE_PIN
      - name: Build rendered site
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//cli/cli:dx -- docs -- "$@"
      - name: Stage rendered site in a temp dir
        # Stage under RUNNER_TEMP so the checkout is never left dirty.
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/pages"
          rm -rf "$stage"
          mkdir -p "$stage"
          test -f "bazel-bin/docs/site/user_site_index.html"
          test -f "bazel-bin/docs/site/user_site_searchindex.json"
          cp "bazel-bin/docs/site/user_site_index.html" "$stage/index.html"
          cp "bazel-bin/docs/site/user_site_searchindex.json" "$stage/searchindex.json"
          echo "PAGES_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Upload rendered site as Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.PAGES_STAGE }}
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Prove checkout left clean
        # Bazel rewrites the lockfile on BCR drift; renderer dirt fails here.
        run: |
          git status --porcelain
          test -z "$(git status --porcelain -- ':!MODULE.bazel.lock')"
