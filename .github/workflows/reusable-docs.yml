name: rules-dx-docs

on:
  workflow_call:
    inputs:
      rules_dx_version:
        description: "Version of the rules_dx declaration in the consumer MODULE.bazel (e.g. 0.0.0). It must equal that call's version, not another dependency's."
        required: true
        type: string
      docs_scope:
        description: "dx scope covered by docs check and lint (e.g. //...)."
        required: false
        default: "//..."
        type: string
      publish:
        description: "Build the rendered site and deploy it to GitHub Pages. False is check-only."
        required: false
        default: false
        type: boolean
      environment:
        description: "Pages environment name for the deploy job."
        required: false
        default: "github-pages"
        type: string
      site:
        description: "One target label in the calling repository whose output is the rendered mdBook tree (index.html and searchindex.js at its root)."
        required: true
        type: string
      site_check:
        description: "Target label in the calling repository that dx docs --check runs. Empty skips the source check."
        required: false
        default: ""
        type: string
      forbid:
        description: "Text the rendered site must not contain, one entry per line. Empty forbids nothing."
        required: false
        default: ""
        type: string
      landing:
        description: "Also require the rendered site to have a landing page."
        required: false
        default: false
        type: boolean
      smoke_test:
        description: "Test label in the calling repository run with DX_PAGES_URL after the deploy. Empty runs only the built-in page fetch."
        required: false
        default: ""
        type: string
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key enabling the shared remote cache. Optional; the job skips remote-cache configuration when absent."
        required: false

permissions:
  contents: read

env:
  # Both stay empty unless the caller passes BUILDBUDDY_API_KEY.
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ secrets.BUILDBUDDY_API_KEY != '' && format('--remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
  BAZELISK_VERSION: "1.29.0"
  DX_DOCS_SITE: ${{ inputs.site }}
  DX_DOCS_SITE_CHECK: ${{ inputs.site_check }}
  DX_DOCS_FORBID: ${{ inputs.forbid }}
  DX_DOCS_LANDING: ${{ inputs.landing }}
  DX_DOCS_SMOKE_TEST: ${{ inputs.smoke_test }}

concurrency:
  group: dx-docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the docs inputs
        shell: bash
        run: |
          set -euo pipefail
          label='^(@@?[A-Za-z0-9_.~+-]*)?//[A-Za-z0-9_.+@=,~/-]*:?[A-Za-z0-9_.+@=,~/-]*$'
          for name in DX_DOCS_SITE DX_DOCS_SITE_CHECK DX_DOCS_SMOKE_TEST; do
            value="${!name}"
            if [ "$name" != DX_DOCS_SITE ] && [ -z "$value" ]; then
              continue
            fi
            if ! [[ "$value" =~ $label ]] || [[ "$value" == *... ]]; then
              echo "dx-ci: $name holds '$value', which is not a single target label." >&2
              exit 1
            fi
          done
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify rules_dx pin
        env:
          RULES_DX_PIN: ${{ inputs.rules_dx_version }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//tools/ci:module_pin_bin
      - name: Lint the docs scope
        env:
          DX_DOCS_SCOPE: ${{ inputs.docs_scope }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//tools/ci:docs_scope_bin
      - name: Check the docs site sources
        if: inputs.site_check != ''
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- docs --check "$DX_DOCS_SITE_CHECK" -- "$@"
      - name: Render and validate the rendered site
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- docs "$DX_DOCS_SITE" -- "$@"
          stage="$RUNNER_TEMP/pages"
          site="$(bazel cquery "$@" --output=files "$DX_DOCS_SITE")"
          test -f "$site/index.html"
          test -f "$site/searchindex.js"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$site/." "$stage/"
          check=()
          if [ "$DX_DOCS_LANDING" = true ]; then
            check+=(--landing)
          fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              check+=(--forbid "$line")
            fi
          done <<< "$DX_DOCS_FORBID"
          bazel run "$@" @rules_dx//tools/docs/site/check:site_check -- --rendered "$stage" "${check[@]}"
  docs-publish:
    name: docs-publish (GitHub Pages)
    needs: [docs-check]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify rules_dx pin
        env:
          RULES_DX_PIN: ${{ inputs.rules_dx_version }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//tools/ci:module_pin_bin
      - name: Build rendered site
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- docs "$DX_DOCS_SITE" -- "$@"
      - name: Stage rendered site in a temp dir
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          stage="$RUNNER_TEMP/pages"
          site="$(bazel cquery "$@" --output=files "$DX_DOCS_SITE")"
          test -f "$site/index.html"
          test -f "$site/searchindex.js"
          test -f "$site/css/general.css"
          test -f "$site/book.js"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$site/." "$stage/"
          echo "PAGES_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Validate staged site
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          check=()
          if [ "$DX_DOCS_LANDING" = true ]; then
            check+=(--landing)
          fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              check+=(--forbid "$line")
            fi
          done <<< "$DX_DOCS_FORBID"
          bazel run "$@" @rules_dx//tools/docs/site/check:site_check -- --rendered "$PAGES_STAGE" "${check[@]}"
      - name: Upload rendered site as Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.PAGES_STAGE }}
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Smoke-test the deployed site
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGES_URL"
          for file in index.html searchindex.js; do
            curl --fail --silent --show-error --location --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null "${PAGES_URL%/}/$file"
          done
          if [ -n "$DX_DOCS_SMOKE_TEST" ]; then
            # shellcheck disable=SC2086
            set -- $BAZEL_CONFIG $BB_ARGS
            bazel test "$@" --test_env=DX_PAGES_URL="$PAGES_URL" "$DX_DOCS_SMOKE_TEST"
          fi
      - name: Prove checkout left clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
