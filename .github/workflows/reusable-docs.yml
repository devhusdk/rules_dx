name: rules-dx-docs

on:
  workflow_call:
    inputs:
      rules_dx_version:
        description: "Version of the rules_dx declaration in the consumer MODULE.bazel (e.g. 0.0.0). It must equal that call's version, not another dependency's."
        required: true
        type: string
      docs_scope:
        description: "dx scope covered by docs check and lint (e.g. //...)."
        required: false
        default: "//..."
        type: string
      publish:
        description: "Build the rendered site and deploy it to GitHub Pages. False is check-only."
        required: false
        default: false
        type: boolean
      environment:
        description: "Pages environment name for the deploy job."
        required: false
        default: "github-pages"
        type: string
    secrets:
      BUILDBUDDY_API_KEY:
        description: "BuildBuddy API key enabling the shared remote cache. Optional; the job skips remote-cache configuration when absent."
        required: false

permissions:
  contents: read

env:
  # Both stay empty unless the caller passes BUILDBUDDY_API_KEY.
  BAZEL_CONFIG: ${{ secrets.BUILDBUDDY_API_KEY != '' && (github.event_name == 'pull_request' && '--config=ci --config=ci-pr' || '--config=ci') || '' }}
  BB_ARGS: ${{ secrets.BUILDBUDDY_API_KEY != '' && format('--remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_API_KEY) || '' }}
  BAZELISK_VERSION: "1.29.0"

concurrency:
  group: dx-docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-
      - name: Verify rules_dx pin
        env:
          RULES_DX_PIN: ${{ inputs.rules_dx_version }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//tools/ci:module_pin_bin
      - name: Lint the docs scope
        env:
          DX_DOCS_SCOPE: ${{ inputs.docs_scope }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//tools/ci:docs_scope_bin
      - run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- docs --check -- "$@"
      - name: Render and validate the rendered site
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- docs -- "$@"
          stage="$RUNNER_TEMP/pages"
          site="$(bazel cquery "$@" --output=files //tools/docs/site:user_site)"
          test -f "$site/index.html"
          test -f "$site/searchindex.js"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$site/." "$stage/"
          bazel run "$@" //tools/docs/site/check:site_check -- --rendered "$stage" --landing \
            --forbid "Treat warnings as errors" \
            --forbid "docs_fixture"
      - name: Save the Bazel repository cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: ${{ steps.repo-cache-restore.outputs.cache-primary-key }}
  docs-publish:
    name: docs-publish (GitHub Pages)
    needs: [docs-check]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Locate the Bazel repository cache
        id: repo-cache
        shell: bash
        run: |
          path="$(bazel --nohome_rc --nosystem_rc info repository_cache)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Restore the Bazel repository cache
        id: repo-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: dx-repo-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-
      - name: Verify rules_dx pin
        env:
          RULES_DX_PIN: ${{ inputs.rules_dx_version }}
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//tools/ci:module_pin_bin
      - name: Build rendered site
        run: |
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" @rules_dx//:dx -- docs -- "$@"
      - name: Stage rendered site in a temp dir
        # Stage under RUNNER_TEMP so the checkout is never left dirty.
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          stage="$RUNNER_TEMP/pages"
          site="$(bazel cquery "$@" --output=files //tools/docs/site:user_site)"
          test -f "$site/index.html"
          test -f "$site/searchindex.js"
          test -f "$site/css/general.css"
          test -f "$site/book.js"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "$site/." "$stage/"
          echo "PAGES_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Validate staged site
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel run "$@" //tools/docs/site/check:site_check -- --rendered "$PAGES_STAGE" --landing \
            --forbid "Treat warnings as errors" \
            --forbid "docs_fixture"
      - name: Upload rendered site as Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.PAGES_STAGE }}
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Smoke-test the deployed site
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGES_URL"
          # shellcheck disable=SC2086
          set -- $BAZEL_CONFIG $BB_ARGS
          bazel test "$@" --test_env=DX_PAGES_URL="$PAGES_URL" //tools/docs/site:deploy_smoke_test
      - name: Prove checkout left clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Save the Bazel repository cache
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.repo-cache-restore.outputs.cache-hit != 'true' && steps.repo-cache.outputs.path != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.repo-cache.outputs.path }}/content_addressable
          key: ${{ steps.repo-cache-restore.outputs.cache-primary-key }}
