name: rules-dx-release

on:
  workflow_call:
    inputs:
      deployables:
        description: 'JSON array of dx_deployment labels to publish, in order. Empty publishes every dx_deployment tagged release.'
        required: false
        default: ""
        type: string
      platforms:
        description: 'JSON array of platforms that dry-run every deployable before anything is published. Empty uses linux_x86_64.'
        required: false
        default: ""
        type: string
      runner:
        description: "Runner label for the publish job."
        required: false
        default: "ubuntu-latest"
        type: string

permissions:
  contents: read

concurrency:
  group: dx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      labels: ${{ steps.list.outputs.labels }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      runners: ${{ steps.platforms.outputs.runners }}
    env:
      DX_DEPLOYABLES: ${{ inputs.deployables }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
      - name: Validate platforms
        id: platforms
        env:
          DX_PLATFORMS: ${{ inputs.platforms }}
        run: bazel run --lockfile_mode=error @rules_dx//tools/ci:input_validation_bin
      - name: List the deployables
        id: list
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$DX_DEPLOYABLES" ]; then
            bazel run --lockfile_mode=error @rules_dx//tools/ci:input_validation_bin -- deployables > "$RUNNER_TEMP/deployables.txt"
          else
            bazel query --output=label 'attr(tags, "[\\[ ]release[,\\]]", kind(dx_deployment, //...))' > "$RUNNER_TEMP/deployables.txt"
          fi
          if [ ! -s "$RUNNER_TEMP/deployables.txt" ]; then
            echo "dx-release: no dx_deployment is tagged release; tag one or pass deployables." >&2
            exit 1
          fi
          echo "Deployables for ${GITHUB_REF_NAME}:"
          cat "$RUNNER_TEMP/deployables.txt"
          echo "labels=$(tr '\n' ' ' < "$RUNNER_TEMP/deployables.txt")" >> "$GITHUB_OUTPUT"
  dry-run:
    name: dry run (${{ matrix.platform }})
    needs: [plan]
    runs-on: ${{ fromJSON(needs.plan.outputs.runners)[matrix.platform] }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
      - name: Dry run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DX_LABELS: ${{ needs.plan.outputs.labels }}
        run: |
          set -euo pipefail
          for label in $DX_LABELS; do
            echo "::group::dx deploy $label (dry run)"
            if [ "$RUNNER_OS" = Windows ]; then
              cmd.exe //c tools\\dx.cmd deploy "$label"
            else
              tools/dx deploy "$label"
            fi
            echo "::endgroup::"
          done
  release:
    name: release
    needs: [plan, dry-run]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DX_LABELS: ${{ needs.plan.outputs.labels }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HACKAGE_API_TOKEN: ${{ secrets.HACKAGE_API_TOKEN }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          HOMEBREW_TAP_API_TOKEN: ${{ secrets.HOMEBREW_TAP_API_TOKEN }}
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          OCI_REGISTRY_TOKEN: ${{ secrets.OCI_REGISTRY_TOKEN }}
          OCI_REGISTRY_USER: ${{ secrets.OCI_REGISTRY_USER }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          RUBYGEMS_API_TOKEN: ${{ secrets.RUBYGEMS_API_TOKEN }}
        run: |
          set -euo pipefail
          for gate in \
            CLOUDFLARE_PAGES_APPROVED \
            CRATES_PUBLISH_APPROVED \
            GH_RELEASE_APPROVED \
            HACKAGE_PUBLISH_APPROVED \
            HEX_PUBLISH_APPROVED \
            HOMEBREW_TAP_PUBLISH_APPROVED \
            LUAROCKS_PUBLISH_APPROVED \
            MAVEN_PUBLISH_APPROVED \
            NPM_PUBLISH_APPROVED \
            NUGET_PUBLISH_APPROVED \
            OCI_PUBLISH_APPROVED \
            OCTOPUS_PUBLISH_APPROVED \
            PROMOTION_APPROVED \
            PUB_PUBLISH_APPROVED \
            PYPI_PUBLISH_APPROVED \
            RUBYGEMS_PUBLISH_APPROVED; do
            export "${gate}=1"
          done
          published=()
          summary() {
            {
              echo "## Release ${GITHUB_REF_NAME}"
              if [ "${#published[@]}" -eq 0 ]; then
                echo "Nothing was published."
              else
                echo "Published:"
                printf -- '- %s\n' "${published[@]}"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap summary EXIT
          for label in $DX_LABELS; do
            echo "::group::dx deploy --apply $label"
            if [ "$RUNNER_OS" = Windows ]; then
              cmd.exe //c tools\\dx.cmd deploy --apply "$label"
            else
              tools/dx deploy --apply "$label"
            fi
            echo "::endgroup::"
            published+=("$label")
          done
