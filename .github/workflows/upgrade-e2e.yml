name: upgrade-e2e

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Older rules_dx version. Empty uses the second-latest on the BCR."
        required: false
        default: ""
        type: string
      to:
        description: "Newer rules_dx version, or local for this checkout. Empty uses the latest on the BCR."
        required: false
        default: ""
        type: string
  release:
    types: [published]

permissions:
  contents: read

env:
  BAZELISK_VERSION: "1.29.0"

jobs:
  upgrade-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          cache-save: false
      - name: Upgrade and roll back
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          if [ -n "$FROM" ] && [ -n "$TO" ]; then
            tools/ci/upgrade_e2e.sh "$FROM" "$TO"
          else
            tools/ci/upgrade_e2e.sh
          fi
