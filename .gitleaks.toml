[extend]
useDefault = true

[[allowlists]]
description = "docs SBOM prose is not a secret"
regexes = ["SBOM/provenance"]
paths = ["docs/.*\\.md$"]
regexTarget = "match"

[[allowlists]]
description = "Bazel aquery action keys in compilation database fixtures are hashes, not secrets"
condition = "AND"
paths = ["cc/tests/fixtures/compilation_db/[^/]*\\.aquery\\.json$"]
regexes = ["\"actionKey\": \"[0-9a-f]{64}\""]
regexTarget = "line"

[[allowlists]]
description = "Qt runtime library names in the pinned SDK tables are not secrets"
condition = "AND"
paths = ["qt/sdk/linux_arm64\\.bzl$", "qt/sdk/linux_x86_64\\.bzl$"]
regexes = ["libxcb-keysyms\\.so"]
regexTarget = "match"
