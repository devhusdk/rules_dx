[extend]
path = ".dx/config/gitleaks/base.toml"

[[allowlists]]
description = "docs SBOM prose is not a secret"
regexes = ["SBOM/provenance"]
paths = ["docs/.*\\.md$"]
regexTarget = "match"

[[allowlists]]
description = "Bazel aquery action keys in compilation database fixtures are hashes, not secrets"
condition = "AND"
paths = ["cc/tests/fixtures/compilation_db/[^/]*\\.aquery\\.json$"]
regexes = ["\"actionKey\": \"[0-9a-f]{64}\""]
regexTarget = "line"

[[allowlists]]
description = "Qt runtime library names in the pinned SDK tables are not secrets"
condition = "AND"
paths = [
  "qt/private/toolchain/linux_arm64\\.bzl$",
  "qt/private/toolchain/linux_x86_64\\.bzl$",
]
regexes = ["libxcb-keysyms\\.so"]
regexTarget = "match"

[[allowlists]]
description = "Debian package keys in the pinned sysroot locks are package ids, not secrets"
condition = "AND"
paths = ["swift/private/toolchain/[^/]+_sysroot\\.lock\\.json$"]
regexes = ["\"key\": \"[A-Za-z0-9._+~-]+_(amd64|arm64|all)\""]
regexTarget = "line"
