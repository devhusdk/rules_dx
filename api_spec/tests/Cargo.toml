[package]
license = "Apache-2.0"
name = "api_spec_tests"
version = "0.0.0"
edition = "2024"

[[test]]
name = "client_rust_test"
path = "client_rust_test.rs"

[dependencies]
progenitor-client = "=0.15.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util"] }
