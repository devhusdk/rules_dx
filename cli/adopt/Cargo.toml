[package]
name = "dx_adopt"
version = "0.0.0"
edition = "2021"

[lib]
name = "dx_adopt"
path = "src/lib.rs"

[dependencies]
# hermetic-llvm ships no CoreServices framework, so the FSEvents backend cannot
# link on macOS. kqueue is notify's other macOS backend and is used instead.
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
notify-debouncer-mini = { version = "0.6", default-features = false, features = ["macos_kqueue"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
  "display",
] }

[dev-dependencies]
# Golden pilot: status JSON golden as an insta snapshot.
insta = "1"
serde_json = "1"
