[package]
name = "dx_adopt"
version = "0.0.0"
edition = "2021"

[lib]
name = "dx_adopt"
path = "src/lib.rs"

[dependencies]
notify = "8"
notify-debouncer-mini = "0.6"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
  "display",
] }

[dev-dependencies]
# Golden pilot: status JSON golden as an insta snapshot.
insta = "1"
