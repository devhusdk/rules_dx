[package]
license = "Apache-2.0"
name = "dx_advisory_prep"
version = "0.0.0"
edition = "2024"

[lib]
name = "dx_advisory_prep"
path = "src/lib.rs"

[dependencies]
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
