[package]
license = "Apache-2.0"
name = "dx_cli"
version = "0.0.0"
edition = "2024"

[dependencies]
base64 = "0.23"
chrono = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-sarif = "0.8"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
# Used only by tests.
libc = "0.2"

[lib]
name = "dx_cli"
path = "src/lib.rs"

[[bin]]
name = "dx"
path = "src/main.rs"

[[bin]]
name = "dx_man"
path = "src/bin_man.rs"

[dev-dependencies]
# assert_cmd + predicates for hermetic CLI process tests.
assert_cmd = "2"
predicates = "3"
