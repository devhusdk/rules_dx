[package]
license = "Apache-2.0"
name = "dx_depcheck"
version = "0.0.0"
edition = "2024"

[lib]
name = "dx_depcheck"
path = "src/lib.rs"

[[bin]]
name = "depcheck"
path = "src/main.rs"

[[test]]
name = "repo_locks_test"
path = "repo_locks_test.rs"

[[test]]
name = "adopt_locks_test"
path = "adopt_locks_test.rs"

[dependencies]
regex = "1"
serde_json = "1"
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
] }
clap = { version = "4", features = ["derive"] }
pep440_rs = "0.7"
semver = "1"
thiserror = "2"
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
