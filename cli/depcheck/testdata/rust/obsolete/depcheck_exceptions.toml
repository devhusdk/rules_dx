# Obsolete cases: removed-dep names no manifest entry; anyhow is
# directly imported so its exception no longer suppresses a finding
# (e.g. after a checker upgrade recognizes the usage). Both must fail
# as obsolete; validation reports without deleting.
[[exception]]
dependency = "removed-dep"
reason = "was a dynamic plugin before removal"

[[exception]]
dependency = "anyhow"
reason = "stale: usage is now recognized"
