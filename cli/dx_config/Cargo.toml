[package]
license = "Apache-2.0"
name = "dx_config"
version = "0.0.0"
edition = "2024"

[lib]
name = "dx_config"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
  "display",
] }

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
serde_json = "1"
