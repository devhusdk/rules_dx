[package]
license = "Apache-2.0"
name = "dx_env"
version = "0.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[lib]
name = "dx_env"
path = "src/lib.rs"

[[bin]]
name = "env"
path = "src/main.rs"
