[package]
license = "Apache-2.0"
name = "dx_http"
version = "0.0.0"
edition = "2024"

[lib]
name = "dx_http"
path = "src/lib.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
thiserror = "2"
ureq = { version = "3.5", default-features = false, features = [
  "gzip",
  "platform-verifier",
  "rustls-no-provider",
] }

[dev-dependencies]
tempfile = "3"
