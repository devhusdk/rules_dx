[package]
license = "Apache-2.0"
name = "dx_output"
version = "0.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
console = "0.16"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }

[lib]
name = "dx_output"
path = "src/lib.rs"
