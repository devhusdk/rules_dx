[package]
name = "dx_plan"
version = "0.0.0"
edition = "2021"

[lib]
name = "dx_plan"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
# Renders the man page from the clap grammar for the `dx_man` binary.
clap_mangen = "0.2"
libc = "0.2"
line-index = "0.1"
quick-junit = "0.8"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde-sarif = "0.8"
serde_json = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
insta = "1"
