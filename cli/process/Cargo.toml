[package]
name = "dx_process"
version = "0.0.0"
edition = "2021"

[dependencies]
libc = "0.2"
thiserror = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lib]
name = "dx_process"
path = "src/lib.rs"
