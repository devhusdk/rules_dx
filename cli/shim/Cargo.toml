[package]
license = "Apache-2.0"
name = "dx_shim"
version = "0.0.0"
edition = "2024"

[lib]
name = "dx_shim"
path = "src/lib.rs"

[[bin]]
name = "dx"
path = "src/main.rs"

[[bin]]
name = "fake_dx"
path = "fake/fake_dx.rs"

[dependencies]
semver = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["platform-verifier"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"
