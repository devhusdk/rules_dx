[package]
license = "Apache-2.0"
name = "dx_update"
version = "0.0.0"
edition = "2021"

[dependencies]
nodejs-semver = "7"
pep440_rs = "0.7"
semver = "1"
saphyr-parser = "0.2"
serde_json = "1"
thiserror = "2"
toml_edit = "0.25"

[dev-dependencies]
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
] }

[lib]
name = "dx_update"
path = "src/lib.rs"
