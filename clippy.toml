# Clippy lint-intent log (not enforcement, issue #1073).
#
# Warnings are already errors via
# `--@rules_rust//rust/settings:extra_rustc_flags=--deny=warnings` in
# `.bazelrc`; third-party `crate_universe` targets stay green
# via per-target `--cap-lints=allow`. This file documents lint intent only
# and intentionally carries zero TOML tables: `clippy.toml` cannot
# allow/deny lints and Clippy rejects an empty `[lints]` table as an
# unknown field, so enforcement stays per-crate plus the CI pin below.
# It does not yet enforce new lints globally: `clippy::unwrap_used` /
# `clippy::expect_used` plus `clippy::unreachable` / `clippy::todo` deny
# outside `#[cfg(test)]` rolls out per crate in
# / as each crate's non-test code goes `expect`/`unwrap`/`unreachable`/`todo`-free, via
# `#![cfg_attr(not(test), deny(clippy::expect_used, clippy::unwrap_used, clippy::unreachable, clippy::todo))]`
# at the crate root (`cfg_attr(not(test))` keeps `rust_test` bodies
# ergonomic). All `cli/*` crates now carry the deny (verified zero
# `.expect(`/`.unwrap(`/`unreachable!`/`todo!` in non-test code via `rg` before the `#[cfg(test)]`
# marker, with `exec/test_support.rs` exempt as `#[cfg(test)]`-only):
# `dx_digest`, `dx_diff`, `dx_bep`, `dx_atomic_fs`, `dx_fingerprint`,
# `dx_path`, `dx_schema`, `dx_proto_validate`, plus `dx_adopt`,
# `dx_apply`, `dx_audit`, `dx_clean`, `dx_cli`
# (+ `dx`/`dx_man` binaries), `dx_codegen`, `dx_env`
# (+ `env` binary), `dx_env_plan`, `dx_lcov`, `dx_output`, `dx_process`,
# `dx_roots`, `dx_setup`, `dx_update`, and test-only `dx_test_scratch`.
# Beyond `cli/*` (backfill checklist, same `rg` proof):
# `quality_adapter`, `quality_evaluator` (+ binary), `quality_markdown`
# (+ binary; `FindingLine` serialization now typed via `dx_fingerprint`),
# `quality_result` (+ `print_result` binary),
# `quality_runner` (+ binary), `env_shard` (+ writer binary),
# `codegen_shard` (+ writer binary), `generation_result`,
# `documentation_ir`, and `coverage_bin` all carry the deny.
# Adding the deny to a crate with
# remaining infallible paths (e.g. `dx_cli reports`/`finalize` before
# 1302877/b2c0c13) turns those paths red, so extend the pilot list only
# after the backfill for that crate lands. Issue #927 backfilled the
# remaining `unreachable!` sites (`dx_fingerprint`, `dx_cli` planning and
# JUnit rendering, `dx_test_scratch`) into typed errors, so the
# `unreachable`/`todo` deny now rolls with the `expect`/`unwrap` deny.
# CI pin enumerating every crate root carrying the deny plus the
# `too_many_*`/`unused_imports` blanket-allow ban lives in
# `tools/ci/clippy_deny_pin.sh` (`bazel run //tools/ci:clippy_deny_pin`,
# issue #955): new crates add their root there in the same PR.
