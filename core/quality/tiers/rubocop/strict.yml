# Needs rubocop, rubocop-performance, rubocop-rspec, rubocop-minitest and
# rubocop-sorbet in the Gemfile that has rubocop.
plugins:
  - rubocop-performance
  - rubocop-rspec
  - rubocop-minitest
  - rubocop-sorbet
AllCops:
  EnabledByDefault: true
  NewCops: disable
  SuggestExtensions: false
Lint/RedundantCopDisableDirective:
  Enabled: true
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true
Style/Copyright:
  Enabled: false
Layout/EndOfLine:
  EnforcedStyle: lf
Lint/Debugger:
  Enabled: true
Lint/SuppressedException:
  Enabled: true
  AllowComments: false
Lint/RescueException:
  Enabled: true
Lint/UselessAssignment:
  Enabled: true
Lint/Void:
  Enabled: true
Security/Eval:
  Enabled: true
Security/Open:
  Enabled: true
Security/YAMLLoad:
  Enabled: true
Security/MarshalLoad:
  Enabled: true
Security/JSONLoad:
  Enabled: true
Security/IoMethods:
  Enabled: true
RSpec/Focus:
  Enabled: true
RSpec/Pending:
  Enabled: true
RSpec/NoExpectationExample:
  Enabled: true
RSpec/EmptyExampleGroup:
  Enabled: true
Minitest/SkipEnsure:
  Enabled: true
Minitest/NoAssertions:
  Enabled: true
# Sorbet cops contradict each other (ForbidSig and EnforceSignatures), so only
# the guards below are on.
Sorbet:
  Enabled: false
Sorbet/IgnoreSigil:
  Enabled: true
Sorbet/StrictSigil:
  Enabled: true
Sorbet/ForbidTUnsafe:
  Enabled: true
Sorbet/ForbidTUntyped:
  Enabled: true
