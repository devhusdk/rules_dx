std = "lua53+lua54"

[lints]
almost_swapped = "deny"
bad_string_escape = "warn"
compare_nan = "deny"
constant_table_comparison = "deny"
deprecated = "warn"
divide_by_zero = "warn"
duplicate_keys = "deny"
empty_if = "warn"
empty_loop = "warn"
global_usage = "warn"
if_same_then_else = "deny"
ifs_same_cond = "deny"
incorrect_standard_library_use = "deny"
manual_table_clone = "warn"
mismatched_arg_count = "deny"
mixed_table = "warn"
multiple_statements = "allow"
must_use = "warn"
parenthese_conditions = "allow"
shadowing = "allow"
suspicious_reverse_loop = "deny"
type_check_inside_call = "deny"
unbalanced_assignments = "warn"
undefined_variable = "deny"
unscoped_variables = "warn"
unused_variable = "warn"
