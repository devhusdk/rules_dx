[package]
name = "dx_install_tools"
version = "0.0.0"
edition = "2021"

[lib]
name = "dx_install_tools"
path = "src/lib.rs"

[[bin]]
name = "dx_verify"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }
tar = "0.4"
tempfile = "3"
zip = { version = "9", default-features = false, features = [
  "deflate-flate2-zlib",
] }
