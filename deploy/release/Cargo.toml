[package]
license = "Apache-2.0"
name = "dx_release_tools"
version = "0.0.0"
edition = "2024"

[lib]
name = "dx_release_tools"
path = "src/lib.rs"

[[bin]]
name = "release_tool"
path = "src/bin_release_tool.rs"

[[bin]]
name = "release_deploy_tool"
path = "src/bin_release_deploy_tool.rs"

[[bin]]
name = "publish_dry_run_check"
path = "src/bin_publish_dry_run_check.rs"

[[bin]]
name = "release_cell"
path = "src/bin_release_cell.rs"

[[bin]]
name = "bcr_ledger"
path = "src/bin_bcr_ledger.rs"

[[bin]]
name = "release_driver"
path = "src/bin_release_driver.rs"

[[bin]]
name = "bump_version"
path = "src/bin_bump_version.rs"

[[bin]]
name = "source_archive"
path = "src/bin_source_archive.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
