[package]
name = "dx_release_tools"
version = "0.0.0"
edition = "2021"

[lib]
name = "dx_release_tools"
path = "src/lib.rs"

[[bin]]
name = "release_tool"
path = "src/bin_release_tool.rs"

[[bin]]
name = "publish_dry_run_check"
path = "src/bin_publish_dry_run_check.rs"

[[bin]]
name = "release_cell"
path = "src/bin_release_cell.rs"

[[bin]]
name = "release_driver"
path = "src/bin_release_driver.rs"

[[bin]]
name = "source_archive"
path = "src/bin_source_archive.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spdx = "0.13"

[dev-dependencies]
tempfile = "3"
