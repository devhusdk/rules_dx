[package]
name = "dx_release_tools"
version = "0.0.0"
edition = "2021"

[lib]
name = "dx_release_tools"
path = "src/lib.rs"

[[bin]]
name = "sbom_spdx_gen"
path = "src/bin_sbom_spdx_gen.rs"

[[bin]]
name = "sbom_prov_gen"
path = "src/bin_sbom_prov_gen.rs"

[[bin]]
name = "bcr_source_gen"
path = "src/bin_bcr_source_gen.rs"

[[bin]]
name = "notice_gen"
path = "src/bin_notice_gen.rs"

[[bin]]
name = "release_driver"
path = "src/bin_release_driver.rs"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spdx = "0.13"

[dev-dependencies]
tempfile = "3"
