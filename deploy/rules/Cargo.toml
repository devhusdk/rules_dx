[package]
name = "dx_deploy_tools"
version = "0.0.0"
edition = "2021"

[lib]
name = "dx_deploy_tools"
path = "src/lib.rs"

[[bin]]
name = "archiver"
path = "src/bin_archiver.rs"

[[bin]]
name = "hasher"
path = "src/bin_hasher.rs"

[[bin]]
name = "cloudflare_verify"
path = "src/bin_cloudflare_verify.rs"

[[bin]]
name = "npm_pack"
path = "src/bin_npm_pack.rs"

[[bin]]
name = "deploy_program"
path = "src/bin_deploy_program.rs"

[[bin]]
name = "deploy_app"
path = "src/bin_deploy_app.rs"

[dependencies]
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
md-5 = "0.10"
pgp = { version = "0.21", default-features = false }
quick-xml = "0.41"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = "1"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "3.5", default-features = false, features = [
  "platform-verifier",
  "rustls-no-provider",
] }
zip = { version = "9", default-features = false, features = [
  "deflate-flate2-zlib",
] }

[dev-dependencies]
tempfile = "3"
