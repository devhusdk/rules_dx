[package]
name = "dx_deploy_tools"
version = "0.0.0"
edition = "2021"

[lib]
name = "dx_deploy_tools"
path = "src/lib.rs"

[[bin]]
name = "archiver"
path = "src/bin_archiver.rs"

[[bin]]
name = "hasher"
path = "src/bin_hasher.rs"

[[bin]]
name = "npm_pack"
path = "src/bin_npm_pack.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
