name: ci
on:
  pull_request: {}
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  dx:
    uses: devhusdk/rules_dx/.github/workflows/reusable-consumer.yml@550b5b9f3c9e7be4ca00f9e7780d7bd370de2199
    with:
      rules_dx_version: "0.0.0"
      disabled_checks: ""
      platforms: '["linux_x86_64"]'
    secrets: inherit
    permissions:
      contents: read
      checks: write
      pull-requests: write
