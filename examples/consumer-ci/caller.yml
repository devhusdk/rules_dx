name: ci
on:
  pull_request: {}
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  dx:
    uses: devhusdk/rules_dx/.github/workflows/reusable-consumer.yml@04bb90c9221b324fe86a16bee0a4e5dadb3adaf7
    with:
      rules_dx_version: "0.0.0"
      disabled_checks: ""
      platforms: '["linux_x86_64"]'
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      REMOTE_CACHE_HEADER: ${{ secrets.REMOTE_CACHE_HEADER }}
    permissions:
      contents: read
      pull-requests: write
