# Consumer caller template: pins the qualified reusable workflow at a reviewed commit.
# Copy to .github/workflows/ci.yml in the consumer repo; do not copy per-check logic.
# Reviewed pin bumps only; customizations (disabled_checks, platforms) preserved across bumps.
# Required repository settings (see the GitHub CI docs, not configured here):
# - approval policy: all_external_contributors for fork runs
# - branch protection: require dx-ci aggregate + up-to-date-branch (or merge queue)
# - default workflow permissions: read-only
name: ci
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  dx:
    uses: rules_dx/.github/workflows/reusable-consumer.yml@acbd29ebb1b35586d93c5de7f33c5d55bf798b5b
    with:
      rules_dx_version: "0.0.0"
      disabled_checks: ""
      platforms: '["linux_x86_64"]'
      scheduling_mode: "parallel"
      code_scanning_opt_in: false
    secrets: inherit
    # A called workflow can only narrow this job's token.
    permissions:
      contents: read
      checks: write
      pull-requests: write
