name: ci
on:
  pull_request: {}
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  dx:
    uses: devhusdk/rules_dx/.github/workflows/reusable-consumer.yml@22a32ee1f155440af00146922b996fae7d43a067
    with:
      disabled_checks: ""
      platforms: '["linux_x86_64"]'
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      REMOTE_CACHE_HEADER: ${{ secrets.REMOTE_CACHE_HEADER }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
