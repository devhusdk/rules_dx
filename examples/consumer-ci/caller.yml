name: ci
on:
  pull_request: {}
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  dx:
    uses: devhusdk/rules_dx/.github/workflows/reusable-consumer.yml@32c4bcd07a0887dfff761a45206c714baf8e6a20
    with:
      disabled_checks: ""
      platforms: '["linux_x86_64"]'
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      REMOTE_CACHE_HEADER: ${{ secrets.REMOTE_CACHE_HEADER }}
    permissions:
      contents: read
      pull-requests: write
