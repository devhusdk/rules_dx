name: docs
on:
  pull_request: {}
  merge_group:
    types: [checks_requested]
  push:
    # Change to your default branch if it is not main.
    branches: [main]
  workflow_dispatch: {}
jobs:
  docs:
    uses: devhusdk/rules_dx/.github/workflows/reusable-docs.yml@fe40d4a0654f5e28fed4d0c045c594917aa9d954
    with:
      docs_scope: "//..."
      site: "//docs:site"
      publish: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
    permissions:
      contents: read
      pages: write
      id-token: write
