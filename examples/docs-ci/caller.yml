name: docs
on:
  pull_request: {}
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  docs:
    uses: devhusdk/rules_dx/.github/workflows/reusable-docs.yml@550b5b9f3c9e7be4ca00f9e7780d7bd370de2199
    with:
      rules_dx_version: "0.0.0"
      docs_scope: "//..."
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
