<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dx shared tasks</title>
</head>
<body>
<main>
<h1>dx shared tasks</h1>
<ul id="tasks"></ul>
<p id="summary">loading</p>
<label>command <input id="command" value="add Ship the browser build"></label>
<button id="run" type="button">Apply</button>
<p id="reply">pending</p>
<p id="asset">loading</p>
<p id="load-error">pending</p>
<p id="version">loading</p>
</main>
<script type="module">
import init, { WebBoard, asset_report, core_version } from "./shared_tasks.js";
await init();
const board = new WebBoard(await (await fetch("./assets/board.txt")).text());
const render = () => {
  document.getElementById("tasks").replaceChildren(...board.lines().map((line) => {
    const item = document.createElement("li");
    item.textContent = line;
    return item;
  }));
  document.getElementById("summary").textContent = board.summary();
};
document.getElementById("run").addEventListener("click", () => {
  const reply = board.apply(document.getElementById("command").value);
  document.getElementById("reply").textContent = reply;
  render();
});
render();
const notes = new Uint8Array(await (await fetch("./assets/notes.txt")).arrayBuffer());
document.getElementById("asset").textContent = asset_report("notes.txt", notes);
try {
  new WebBoard("not a board");
  document.getElementById("load-error").textContent = "accepted";
} catch (error) {
  document.getElementById("load-error").textContent = error.message;
}
document.getElementById("version").textContent = core_version();
</script>
</body>
</html>
