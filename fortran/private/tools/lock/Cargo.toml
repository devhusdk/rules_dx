[package]
license = "Apache-2.0"
name = "fpm_lock"
version = "0.0.0"
edition = "2024"

[lib]
name = "fpm_lock"
path = "src/resolve.rs"

[[bin]]
name = "fpm_lock_bin"
path = "src/main.rs"

[[test]]
name = "resolve_test"
path = "resolve_test.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }
tar = "0.4"
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
] }

[dev-dependencies]
tempfile = "3"
