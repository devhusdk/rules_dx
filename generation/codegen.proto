syntax = "proto3";

package rules_dx.codegen;

// Normalized per-contributor codegen plan shard.
//
// Each contributing configured target emits one shard carrying its direct
// projection records; collectors merge shards transitively and the CLI
// parses the shards reported through the `dx_codegen_plans` output group.
message DxCodegenShard {
  // Contributing target label in observation rendering.
  string producer = 1;
  // Generated file class, e.g. "rust".
  string language = 2;
  repeated DxCodegenEntry entries = 3;
}

message DxCodegenEntry {
  // Deterministic logical workspace-relative generated path.
  string logical_path = 1;
  // Language import/source root, workspace-relative.
  string import_root = 2;
  // Required generated package or namespace semantics; empty when the
  // language mapping carries no namespace.
  string namespace = 3;
  // Projections are read-only quality context; always true on the wire.
  bool read_only = 4;
  // Bazel execution-path suffix identifying the backing artifact's BEP
  // exec path (basename or relative suffix; matched as a path-component
  // suffix so different output bases still resolve). Empty means a
  // logical-only entry requiring no materialized artifact (synthetic
  // shards and merge/conflict fixtures). Entries that declare an
  // exec path must resolve to exactly one BEP-reported non-shard
  // artifact; missing, ambiguous, or unreported artifacts fail
  // collection and never fall back to scanning `bazel-out`.
  string exec_path = 5;
  // Workspace-relative checked-in source this generated artifact
  // replaces. Empty means no replacement: a generated logical path
  // colliding with a workspace source fails closed. Non-empty must
  // equal logical_path (explicit self-replacement acknowledgment) and
  // requires a non-empty exec_path binding the replacing generated
  // artifact, so the contract identifies both the replaced source and
  // the generated artifact identity. Staging allows the workspace
  // collision only for such contracted entries; all other collisions
  // fail with no generic waiver flag.
  string replaces = 6;
}
