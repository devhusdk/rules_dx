[package]
license = "Apache-2.0"
name = "maven_lock"
version = "0.0.0"
edition = "2024"

[lib]
name = "maven_lock"
path = "src/resolve.rs"

[[bin]]
name = "maven_lock_bin"
path = "src/main.rs"

[[test]]
name = "resolve_test"
path = "resolve_test.rs"

[dependencies]
serde_json = "1"
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
] }

[dev-dependencies]
tempfile = "3"
