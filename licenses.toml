# License policy for `dx audit license` dogfood.
# This repository cuts no releases (version 0.0.0, unpublishable module,
# no tags); the `//...` dogfood scope stays internal-only, inventoried in
# the SBOM and never failing on the allow/review/deny table except blocked.
# `//cli/cli:dx` is the release binary; `internal` matches one scope exactly,
# so that label is distributed and `dx audit license //cli/cli:dx` exercises the
# strict table on the existing customer flow. Blocked licenses fail in both
# tiers and need versioned exceptions.
[policy]
blocked = ["AGPL-3.0-only", "AGPL-3.0-or-later", "SSPL-1.0"]

[policy.distributed]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
]
review = [
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MPL-2.0",
  "EPL-2.0",
  "CDDL-1.0",
]
deny = ["GPL-2.0-only", "GPL-2.0-or-later", "GPL-3.0-only", "GPL-3.0-or-later"]

[distribution]
internal = ["//..."]
