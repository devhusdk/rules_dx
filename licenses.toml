# License policy for dx audit license.
[policy]
blocked = ["AGPL-3.0-only", "AGPL-3.0-or-later", "SSPL-1.0"]

[policy.distributed]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
]
review = [
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MPL-2.0",
  "EPL-2.0",
  "CDDL-1.0",
]
deny = ["GPL-2.0-only", "GPL-2.0-or-later", "GPL-3.0-only", "GPL-3.0-or-later"]

[distribution]
internal = ["//..."]


[[exception]]
package = "allocative"
set = "cargo"
license = "Apache-2.0"
versions = "=0.3.6"
reason = "The crate ships no license file; its NOTICE entry names the declared license."
expires = "2027-10-27"

