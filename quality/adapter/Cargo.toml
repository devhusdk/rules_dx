[package]
license = "Apache-2.0"
name = "quality_adapter"
version = "0.0.0"
edition = "2024"

[dependencies]
globset = "0.4"
line-index = "0.1"
quick-xml = "0.41"
saphyr-parser = "0.2"
serde = { version = "1", features = ["derive"] }
serde-sarif = "0.8"
serde_json = "1"
tempfile = "3"
toml_edit = "0.25"
thiserror = "2"
url = "2"

[lib]
name = "quality_adapter"
path = "src/lib.rs"
