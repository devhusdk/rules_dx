[package]
name = "quality_evaluator"
version = "0.0.0"
edition = "2021"

[lib]
name = "quality_evaluator"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "quality_evaluator"
path = "src/main.rs"
