[package]
name = "dx_matrix_harness"
version = "0.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "dx_matrix_harness"
path = "src/lib.rs"

[[bin]]
name = "matrix_harness"
path = "src/main.rs"