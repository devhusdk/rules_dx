[package]
license = "Apache-2.0"
name = "quality_result"
version = "0.0.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[lib]
name = "quality_result"
path = "src/lib.rs"

# Layer-2 matrix harness printer: decodes one validated result
# protobuf into deterministic text for golden diffing. Test-only tooling.
# Declared so Cargo-based generation owns the target instead of dropping
# it as stale.
[[bin]]
name = "print_result"
path = "src/print.rs"
