[package]
name = "quality_runner"
version = "0.0.0"
edition = "2021"

[lib]
name = "quality_runner"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
zip = { version = "9", default-features = false, features = [
  "deflate-flate2-zlib",
] }

[[bin]]
name = "quality_runner"
path = "src/main.rs"
