[package]
name = "quality_runner"
version = "0.0.0"
edition = "2021"

[lib]
name = "quality_runner"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"

[[bin]]
name = "quality_runner"
path = "src/main.rs"

[[bin]]
name = "matrix_harness"
path = "src/matrix_harness.rs"
