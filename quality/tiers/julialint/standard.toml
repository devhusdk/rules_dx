preset = "default"

[rules]
async_task = "off"
bare_using = "off"
break_continue = "warning"
computed_include = "off"
config_errors = "error"
const_decl = "warning"
const_if_condition = "warning"
debug_statement = "off"
detached_docstring = "warning"
duplicate_branch_condition = "off"
duplicate_function_argument = "warning"
global_const_decl = "warning"
include_errors = "warning"
incorrect_call_args = "off"
incorrect_iter_spec = "warning"
index_from_length = "off"
invalid_type_declaration = "warning"
kw_default_mismatch = "warning"
literal_use = "warning"
missing_reference = "off"
module_name = "warning"
nan_comparison = "off"
nothing_comparison = "off"
pointless_boolean = "warning"
relative_import = "off"
string_concat_style = "off"
syntax_errors = "error"
syntax_warnings = "off"
testitem_errors = "error"
toml_syntax_errors = "error"
type_piracy = "warning"
unresolved_import = "off"
unused_binding = "off"
unused_function_argument = "off"
unused_type_parameter = "off"
