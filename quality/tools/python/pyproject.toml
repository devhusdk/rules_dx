# Managed 3.12 interpreter floor (`requires-python`); dependencies carry
# lower bounds, exact pins live in `uv.lock`. Update flow: bump the bound
# here, then regenerate with `uv lock` in this directory.
[project]
name = "dx-python-tools"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "pydoclint>=0.9.1",
  "yamllint>=1.38.0",
  "check-jsonschema>=0.39.0",
  "djlint>=1.49.9",
  "griffelib>=2.4.1",
  "ansible-lint>=26.10.1",
  "ansible-core>=2.21.5",
  "docutils>=0.23",
  "cfn-lint>=1.58.0,<2",
  "cmakelint>=1.4.3",
  "mbake>=1.5.0",
  "openapi-python-client>=0.29.1",
]

[tool.uv]
constraint-dependencies = ["cryptography<50"]
