# Cargo-built quality tools. The stub package only carries the pinned
# dependency set for the dx_quality_crates hub; it is never built.
# statix is built from source (//quality/tools/rust:statix.BUILD.bazel), so its
# dependencies are pinned to the versions in statix's own Cargo.lock.
[package]
name = "dx_quality_tools"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
deadnix = "=1.3.1"
# selene 0.31.0 (latest on crates.io; 0.32.0 only adds Luau syntax). Upstream's
# binary builds selene-lib without the Lua 5.2+ parsers, which makes valid Lua
# 5.4 code fail to parse. Cargo feature unification turns them on for the
# selene binary through this direct selene-lib dependency.
selene = { version = "=0.31.0", default-features = false }
selene-lib = { version = "=0.31.0", default-features = false, features = ["lua52", "lua53", "lua54"] }

# statix @ 52530001bdbc8e94aae0d406a929c7ad7f09d9d1
anyhow = "=1.0.103"
ariadne = "=0.6.0"
clap = { version = "=4.6.2", features = ["derive"] }
hex = "=0.4.3"
ignore = "=0.4.29"
indexmap = "=2.14.0"
lazy_static = "=1.5.0"
proc-macro2 = "=1.0.106"
quote = "=1.0.46"
rayon = "=1.12.0"
rnix = "=0.14.0"
rowan = "=0.16.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
similar = "=3.1.0"
syn = { version = "=2.0.119", features = ["full"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
toml = "=1.1.3"
