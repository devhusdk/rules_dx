# Cargo-built quality tools. The stub package only carries the pinned
# dependency set for the dx_quality_crates hub; it is never built.
# statix is built from source (//quality/tools/rust:statix.BUILD.bazel), so its
# dependencies are pinned to the versions in statix's own Cargo.lock.
[package]
name = "dx_quality_tools"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
deadnix = "=1.3.1"

# dx_topiary (//quality/tools/rust/topiary): the OCaml grammar tag must match the
# grammar rev topiary pins in topiary-config/languages.ncl at the topiary
# version below (0.8.0 -> a45fda5 == tree-sitter-ocaml v0.24.0). Re-derive it
# from that file on every topiary bump. tree-sitter is pinned by topiary-core.
topiary-core = "=0.8.0"
topiary-queries = { version = "=0.8.0", default-features = false, features = ["ocaml", "ocaml_interface"] }
tree-sitter = "=0.26.12"
tree-sitter-ocaml = "=0.24.0"

# statix @ 52530001bdbc8e94aae0d406a929c7ad7f09d9d1
anyhow = "=1.0.103"
ariadne = "=0.6.0"
clap = { version = "=4.6.2", features = ["derive"] }
hex = "=0.4.3"
ignore = "=0.4.29"
indexmap = "=2.14.0"
lazy_static = "=1.5.0"
proc-macro2 = "=1.0.106"
quote = "=1.0.46"
rayon = "=1.12.0"
rnix = "=0.14.0"
rowan = "=0.16.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
similar = "=3.1.0"
syn = { version = "=2.0.119", features = ["full"] }
tempfile = "=3.27.0"
thiserror = "2.0.21"
toml = "=1.1.3"

# selene @ 0.32.0 (built from source, //quality/tools/rust:selene.BUILD.bazel).
# Shared crates (serde, serde_json, lazy_static) reuse the pins above; the
# rest use compatible ranges so they resolve alongside statix/deadnix. toml 0.7
# is renamed because statix needs toml 1.
atty = "0.2.14"
cfg-if = "1.0.0"
chrono = "0.4.23"
codespan = { version = "=0.11.1", features = ["serialization"] }
codespan-reporting = { version = "=0.11.1", features = ["serialization"] }
color-eyre = "0.6.2"
dirs = "4.0.0"
full_moon = { version = "=3.0.0", features = ["lua52", "lua53", "lua54"] }
glob = "0.3.1"
globset = "0.4.10"
id-arena = "2.2.1"
if_chain = "1.0.2"
num_cpus = "1.15.0"
once_cell = "1.17.0"
paste = "1.0.11"
profiling = "1.0.7"
regex = "1.7.1"
serde_yaml = "0.9.16"
structopt = "0.3.26"
termcolor = "1.2.0"
threadpool = "1.8.1"
toml07 = { package = "toml", version = "=0.7.2" }
