[package]
license = "Apache-2.0"
name = "dx_progenitor"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "dx_progenitor"
path = "main.rs"

[dependencies]
openapiv3 = "=2.2.0"
prettyplease = "0.2"
progenitor = { version = "=0.15.1", default-features = false }
serde_json = "1.0.154"
serde_yaml = "0.9.16"
syn = { version = "=2.0.119", features = ["full"] }
