[package]
license = "Apache-2.0"
name = "swift_lock"
version = "0.0.0"
edition = "2024"

[lib]
name = "swift_lock"
path = "src/resolve.rs"

[[bin]]
name = "swift_lock_bin"
path = "src/main.rs"

[[test]]
name = "resolve_test"
path = "tests/resolve_test.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }
serde_json = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
