[package]
license = "Apache-2.0"
name = "bcr_outdated"
version = "0.0.0"
edition = "2024"

[dependencies]
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }

[lib]
name = "bcr_outdated"
path = "src/lib.rs"

[[bin]]
name = "bcr_outdated_bin"
path = "src/main.rs"

[[test]]
name = "bcr_outdated_test"
path = "tests/bcr_outdated_test.rs"
