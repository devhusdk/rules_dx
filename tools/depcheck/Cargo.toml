[package]
name = "dx_depcheck"
version = "0.0.0"
edition = "2021"

[lib]
name = "dx_depcheck"
path = "src/lib.rs"

[[bin]]
name = "depcheck"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
] }
clap = { version = "4", features = ["derive"] }
pep440_rs = "0.7"
semver = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
