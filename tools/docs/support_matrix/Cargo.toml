[package]
license = "Apache-2.0"
name = "support_matrix"
version = "0.0.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"

[lib]
name = "support_matrix"
path = "src/lib.rs"

[[bin]]
name = "update"
path = "src/main.rs"

[[test]]
name = "generate_test"
path = "src/generate_test.rs"
