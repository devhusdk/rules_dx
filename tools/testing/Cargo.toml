[package]
license = "Apache-2.0"
name = "dx_testing"
version = "0.0.0"
edition = "2024"

[lib]
name = "dx_testing"
path = "src/lib.rs"

[[bin]]
name = "nested_bazel_probe"
path = "nested_bazel_probe.rs"

[[bin]]
name = "nested_bazel_shim"
path = "nested_bazel_shim.rs"

[[bin]]
name = "starlark_harness"
path = "starlark_harness.rs"

[[test]]
name = "consumer_maven_lock_test"
path = "consumer_maven_lock_test.rs"

[[test]]
name = "module_srcs_test"
path = "module_srcs_test.rs"

[[test]]
name = "nested_bazel_harness_test"
path = "nested_bazel_harness_test.rs"

[[test]]
name = "preflight_smoke_test"
path = "preflight_smoke_test.rs"

[[test]]
name = "starlark_harness_exit_test"
path = "starlark_harness_exit_test.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_Rpc",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
