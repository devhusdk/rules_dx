[package]
license = "Apache-2.0"
name = "dx_testing"
version = "0.0.0"
edition = "2021"

[lib]
name = "dx_testing"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
