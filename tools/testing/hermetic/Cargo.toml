[package]
license = "Apache-2.0"
name = "hermetic"
version = "0.0.0"
edition = "2024"

[lib]
name = "hermetic"
path = "src/lib.rs"

[[bin]]
name = "verify"
path = "verify.rs"

[[bin]]
name = "appcontainer_run"
path = "appcontainer/main.rs"

[[bin]]
name = "isolation_windows_probe"
path = "isolation_windows_probe.rs"

[[test]]
name = "consumer_repos_test"
path = "consumer_repos_test.rs"

[[test]]
name = "isolation_probe_test"
path = "isolation_test.rs"

[[test]]
name = "isolation_windows_probe_test"
path = "isolation_windows_test.rs"

[[test]]
name = "cuda_gpu_facts_test"
path = "cuda_gpu_test.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_Rpc",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
