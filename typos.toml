[default]
locale = "en"
# Lines ending in a `spellchecker:disable-line` comment are skipped.
extend-ignore-re = ["~2E\\w+", "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$"]

[default.extend-words]
intoto = "intoto"
PAKET = "PAKET"
paket = "paket"
Paket = "Paket"
anc = "anc"
udid = "udid"
UDID = "UDID"
flate = "flate"
caf = "caf"
unparseable = "unparseable"
Unparseable = "Unparseable"
configed = "configed"
remvoe = "remvoe"
fo = "fo"
behaviou = "behaviou"
secur = "secur"
passin = "passin"
cmo = "cmo"

[files]
extend-exclude = [
  "*.lock",
  "*.min.js",
  "*.svg",
  "**/*_test.rs",
  "**/*_tests.rs",
]
