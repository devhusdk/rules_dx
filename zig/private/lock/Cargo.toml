[package]
license = "Apache-2.0"
name = "zig_lock"
version = "0.0.0"
edition = "2024"

[lib]
name = "zig_lock"
path = "src/resolve.rs"

[[bin]]
name = "zig_lock_bin"
path = "src/main.rs"

[[test]]
name = "resolve_test"
path = "tests/resolve_test.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }
lzma-rs = "0.3"
ruzstd = "0.9"
serde_json = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = [
  "deflate-flate2-zlib",
] }

[dev-dependencies]
tempfile = "3"
